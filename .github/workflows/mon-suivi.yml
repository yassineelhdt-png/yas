# Mon suivi : fabrique l'APK Android et l'app Windows, puis les publie dans la release « mon-suivi »
# (à côté de la release « latest » de Horaire 9h, sans y toucher).
name: Mon suivi

on:
  push:
    paths:
      - "diet/**"
      - ".github/workflows/mon-suivi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mon-suivi-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diet/app
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diet/app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - name: Compiler l'APK
        working-directory: diet/app/android
        run: ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=${{ env.APP_VERSION }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk Mon-suivi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mon-suivi-android
          path: diet/app/Mon-suivi.apk
          if-no-files-found: error

  windows:
    name: App Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: diet/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diet/app/package-lock.json
      - run: npm ci
      - run: npm run www
      - name: Créer l'installeur et la version portable
        # bash : PowerShell (shell par défaut sous Windows) découpe l'argument -c.extraMetadata…
        shell: bash
        run: npx electron-builder --win --publish never -c.extraMetadata.version=${{ env.APP_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: mon-suivi-windows
          path: diet/app/release/*.exe
          if-no-files-found: error

  release:
    name: Publier la release
    needs: [android, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mon-suivi-*
          path: out
          merge-multiple: true
      - name: Remplacer la release « mon-suivi »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          cat > notes.md <<EOF
          ## Installer Mon suivi

          - **Tablette / téléphone Android** : télécharge \`Mon-suivi.apk\` depuis la tablette, ouvre-le et autorise l'installation (« sources inconnues »). Les mises à jour s'installent par-dessus, sans perdre tes données.
          - **PC Windows** : \`Mon-suivi-Installation.exe\` (installe l'app avec un raccourci) ou \`Mon-suivi-Portable.exe\` (sans installation). Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*.
          - **Passer tes données d'un appareil à l'autre** : Réglages → *Faire une sauvegarde*, puis *Restaurer une sauvegarde* sur l'autre appareil.

          Version ${APP_VERSION} · branche ${GITHUB_REF_NAME} · commit ${GITHUB_SHA::7}
          EOF
          gh release delete mon-suivi --yes --cleanup-tag || true
          gh release create mon-suivi out/Mon-suivi.apk out/Mon-suivi-Installation.exe out/Mon-suivi-Portable.exe \
            --target "$GITHUB_SHA" --title "Mon suivi — version ${APP_VERSION}" --notes-file notes.md --latest=false
