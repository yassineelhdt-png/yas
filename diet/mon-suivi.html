<title>Mon suivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#18222F; --muted:#5A6778; --line:#D5DCE4;
  --matin:#E9A62B; --matin-2:#F6D48A; --matin-tint:#FCF2DC; --matin-line:#F0D49B; --matin-on:#18222F;
  --midi:#1F9C93; --midi-2:#94D8D1; --midi-tint:#DFF2EF; --midi-line:#ABDDD7; --midi-on:#18222F;
  --aprem:#7C5CD6; --aprem-2:#C4B4F1; --aprem-tint:#EDE7FB; --aprem-line:#CFC2F4; --aprem-on:#FFFFFF;
  --soir:#3557C2; --soir-2:#A3B5EC; --soir-tint:#E2E8F8; --soir-line:#B9C7F0; --soir-on:#FFFFFF;
  --fill:#1F9C93; --bub:#DCE3EA; --danger:#BF3A31; --focus:#3557C2;
  --font-ui:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display:"Unbounded", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161F; --surface:#18212D; --surface-2:#1D2735; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2C3747;
    --matin:#F2BA4E; --matin-2:#8C6B2B; --matin-tint:#272115; --matin-line:#4A3D1F; --matin-on:#10161F;
    --midi:#3CC0B5; --midi-2:#1F6E68; --midi-tint:#122725; --midi-line:#1F4643; --midi-on:#10161F;
    --aprem:#A78CF3; --aprem-2:#5A4990; --aprem-tint:#1E1A31; --aprem-line:#3A305E; --aprem-on:#10161F;
    --soir:#7C95F3; --soir-2:#3E5192; --soir-tint:#171F36; --soir-line:#2D3C66; --soir-on:#10161F;
    --fill:#3CC0B5; --bub:#263142; --danger:#F06C62; --focus:#7C95F3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161F; --surface:#18212D; --surface-2:#1D2735; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2C3747;
  --matin:#F2BA4E; --matin-2:#8C6B2B; --matin-tint:#272115; --matin-line:#4A3D1F; --matin-on:#10161F;
  --midi:#3CC0B5; --midi-2:#1F6E68; --midi-tint:#122725; --midi-line:#1F4643; --midi-on:#10161F;
  --aprem:#A78CF3; --aprem-2:#5A4990; --aprem-tint:#1E1A31; --aprem-line:#3A305E; --aprem-on:#10161F;
  --soir:#7C95F3; --soir-2:#3E5192; --soir-tint:#171F36; --soir-line:#2D3C66; --soir-on:#10161F;
  --fill:#3CC0B5; --bub:#263142; --danger:#F06C62; --focus:#7C95F3;
  color-scheme:dark;
}
.m-matin{ --m:var(--matin); --m2:var(--matin-2); --mt:var(--matin-tint); --ml:var(--matin-line); --mo:var(--matin-on); }
.m-midi{ --m:var(--midi); --m2:var(--midi-2); --mt:var(--midi-tint); --ml:var(--midi-line); --mo:var(--midi-on); }
.m-aprem{ --m:var(--aprem); --m2:var(--aprem-2); --mt:var(--aprem-tint); --ml:var(--aprem-line); --mo:var(--aprem-on); }
.m-soir{ --m:var(--soir); --m2:var(--soir-2); --mt:var(--soir-tint); --ml:var(--soir-line); --mo:var(--soir-on); }

*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 116px); -webkit-text-size-adjust:100%; text-size-adjust:100%; }
@media (min-width:720px){ html{ scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 76px); } }
body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
h1,h2,h3{ margin:0; text-wrap:balance; }
.sr-only{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* Barre du haut */
.top{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg); border-bottom:1px solid var(--line); }
.top-in{ max-width:1120px; margin:0 auto; padding:10px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
.brand{ font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:-.01em; }
.sync{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--muted); }
.sync::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--dot, var(--muted)); }
.tabs{ order:3; flex:1 1 100%; display:flex; gap:4px; padding:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; }
.tabs button{ flex:1; border:0; background:transparent; border-radius:999px; padding:8px 6px; font-weight:700; font-size:15px; color:var(--muted); }
.tabs button[aria-current="page"]{ background:var(--ink); color:var(--bg); }
@media (min-width:720px){
  .tabs{ order:0; flex:0 1 auto; margin-left:auto; }
  .tabs button{ flex:none; padding:8px 18px; }
  .sync{ margin-left:0; }
}

main{ max-width:1120px; margin:0 auto; padding:22px 16px 64px; }
@media (min-width:720px){ main{ padding:30px 24px 80px; } }
.loading{ color:var(--muted); font-weight:600; }

/* Boutons */
.icon{ flex:none; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:inline-grid; place-items:center; color:var(--ink); padding:0; }
.ghost{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 16px; font-weight:700; font-size:15px; min-height:42px; }
.primary{ border:0; background:var(--ink); color:var(--bg); border-radius:999px; padding:10px 18px; font-weight:700; font-size:15px; min-height:42px; }
.danger{ border:0; background:var(--danger); color:#fff; border-radius:999px; padding:10px 18px; font-weight:700; min-height:42px; }
.link{ border:0; background:transparent; color:var(--muted); font-weight:700; font-size:14px; padding:6px 8px; border-radius:8px; }
.link:hover{ color:var(--ink); }
.link.danger{ color:var(--danger); background:transparent; min-height:0; padding:6px 8px; }
@media (hover:hover){
  .icon:hover,.ghost:hover,.lid:hover{ border-color:var(--muted); }
  .tabs button:not([aria-current]):hover{ color:var(--ink); }
}
.hint{ margin:0 0 12px; color:var(--muted); font-size:14px; font-weight:500; }
.empty{ margin:4px 0 0; color:var(--muted); }
.muted{ color:var(--muted); }
.actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.daynav{ display:flex; align-items:center; gap:8px; margin-left:auto; }

/* Jour */
.datebar{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
.date{ font-family:var(--font-display); font-weight:600; font-size:clamp(24px, 4.4vw, 40px); line-height:1.08; letter-spacing:-.025em; }
.strip{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; margin:18px 0 26px; }
.lid{ border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:7px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:0; }
.lid .wd{ font-size:12px; font-weight:700; color:var(--muted); }
.lid .dn{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.3; }
.lid .bar{ width:64%; height:4px; border-radius:2px; background:var(--bub); overflow:hidden; margin-top:3px; }
.lid .bar i{ display:block; height:100%; background:var(--fill); border-radius:2px; }
.lid[aria-current="date"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
.lid[aria-current="date"] .wd{ color:inherit; opacity:.7; }
.lid[aria-current="date"] .bar{ background:rgba(127,127,127,.4); }
.lid.today .dn{ text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px; }
.banner{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:-8px 0 24px; padding:12px 14px; border:1.5px dashed var(--matin); background:var(--surface); border-radius:14px; }
.banner p{ margin:0; font-weight:700; }
.banner select{ background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-height:42px; }
.daygrid{ display:grid; gap:36px; }
@media (min-width:900px){ .daygrid{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:44px; align-items:start; } }
.sec-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; min-height:42px; }
.sec-head h2{ font-size:20px; font-weight:800; letter-spacing:-.01em; min-width:0; }
.sec-head .primary,.sec-head .ghost{ white-space:nowrap; flex:none; }
.count{ font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
.sleep{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 14px; padding-bottom:24px; margin-bottom:24px; border-bottom:1px solid var(--line); }
.sleep .field{ width:132px; }
.night{ margin:0 0 10px; font-weight:700; }
.chip{ border:1.5px dashed var(--matin); background:var(--matin-tint); color:var(--ink); border-radius:999px; padding:9px 16px; font-weight:700; min-height:44px; }
.field{ display:flex; flex-direction:column; gap:5px; font-size:14px; font-weight:700; color:var(--muted); min-width:0; }
.field input,.field select,.field textarea,.notes{ width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 11px; min-height:44px; font-weight:500; font-size:16px; }
.field textarea,.notes{ resize:vertical; line-height:1.45; }
.boxes{ display:flex; flex-direction:column; gap:14px; }
.box{ background:var(--mt); border:1.5px solid var(--ml); border-radius:18px; padding:4px 14px 6px; }
.box-lid{ display:flex; align-items:baseline; gap:10px; padding:10px 0 4px; }
.box-lid h3{ font-family:var(--font-display); font-weight:600; font-size:17px; letter-spacing:-.01em; }
.box-lid span{ font-size:14px; color:var(--muted); font-weight:600; }
.item{ width:100%; display:flex; align-items:center; gap:14px; padding:12px 0; background:transparent; border:0; border-top:1px solid var(--ml); text-align:left; }
.box-lid + .item{ border-top:0; }
.cap{ flex:none; position:relative; width:48px; height:26px; border-radius:999px; border:2px solid var(--m); background:var(--surface); }
.cap::after{ content:""; position:absolute; top:4px; bottom:4px; left:50%; width:2px; margin-left:-1px; background:var(--ml); border-radius:1px; }
.cap.on{ background:linear-gradient(90deg, var(--m) 0 50%, var(--m2) 50% 100%); }
.cap.on::after{ background:rgba(0,0,0,.14); }
.cap svg{ position:absolute; left:4px; top:50%; width:15px; height:15px; margin-top:-7.5px; color:var(--mo); }
.cap.just{ animation:pop .24s ease-out; }
@keyframes pop{ 0%{ transform:scale(.86); } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); } }
.it-main{ flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; }
.it-name{ font-weight:800; }
.it-dose{ font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
.it-note{ flex-basis:100%; font-size:14px; color:var(--muted); line-height:1.35; }
.freq{ flex:none; font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--ml); white-space:nowrap; }
.jsec + .jsec{ margin-top:34px; }
.list{ list-style:none; margin:0; padding:0; }
.entry{ display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:4px 12px; padding:12px 0; border-top:1px solid var(--line); align-items:start; }
.list > li:first-child{ border-top:0; }
.editing{ padding:6px 0; }
.t{ font-weight:800; font-variant-numeric:tabular-nums; padding-top:3px; }
.ci-line{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
.face{ font-size:26px; line-height:1; }
.meters{ display:flex; flex-wrap:wrap; gap:6px 14px; }
.meter{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--muted); }
.segs{ display:inline-flex; gap:2px; }
.segs i{ width:7px; height:12px; border-radius:2px; background:var(--bub); }
.segs i.on{ background:var(--ink); }
.note{ margin:4px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.kind{ display:block; font-size:13px; font-weight:800; color:var(--muted); }
.kind + .note{ margin-top:0; }
.row-actions{ display:flex; flex-wrap:wrap; justify-content:flex-end; }
.form{ display:flex; flex-direction:column; gap:16px; padding:16px; margin-bottom:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
.form-row{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
.field-time{ width:132px; }
.scale{ border:0; margin:0; padding:0; min-width:0; }
.scale legend{ padding:0; margin-bottom:6px; font-size:14px; font-weight:800; }
.dots{ display:flex; gap:8px; }
.dot{ width:46px; height:46px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-weight:800; font-size:16px; display:grid; place-items:center; padding:0; }
.dot.emoji{ font-size:23px; }
.dot[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
.dot.emoji[aria-pressed="true"]{ background:var(--matin-tint); border-color:var(--matin); box-shadow:inset 0 0 0 2px var(--matin); color:inherit; }
.ends{ display:flex; justify-content:space-between; width:262px; max-width:100%; margin-top:5px; font-size:12px; font-weight:600; color:var(--muted); }
.seg{ display:inline-flex; padding:3px; gap:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; }
.seg button{ border:0; background:transparent; border-radius:999px; padding:8px 14px; font-weight:700; color:var(--muted); min-height:38px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.notes{ min-height:110px; }

/* Semaine */
.wk-head,.yr-head{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:10px; }
.wk-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(20px, 3.4vw, 30px); letter-spacing:-.02em; line-height:1.15; }
.scroller{ overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
.week{ width:100%; min-width:700px; border-collapse:collapse; }
.week th,.week td{ padding:7px 4px; text-align:center; border-bottom:1px solid var(--line); }
.week thead th{ padding:8px 4px; }
.week thead button{ border:0; background:transparent; border-radius:12px; padding:5px 10px; display:inline-flex; flex-direction:column; align-items:center; line-height:1.2; font-weight:700; font-size:13px; color:var(--muted); }
.week thead button b{ font-size:17px; color:var(--ink); font-variant-numeric:tabular-nums; }
.week thead th.today button{ background:var(--ink); color:var(--bg); }
.week thead th.today button b{ color:var(--bg); }
.week th[scope="row"]{ text-align:left; padding-left:14px; font-weight:700; white-space:nowrap; }
.week th[scope="row"] small{ margin-left:6px; font-size:13px; font-weight:600; color:var(--muted); }
.week tr.grp th{ text-align:left; padding:12px 14px 6px; background:var(--mt); border-bottom:1px solid var(--ml); font-family:var(--font-display); font-weight:600; font-size:15px; }
.week tr.grp th span{ font-family:var(--font-ui); font-size:13px; font-weight:600; color:var(--muted); margin-left:6px; }
.mini{ position:relative; width:36px; height:22px; padding:0; border-radius:999px; border:2px solid var(--m); background:var(--surface); vertical-align:middle; }
.mini.on{ background:linear-gradient(90deg, var(--m) 0 50%, var(--m2) 50% 100%); }
.mini svg{ position:absolute; left:3px; top:50%; width:12px; height:12px; margin-top:-6px; color:var(--mo); }
.week tbody.sum th[scope="row"]{ color:var(--muted); }
.week tbody.sum td{ font-weight:700; font-variant-numeric:tabular-nums; }
.week tbody.sum tr:first-child th,.week tbody.sum tr:first-child td{ border-top:2px solid var(--line); }
.week tbody.sum tr:last-child th,.week tbody.sum tr:last-child td{ border-bottom:0; }

/* Année */
.yr-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(30px, 6vw, 52px); letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
.yr-sum{ margin:6px 0 14px; font-weight:600; }
.legend{ display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:20px; font-size:14px; font-weight:600; color:var(--muted); }
.legend span{ display:inline-flex; align-items:center; gap:7px; }
.months{ display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:16px; }
.month{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 12px 14px; }
.month h3{ font-size:15px; font-weight:800; margin-bottom:8px; }
.blister{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:5px; }
.wdh{ text-align:center; font-size:11px; font-weight:700; color:var(--muted); }
.bub{ display:block; width:100%; max-width:100%; min-height:20px; aspect-ratio:1/1; padding:0; border-radius:50%; border:1px solid var(--line); background:var(--bub); position:relative; box-shadow:inset 0 -2px 0 rgba(0,0,0,.07); }
.bub.none{ background:transparent; border-style:dashed; box-shadow:none; }
.bub.part{ background:conic-gradient(var(--fill) calc(var(--p) * 1turn), var(--bub) 0); }
.bub.full{ background:var(--fill); border-color:var(--fill); }
.bub.future{ opacity:.4; }
.bub.today{ outline:2px solid var(--ink); outline-offset:1px; }
.bub.j::after{ content:""; position:absolute; right:-2px; bottom:-2px; width:8px; height:8px; border-radius:50%; background:var(--aprem); border:1.5px solid var(--surface-2); }
.legend .bub{ display:inline-block; width:16px; height:16px; min-height:0; }

/* Réglages */
.set-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(24px, 4.4vw, 40px); letter-spacing:-.025em; margin-bottom:22px; }
.set-sec{ max-width:780px; }
.set-sec + .set-sec{ margin-top:44px; padding-top:28px; border-top:1px solid var(--line); }
.m-title{ display:flex; align-items:center; gap:10px; margin:24px 0 10px; font-family:var(--font-display); font-weight:600; font-size:16px; }
.m-title::before{ content:""; flex:none; width:24px; height:13px; border-radius:999px; background:linear-gradient(90deg, var(--m) 0 50%, var(--m2) 50% 100%); }
.m-title span{ font-family:var(--font-ui); font-size:14px; font-weight:600; color:var(--muted); }
.srow{ display:flex; flex-direction:column; gap:10px; padding:14px; margin-bottom:10px; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--m); border-radius:12px; }
.srow.paused{ opacity:.62; }
.srow-c{ padding:0; }
.srow-open{ width:100%; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; row-gap:2px; padding:13px 14px; min-height:48px; background:transparent; border:0; border-radius:10px; text-align:left; }
.srow-meta{ margin-left:auto; font-size:14px; font-weight:700; color:var(--muted); }
.srow-foot .row-actions{ align-items:center; gap:6px; }
.srow-line{ display:flex; flex-wrap:wrap; gap:10px; }
.srow-line .field{ flex:0 1 auto; }
.srow-line .grow{ flex:1 1 220px; }
.srow-line select{ min-width:130px; }
.srow-foot{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
.switch{ display:inline-flex; align-items:center; gap:8px; font-weight:700; }
.switch input{ width:22px; height:22px; accent-color:var(--ink); margin:0; }
.filebtn{ display:inline-flex; align-items:center; cursor:pointer; position:relative; }
.filebtn:focus-within{ outline:3px solid var(--focus); outline-offset:2px; }
.exportbox{ margin-top:16px; }
.export{ width:100%; min-height:160px; font-size:13px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
.reset{ margin-top:22px; }
.reset p{ margin:0 0 10px; font-weight:600; }

/* Messages */
.toast-wrap{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:0 16px calc(18px + env(safe-area-inset-bottom, 0px)); pointer-events:none; }
#toast{ background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-weight:700; font-size:15px; opacity:0; transform:translateY(12px); transition:opacity .18s ease, transform .18s ease; max-width:100%; text-align:center; }
#toast.show{ opacity:1; transform:none; }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation:none !important; transition:none !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="top-in">
      <span class="brand">Mon suivi</span>
      <nav class="tabs" aria-label="Vues">
        <button type="button" data-act="tab" data-view="jour" aria-current="page">Jour</button>
        <button type="button" data-act="tab" data-view="semaine">Semaine</button>
        <button type="button" data-act="tab" data-view="annee">Année</button>
        <button type="button" data-act="tab" data-view="reglages">Réglages</button>
      </nav>
      <span class="sync" id="sync">Chargement…</span>
    </div>
  </header>
  <main id="view"><p class="loading">Chargement de tes données…</p></main>
  <div class="toast-wrap"><div id="toast" role="status" aria-live="polite"></div></div>
</div>

<script>
(() => {
  'use strict';
  document.documentElement.lang = 'fr';

  /* ---------- Réglages techniques ---------- */
  const LS_KEY = 'mon-suivi-v1';          // données en mode local (sans compte Claude)
  const CACHE_KEY = 'mon-suivi-cloud-v1'; // copie du compte sur cet appareil + modifications pas encore envoyées
  const SAVE_DELAY = 700;                 // regroupe les frappes avant d'écrire en ligne
  const LOCAL_DELAY = 250;
  const CAPS_TIMEOUT = 9000;
  const GET_TIMEOUT = 12000;
  const MAX_DOC_BYTES = 250000;           // marge sous la limite de 256 Kio par document
  const RETRY_DELAYS = [5000, 15000, 30000, 60000];
  const MONTH_DOC = /^m\d{4}-\d{2}$/;

  /* ---------- Outils ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => toKey(new Date());
  const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); };
  const dayNum = (k) => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
  const weekdayOf = (k) => (fromKey(k).getDay() + 6) % 7;
  const monthKey = (k) => k.slice(0, 7);
  const monthDocId = (k) => 'm' + monthKey(k);
  const startOfWeek = (k) => addDays(k, -weekdayOf(k));
  const isKey = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const toMin = (t) => {
    const m = typeof t === 'string' ? /^(\d{1,2}):(\d{2})$/.exec(t) : null;
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  };
  const fromMin = (m) => { m = ((m % 1440) + 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
  const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
  const cap1 = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const withTimeout = (p, ms, fallback) => Promise.race([p, sleep(ms).then(() => fallback)]);
  const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
  const str = (v) => (typeof v === 'string' ? v : '');
  const listOf = (v) => (Array.isArray(v) ? v.filter(isObj) : []);
  const byTime = (a, b) => (toMin(a.time) ?? 9999) - (toMin(b.time) ?? 9999);
  const bytes = (s) => new TextEncoder().encode(s).length;
  const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;
  const bool = (b) => (b ? 'true' : 'false');
  const attr = (name, value) => `[${name}="${CSS.escape(String(value))}"]`;
  /* Souris ou pavé tactile : on peut déplacer le focus sans ouvrir de clavier à l'écran. */
  const finePointer = () => { try { return matchMedia('(pointer: fine)').matches; } catch (e) { return false; } };
  function stable(v) {
    if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
    if (v && typeof v === 'object') {
      return '{' + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
    }
    return JSON.stringify(v === undefined ? null : v);
  }

  /* Gabarits HTML : tout ce qui est inséré avec ${…} est échappé, sauf un autre gabarit html`…`.
     Un tableau est concaténé ; null, undefined et false n'affichent rien. */
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
  class Html { constructor(s) { this.s = s; } toString() { return this.s; } }
  const trusted = (s) => new Html(s);
  const part = (v) => (v instanceof Html ? v.s : Array.isArray(v) ? v.map(part).join('') : v == null || v === false ? '' : esc(v));
  const html = (strings, ...vals) => new Html(strings.reduce((out, s, i) => out + part(vals[i - 1]) + s));

  /* ---------- Dates en français ---------- */
  const WD_SHORT = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const WD_LETTER = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  const WD_LONG = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
  const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const dayNumber = (n) => (n === 1 ? '1er' : String(n));
  const yearSuffix = (d) => (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
  const longDate = (k) => {
    const d = fromKey(k);
    return cap1(`${WD_LONG[weekdayOf(k)]} ${dayNumber(d.getDate())} ${MONTHS[d.getMonth()]}${yearSuffix(d)}`);
  };
  function weekTitle(start) {
    const a = fromKey(start), b = fromKey(addDays(start, 6));
    const split = a.getFullYear() !== b.getFullYear();
    const from = a.getMonth() === b.getMonth() ? dayNumber(a.getDate()) : `${dayNumber(a.getDate())} ${MONTHS[a.getMonth()]}${split ? ' ' + a.getFullYear() : ''}`;
    return `Semaine du ${from} au ${dayNumber(b.getDate())} ${MONTHS[b.getMonth()]}${split ? ' ' + b.getFullYear() : yearSuffix(b)}`;
  }

  /* ---------- Contenu ---------- */
  const MOMENTS = [
    { key: 'matin', label: 'Matin', hint: 'avec le café' },
    { key: 'midi', label: 'Midi', hint: 'avec le repas' },
    { key: 'aprem', label: '16h', hint: 'repas ou collation' },
    { key: 'soir', label: 'Soir', hint: '' }
  ];
  const MOMENT_KEYS = MOMENTS.map((m) => m.key);
  const FREQS = { daily: 'Tous les jours', alt: 'Un jour sur deux', weekly: 'Une fois par semaine' };
  const FREQ_BADGE = { alt: '1 jour sur 2', weekly: '1 fois par semaine' };
  const SCALES = [
    { key: 'mood', label: 'Humeur', lo: 'au plus bas', hi: 'au top', faces: ['😞', '😕', '😐', '🙂', '😄'] },
    { key: 'energy', label: 'Énergie', lo: 'à plat', hi: 'à fond' },
    { key: 'focus', label: 'Concentration', lo: 'dispersé', hi: 'focus total' },
    { key: 'hunger', label: 'Faim', lo: 'aucune', hi: 'très forte' }
  ];
  const FACES = SCALES[0].faces;
  const MEAL_KINDS = ['Repas', 'Collation'];
  const ICON = {
    left: trusted('<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'),
    right: trusted('<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'),
    check: trusted('<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 12.5l4.5 4.5L19.5 6.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>')
  };
  /* Une note de 1 à 5, sinon null (protège l'affichage contre une donnée abîmée). */
  const scaleValue = (v) => (Number.isInteger(v) && v >= 1 && v <= 5 ? v : null);

  /* ---------- Liste de départ ---------- */
  function defaultSupplements(since) {
    const mk = (name, dose, moment, freq, note) => ({ id: newId(), name, dose, moment, freq, note, since, active: true, weekday: null });
    return [
      mk('L-théanine', '200 mg', 'matin', 'daily', 'Avec le café'),
      mk('Citicoline', '250 mg', 'matin', 'daily', ''),
      mk('Omberacetam', '10 mg', 'matin', 'daily', 'Ne pas augmenter la dose'),
      mk('Collagène marin', '10 g', 'matin', 'daily', 'Dans le café ou quand tu veux'),
      mk('Oméga-3', '1 capsule', 'midi', 'daily', 'Mieux absorbés avec un repas'),
      mk('Vitamine D3 + K2', '1 capsule', 'midi', 'alt', 'En attendant de la faire doser'),
      mk('Complexe B12', '1 comprimé', 'midi', 'alt', 'Pour rester sous la limite de B6'),
      mk('Créatine', '5 g', 'midi', 'daily', "L'heure n'a pas d'importance"),
      mk('Potassium', '100 mg', 'midi', 'daily', 'Avec le repas'),
      mk('Zinc-magnésium', '1 capsule', 'aprem', 'daily', 'Jamais à jeun'),
      mk('Potassium', '100 mg', 'aprem', 'daily', 'Avec le repas'),
      mk('Mounjaro', '2,5 mg', 'matin', 'weekly', 'Dose prescrite par ton médecin')
    ];
  }
  const freshSettings = () => { const t = todayKey(); return { version: 1, created: t, supplements: defaultSupplements(t) }; };
  function normalizeSettings(raw) {
    const created = raw && isKey(raw.created) ? raw.created : todayKey();
    const sups = raw && Array.isArray(raw.supplements) ? raw.supplements : [];
    return {
      version: 1,
      created,
      supplements: sups.filter(isObj).map((s) => ({
        id: String(s.id || newId()),
        name: String(s.name || 'Sans nom'),
        dose: String(s.dose || ''),
        note: String(s.note || ''),
        moment: MOMENT_KEYS.includes(s.moment) ? s.moment : 'matin',
        freq: FREQS[s.freq] ? s.freq : 'daily',
        since: isKey(s.since) ? s.since : created,
        active: s.active !== false,
        weekday: s.weekday == null || s.weekday === '' ? null : Math.min(6, Math.max(0, Math.round(Number(s.weekday)) || 0))
      }))
    };
  }
  /* Garde les mois « AAAA-MM » et, dedans, les jours « AAAA-MM-JJ » de ce mois. */
  function sanitizeMonths(m) {
    const out = {};
    if (!isObj(m)) return out;
    Object.keys(m).forEach((mk) => {
      if (!/^\d{4}-\d{2}$/.test(mk) || !isObj(m[mk]) || !isObj(m[mk].days)) return;
      const days = {};
      Object.keys(m[mk].days).forEach((dk) => { if (isKey(dk) && monthKey(dk) === mk && isObj(m[mk].days[dk])) days[dk] = m[mk].days[dk]; });
      out[mk] = { days };
    });
    return out;
  }

  /* ---------- État ---------- */
  const S = {
    settings: null, months: {}, ready: false,
    ui: { view: 'jour', date: todayKey(), weekOf: startOfWeek(todayKey()), year: new Date().getFullYear(), form: null, confirm: null, exportText: null, just: null, focus: null, select: false, openSup: null }
  };
  let localData = null;

  function peekDay(k) { const m = S.months[monthKey(k)]; return m && isObj(m.days) && isObj(m.days[k]) ? m.days[k] : undefined; }
  function ensureDay(k) {
    const mk = monthKey(k);
    const month = S.months[mk] || (S.months[mk] = { days: {} });
    if (!isObj(month.days)) month.days = {};
    let d = month.days[k];
    if (!isObj(d)) d = month.days[k] = { taken: {}, wake: '', bed: '', checkins: [], meals: [], notes: '' };
    if (!isObj(d.taken)) d.taken = {};
    if (!Array.isArray(d.checkins)) d.checkins = [];
    if (!Array.isArray(d.meals)) d.meals = [];
    return d;
  }
  function mutateDay(k, field, fn, rerender = true) {
    fn(ensureDay(k));
    touchDay(k, field);
    markDirty(monthDocId(k));
    if (rerender) render();
  }
  function mutateSettings(fn, rerender = true) {
    fn(S.settings);
    markDirty('settings');
    if (rerender) render();
  }

  function isScheduled(s, k) {
    if (!s || s.active === false) return false;
    if (s.since && k < s.since) return false;
    if (s.freq === 'alt') return Math.abs(dayNum(k) - dayNum(s.since || k)) % 2 === 0;
    if (s.freq === 'weekly') return s.weekday != null && weekdayOf(k) === Number(s.weekday);
    return true;
  }
  function isTaken(sid, k) { const d = peekDay(k); return !!(d && isObj(d.taken) && d.taken[sid]); }
  const scheduledFor = (k) => S.settings.supplements.filter((s) => isScheduled(s, k));
  const itemsForDay = (k) => S.settings.supplements.filter((s) => isScheduled(s, k) || isTaken(s.id, k));
  function stats(k) {
    const sch = scheduledFor(k);
    return { total: sch.length, taken: sch.filter((s) => isTaken(s.id, k)).length };
  }
  function avgScale(k, key) {
    const d = peekDay(k);
    const vals = d ? listOf(d.checkins).map((c) => scaleValue(c[key])).filter((v) => v != null) : [];
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }
  const fmtAvg = (v) => String(Math.round(v * 10) / 10).replace('.', ',');
  /* Durée de la nuit : coucher noté la veille (avant midi = après minuit), réveil noté ce jour-là. */
  function nightLength(bed, wake) {
    const b = toMin(bed), w = toMin(wake);
    if (b === null || w === null) return '';
    const dur = w + 1440 - (b < 720 ? b + 1440 : b);
    if (dur <= 0 || dur > 20 * 60) return '';
    return `${Math.floor(dur / 60)} h ${pad(dur % 60)}`;
  }
  function hasJournal(d) {
    return !!(d && (listOf(d.checkins).length || listOf(d.meals).length || str(d.wake) || str(d.notes)));
  }

  /* ---------- Enregistrement ----------
     Mode « local » : pas de compte Claude, tout reste dans ce navigateur (LS_KEY).
     Mode « cloud » : un document « settings » et un document par mois (« m2026-09 ») dans data/users/<id>.
     Chaque modification note le jour et le champ touchés (« taken:<id> », « notes »… ou « * » pour le jour entier) :
     seuls ces champs partent en ligne, pour ne pas écraser ce qu'un autre appareil écrit en même temps.
     Tant qu'ils ne sont pas confirmés, ils restent aussi dans la copie de l'appareil (CACHE_KEY) :
     hors ligne ou page fermée trop tôt, ils repartent au prochain chargement. Cette copie sert aussi
     à afficher tes données tout de suite, avant la réponse du compte. */
  const store = {
    mode: 'local', online: false, connecting: false, stopped: false, failed: false,
    col: null, uid: null, downloads: null, unsub: null,
    trusted: true,        // false : la liste affichée n'est pas (encore) celle du compte
    dirty: new Set(), inflight: new Set(), again: new Set(), timers: {}, last: {}, refs: {},
    dirtyDays: {},        // { 'm2026-09': { '2026-09-26': { 'taken:abc': true, notes: true } } }
    writingDays: {},      // la même chose, pour les écritures en cours
    connectTry: 0, connectTimer: null, retryTry: 0, retryTimer: null, lsTimer: null, status: null
  };

  function lsGet(key) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function lsSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } }

  function addFields(target, src) {
    if (!isObj(src)) return target;
    Object.keys(src).forEach((dk) => {
      if (!isKey(dk) || !isObj(src[dk])) return;
      const t = target[dk] || (target[dk] = {});
      Object.keys(src[dk]).forEach((f) => { t[f] = true; });
    });
    return target;
  }
  function touchDay(k, field = '*') {
    if (store.mode !== 'cloud') return;
    addFields(store.dirtyDays[monthDocId(k)] || (store.dirtyDays[monthDocId(k)] = {}), { [k]: { [field]: true } });
  }
  function pendingFields(docId, dk) {
    const a = store.dirtyDays[docId] && store.dirtyDays[docId][dk];
    const b = store.writingDays[docId] && store.writingDays[docId][dk];
    return a || b ? Object.assign({}, a, b) : null;
  }
  function pendingSnapshot() {
    const days = {};
    new Set([...Object.keys(store.dirtyDays), ...Object.keys(store.writingDays)]).forEach((id) => {
      const m = addFields(addFields({}, store.dirtyDays[id]), store.writingDays[id]);
      if (Object.keys(m).length) days[id] = m;
    });
    return { settings: store.dirty.has('settings') || store.inflight.has('settings'), days };
  }

  function persistNow() {
    clearTimeout(store.lsTimer); store.lsTimer = null;
    if (!S.settings) return true;
    if (store.mode === 'local') {
      store.failed = !lsSet(LS_KEY, { settings: S.settings, months: S.months });
      refreshSync();
      return !store.failed;
    }
    if (!store.uid) return false;
    return lsSet(CACHE_KEY, { v: 1, uid: store.uid, trusted: store.trusted, settings: S.settings, months: S.months, pending: pendingSnapshot() });
  }
  function persistSoon() { clearTimeout(store.lsTimer); store.lsTimer = setTimeout(persistNow, LOCAL_DELAY); }

  const SYNC = {
    loading: ['Chargement…', 'var(--muted)', ''],
    saved: ['Enregistré', 'var(--fill)', 'Enregistré sur ton compte Claude.'],
    saving: ['Enregistrement…', 'var(--matin)', ''],
    local: ['Sur cet appareil', 'var(--muted)', 'Enregistré dans ce navigateur uniquement.'],
    offline: ['Hors ligne', 'var(--matin)', 'Pas de connexion à ton compte Claude pour l’instant. Tes modifications sont gardées sur cet appareil et partiront dès que possible.'],
    error: ['Pas enregistré en ligne', 'var(--danger)', 'L’enregistrement en ligne a échoué. Tes modifications sont gardées sur cet appareil et repartiront au prochain essai.'],
    localError: ['Pas enregistré', 'var(--danger)', 'Ce navigateur refuse d’enregistrer (stockage plein ou bloqué). Fais une sauvegarde depuis Réglages.']
  };
  function syncState() {
    if (store.mode === 'local') return !S.ready ? 'loading' : store.failed ? 'localError' : 'local';
    if (store.stopped) return 'error';
    if (!store.online) return store.connectTry ? 'offline' : 'loading';
    if (store.failed) return 'error';
    return store.dirty.size || store.inflight.size ? 'saving' : 'saved';
  }
  function refreshSync() {
    const st = syncState();
    if (st === store.status) return;
    store.status = st;
    const el = document.getElementById('sync');
    const [label, dot, title] = SYNC[st];
    el.textContent = label;
    el.style.setProperty('--dot', dot);
    el.title = title;
  }

  function markDirty(docId) {
    if (store.mode === 'local') { persistSoon(); return; }
    store.dirty.add(docId);
    persistSoon();
    if (store.online && !store.stopped) {
      clearTimeout(store.timers[docId]);
      store.timers[docId] = setTimeout(() => flush(docId), SAVE_DELAY);
    }
    refreshSync();
  }
  function docData(docId) {
    if (docId === 'settings') return clone(S.settings);
    const month = S.months[docId.slice(1)];
    return clone({ days: (month && isObj(month.days) && month.days) || {} });
  }
  /* Seuls les champs modifiés partent ; si le mois n'existe pas encore en ligne, on l'écrit en entier. */
  async function writeMonth(ref, full, writing) {
    const days = {};
    Object.keys(writing).forEach((dk) => {
      const day = full.days[dk], fields = writing[dk];
      if (!isObj(day)) return;
      if (fields['*']) { days[dk] = day; return; }
      const out = {};
      Object.keys(fields).forEach((f) => {
        if (f.startsWith('taken:')) {
          const sid = f.slice(6);
          (out.taken || (out.taken = {}))[sid] = !!(isObj(day.taken) && day.taken[sid]);
        } else if (f in day) out[f] = day[f];
      });
      days[dk] = out;
    });
    if (!Object.keys(days).length) return;
    try {
      await ref.update({ days });
    } catch (e) {
      if (!e || e.code !== 'invalid_argument') throw e;
      const snap = await ref.get();
      if (snap.exists) throw e;
      await ref.set(full);
    }
  }
  async function withOneRetry(fn) {
    try { return await fn(); } catch (e) {
      if (!e || e.code !== 'unavailable') throw e;
      await sleep(600 + Math.random() * 900);
      return fn();
    }
  }
  function onWriteError(e) {
    const code = e && e.code;
    store.failed = true;
    if (code === 'revoked') { stopSync(); return; }
    if (code === 'quota_exceeded') { toast('Plus de place pour enregistrer en ligne. Tes données restent sur cet appareil.'); return; }
    if (code === 'invalid_argument' || code === 'transform_error') return;
    scheduleRetry();
  }
  function scheduleRetry() {
    if (store.retryTimer || store.stopped) return;
    const delay = RETRY_DELAYS[Math.min(store.retryTry++, RETRY_DELAYS.length - 1)];
    store.retryTimer = setTimeout(() => { store.retryTimer = null; flushAll(); }, delay);
  }

  async function flush(docId) {
    clearTimeout(store.timers[docId]); delete store.timers[docId];
    if (store.mode !== 'cloud' || !store.online || store.stopped) return;
    if (store.inflight.has(docId)) { store.again.add(docId); return; }
    if (!store.dirty.has(docId)) return;
    store.dirty.delete(docId);
    const isMonth = docId !== 'settings';
    const writing = store.dirtyDays[docId] || {};
    delete store.dirtyDays[docId];
    if (isMonth && !Object.keys(writing).length) { refreshSync(); return; }
    store.writingDays[docId] = writing;
    const full = docData(docId), sig = stable(full);
    const restore = () => { addFields(store.dirtyDays[docId] || (store.dirtyDays[docId] = {}), writing); store.dirty.add(docId); };
    if (bytes(sig) > MAX_DOC_BYTES) {
      delete store.writingDays[docId];
      restore();
      store.failed = true;
      toast(isMonth ? 'Ce mois est trop long pour être enregistré en ligne. Raccourcis quelques notes.' : 'Ta liste est trop longue pour être enregistrée en ligne.');
      persistSoon(); refreshSync();
      return;
    }
    store.inflight.add(docId);
    refreshSync();
    const ref = store.col.doc(docId);
    let error = null;
    try {
      await withOneRetry(() => (isMonth ? writeMonth(ref, full, writing) : ref.set(full)));
    } catch (e) { error = e || { code: 'unavailable' }; }
    store.inflight.delete(docId);
    delete store.writingDays[docId];
    if (error) { restore(); onWriteError(error); }
    else { store.last[docId] = sig; store.failed = false; store.retryTry = 0; }
    persistSoon();
    if (store.again.delete(docId)) flush(docId);
    refreshSync();
  }
  function flushAll() {
    if (store.mode === 'local') { if (store.lsTimer) persistNow(); return; }
    [...store.dirty].forEach(flush);
    persistNow();
  }

  function applyRemoteDoc(id, data) {
    if (id === 'settings') S.settings = normalizeSettings(data);
    else if (MONTH_DOC.test(id)) S.months[id.slice(1)] = { days: isObj(data && data.days) ? data.days : {} };
  }
  /* Un mois modifié ici pendant qu'un autre appareil écrit : on prend ses jours et ses champs, sauf ceux qu'on est en train d'envoyer. */
  function mergeBusyMonth(id, remoteDays) {
    const mk = id.slice(1);
    const month = S.months[mk] || (S.months[mk] = { days: {} });
    if (!isObj(month.days)) month.days = {};
    const local = month.days;
    let changed = false;
    Object.keys(remoteDays).forEach((dk) => {
      const rd = remoteDays[dk], pend = pendingFields(id, dk);
      if (!pend) {
        if (stable(rd) !== stable(local[dk])) { local[dk] = rd; changed = true; }
        return;
      }
      if (pend['*'] || !isObj(rd)) return;
      const ld = isObj(local[dk]) ? local[dk] : (local[dk] = {});
      Object.keys(rd).forEach((field) => {
        if (field === 'taken') {
          const rt = isObj(rd.taken) ? rd.taken : {};
          if (!isObj(ld.taken)) ld.taken = {};
          Object.keys(rt).forEach((sid) => {
            if (pend['taken:' + sid] || ld.taken[sid] === rt[sid]) return;
            ld.taken[sid] = rt[sid]; changed = true;
          });
          return;
        }
        if (pend[field] || stable(rd[field]) === stable(ld[field])) return;
        ld[field] = rd[field]; changed = true;
      });
    });
    return changed;
  }
  function onRemote(snap) {
    let changed = false;
    snap.docs.forEach((ds) => {
      if (!ds.exists) return;
      const raw = ds.data();
      if (store.refs[ds.id] === raw) return; // document inchangé depuis la dernière livraison
      store.refs[ds.id] = raw;
      const id = ds.id, data = clone(raw) || {}, sig = stable(data);
      const busy = store.dirty.has(id) || store.inflight.has(id) || !!store.timers[id];
      if (!busy) {
        if (sig === store.last[id]) return;
        store.last[id] = sig;
        applyRemoteDoc(id, data);
        changed = true;
      } else if (MONTH_DOC.test(id) && isObj(data.days)) {
        changed = mergeBusyMonth(id, data.days) || changed;
      }
    });
    if (changed) { persistSoon(); safeRender(); }
  }
  function subscribe() {
    if (store.unsub || store.stopped) return;
    try {
      store.unsub = store.col.onSnapshot(onRemote, (e) => {
        store.unsub = null;
        const code = e && e.code;
        if (code === 'revoked') { stopSync(); return; }
        if (code === 'invalid_argument' || code === 'transform_error') return;
        setTimeout(subscribe, 15000); // flux coupé : on se réabonne un peu plus tard
      });
    } catch (e) { /* la page reste utilisable sans synchro en direct */ }
  }
  function stopSync() {
    store.stopped = true;
    if (store.unsub) { try { store.unsub(); } catch (e) { /* déjà fermé */ } store.unsub = null; }
    clearTimeout(store.retryTimer); clearTimeout(store.connectTimer);
    Object.values(store.timers).forEach(clearTimeout); store.timers = {};
    if (!S.ready) startOffline();
    persistNow(); refreshSync();
  }

  /* Remet par-dessus les données du compte ce qui a été modifié sur l'appareil et pas encore envoyé. */
  function copyFields(dk, src, fields) {
    const day = ensureDay(dk);
    if (fields['*']) { S.months[monthKey(dk)].days[dk] = clone(src); return; }
    Object.keys(fields).forEach((f) => {
      if (f.startsWith('taken:')) { const sid = f.slice(6); day.taken[sid] = !!(isObj(src.taken) && src.taken[sid]); }
      else if (f in src) day[f] = clone(src[f]);
    });
  }
  function applyInitialSnapshot(snap) {
    const before = { settings: S.settings, months: S.months, trusted: store.trusted };
    S.months = {};
    let hasSettings = false;
    snap.docs.forEach((ds) => {
      if (!ds.exists) return;
      const raw = ds.data(), data = clone(raw) || {};
      store.refs[ds.id] = raw;
      store.last[ds.id] = stable(data);
      if (ds.id === 'settings') hasSettings = true;
      applyRemoteDoc(ds.id, data);
    });
    if (!hasSettings) {
      // Rien encore sur ce compte : on y met ce qu'il y a sur l'appareil (sinon la liste de départ).
      const src = before.settings ? before
        : localData && localData.settings ? { settings: normalizeSettings(localData.settings), months: sanitizeMonths(localData.months) }
        : { settings: freshSettings(), months: {} };
      S.settings = src.settings;
      store.dirty.add('settings');
      Object.keys(src.months).forEach((mk) => {
        if (S.months[mk]) return;
        S.months[mk] = src.months[mk];
        Object.keys(src.months[mk].days || {}).forEach((dk) => touchDay(dk));
      });
    } else if (before.settings && before.trusted && store.dirty.has('settings')) {
      S.settings = before.settings;
    } else {
      store.dirty.delete('settings');
    }
    Object.keys(store.dirtyDays).forEach((docId) => {
      const month = before.months[docId.slice(1)];
      Object.keys(store.dirtyDays[docId]).forEach((dk) => {
        const src = month && isObj(month.days) ? month.days[dk] : null;
        if (isObj(src)) copyFields(dk, src, store.dirtyDays[docId][dk]);
      });
      store.dirty.add(docId);
    });
    store.trusted = true;
  }

  function scheduleConnect() {
    if (store.connectTimer || store.stopped) return;
    const delay = RETRY_DELAYS[Math.min(store.connectTry - 1, RETRY_DELAYS.length - 1)];
    store.connectTimer = setTimeout(() => { store.connectTimer = null; connect(); }, delay);
  }
  async function connect() {
    if (store.online || store.stopped || store.connecting || !store.col) return;
    clearTimeout(store.connectTimer); store.connectTimer = null;
    store.connecting = true;
    let snap = null, error = null;
    try { snap = await withTimeout(store.col.get(), GET_TIMEOUT, null); } catch (e) { error = e; }
    store.connecting = false;
    if (!snap) {
      store.connectTry++;
      const code = error && error.code;
      if (['revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) { stopSync(); return; }
      if (!S.ready) startOffline();
      scheduleConnect();
      refreshSync();
      return;
    }
    applyInitialSnapshot(snap);
    store.online = true;
    store.connectTry = 0;
    subscribe();
    flushAll();
    if (S.ready) safeRender(); else { S.ready = true; render(); }
    refreshSync();
  }

  function startLocal() {
    store.mode = 'local';
    if (localData && localData.settings) { S.settings = normalizeSettings(localData.settings); S.months = sanitizeMonths(localData.months); }
    else { S.settings = freshSettings(); S.months = {}; persistNow(); }
    S.ready = true;
    render(); refreshSync();
  }
  function startFromCache(cache) {
    S.settings = normalizeSettings(cache.settings);
    S.months = sanitizeMonths(cache.months);
    store.trusted = cache.trusted !== false;
    const p = isObj(cache.pending) ? cache.pending : {};
    if (p.settings) store.dirty.add('settings');
    if (isObj(p.days)) Object.keys(p.days).forEach((docId) => {
      if (!MONTH_DOC.test(docId)) return;
      const days = addFields({}, p.days[docId]);
      if (!Object.keys(days).length) return;
      store.dirtyDays[docId] = days;
      store.dirty.add(docId);
    });
    S.ready = true;
    render();
  }
  /* Le compte ne répond pas et l'appareil n'en a pas de copie : on montre les données locales ou la liste de départ. */
  function startOffline() {
    if (S.ready) return;
    const base = localData && localData.settings ? localData : null;
    S.settings = base ? normalizeSettings(base.settings) : freshSettings();
    S.months = base ? sanitizeMonths(base.months) : {};
    store.trusted = false;
    S.ready = true;
    render();
  }

  async function getCapabilities() {
    const none = { db: null, downloads: null, uid: null };
    const claude = window.claude;
    if (!claude || typeof claude.use !== 'function') return none;
    const use = (name) => Promise.resolve().then(() => claude.use(name)).catch(() => null);
    try {
      const [db, user, downloads] = await withTimeout(Promise.all([use('db'), use('user'), use('downloads')]), CAPS_TIMEOUT, [null, null, null]);
      const uid = user && typeof user.id === 'function' ? await withTimeout(user.id().catch(() => null), 5000, null) : null;
      return { db, downloads, uid };
    } catch (e) { return none; }
  }
  async function init() {
    refreshSync();
    localData = lsGet(LS_KEY);
    const caps = await getCapabilities();
    store.downloads = caps.downloads || null;
    if (!caps.db || !caps.uid) { startLocal(); return; }
    try { store.col = caps.db.collection('data/users/' + caps.uid); } catch (e) { startLocal(); return; }
    store.mode = 'cloud';
    store.uid = caps.uid;
    const cache = lsGet(CACHE_KEY);
    if (isObj(cache) && cache.uid === caps.uid && isObj(cache.settings)) startFromCache(cache);
    refreshSync();
    connect();
  }

  /* ---------- Rendu : Jour ---------- */
  function renderDay() {
    const k = S.ui.date, isToday = k === todayKey();
    const d = peekDay(k) || {};
    return html`<section class="dayhead"><div class="datebar">
        <h1 class="date">${longDate(k)}</h1>
        <div class="daynav">
          ${isToday ? '' : html`<button type="button" class="ghost" data-act="day-today">Aujourd’hui</button>`}
          <button type="button" class="icon" data-act="day-prev" aria-label="Jour précédent">${ICON.left}</button>
          <button type="button" class="icon" data-act="day-next" aria-label="Jour suivant">${ICON.right}</button>
        </div>
      </div>${weekStrip(k)}</section>
      ${weeklyBanner()}
      <div class="daygrid">
        <div class="col">${sleepBlock(k, d, isToday)}${supplementBlock(k)}</div>
        <div class="col">${checkinBlock(k, d, isToday)}${mealBlock(k, d)}${notesBlock(k, d)}</div>
      </div>`;
  }
  function weekStrip(k) {
    const start = startOfWeek(k), t = todayKey();
    const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    return html`<div class="strip" role="group" aria-label="Jours de la semaine">${days.map((dk, i) => {
      const st = stats(dk), pct = st.total ? Math.round((st.taken / st.total) * 100) : 0;
      const label = longDate(dk) + (st.total ? `, ${st.taken} sur ${st.total} compléments` : '');
      return html`<button type="button" class="lid${dk === t ? ' today' : ''}" data-act="goto" data-date="${dk}"${dk === k ? html` aria-current="date"` : ''} aria-label="${label}"><span class="wd">${WD_SHORT[i]}</span><span class="dn">${fromKey(dk).getDate()}</span><span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span></button>`;
    })}</div>`;
  }
  function weeklyBanner() {
    return S.settings.supplements.filter((s) => s.active && s.freq === 'weekly' && s.weekday == null).map((s) => html`<div class="banner">
      <p><label for="wk-${s.id}">${s.name} : quel jour de la semaine ?</label></p>
      <select id="wk-${s.id}" data-weekly="${s.id}"><option value="">Choisir le jour</option>${WD_LONG.map((w, i) => html`<option value="${i}">${cap1(w)}</option>`)}</select>
    </div>`);
  }
  function sleepBlock(k, d, isToday) {
    const prev = peekDay(addDays(k, -1));
    const wake = str(d.wake), night = nightLength(prev && prev.bed, wake);
    return html`<section class="sleep" aria-label="Sommeil">
      <label class="field"><span>Réveil</span><input type="time" id="wake-${k}" data-bind="wake" data-date="${k}" value="${wake}"></label>
      <label class="field"><span>Coucher</span><input type="time" id="bed-${k}" data-bind="bed" data-date="${k}" value="${str(d.bed)}"></label>
      ${!wake && isToday ? html`<button type="button" class="chip" data-act="wake-now" data-date="${k}">Je viens de me lever</button>`
        : night ? html`<p class="night">Nuit de ${night}</p>` : ''}
    </section>`;
  }
  function supplementItem(s, k) {
    const on = isTaken(s.id, k), just = S.ui.just === `${s.id}|${k}`;
    return html`<button type="button" class="item" data-act="toggle" data-sid="${s.id}" data-date="${k}" aria-pressed="${bool(on)}"><span class="cap${on ? ' on' : ''}${just ? ' just' : ''}" aria-hidden="true">${on ? ICON.check : ''}</span><span class="it-main"><span class="it-name">${s.name}</span>${s.dose ? html`<span class="it-dose">${s.dose}</span>` : ''}${s.note ? html`<span class="it-note">${s.note}</span>` : ''}</span>${FREQ_BADGE[s.freq] ? html`<span class="freq">${FREQ_BADGE[s.freq]}</span>` : ''}</button>`;
  }
  function supplementBlock(k) {
    const items = itemsForDay(k), st = stats(k);
    const body = items.length
      ? html`<div class="boxes">${MOMENTS.map((m) => {
          const list = items.filter((s) => s.moment === m.key);
          return list.length ? html`<div class="box m-${m.key}"><div class="box-lid"><h3>${m.label}</h3>${m.hint ? html`<span>${m.hint}</span>` : ''}</div>${list.map((s) => supplementItem(s, k))}</div>` : '';
        })}</div>`
      : html`<p class="empty">Rien de prévu ce jour-là.${S.settings.supplements.length ? '' : ' Ajoute tes compléments dans Réglages.'}</p>`;
    return html`<section class="supps"><div class="sec-head"><h2>Compléments</h2>${st.total ? html`<span class="count">${st.taken} sur ${st.total}</span>` : ''}</div>${body}</section>`;
  }
  function rowActions(kind, k, id, what) {
    if (S.ui.confirm === `${kind}:${id}`) {
      return html`<span class="row-actions"><button type="button" class="link danger" data-act="${kind}-del" data-date="${k}" data-id="${id}" aria-label="Oui, supprimer ${what}">Oui, supprimer</button><button type="button" class="link" data-act="confirm-cancel">Non</button></span>`;
    }
    return html`<span class="row-actions"><button type="button" class="link" data-act="${kind}-edit" data-date="${k}" data-id="${id}" aria-label="Modifier ${what}">Modifier</button><button type="button" class="link" data-act="${kind}-ask" data-date="${k}" data-id="${id}" aria-label="Supprimer ${what}">Supprimer</button></span>`;
  }
  const openForm = (type, k) => (S.ui.form && S.ui.form.type === type && S.ui.form.date === k ? S.ui.form : null);
  function checkinBlock(k, d, isToday) {
    const list = listOf(d.checkins).sort(byTime);
    const f = openForm('checkin', k);
    let hint = '';
    if (isToday && !f) {
      const last = list.length ? toMin(list[list.length - 1].time) : null;
      if (!list.length) hint = 'Premier check-in : comment tu te sens au réveil ?';
      else if (last != null && last + 180 < 23 * 60) hint = `Prochain check-in entre ${fromMin(last + 180)} et ${fromMin(Math.min(last + 240, 23 * 60 + 59))}`;
    }
    return html`<section class="jsec"><div class="sec-head"><h2>Comment je me sens</h2>${f ? '' : html`<button type="button" class="primary" data-act="ci-new" data-date="${k}">Nouveau check-in</button>`}</div>
      ${hint ? html`<p class="hint">${hint}</p>` : ''}
      ${f && !f.id ? checkinForm(f) : ''}
      ${list.length ? html`<ul class="list">${list.map((c) => (f && f.id === c.id ? html`<li class="editing">${checkinForm(f)}</li>` : checkinEntry(c, k)))}</ul>`
        : f ? '' : html`<p class="empty">Aucun check-in pour l’instant.</p>`}
    </section>`;
  }
  function checkinEntry(c, k) {
    const mood = scaleValue(c.mood);
    const meters = SCALES.slice(1).map((sc) => {
      const v = scaleValue(c[sc.key]);
      if (!v) return '';
      const segs = [1, 2, 3, 4, 5].map((i) => (i <= v ? html`<i class="on"></i>` : html`<i></i>`));
      return html`<span class="meter"><span aria-hidden="true">${sc.label}</span><span class="segs" aria-hidden="true">${segs}</span><span class="sr-only">${sc.label} ${v} sur 5</span></span>`;
    });
    return html`<li class="entry"><span class="t">${str(c.time)}</span><div class="e-body"><div class="ci-line">${mood ? html`<span class="face" role="img" aria-label="Humeur ${mood} sur 5">${FACES[mood - 1]}</span>` : ''}<span class="meters">${meters}</span></div>${c.note ? html`<p class="note">${c.note}</p>` : ''}</div>${rowActions('ci', k, c.id, `le check-in de ${str(c.time)}`)}</li>`;
  }
  function checkinForm(f) {
    const dr = f.draft;
    return html`<div class="form" role="group" aria-label="Check-in">
      <label class="field field-time"><span>Heure</span><input type="time" id="draft-time" data-draft="time" value="${str(dr.time)}"></label>
      ${SCALES.map((sc) => html`<fieldset class="scale"><legend>${sc.label}</legend><div class="dots">${[1, 2, 3, 4, 5].map((i) => html`<button type="button" class="dot${sc.faces ? ' emoji' : ''}" data-act="rate" data-scale="${sc.key}" data-v="${i}" aria-pressed="${bool(dr[sc.key] === i)}" aria-label="${sc.label} ${i} sur 5">${sc.faces ? sc.faces[i - 1] : i}</button>`)}</div><div class="ends" aria-hidden="true"><span>${sc.lo}</span><span>${sc.hi}</span></div></fieldset>`)}
      <label class="field"><span>Note</span><textarea id="draft-note" data-draft="note" rows="2" placeholder="Ce qui se passe, ce qui joue sur ton état">${str(dr.note)}</textarea></label>
      <div class="actions"><button type="button" class="primary" data-act="form-save">Enregistrer</button><button type="button" class="ghost" data-act="form-cancel">Annuler</button></div>
    </div>`;
  }
  function mealBlock(k, d) {
    const list = listOf(d.meals).sort(byTime);
    const f = openForm('meal', k);
    const entry = (m) => html`<li class="entry"><span class="t">${str(m.time)}</span><div class="e-body"><span class="kind">${m.kind || 'Repas'}</span><p class="note">${m.text}</p></div>${rowActions('meal', k, m.id, `${m.kind === 'Collation' ? 'la collation' : 'le repas'} de ${str(m.time)}`)}</li>`;
    return html`<section class="jsec"><div class="sec-head"><h2>Ce que j’ai mangé</h2>${f ? '' : html`<button type="button" class="primary" data-act="meal-new" data-date="${k}">Ajouter</button>`}</div>
      ${f && !f.id ? mealForm(f) : ''}
      ${list.length ? html`<ul class="list">${list.map((m) => (f && f.id === m.id ? html`<li class="editing">${mealForm(f)}</li>` : entry(m)))}</ul>`
        : f ? '' : html`<p class="empty">Rien de noté pour l’instant.</p>`}
    </section>`;
  }
  function mealForm(f) {
    const dr = f.draft;
    return html`<div class="form" role="group" aria-label="Repas">
      <div class="form-row">
        <label class="field field-time"><span>Heure</span><input type="time" id="draft-time" data-draft="time" value="${str(dr.time)}"></label>
        <div class="field"><span id="kind-lbl">Type</span><div class="seg" role="group" aria-labelledby="kind-lbl">${MEAL_KINDS.map((v) => html`<button type="button" data-act="meal-kind" data-v="${v}" aria-pressed="${bool(dr.kind === v)}">${v}</button>`)}</div></div>
      </div>
      <label class="field"><span>Qu’est-ce que tu as mangé ?</span><textarea id="meal-text" data-draft="text" rows="3" placeholder="Riz complet, poulet, brocolis…">${str(dr.text)}</textarea></label>
      <div class="actions"><button type="button" class="primary" data-act="form-save">Enregistrer</button><button type="button" class="ghost" data-act="form-cancel">Annuler</button></div>
    </div>`;
  }
  function notesBlock(k, d) {
    return html`<section class="jsec"><div class="sec-head"><h2><label for="notes-${k}">Notes du jour</label></h2></div><textarea id="notes-${k}" class="notes" data-bind="notes" data-date="${k}" rows="4" placeholder="Cours, révisions, ce qui s’est passé…">${str(d.notes)}</textarea></section>`;
  }

  /* ---------- Rendu : Semaine ---------- */
  function renderWeek() {
    const start = S.ui.weekOf, t = todayKey();
    const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    const rows = MOMENTS.map((m) => {
      const sups = S.settings.supplements.filter((s) => s.moment === m.key && days.some((dk) => isScheduled(s, dk) || isTaken(s.id, dk)));
      if (!sups.length) return '';
      return html`<tr class="grp m-${m.key}"><th colspan="8" scope="colgroup">${m.label}${m.hint ? html` <span>${m.hint}</span>` : ''}</th></tr>${sups.map((s) => html`<tr class="m-${m.key}"><th scope="row">${s.name}${s.dose ? html` <small>${s.dose}</small>` : ''}</th>${days.map((dk) => {
        const on = isTaken(s.id, dk);
        if (!on && !isScheduled(s, dk)) return html`<td></td>`;
        return html`<td><button type="button" class="mini${on ? ' on' : ''}" data-act="toggle" data-sid="${s.id}" data-date="${dk}" aria-pressed="${bool(on)}" aria-label="${s.name}, ${longDate(dk)}">${on ? ICON.check : ''}</button></td>`;
      })}</tr>`)}`;
    });
    const summary = [
      html`<tr><th scope="row">Pris</th>${days.map((dk) => { const st = stats(dk); return html`<td>${st.total ? `${st.taken}/${st.total}` : ''}</td>`; })}</tr>`,
      html`<tr><th scope="row">Réveil</th>${days.map((dk) => html`<td>${str((peekDay(dk) || {}).wake)}</td>`)}</tr>`,
      SCALES.map((sc) => html`<tr><th scope="row">${sc.label}${sc.faces ? '' : html` <small>sur 5</small>`}</th>${days.map((dk) => {
        const v = avgScale(dk, sc.key);
        if (v == null) return html`<td></td>`;
        if (sc.faces) return html`<td><span role="img" aria-label="${sc.label} ${fmtAvg(v)} sur 5">${sc.faces[Math.min(4, Math.max(0, Math.round(v) - 1))]}</span></td>`;
        return html`<td>${fmtAvg(v)}</td>`;
      })}</tr>`)
    ];
    return html`<div class="wk-head"><h1 class="wk-title">${weekTitle(start)}</h1><div class="daynav">
        ${start !== startOfWeek(t) ? html`<button type="button" class="ghost" data-act="week-now">Cette semaine</button>` : ''}
        <button type="button" class="icon" data-act="week-prev" aria-label="Semaine précédente">${ICON.left}</button>
        <button type="button" class="icon" data-act="week-next" aria-label="Semaine suivante">${ICON.right}</button>
      </div></div>
      <p class="hint">Touche une gélule pour la cocher, ou un jour pour ouvrir son journal.</p>
      <div class="scroller"><table class="week"><thead><tr><th scope="col"><span class="sr-only">Complément</span></th>${days.map((dk, i) => html`<th scope="col"${dk === t ? html` class="today"` : ''}><button type="button" data-act="goto" data-date="${dk}" aria-label="${longDate(dk)}"><span>${WD_SHORT[i]}</span><b>${fromKey(dk).getDate()}</b></button></th>`)}</tr></thead>
      <tbody>${rows}</tbody><tbody class="sum">${summary}</tbody></table></div>
      ${S.settings.supplements.length ? '' : html`<p class="empty">Ta liste est vide. Ajoute tes compléments dans Réglages.</p>`}`;
  }

  /* ---------- Rendu : Année ---------- */
  function renderYear() {
    const y = S.ui.year, t = todayKey();
    let full = 0, tracked = 0;
    const months = MONTHS.map((name, m) => {
      const offset = (new Date(y, m, 1).getDay() + 6) % 7, nDays = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let dn = 1; dn <= nDays; dn++) {
        const k = `${y}-${pad(m + 1)}-${pad(dn)}`, st = stats(k), j = hasJournal(peekDay(k));
        const future = k > t, p = st.total ? st.taken / st.total : 0;
        if (!future && st.total) { tracked++; if (p >= 1) full++; }
        const cls = 'bub' + (future ? ' future' : '') + (!st.total ? ' none' : p >= 1 ? ' full' : p > 0 ? ' part' : '') + (j ? ' j' : '') + (k === t ? ' today' : '');
        const label = `${longDate(k)} : ${st.total ? `${st.taken} sur ${st.total} compléments` : 'rien de prévu'}${j ? ', journal rempli' : ''}`;
        cells.push(html`<button type="button" class="${cls}" style="--p:${p.toFixed(3)}" data-act="goto" data-date="${k}" aria-label="${label}"></button>`);
      }
      return html`<section class="month"><h3>${cap1(name)}</h3><div class="blister">${WD_LETTER.map((l) => html`<span class="wdh" aria-hidden="true">${l}</span>`)}${Array.from({ length: offset }, () => html`<span aria-hidden="true"></span>`)}${cells}</div></section>`;
    });
    return html`<div class="yr-head"><h1 class="yr-title">${y}</h1><div class="daynav">
        ${y !== new Date().getFullYear() ? html`<button type="button" class="ghost" data-act="year-now">Cette année</button>` : ''}
        <button type="button" class="icon" data-act="year-prev" aria-label="Année précédente">${ICON.left}</button>
        <button type="button" class="icon" data-act="year-next" aria-label="Année suivante">${ICON.right}</button>
      </div></div>
      <p class="yr-sum">${tracked ? `Tout pris ${plural(full, 'jour')} sur ${plural(tracked, 'suivi')}.` : 'Rien de suivi cette année pour l’instant.'}</p>
      <div class="legend" aria-hidden="true"><span><i class="bub"></i>Rien pris</span><span><i class="bub part" style="--p:.5"></i>En partie</span><span><i class="bub full"></i>Tout pris</span><span><i class="bub j"></i>Journal rempli</span></div>
      <div class="months">${months}</div>`;
  }

  /* ---------- Rendu : Réglages ---------- */
  function supSummary(s) {
    if (!s.active) return 'En pause';
    if (s.freq === 'alt') return 'Un jour sur deux';
    if (s.freq === 'weekly') return s.weekday == null ? 'Jour à choisir' : 'Chaque ' + WD_LONG[s.weekday];
    return 'Tous les jours';
  }
  function supRow(s) {
    const cls = `srow m-${s.moment}${s.active ? '' : ' paused'}`;
    if (S.ui.openSup !== s.id) {
      return html`<div class="${cls} srow-c" data-sid="${s.id}"><button type="button" class="srow-open" data-act="sup-open" data-sid="${s.id}" aria-expanded="false"><span class="it-name">${s.name}</span>${s.dose ? html`<span class="it-dose">${s.dose}</span>` : ''}<span class="srow-meta">${supSummary(s)}</span></button></div>`;
    }
    const id = (f) => `sup-${s.id}-${f}`;
    const options = (entries, current) => entries.map(([v, label]) => html`<option value="${v}"${String(v) === String(current) ? html` selected` : ''}>${label}</option>`);
    return html`<div class="${cls}" data-sid="${s.id}">
      <div class="srow-line">
        <label class="field grow"><span>Nom</span><input type="text" id="${id('name')}" data-sset="name" value="${s.name}" autocomplete="off"></label>
        <label class="field"><span>Dose</span><input type="text" id="${id('dose')}" data-sset="dose" value="${s.dose}" autocomplete="off" size="10"></label>
      </div>
      <div class="srow-line">
        <label class="field"><span>Moment</span><select id="${id('moment')}" data-sset="moment">${options(MOMENTS.map((m) => [m.key, m.label]), s.moment)}</select></label>
        <label class="field"><span>Fréquence</span><select id="${id('freq')}" data-sset="freq">${options(Object.entries(FREQS), s.freq)}</select></label>
        ${s.freq === 'weekly' ? html`<label class="field"><span>Jour</span><select id="${id('weekday')}" data-sset="weekday">${options([['', 'Choisir'], ...WD_LONG.map((w, i) => [i, cap1(w)])], s.weekday == null ? '' : s.weekday)}</select></label>` : ''}
        <label class="field"><span>${s.freq === 'alt' ? 'Premier jour' : 'Depuis le'}</span><input type="date" id="${id('since')}" data-sset="since" value="${s.since}"></label>
      </div>
      <label class="field"><span>Note</span><input type="text" id="${id('note')}" data-sset="note" value="${s.note}" placeholder="Optionnel" autocomplete="off"></label>
      <div class="srow-foot"><label class="switch"><input type="checkbox" id="${id('active')}" data-sset="active"${s.active ? html` checked` : ''}> Actif</label>
        ${S.ui.confirm === `sup:${s.id}`
          ? html`<span class="row-actions"><button type="button" class="link danger" data-act="sup-del" data-sid="${s.id}">Oui, supprimer</button><button type="button" class="link" data-act="confirm-cancel">Non</button></span>`
          : html`<span class="row-actions"><button type="button" class="link" data-act="sup-ask" data-sid="${s.id}">Supprimer</button><button type="button" class="ghost" data-act="sup-close" data-sid="${s.id}">Terminé</button></span>`}
      </div>
    </div>`;
  }
  function renderSettings() {
    const sups = S.settings.supplements;
    const groups = MOMENTS.map((m) => {
      const list = sups.filter((s) => s.moment === m.key);
      return list.length ? html`<h3 class="m-title m-${m.key}">${m.label}${m.hint ? html` <span>${m.hint}</span>` : ''}</h3>${list.map(supRow)}` : '';
    });
    const where = store.mode === 'cloud'
      ? 'Enregistrées sur ton compte Claude et privées : toi seul les vois, même si tu partages cette page. Elles se synchronisent entre ta tablette et tes autres appareils. Sans connexion, tes modifications restent sur l’appareil et partent dès que possible.'
      : 'Enregistrées dans ce navigateur, sur cet appareil uniquement. Fais une sauvegarde de temps en temps.';
    return html`<h1 class="set-title">Réglages</h1>
      <section class="set-sec"><div class="sec-head"><h2>Ta liste</h2><button type="button" class="primary" data-act="sup-add">Ajouter un complément</button></div>
        <p class="hint">Touche un complément pour le modifier. Tout est enregistré au fur et à mesure. Pour « un jour sur deux », le premier jour décide lesquels tombent.</p>
        ${groups}${sups.length ? '' : html`<p class="empty">Ta liste est vide.</p>`}
      </section>
      <section class="set-sec"><div class="sec-head"><h2>Tes données</h2></div>
        <p class="muted">${where}</p>
        <div class="actions"><button type="button" class="ghost" data-act="export-json">Faire une sauvegarde</button><button type="button" class="ghost" data-act="export-csv">Exporter le journal en tableau</button><label class="ghost filebtn">Restaurer une sauvegarde<input type="file" id="import-file" accept=".json,application/json" data-file="import" class="sr-only"></label></div>
        ${S.ui.exportText != null ? html`<div class="exportbox"><p class="hint">Le téléchargement n’est pas disponible ici. Copie ce texte et garde-le quelque part.</p><textarea readonly class="export" id="export-text" rows="8">${S.ui.exportText}</textarea><div class="actions"><button type="button" class="ghost" data-act="copy-export">Copier</button><button type="button" class="link" data-act="close-export">Fermer</button></div></div>` : ''}
        <div class="reset">${S.ui.confirm === 'reset'
          ? html`<p>Ta liste actuelle sera remplacée par la liste de départ. Ton journal ne bouge pas.</p><div class="actions"><button type="button" class="danger" data-act="reset-yes">Remplacer ma liste</button><button type="button" class="ghost" data-act="confirm-cancel">Annuler</button></div>`
          : html`<button type="button" class="link" data-act="reset-ask">Remettre la liste de départ</button>`}</div>
      </section>`;
  }

  /* ---------- Rendu général ---------- */
  const view = document.getElementById('view');
  const VIEWS = { jour: renderDay, semaine: renderWeek, annee: renderYear, reglages: renderSettings };
  let pendingRender = false;
  /* Le bouton qui a le focus est recréé à chaque rendu : on retrouve le même (mêmes data-*) pour garder la place au clavier. */
  const FOCUS_ATTRS = ['data-act', 'data-sid', 'data-date', 'data-id', 'data-scale', 'data-v'];
  function focusedButton() {
    const a = document.activeElement;
    if (!a || a.tagName !== 'BUTTON' || !view.contains(a)) return null;
    const sel = FOCUS_ATTRS.filter((n) => a.hasAttribute(n)).map((n) => attr(n, a.getAttribute(n))).join('');
    return sel ? 'button' + sel : null;
  }
  function render() {
    document.querySelectorAll('.tabs [data-view]').forEach((b) => {
      if (b.dataset.view === S.ui.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (!S.ready) { view.innerHTML = '<p class="loading">Chargement de tes données…</p>'; return; }
    pendingRender = false;
    const explicit = S.ui.focus, keep = explicit || focusedButton();
    view.innerHTML = String((VIEWS[S.ui.view] || renderDay)());
    S.ui.just = null;
    if (keep) {
      const el = view.querySelector(keep);
      if (el) { try { el.focus(explicit ? undefined : { preventScroll: true }); if (S.ui.select && el.select) el.select(); } catch (e) { /* rien */ } }
    }
    S.ui.focus = null; S.ui.select = false;
  }
  function isEditing() {
    const a = document.activeElement;
    return !!(a && view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox');
  }
  function safeRender() { if (isEditing()) { pendingRender = true; return; } render(); }
  document.addEventListener('focusout', () => {
    if (!pendingRender) return;
    setTimeout(() => { if (pendingRender && !isEditing()) render(); }, 60);
  });

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }
  function toTop() { try { window.scrollTo(0, 0); } catch (e) { /* rien */ } }
  function go(k) { S.ui.date = k; S.ui.form = null; S.ui.confirm = null; render(); }

  /* ---------- Formulaires ---------- */
  function startForm(type, k, id) {
    let draft;
    if (id) {
      const d = peekDay(k);
      const it = d ? listOf(type === 'checkin' ? d.checkins : d.meals).find((x) => x.id === id) : null;
      if (!it) return;
      draft = clone(it);
    } else {
      draft = type === 'checkin'
        ? { time: nowTime(), mood: null, energy: null, focus: null, hunger: null, note: '' }
        : { time: nowTime(), kind: 'Repas', text: '' };
    }
    S.ui.confirm = null;
    S.ui.form = { type, date: k, id: id || null, draft };
    if (type === 'meal') S.ui.focus = '#meal-text';
    render();
  }
  function saveForm() {
    const f = S.ui.form;
    if (!f) return;
    const dr = f.draft, isCheckin = f.type === 'checkin';
    const note = String(dr.note || '').trim(), text = String(dr.text || '').trim();
    if (toMin(dr.time) === null) { toast('Indique l’heure.'); return; }
    if (!isCheckin && !text) { toast('Écris ce que tu as mangé.'); return; }
    const scores = {};
    SCALES.forEach((sc) => { scores[sc.key] = scaleValue(dr[sc.key]); });
    if (isCheckin && Object.values(scores).every((v) => v == null) && !note) { toast('Choisis au moins ton humeur.'); return; }
    const entry = isCheckin
      ? { id: f.id || newId(), time: dr.time, ...scores, note }
      : { id: f.id || newId(), time: dr.time, kind: dr.kind === 'Collation' ? 'Collation' : 'Repas', text };
    const field = isCheckin ? 'checkins' : 'meals';
    mutateDay(f.date, field, (d) => {
      const i = d[field].findIndex((x) => x && x.id === entry.id);
      if (i >= 0) d[field][i] = entry; else d[field].push(entry);
    }, false);
    S.ui.form = null;
    S.ui.focus = `[data-act="${isCheckin ? 'ci' : 'meal'}-new"]`;
    render();
    toast(isCheckin ? 'Check-in enregistré' : 'Repas noté');
  }

  /* ---------- Sauvegardes ---------- */
  const csvCell = (v) => {
    let s = String(v ?? '');
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  function buildCSV() {
    const rows = [['Date', 'Réveil', 'Coucher', 'Compléments pris', 'Compléments prévus', 'Check-ins', 'Repas', 'Notes']];
    const dash = (v) => v ?? '-';
    Object.keys(S.months).sort().forEach((mk) => {
      Object.keys(S.months[mk].days || {}).sort().forEach((k) => {
        const d = peekDay(k);
        if (!d) return;
        const ci = listOf(d.checkins).sort(byTime).map((c) => `${str(c.time)} humeur ${dash(scaleValue(c.mood))} énergie ${dash(scaleValue(c.energy))} concentration ${dash(scaleValue(c.focus))} faim ${dash(scaleValue(c.hunger))}${c.note ? ` (${c.note})` : ''}`).join(' | ');
        const ml = listOf(d.meals).sort(byTime).map((x) => `${str(x.time)} ${str(x.kind) || 'Repas'} : ${str(x.text)}`).join(' | ');
        const hasTaken = isObj(d.taken) && Object.values(d.taken).some(Boolean);
        if (!str(d.wake) && !str(d.bed) && !ci && !ml && !str(d.notes) && !hasTaken) return;
        const st = stats(k);
        rows.push([k, str(d.wake), str(d.bed), st.taken, st.total, ci, ml, str(d.notes)]);
      });
    });
    return '﻿' + rows.map((r) => r.map(csvCell).join(';')).join('\r\n');
  }
  async function offerFile(name, data) {
    if (store.downloads) {
      try {
        const res = await store.downloads.save({ filename: name, data });
        if (!res || res.status !== 'delivered') toast('Fichier enregistré');
        return;
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') return;
        if (code === 'rate_limited') { toast('Réessaie dans un instant.'); return; }
      }
    }
    S.ui.exportText = data;
    S.ui.focus = '#export-text';
    S.ui.select = true;
    render();
  }
  function exportJSON() {
    const backup = { app: 'mon-suivi', version: 1, exported: new Date().toISOString(), settings: S.settings, months: S.months };
    offerFile(`mon-suivi-sauvegarde-${todayKey()}.json`, JSON.stringify(backup, null, 2));
  }
  function exportCSV() { offerFile(`mon-suivi-journal-${todayKey()}.csv`, buildCSV()); }
  async function copyExport() {
    try { await navigator.clipboard.writeText(S.ui.exportText || ''); toast('Copié'); }
    catch (e) {
      const ta = document.getElementById('export-text');
      if (ta) { ta.focus(); ta.select(); }
      toast('Sélectionne le texte et copie-le.');
    }
  }
  function importFile(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      let obj = null;
      try { obj = JSON.parse(String(r.result)); } catch (e) { obj = null; }
      if (!isObj(obj) || !isObj(obj.settings) || !Array.isArray(obj.settings.supplements) || !isObj(obj.months)) {
