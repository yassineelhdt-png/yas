      </section>
      ${nutritionSettings()}
      <section class="set-sec"><div class="sec-head"><h2>Claude</h2></div>
        <label class="field"><span>Ce que Claude doit savoir sur toi</span><textarea id="set-profile" data-setting="profile" rows="4" placeholder="Âge, taille, objectif (perte de poids…), traitements (Mounjaro 2,5 mg depuis…), problèmes de santé, dernières prises de sang…">${S.settings.profile}</textarea></label>
        <p class="hint">Ajouté à chaque envoi à Claude (copie, partage ou question).</p>
        <label class="field"><span>Lien de ton projet Claude (facultatif)</span><input type="url" id="set-claude-url" data-setting="claudeUrl" value="${S.settings.claudeUrl}" placeholder="https://claude.ai/project/…" autocomplete="off"></label>
        <p class="hint">Crée un projet « État et santé » dans Claude, colle son lien ici : le bouton « Ouvrir mon projet Claude » y mènera directement.</p>
      </section>
      <section class="set-sec"><div class="sec-head"><h2>Tes données</h2></div>
        <p class="muted">${where}</p>
        <div class="actions"><button type="button" class="ghost" data-act="export-json">Faire une sauvegarde</button><button type="button" class="ghost" data-act="export-csv">Exporter le journal en tableau</button><label class="ghost filebtn">Restaurer une sauvegarde<input type="file" id="import-file" accept=".json,application/json,text/plain" data-file="import" class="sr-only"></label><button type="button" class="link" data-act="restore-open" aria-expanded="${bool(S.ui.restoreOpen)}">Coller une sauvegarde</button></div>
        ${S.ui.restoreOpen ? html`<div class="restore"><label class="field"><span>Texte de la sauvegarde</span><textarea id="restore-text" class="export" data-restore="text" rows="6" placeholder="Colle ici le texte copié depuis un autre appareil">${S.ui.restoreText}</textarea></label><div class="actions"><button type="button" class="primary" data-act="restore-text">Restaurer ce texte</button><button type="button" class="link" data-act="restore-close">Fermer</button></div></div>` : ''}
        ${S.ui.exportText != null ? html`<div class="exportbox"><p class="hint">${PLATFORM.native ? 'Copie ce texte ou partage-le (e-mail, Drive, Claude…), puis colle-le dans « Coller une sauvegarde » sur l’autre appareil.' : 'Le téléchargement n’est pas disponible ici. Copie ce texte et garde-le quelque part.'}</p><textarea readonly class="export" id="export-text" rows="8">${S.ui.exportText}</textarea>
          <div class="actions"><button type="button" class="ghost" data-act="copy-export">Copier</button>${canShare() ? html`<button type="button" class="ghost" data-act="share-export">Partager</button>` : ''}<button type="button" class="link" data-act="close-export">Fermer</button></div></div>` : ''}
        <div class="reset">${S.ui.confirm === 'reset'
          ? html`<p>Ta liste actuelle sera remplacée par la liste de départ. Ton journal ne bouge pas.</p><div class="actions"><button type="button" class="danger" data-act="reset-yes">Remplacer ma liste</button><button type="button" class="ghost" data-act="confirm-cancel">Annuler</button></div>`
          : html`<button type="button" class="link" data-act="reset-ask">Remettre la liste de départ</button>`}</div>
      </section>`;
  }

  /* ---------- Rendu général ---------- */
  const view = document.getElementById('view');
  const VIEWS = { jour: renderDay, semaine: renderWeek, annee: renderYear, reglages: renderSettings };
  let pendingRender = false;
  /* Le bouton qui a le focus est recréé à chaque rendu : on retrouve le même (mêmes data-*) pour garder la place au clavier. */
  const FOCUS_ATTRS = ['data-act', 'data-sid', 'data-date', 'data-id', 'data-scale', 'data-v', 'data-scope', 'data-key'];
  function focusedButton() {
    const a = document.activeElement;
    if (!a || a.tagName !== 'BUTTON' || !view.contains(a)) return null;
    const sel = FOCUS_ATTRS.filter((n) => a.hasAttribute(n)).map((n) => attr(n, a.getAttribute(n))).join('');
    return sel ? 'button' + sel : null;
  }
  function render() {
    document.querySelectorAll('.tabs [data-view]').forEach((b) => {
      if (b.dataset.view === S.ui.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (!S.ready) { view.innerHTML = '<p class="loading">Chargement de tes données…</p>'; return; }
    pendingRender = false;
    const explicit = S.ui.focus, keep = explicit || focusedButton();
    view.innerHTML = String((VIEWS[S.ui.view] || renderDay)());
    S.ui.just = null;
    if (keep) {
      const el = view.querySelector(keep);
      if (el) { try { el.focus(explicit ? undefined : { preventScroll: true }); if (S.ui.select && el.select) el.select(); } catch (e) { /* rien */ } }
    }
    S.ui.focus = null; S.ui.select = false;
  }
  function isEditing() {
    const a = document.activeElement;
    return !!(a && view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'file');
  }
  function safeRender() { if (isEditing()) { pendingRender = true; return; } render(); }
  document.addEventListener('focusout', () => {
    if (!pendingRender) return;
    setTimeout(() => { if (pendingRender && !isEditing()) render(); }, 60);
  });

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }
  function toTop() { try { window.scrollTo(0, 0); } catch (e) { /* rien */ } }
  function go(k) { S.ui.date = k; S.ui.form = null; S.ui.confirm = null; render(); }

  /* ---------- Formulaires ---------- */
  function startForm(type, k, id) {
    const d = peekDay(k);
    let draft;
    if (id) {
      const it = d ? listOf(d[FORM_KINDS[type].field]).find((x) => x.id === id) : null;
      if (!it) return;
      draft = clone(it);
    } else if (type === 'checkin') {
      draft = { time: nowTime(), mood: null, energy: null, focus: null, stress: null, pain: null, hunger: null, note: '' };
    } else if (type === 'symptom') {
      draft = { time: nowTime(), text: '', intensity: null };
    } else {
      draft = { time: nowTime(), kind: mealKindAt(nowTime()), text: '' };
    }
    if (type === 'meal') {
      draft.items = mealItems(draft).map((x) => ({ ...x }));
      draft.item = blankItem();
      draft.editItem = null;
    }
    S.ui.confirm = null;
    S.ui.form = { type, date: k, id: id || null, draft };
    if (type === 'symptom') S.ui.focus = '#sym-text';
    else if (type === 'meal' && finePointer()) S.ui.focus = '#fi-name';
    render();
  }
  function saveForm() {
    const f = S.ui.form;
    if (!f) return false;
    const dr = f.draft, kind = FORM_KINDS[f.type];
    if (toMin(dr.time) === null) { toast('Indique l’heure.'); return false; }
    let entry;
    if (f.type === 'checkin') {
      const scores = {};
      SCALES.forEach((sc) => { scores[sc.key] = scaleValue(dr[sc.key]); });
      const note = String(dr.note || '').trim();
      if (Object.values(scores).every((v) => v == null) && !note) { toast('Choisis au moins ton humeur.'); return false; }
      entry = { id: f.id || newId(), time: dr.time, ...scores, note };
    } else if (f.type === 'symptom') {
      const text = String(dr.text || '').trim();
      if (!text) { toast('Écris ce que tu ressens.'); return false; }
      entry = { id: f.id || newId(), time: dr.time, text, intensity: scaleValue(dr.intensity) };
    } else {
      if (String(dr.item.name || '').trim()) commitItem({ quiet: true }); // aliment saisi mais pas encore ajouté
      const text = String(dr.text || '').trim();
      if (!text && !dr.items.length) { toast('Ajoute un aliment ou écris ce que tu as mangé.'); return false; }
      entry = { id: f.id || newId(), time: dr.time, kind: MEAL_KINDS.includes(dr.kind) || dr.kind === 'Repas' ? dr.kind : 'Repas', text, items: dr.items };
    }
    mutateDay(f.date, kind.field, (d) => {
      const list = d[kind.field];
      const i = list.findIndex((x) => x && x.id === entry.id);
      if (i >= 0) list[i] = entry; else list.push(entry);
    }, false);
    S.ui.form = null;
    S.ui.focus = `[data-act="${kind.act}-new"]`;
    render();
    toast(f.type === 'checkin' ? 'Check-in enregistré' : f.type === 'symptom' ? 'Noté' : 'Repas noté');
    return true;
  }

  /* ---------- Sauvegardes ---------- */
  const csvCell = (v) => {
    let s = String(v ?? '');
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  function buildCSV() {
    const rows = [['Date', 'Réveil', 'Coucher', 'Poids (kg)', 'Compléments pris', 'Compléments prévus', 'Check-ins', 'Ressenti', 'Repas', 'Calories', 'Protéines (g)', 'Glucides (g)', 'Lipides (g)', 'Notes']];
    const dash = (v) => v ?? '-';
    Object.keys(S.months).sort().forEach((mk) => {
      Object.keys(S.months[mk].days || {}).sort().forEach((k) => {
        const d = peekDay(k);
        if (!d) return;
        const ci = listOf(d.checkins).sort(byTime).map((c) => `${str(c.time)} ${SCALES.map((sc) => `${sc.label.toLowerCase()} ${dash(scaleValue(c[sc.key]))}`).join(' ')}${c.note ? ` (${c.note})` : ''}`).join(' | ');
        const sy = listOf(d.symptoms).sort(byTime).map((s) => `${str(s.time)} ${str(s.text)}${scaleValue(s.intensity) ? ` (${s.intensity}/5)` : ''}`).join(' | ');
        const ml = listOf(d.meals).sort(byTime).map((x) => `${str(x.time)} ${str(x.kind) || 'Repas'} : ${[str(x.text), mealItems(x).map((it) => `${it.name}${num(it.grams) ? ` ${it.grams} g` : ''}`).join(', ')].filter(Boolean).join(' — ')}`).join(' | ');
        const hasTaken = isObj(d.taken) && Object.values(d.taken).some(Boolean);
        const t = sumMacros(dayItems(d)), w = num(d.weight);
        if (!str(d.wake) && !str(d.bed) && !w && !ci && !sy && !ml && !str(d.notes) && !hasTaken) return;
        const st = stats(k);
        rows.push([k, str(d.wake), str(d.bed), w ? fmtDec(w) : '', st.taken, st.total, ci, sy, ml, t.n ? Math.round(t.kcal) : '', t.n ? fmtDec(t.p) : '', t.n ? fmtDec(t.g) : '', t.n ? fmtDec(t.l) : '', str(d.notes)]);
      });
    });
    return '﻿' + rows.map((r) => r.map(csvCell).join(';')).join('\r\n');
  }
  function downloadBlob(name, data) {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: name.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return true;
    } catch (e) { return false; }
  }
  async function offerFile(name, data) {
    if (store.downloads) {
      try {
        const res = await store.downloads.save({ filename: name, data });
        if (!res || res.status !== 'delivered') toast('Fichier enregistré');
        return;
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') return;
        if (code === 'rate_limited') { toast('Réessaie dans un instant.'); return; }
      }
    } else if (!PLATFORM.artifact && !PLATFORM.native && downloadBlob(name, data)) {
      return; // navigateur ou app PC : le fichier est téléchargé
    }
    S.ui.exportText = data;
    S.ui.focus = '#export-text';
    S.ui.select = true;
    render();
  }
  const backupJSON = () => JSON.stringify({ app: 'mon-suivi', version: 1, exported: new Date().toISOString(), settings: S.settings, months: S.months }, null, 2);
  function exportJSON() { offerFile(`mon-suivi-sauvegarde-${todayKey()}.json`, backupJSON()); }
  function exportCSV() { offerFile(`mon-suivi-journal-${todayKey()}.csv`, buildCSV()); }
  function copyExport() {
    copyText(S.ui.exportText || '').then((ok) => {
      if (ok) { toast('Copié'); return; }
      const ta = document.getElementById('export-text');
      if (ta) { ta.focus(); ta.select(); }
      toast('Sélectionne le texte et copie-le.');
    });
  }
  function restoreBackup(raw) {
    let obj = null;
    try { obj = JSON.parse(String(raw).trim()); } catch (e) { obj = null; }
    if (!isObj(obj) || !isObj(obj.settings) || !Array.isArray(obj.settings.supplements) || !isObj(obj.months)) {
      toast('Ce n’est pas une sauvegarde de Mon suivi.');
      return false;
    }
    S.settings = normalizeSettings(obj.settings);
    store.trusted = true;
    markDirty('settings');
    const months = sanitizeMonths(obj.months);
    let n = 0;
    Object.keys(months).forEach((mk) => {
      S.months[mk] = months[mk];
      Object.keys(months[mk].days).forEach((dk) => { touchDay(dk); n++; });
      markDirty('m' + mk);
    });
    S.ui.form = null; S.ui.confirm = null; S.ui.openSup = null; S.ui.restoreOpen = false; S.ui.restoreText = '';
    render();
    toast(`Sauvegarde restaurée (${plural(n, 'jour')})`);
    return true;
  }
  function importFile(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => restoreBackup(r.result);
    r.onerror = () => toast('Impossible de lire ce fichier.');
    r.readAsText(file);
  }

  /* ---------- Actions (boutons data-act) ---------- */
  const askDelete = (kind, id, focus) => { S.ui.confirm = `${kind}:${id}`; S.ui.focus = focus; render(); };
  function deleteEntry(field, k, id) {
    S.ui.confirm = null;
    mutateDay(k, field, (d) => { d[field] = d[field].filter((x) => !x || x.id !== id); });
    toast('Supprimé');
  }
  const actForm = (type) => {
    const { act, field } = FORM_KINDS[type];
    return {
      [`${act}-new`]: (d) => startForm(type, d.date),
      [`${act}-edit`]: (d) => startForm(type, d.date, d.id),
      [`${act}-ask`]: (d) => askDelete(act, d.id, `[data-act="${act}-del"]${attr('data-id', d.id)}`),
      [`${act}-del`]: (d) => deleteEntry(field, d.date, d.id)
    };
  };
  const mealDraft = () => (S.ui.form && S.ui.form.type === 'meal' ? S.ui.form.draft : null);
  const actions = {
    ...actForm('checkin'), ...actForm('meal'), ...actForm('symptom'),
    tab: (d) => { S.ui.view = d.view; S.ui.form = null; S.ui.confirm = null; S.ui.exportText = null; render(); toTop(); },
    'day-prev': () => go(addDays(S.ui.date, -1)),
    'day-next': () => go(addDays(S.ui.date, 1)),
    'day-today': () => go(todayKey()),
    goto: (d) => { const fromOther = S.ui.view !== 'jour'; S.ui.view = 'jour'; go(d.date); if (fromOther) toTop(); },
    toggle: (d) => {
      S.ui.just = `${d.sid}|${d.date}`;
      mutateDay(d.date, 'taken:' + d.sid, (day) => { day.taken[d.sid] = !day.taken[d.sid]; });
    },
    'wake-now': (d) => {
      const t = nowTime();
      mutateDay(d.date, 'wake', (day) => { day.wake = t; });
      toast(`Réveil noté à ${t}`);
    },
    'confirm-cancel': () => {
      const [kind, id] = String(S.ui.confirm || '').split(/:(.*)/);
      if (kind === 'reset') S.ui.focus = '[data-act="reset-ask"]';
      else if (kind === 'sup') S.ui.focus = `[data-act="sup-ask"]${attr('data-sid', id)}`;
      else if (kind) S.ui.focus = `[data-act="${kind}-ask"]${attr('data-id', id)}`;
      S.ui.confirm = null;
      render();
    },
    rate: (d) => {
      const f = S.ui.form;
      if (!f) return;
      const v = Number(d.v);
      f.draft[d.scale] = f.draft[d.scale] === v ? null : v;
      render();
    },
    'sym-chip': (d) => {
      const f = S.ui.form;
      if (!f) return;
      const cur = String(f.draft.text || '').trim();
      f.draft.text = cur ? `${cur}, ${d.v.toLowerCase()}` : d.v;
      render();
    },
    'meal-kind': (d) => { if (S.ui.form) { S.ui.form.draft.kind = d.v; render(); } },
    'item-add': () => {
      if (!mealDraft() || !commitItem()) return;
      if (finePointer()) S.ui.focus = '#fi-name';
      render();
    },
    'item-edit': (d) => {
      const dr = mealDraft();
      const x = dr && dr.items.find((i) => i.id === d.id);
      if (!x) return;
      dr.item = { name: x.name, grams: x.grams ? fmtDec(x.grams) : '', p: fmtDec(x.p), g: fmtDec(x.g), l: fmtDec(x.l), kcal: fmtDec(x.kcal), auto: false, kcalAuto: false, save: false };
      dr.editItem = x.id;
      S.ui.focus = '#fi-grams';
      render();
    },
    'item-del': (d) => {
      const dr = mealDraft();
      if (!dr) return;
      dr.items = dr.items.filter((i) => i.id !== d.id);
      if (dr.editItem === d.id) { dr.editItem = null; dr.item = blankItem(); }
      render();
    },
    'item-recent': (d) => {
      const dr = mealDraft();
      const r = dr && recentFoods(S.ui.form.date).find((x) => x.name === d.v);
      if (!r) return;
      dr.items.push({ id: newId(), name: r.name, grams: posNum(r.grams), kcal: posNum(r.kcal) ?? 0, p: posNum(r.p) ?? 0, g: posNum(r.g) ?? 0, l: posNum(r.l) ?? 0 });
      render();
    },
    'form-save': () => saveForm(),
    'form-save-claude': () => { const k = S.ui.form && S.ui.form.date; if (saveForm() && k) claudeGo(k); },
    'form-cancel': () => {
      const f = S.ui.form;
      S.ui.form = null;
      if (f) { const act = FORM_KINDS[f.type].act; S.ui.focus = f.id ? `[data-act="${act}-edit"]${attr('data-id', f.id)}` : `[data-act="${act}-new"]`; }
      render();
    },
    'to-claude': () => scrollToClaude(),
    'claude-ask': (d) => askClaude(d.scope, d.key, S.ui.ask.scope === d.scope && S.ui.ask.key === d.key && !!S.ui.ask.text),
    'ask-stop': () => { if (S.ui.ask.ctl) S.ui.ask.ctl.abort(); },
    'claude-copy': (d) => copyClaude(d.scope, d.key),
    'claude-share': (d) => shareClaude(d.scope, d.key),
    'answer-copy': (d) => {
      const a = S.ui.ask, mine = a.scope === d.scope && a.key === d.key && a.text;
      const saved = (peekDay(d.key) || {}).claude;
      copyText(mine ? a.text : isObj(saved) ? str(saved.text) : '').then((ok) => toast(ok ? 'Réponse copiée' : 'Sélectionne la réponse et copie-la.'));
    },
    'ask-photo-clear': () => { S.ui.ask.photo = null; render(); },
    'week-prev': () => { S.ui.weekOf = addDays(S.ui.weekOf, -7); render(); },
    'week-next': () => { S.ui.weekOf = addDays(S.ui.weekOf, 7); render(); },
    'week-now': () => { S.ui.weekOf = startOfWeek(todayKey()); render(); },
    'year-prev': () => { S.ui.year--; render(); },
    'year-next': () => { S.ui.year++; render(); },
    'year-now': () => { S.ui.year = new Date().getFullYear(); render(); },
    'sup-add': () => {
      const s = { id: newId(), name: 'Nouveau complément', dose: '', note: '', moment: 'matin', freq: 'daily', since: todayKey(), active: true, weekday: null };
      S.ui.openSup = s.id;
      S.ui.focus = `#sup-${CSS.escape(s.id)}-name`;
      S.ui.select = true;
      mutateSettings((st) => { st.supplements.push(s); });
    },
    'sup-open': (d) => { S.ui.openSup = d.sid; S.ui.confirm = null; if (finePointer()) S.ui.focus = `#sup-${CSS.escape(d.sid)}-name`; render(); },
    'sup-close': (d) => { S.ui.openSup = null; S.ui.confirm = null; S.ui.focus = `[data-act="sup-open"]${attr('data-sid', d.sid)}`; render(); },
    'sup-ask': (d) => askDelete('sup', d.sid, `[data-act="sup-del"]${attr('data-sid', d.sid)}`),
    'sup-del': (d) => {
      S.ui.confirm = null;
      mutateSettings((st) => { st.supplements = st.supplements.filter((x) => x.id !== d.sid); });
      toast('Complément supprimé');
    },
    'food-add': () => {
      const fd = S.ui.foodDraft, name = String(fd.name || '').trim();
      if (!name) { toast('Donne un nom à l’aliment.'); return; }
      const p = posNum(fd.p) ?? 0, g = posNum(fd.g) ?? 0, l = posNum(fd.l) ?? 0;
      const food = normalizeFood({ name, p, g, l, kcal: posNum(fd.kcal) ?? kcalOf(p, g, l) });
      mutateSettings((st) => {
        const j = st.foods.findIndex((x) => norm(x.name) === norm(name));
        if (j >= 0) { food.id = st.foods[j].id; st.foods[j] = food; } else st.foods.unshift(food);
      }, false);
      S.ui.foodDraft = { name: '', kcal: '', p: '', g: '', l: '' };
      S.ui.focus = '#fd-name';
      render();
      toast(`${name} ajouté à tes aliments`);
    },
    'food-ask': (d) => askDelete('food', d.id, `[data-act="food-del"]${attr('data-id', d.id)}`),
    'food-del': (d) => {
      S.ui.confirm = null;
      mutateSettings((st) => { st.foods = st.foods.filter((x) => x.id !== d.id); });
      toast('Aliment supprimé');
    },
    'reset-ask': () => { S.ui.confirm = 'reset'; S.ui.focus = '[data-act="reset-yes"]'; render(); },
    'reset-yes': () => {
      S.ui.confirm = null;
      mutateSettings((st) => { st.supplements = defaultSupplements(todayKey()); });
      toast('Liste de départ remise');
    },
    'export-json': () => exportJSON(),
    'export-csv': () => exportCSV(),
    'copy-export': () => copyExport(),
    'share-export': () => { shareText('Mon suivi — sauvegarde', S.ui.exportText || '').then((ok) => { if (!ok) copyExport(); }); },
    'close-export': () => { S.ui.exportText = null; render(); },
    'restore-open': () => { S.ui.restoreOpen = !S.ui.restoreOpen; if (S.ui.restoreOpen) S.ui.focus = '#restore-text'; render(); },
    'restore-close': () => { S.ui.restoreOpen = false; render(); },
    'restore-text': () => { if (!String(S.ui.restoreText).trim()) { toast('Colle d’abord le texte de la sauvegarde.'); return; } restoreBackup(S.ui.restoreText); }
  };

  /* ---------- Événements ---------- */
  const app = document.getElementById('app');
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || !app.contains(b) || !S.ready) return;
    const fn = actions[b.dataset.act];
    if (fn) fn(b.dataset);
  });
  function setSupplementField(sid, f, v) {
    const s = S.settings.supplements.find((x) => x.id === sid);
    if (!s) return;
    if (f === 'active') s.active = !!v;
    else if (f === 'weekday') s.weekday = v === '' ? null : Number(v);
    else if (f === 'since') { if (isKey(v)) s.since = v; }
    else if (f === 'moment') { if (MOMENT_KEYS.includes(v)) s.moment = v; }
    else if (f === 'freq') { if (FREQS[v]) s.freq = v; }
    else if (f === 'name') s.name = String(v).trim() || 'Sans nom';
    else if (f === 'dose' || f === 'note') s[f] = String(v);
  }
  app.addEventListener('change', (e) => {
    const t = e.target, ds = t.dataset;
    if (!S.ready || !ds) return;
    if (ds.bind === 'wake' || ds.bind === 'bed') {
      // Enregistré tout de suite ; l'affichage (durée de la nuit) suit quand on quitte le champ.
      const field = ds.bind, val = t.value;
      mutateDay(ds.date, field, (d) => { d[field] = val; }, false);
      safeRender();
    } else if (ds.bind === 'weight') {
      const w = num(t.value);
      if (String(t.value).trim() && (w == null || w < 20 || w > 400)) { toast('Écris ton poids en kilos, par exemple 82,5.'); return; }
      mutateDay(ds.date, 'weight', (d) => { d.weight = w == null ? null : round1(w); }, false);
      if (w != null) t.value = fmtDec(round1(w));
    } else if (ds.draft && S.ui.form) {
      S.ui.form.draft[ds.draft] = t.value;
    } else if (ds.item) {
      onItemInput(ds.item, t.type === 'checkbox' ? t.checked : t.value);
    } else if (ds.ask === 'withWeek') {
      S.ui.ask.withWeek = t.checked;
      refreshReport();
    } else if (ds.ask === 'photo') {
      S.ui.ask.photo = (t.files && t.files[0]) || null;
      render();
    } else if (ds.goal) {
      const n = posNum(t.value);
      mutateSettings((st) => { st.goals[ds.goal] = n ? round1(n) : null; }, false);
      t.value = n ? fmtDec(round1(n)) : '';
    } else if (ds.setting === 'claudeUrl') {
      const v = t.value.trim();
      if (v && !isClaudeUrl(v)) { toast('Colle un lien qui commence par https://claude.ai/'); return; }
      mutateSettings((st) => { st.claudeUrl = v; }, false);
      if (v) toast('Lien enregistré');
    } else if (ds.weekly) {
      const v = t.value;
      mutateSettings((st) => { const s = st.supplements.find((x) => x.id === ds.weekly); if (s) s.weekday = v === '' ? null : Number(v); });
      if (v !== '') toast('Jour enregistré');
    } else if (ds.sset) {
      const row = t.closest('[data-sid]');
      if (!row) return;
      const structural = ['moment', 'freq', 'active'].includes(ds.sset); // ceux qui changent la fiche affichée
      if (structural && (t.type === 'checkbox' || finePointer())) S.ui.focus = `#${CSS.escape(t.id)}`;
      mutateSettings(() => setSupplementField(row.dataset.sid, ds.sset, t.type === 'checkbox' ? t.checked : t.value), structural);
    } else if (ds.file === 'import') {
      importFile(t.files && t.files[0]);
      t.value = '';
    }
  });
  app.addEventListener('input', (e) => {
    const t = e.target, ds = t.dataset;
    if (!S.ready || !ds) return;
    if (ds.bind === 'notes') {
      mutateDay(ds.date, 'notes', (d) => { d.notes = t.value; }, false);
    } else if (ds.draft && S.ui.form) {
      S.ui.form.draft[ds.draft] = t.value;
    } else if (ds.item && t.type !== 'checkbox') {
      onItemInput(ds.item, t.value);
    } else if (ds.ask === 'q') {
      S.ui.ask.q = t.value;
      refreshReport();
    } else if (ds.fd) {
      S.ui.foodDraft[ds.fd] = t.value;
    } else if (ds.restore) {
      S.ui.restoreText = t.value;
    } else if (ds.setting === 'profile') {
      mutateSettings((st) => { st.profile = t.value.slice(0, 4000); }, false);
    } else if (['name', 'dose', 'note'].includes(ds.sset)) {
      const row = t.closest('[data-sid]');
      const s = row && S.settings.supplements.find((x) => x.id === row.dataset.sid);
      if (!s) return;
      s[ds.sset] = t.value;
      markDirty('settings');
    }
  });
  /* Le texte pour Claude affiché suit la question et la case « 6 jours d'avant ». */
  function refreshReport() {
    const rt = document.getElementById('report-text'), area = document.getElementById('ask-area');
    if (rt && area && S.ui.ask.showReport) rt.value = claudeText(area.dataset.scope, area.dataset.key);
  }
  app.addEventListener('toggle', (e) => {
    const t = e.target;
    if (!t.dataset || t.dataset.toggle !== 'report') return;
    S.ui.ask.showReport = t.open;
    refreshReport();
  }, true); // « toggle » ne remonte pas : on l'écoute à la descente

  /* Nouveau jour, retour sur la page, connexion retrouvée, fermeture */
  let lastToday = todayKey();
  function checkRollover() {
    const t = todayKey();
    if (t === lastToday) return;
    if (S.ui.date === lastToday) S.ui.date = t;
    if (S.ui.weekOf === startOfWeek(lastToday)) S.ui.weekOf = startOfWeek(t);
    lastToday = t;
    if (S.ready) safeRender();
  }
  function resume() {
    if (store.mode !== 'cloud' || store.stopped) return;
    if (!store.online) { clearTimeout(store.connectTimer); store.connectTimer = null; connect(); }
    else if (store.dirty.size) { clearTimeout(store.retryTimer); store.retryTimer = null; flushAll(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkRollover(); resume(); }
    else flushAll();
  });
  window.addEventListener('online', resume);
  window.addEventListener('pagehide', flushAll);
  setInterval(checkRollover, 60000);

  /* App Android : le bouton retour ferme le formulaire ouvert, revient à la vue Jour, puis met l'app en arrière-plan. */
  const capApp = capPlugin('App');
  if (capApp && typeof capApp.addListener === 'function') {
    capApp.addListener('backButton', () => {
      if (S.ui.form || S.ui.confirm || S.ui.exportText != null) { S.ui.form = null; S.ui.confirm = null; S.ui.exportText = null; render(); }
      else if (S.ui.view !== 'jour') { S.ui.view = 'jour'; render(); toTop(); }
      else if (typeof capApp.minimizeApp === 'function') capApp.minimizeApp();
    });
  }

  init();
})();
</script>
