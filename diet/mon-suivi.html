    } catch (e) {
      // annulé par toi (Android : message « Share canceled », navigateur : AbortError) : rien à signaler
      const why = e && typeof e === 'object' ? `${e.name || ''} ${e.message || ''} ${e.code || ''}` : String(e);
      return /cancel|abort/i.test(why) ? 'cancel' : false;
    }
  }
  function showReportFallback() {
    S.ui.ask.showReport = true;
    S.ui.focus = '#report-text';
    S.ui.select = true;
    render();
    toast('Sélectionne le texte et copie-le.');
  }
  function copyClaude(scope, key) {
    copyText(claudeText(scope, key)).then((ok) => {
      if (ok) { markSent(scope, key, 'copy'); toast(S.settings.claudeUrl ? 'Copié. Colle-le dans ton projet Claude.' : 'Copié. Colle-le dans une conversation avec Claude.'); }
      else showReportFallback();
    });
  }
  function shareClaude(scope, key) {
    shareText(`Mon suivi — ${scopeLabel(scope, key)}`, claudeText(scope, key)).then((r) => { if (r === true) markSent(scope, key, 'share'); else if (!r) copyClaude(scope, key); });
  }
  /* Les journées couvertes par un envoi, puis la marque « envoyée à Claude » sur chacune. */
  function scopeKeys(scope, key) {
    if (scope === 'dossier') return [];
    if (scope === 'days') return key.split(',').filter(isKey);
    if (scope === 'week') return Array.from({ length: 7 }, (_, i) => addDays(key, i)).filter((dk) => dk <= todayKey() && hasJournal(peekDay(dk)));
    return [key];
  }
  function markSent(scope, key, how) {
    const at = new Date().toISOString();
    scopeKeys(scope, key).forEach((dk) => mutateDay(dk, 'sent', (d) => { d.sent = { at, how }; }, false));
    safeRender();
  }
  /* Journées remplies des 7 derniers jours pas encore envoyées, et aujourd'hui à partir de 18 h. */
  function unsentDays() {
    const t = todayKey(), out = [];
    for (let i = 7; i >= 1; i--) { const dk = addDays(t, -i), d = peekDay(dk); if (hasJournal(d) && !isObj(d.sent)) out.push(dk); }
    const d = peekDay(t);
    if (new Date().getHours() >= 18 && hasJournal(d) && !isObj(d.sent)) out.push(t);
    return out;
  }
  function sendBanner() {
    const days = unsentDays();
    if (!days.length) return '';
    const t = todayKey(), onlyToday = days.length === 1 && days[0] === t;
    const scope = days.length === 1 ? (hasVisit(days[0]) ? 'visit' : 'day') : 'days', key = days.join(',');
    const names = days.map((dk) => (dk === t ? 'aujourd’hui' : dk === addDays(t, -1) ? 'hier' : `${WD_LONG[weekdayOf(dk)]} ${fromKey(dk).getDate()}`));
    const list = names.length > 3 ? `du ${names[0]} à ${names[names.length - 1]}` : names.length > 1 ? `${names.slice(0, -1).join(', ')} et ${names[names.length - 1]}` : names[0];
    const off = navigator.onLine === false;
    const title = onlyToday ? 'Ce soir : envoie ta journée à Claude' : `${plural(days.length, 'journée')} pas encore envoyée${days.length > 1 ? 's' : ''} à Claude`;
    const text = `${onlyToday ? 'Tout ce que tu as noté aujourd’hui part en un seul texte.' : `${cap1(list)}, en un seul envoi.`}${off ? ' Pas de réseau pour l’instant : c’est enregistré, envoie dès que tu as le wifi.' : ''}`;
    const label = canShare() ? 'Envoyer à Claude' : store.sample && scope !== 'days' ? 'Demander à Claude' : 'Copier pour Claude';
    return html`<div class="banner send" role="note"><span class="mico" aria-hidden="true">${ICON.send}</span><p class="btxt"><b>${title}</b><span>${text}</span></p><div class="actions"><button type="button" class="primary" data-act="send-pending" data-scope="${scope}" data-key="${key}">${label}</button><button type="button" class="link" data-act="send-done" data-key="${key}">Déjà fait</button></div></div>`;
  }
  function scrollToClaude() {
    const el = document.getElementById('claude');
    if (el) el.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  }
  /* Le bouton « … Claude » du check-in : la meilleure action possible ici. */
  function claudeGo(k) {
    const scope = hasVisit(k) ? 'visit' : 'day';
    if (store.sample) { askClaude(scope, k); scrollToClaude(); }
    else if (canShare()) shareClaude(scope, k);
    else { copyClaude(scope, k); scrollToClaude(); }
  }

  /* ---------- Rendu : Semaine ---------- */
  function renderWeek() {
    const start = S.ui.weekOf, t = todayKey();
    const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    const rows = MOMENTS.map((m) => {
      const sups = S.settings.supplements.filter((s) => s.moment === m.key && days.some((dk) => isScheduled(s, dk) || isTaken(s.id, dk)));
      if (!sups.length) return '';
      return html`<tr class="grp m-${m.key}"><th colspan="8" scope="colgroup">${m.label}${m.hint ? html` <span>${m.hint}</span>` : ''}</th></tr>${sups.map((s) => html`<tr class="m-${m.key}"><th scope="row">${s.name}${s.dose ? html` <small>${s.dose}</small>` : ''}</th>${days.map((dk) => {
        const on = isTaken(s.id, dk);
        if (!on && !isScheduled(s, dk)) return html`<td></td>`;
        return html`<td><button type="button" class="mini${on ? ' on' : ''}" data-act="toggle" data-sid="${s.id}" data-date="${dk}" aria-pressed="${bool(on)}" aria-label="${s.name}, ${longDate(dk)}">${on ? ICON.check : ''}</button></td>`;
      })}</tr>`)}`;
    });
    const cell = (fn) => days.map((dk) => html`<td>${fn(dk, peekDay(dk) || {})}</td>`);
    const summary = [
      html`<tr><th scope="row">Pris</th>${cell((dk) => { const st = stats(dk); return st.total ? `${st.taken}/${st.total}` : ''; })}</tr>`,
      html`<tr><th scope="row">Réveil</th>${cell((dk, d) => str(d.wake))}</tr>`,
      html`<tr><th scope="row">Eau <small>L</small></th>${cell((dk, d) => (waterOf(d) ? fmtL(waterOf(d)) : ''))}</tr>`,
      html`<tr><th scope="row">Calories</th>${cell((dk, d) => { const x = sumMacros(dayItems(d)); return x.n ? fmtInt(x.kcal) : ''; })}</tr>`,
      html`<tr><th scope="row">Protéines <small>g</small></th>${cell((dk, d) => { const x = sumMacros(dayItems(d)); return x.n ? fmtG(x.p) : ''; })}</tr>`,
      SCALES.map((sc) => html`<tr><th scope="row">${sc.label}${sc.faces ? '' : html` <small>sur 5</small>`}</th>${days.map((dk) => {
        const v = avgScale(dk, sc.key);
        if (v == null) return html`<td></td>`;
        if (sc.faces) return html`<td><span role="img" aria-label="${sc.label} ${fmtAvg(v)} sur 5">${sc.faces[Math.min(4, Math.max(0, Math.round(v) - 1))]}</span></td>`;
        return html`<td>${fmtAvg(v)}</td>`;
      })}</tr>`),
      html`<tr><th scope="row">Sport <small>min</small></th>${cell((dk, d) => { const m = minutesOf(sportOf(d)); return m ? String(m) : ''; })}</tr>`,
      html`<tr><th scope="row">Pas</th>${cell((dk, d) => (stepsOf(d) ? fmtInt(stepsOf(d)) : ''))}</tr>`,
      html`<tr><th scope="row">Ressenti</th>${cell((dk, d) => { const n = listOf(d.symptoms).length; return n ? String(n) : ''; })}</tr>`
    ];
    return html`<div class="wk-head"><h2 class="wk-title">${weekTitle(start)}</h2><div class="daynav">
        ${start !== startOfWeek(t) ? html`<button type="button" class="ghost" data-act="week-now">Cette semaine</button>` : ''}
        <button type="button" class="icon" data-act="week-prev" aria-label="Semaine précédente">${ICON.left}</button>
        <button type="button" class="icon" data-act="week-next" aria-label="Semaine suivante">${ICON.right}</button>
      </div></div>
      <p class="hint">Touche une gélule pour la cocher, ou un jour pour ouvrir son journal.</p>
      <div class="scroller"><table class="week"><thead><tr><th scope="col"><span class="sr-only">Complément</span></th>${days.map((dk, i) => html`<th scope="col"${dk === t ? html` class="today"` : ''}><button type="button" data-act="goto" data-date="${dk}" aria-label="${longDate(dk)}${hasVisit(dk) ? ', visite médicale' : ''}"><span>${WD_SHORT[i]}</span><b>${fromKey(dk).getDate()}</b>${hasVisit(dk) ? html`<small class="vtag" aria-hidden="true">Visite</small>` : ''}</button></th>`)}</tr></thead>
      <tbody>${rows}</tbody><tbody class="sum">${summary}</tbody></table></div>
      ${S.settings.supplements.length ? '' : html`<p class="empty">Ta liste est vide. Ajoute tes compléments dans Réglages.</p>`}
      <div class="week-claude">${start <= t ? claudeBlock('week', start) : ''}</div>`;
  }

  /* ---------- Rendu : Année ---------- */
  function renderYear() {
    const y = S.ui.year, t = todayKey();
    let full = 0, tracked = 0;
    const months = MONTHS.map((name, m) => {
      const offset = (new Date(y, m, 1).getDay() + 6) % 7, nDays = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let dn = 1; dn <= nDays; dn++) {
        const k = `${y}-${pad(m + 1)}-${pad(dn)}`, st = stats(k), j = hasJournal(peekDay(k)), v = hasVisit(k);
        const future = k > t, p = st.total ? st.taken / st.total : 0;
        if (!future && st.total) { tracked++; if (p >= 1) full++; }
        const cls = 'bub' + (future ? ' future' : '') + (!st.total ? ' none' : p >= 1 ? ' full' : p > 0 ? ' part' : '') + (j ? ' j' : '') + (v ? ' v' : '') + (k === t ? ' today' : '');
        const label = `${longDate(k)} : ${st.total ? `${st.taken} sur ${st.total} compléments` : 'rien de prévu'}${j ? ', journal rempli' : ''}${v ? ', visite médicale' : ''}`;
        cells.push(html`<button type="button" class="${cls}" style="--p:${p.toFixed(3)}" data-act="goto" data-date="${k}" aria-label="${label}"></button>`);
      }
      return html`<section class="month"><h3>${cap1(name)}</h3><div class="blister">${WD_LETTER.map((l) => html`<span class="wdh" aria-hidden="true">${l}</span>`)}${Array.from({ length: offset }, () => html`<span aria-hidden="true"></span>`)}${cells}</div></section>`;
    });
    return html`<div class="yr-head"><h2 class="yr-title">${y}</h2><div class="daynav">
        ${y !== new Date().getFullYear() ? html`<button type="button" class="ghost" data-act="year-now">Cette année</button>` : ''}
        <button type="button" class="icon" data-act="year-prev" aria-label="Année précédente">${ICON.left}</button>
        <button type="button" class="icon" data-act="year-next" aria-label="Année suivante">${ICON.right}</button>
      </div></div>
      <p class="yr-sum">${tracked ? `Tout pris ${plural(full, 'jour')} sur ${plural(tracked, 'suivi')}.` : 'Rien de suivi cette année pour l’instant.'}</p>
      <div class="legend" aria-hidden="true"><span><i class="bub"></i>Rien pris</span><span><i class="bub part" style="--p:.5"></i>En partie</span><span><i class="bub full"></i>Tout pris</span><span><i class="bub j"></i>Journal rempli</span><span><i class="bub v"></i>Visite médicale</span></div>
      <div class="months">${months}</div>`;
  }

  /* ---------- Rendu : Réglages ---------- */
  function supSummary(s) {
    if (!s.active) return 'En pause';
    const base = s.freq === 'alt' ? 'Un jour sur deux' : s.freq === 'weekly' ? (s.weekday == null ? 'Jour à choisir' : 'Chaque ' + WD_LONG[s.weekday]) : 'Tous les jours';
    if (!s.cure) return base;
    const ph = curePhase(s.cure, todayKey());
    return `${base} · cure ${s.cure.on} sem. / pause ${s.cure.off} sem. · ${ph.phase === 'avant' ? `dès le ${tinyDate(ph.next)}` : ph.phase === 'prise' ? `sem. ${ph.week}/${ph.of}` : `reprise le ${tinyDate(ph.next)}`}`;
  }
  function supRow(s) {
    const cls = `srow m-${s.moment}${s.active ? '' : ' paused'}`;

    }
    const id = (f) => `sup-${s.id}-${f}`;
    const options = (entries, current) => entries.map(([v, label]) => html`<option value="${v}"${String(v) === String(current) ? html` selected` : ''}>${label}</option>`);
    return html`<div class="${cls}" data-sid="${s.id}">
      <div class="srow-line">
        <label class="field grow"><span>Nom</span><input type="text" id="${id('name')}" data-sset="name" value="${s.name}" autocomplete="off"></label>
        <label class="field"><span>Dose</span><input type="text" id="${id('dose')}" data-sset="dose" value="${s.dose}" autocomplete="off" size="10"></label>
      </div>
      <div class="srow-line">
        <label class="field"><span>Moment</span><select id="${id('moment')}" data-sset="moment">${options(MOMENTS.map((m) => [m.key, m.label]), s.moment)}</select></label>
        <label class="field"><span>Fréquence</span><select id="${id('freq')}" data-sset="freq">${options(Object.entries(FREQS), s.freq)}</select></label>
        ${s.freq === 'weekly' ? html`<label class="field"><span>Jour</span><select id="${id('weekday')}" data-sset="weekday">${options([['', 'Choisir'], ...WD_LONG.map((w, i) => [i, cap1(w)])], s.weekday == null ? '' : s.weekday)}</select></label>` : ''}
        <label class="field"><span>${s.freq === 'alt' ? 'Premier jour' : 'Depuis le'}</span><input type="date" id="${id('since')}" data-sset="since" value="${s.since}"></label>
      </div>
      <div class="cure-box">
        <label class="switch"><input type="checkbox" id="${id('cure')}" data-sset="cure"${s.cure ? html` checked` : ''}> Prendre en cure (des semaines de prise, puis de pause)</label>
        ${s.cure ? html`<div class="srow-line">
          <label class="field"><span>Semaines de prise</span><input type="number" inputmode="numeric" min="1" max="52" id="${id('cureOn')}" data-sset="cureOn" value="${s.cure.on}"></label>
          <label class="field"><span>Semaines de pause</span><input type="number" inputmode="numeric" min="1" max="52" id="${id('cureOff')}" data-sset="cureOff" value="${s.cure.off}"></label>
          <label class="field"><span>Début de la cure</span><input type="date" id="${id('cureStart')}" data-sset="cureStart" value="${s.cure.start}"></label>
        </div>
        <p class="hint">${curePlan(s.cure, todayKey())}.</p>` : ''}
        ${cureHint(s.name) ? html`<p class="hint">${cureHint(s.name).why}${s.cure ? '' : html` <button type="button" class="link" data-act="sup-cure" data-sid="${s.id}">Programmer la cure</button>`}</p>` : ''}
      </div>
      <label class="field"><span>Note</span><input type="text" id="${id('note')}" data-sset="note" value="${s.note}" placeholder="Optionnel" autocomplete="off"></label>
      <div class="srow-foot"><label class="switch"><input type="checkbox" id="${id('active')}" data-sset="active"${s.active ? html` checked` : ''}> Actif</label>

          ? html`<span class="row-actions"><button type="button" class="link danger" data-act="sup-del" data-sid="${s.id}">Oui, supprimer</button><button type="button" class="link" data-act="confirm-cancel">Non</button></span>`
          : html`<span class="row-actions"><button type="button" class="link" data-act="sup-ask" data-sid="${s.id}">Supprimer</button><button type="button" class="ghost" data-act="sup-close" data-sid="${s.id}">Terminé</button></span>`}

  /* ---------- Réglages : une liste, puis une page par sujet ---------- */

  function goalsSettings() {

    const goal = (key, label) => html`<label class="field"><span>${label}</span><input type="text" inputmode="decimal" id="goal-${key}" data-goal="${key}" value="${g[key] ? fmtDec(g[key]) : ''}" placeholder="—" autocomplete="off"></label>`;

      <h2 class="sub-title">Eau</h2>

        <label class="field"><span>Taille d’un verre</span><select id="goal-glass" data-goal="glass">${[200, 250, 330, 500].map((v) => html`<option value="${v}"${g.glass === v ? html` selected` : ''}>${v / 10} cl</option>`)}</select></label>
      </div>
      ${suggest ? html`<p class="suggest">Repère courant : 35 mL par kilo, soit ${fmtDec(suggest)} L pour ${fmtDec(w)} kg.${suggest !== g.water ? html` <button type="button" class="link" data-act="water-suggest" data-v="${suggest}">Mettre ${fmtDec(suggest)} L</button>` : ''}</p>` : ''}

  function visitSettings() {
    const v = S.settings.visit, t = todayKey();
    const nv = nextVisit(t), n = daysBetween(t, nv);
    const after = [1, 2, 3].map((i) => shortDate(addDays(nv, i * v.every)));
    return html`<section class="set-sec">
      <p class="next-visit m-soir"><span class="mico" aria-hidden="true">${ICON.visit}</span><span><b>Prochaine visite : ${longDate(nv).replace(/^./, (c) => c.toLowerCase())}</b><span>${cap1(whenLabel(n))} · prise de sang, pesée et médecin</span></span></p>

      ${PLATFORM.native ? html`<label class="switch"><input type="checkbox" id="visit-notify" data-vset="notify"${v.notify ? html` checked` : ''}> Notification la veille à 19:00 et le matin à 7:30</label>
        ${store.notifyDenied ? html`<p class="hint">Les notifications sont bloquées : autorise-les pour Mon suivi dans les réglages Android.</p>` : ''}` : ''}
    </section>`;
  }
  function supplementSettings() {
    const sups = S.settings.supplements;
    const groups = MOMENTS.map((m) => {
      const list = sups.filter((s) => s.moment === m.key);
      return list.length ? html`<h3 class="m-title m-${m.key}">${m.label}${m.hint ? html` <span>${m.hint}</span>` : ''}</h3>${list.map(supRow)}` : '';
    });
    return html`<section class="set-sec">
      <div class="sec-head"><p class="hint" style="margin:0">Touche un complément pour le modifier. Pour « un jour sur deux », le premier jour décide lesquels tombent.</p><button type="button" class="primary" data-act="sup-add">Ajouter</button></div>
      ${groups}${sups.length ? '' : html`<p class="empty">Ta liste est vide.</p>`}

  function renderMonth() {
    const mk = S.ui.monthOf, [y, m] = mk.split('-').map(Number), t = todayKey();

    const visits = [];
    const cells = Array.from({ length: weekdayOf(first) }, () => html`<span class="mday out" aria-hidden="true"></span>`);
    for (let dn = 1; dn <= nDays; dn++) {
      const k = `${mk}-${pad(dn)}`, d = peekDay(k), st = stats(k), v = hasVisit(k), j = hasJournal(d), wOk = waterOf(d) >= goal, ns = sessionsOf(d).length;
      const future = k > t, p = st.total ? st.taken / st.total : 0;
      if (!future && st.total) { tracked++; if (p >= 1) full++; }
      if (wOk) waterOk++;
      if (v) visits.push(k);
      const label = `${longDate(k)} : ${st.total ? `${st.taken} sur ${st.total} compléments` : 'rien de prévu'}${ns ? `, ${plural(ns, 'séance')} de sport` : ''}${wOk ? ', objectif d’eau atteint' : ''}${j ? ', journal rempli' : ''}${v ? ', visite médicale' : ''}`;

  /* Séances par semaine sur 8 semaines : colonnes de 24 px au plus, bouts arrondis de 4 px, valeur au sommet,
     ligne d'objectif fine ; chaque colonne porte sa bulle (title) avec les minutes. */
  function sportChart() {
    const sp = S.settings.sport, cur = startOfWeek(todayKey());
    const weeks = Array.from({ length: 8 }, (_, i) => { const w = addDays(cur, (i - 7) * 7), s = sportWeek(w); return { w, n: s.count, min: s.minutes }; });
    if (!weeks.some((x) => x.n)) return html`<p class="empty">Ton historique apparaîtra ici dès ta première séance.</p>`;
    const colW = innerWidth >= 900 ? (Math.min(view.clientWidth || 900, 1120) - 90) / 2 - 40 : (view.clientWidth || 360) - 66;
    const W = Math.round(Math.max(270, Math.min(560, colW))), H = 190, padL = 10, padR = 10, padT = 22, padB = 28;
    const top = Math.max(sp.perWeek, ...weeks.map((x) => x.n)) + 1;
    const slot = (W - padL - padR) / weeks.length, bw = Math.min(24, slot * 0.55);
    const Y = (v) => padT + (1 - v / top) * (H - padT - padB), base = H - padB;
    const bar = (x, y) => {
      const h = base - y, r = Math.min(4, h);
      return `M${x.toFixed(1)} ${base} V${(y + r).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)} H${(x + bw - r).toFixed(1)} Q${(x + bw).toFixed(1)} ${y.toFixed(1)} ${(x + bw).toFixed(1)} ${(y + r).toFixed(1)} V${base} Z`;
    };
    const every = slot < 44 ? 2 : 1;
    const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(`Séances par semaine : ${weeks.map((x) => `semaine du ${shortDate(x.w)}, ${x.n}`).join(' ; ')}`)}">`
      + `<line x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1"/>`
      + `<line x1="${padL}" x2="${W - padR}" y1="${Y(sp.perWeek).toFixed(1)}" y2="${Y(sp.perWeek).toFixed(1)}" stroke="var(--muted)" stroke-width="1"/>`
      + `<text x="${W - padR}" y="${(Y(sp.perWeek) - 6).toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${esc(`Objectif ${sp.perWeek}`)}</text>`
      + weeks.map((x, i) => {
        const cx = padL + slot * i + slot / 2, bx = cx - bw / 2;
        const tip = `<title>${esc(`Semaine du ${shortDate(x.w)} : ${plural(x.n, 'séance')}, ${x.min} min`)}</title>`;
        const mark = x.n ? `<path d="${bar(bx, Y(x.n))}" fill="var(--sport)"/><text x="${cx.toFixed(1)}" y="${(Y(x.n) - 6).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${x.n}</text>` : '';
        const lbl = (weeks.length - 1 - i) % every === 0 ? `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" font-weight="${i === weeks.length - 1 ? 800 : 600}" fill="var(--muted)">${esc(i === weeks.length - 1 ? 'Cette sem.' : tinyDate(x.w))}</text>` : '';
        return `<g>${tip}<rect x="${(cx - slot / 2).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${H - padT}" fill="transparent"/>${mark}${lbl}</g>`;
      }).join('')
      + '</svg>';
    return html`<div class="chart-wrap">${trusted(svg)}</div>`;
  }

  /* ---------- Séance en direct ---------- */
  /* La séance en cours vit sur cet appareil (LIVE_KEY) jusqu'à « Enregistrer » : elle survit à une fermeture de l'app.
     Chrono et repos se calculent à partir des heures de début, jamais en comptant les secondes. */
  const LIVE_KEY = 'mon-suivi-live-v1';
  const REST_CHOICES = [60, 90, 120, 180];
  // Exercices proposés : nom, et « time » quand il se compte en secondes plutôt qu'en répétitions.
  const EXOS = [
    ['Squats', 'reps'], ['Pompes', 'reps'], ['Fentes', 'reps'], ['Gainage', 'time'], ['Gainage latéral', 'time'],
    ['Pont fessier', 'reps'], ['Hip thrust', 'reps'], ['Tractions', 'reps'], ['Dips', 'reps'], ['Rowing haltère', 'reps'],
    ['Développé couché', 'reps'], ['Développé militaire', 'reps'], ['Soulevé de terre', 'reps'], ['Curl biceps', 'reps'],
    ['Extensions triceps', 'reps'], ['Crunchs', 'reps'], ['Mollets', 'reps'], ['Burpees', 'reps'],
    ['Mountain climbers', 'time'], ['Corde à sauter', 'time'], ['Jumping jacks', 'time'], ['Chaise', 'time'], ['Vélo', 'time'], ['Rameur', 'time']
  ];
  const exoMode = (name) => { const e = EXOS.find(([n]) => norm(n) === norm(name)); return e ? e[1] : 'reps'; };
  function loadLive() {
    const l = lsGet(scoped(LIVE_KEY));
    if (!isObj(l) || !Number.isFinite(l.start) || !isKey(l.date) || !Array.isArray(l.exos)) return null;
    l.exos = l.exos.filter(isObj).map((e) => ({ id: String(e.id || newId()), name: str(e.name) || 'Exercice', mode: e.mode === 'time' ? 'time' : 'reps', sets: Array.isArray(e.sets) ? e.sets.filter(isObj) : [] }));
    l.draft = isObj(l.draft) ? l.draft : { exo: '', reps: 10, kg: '', rir: null, sec: 30 };
    return l;
  }
  function saveLive() {
    if (S.live) { if (!lsSet(scoped(LIVE_KEY), S.live)) toast('Cet appareil refuse d’enregistrer la séance en cours : ne ferme pas l’app avant de l’enregistrer.'); }
    else { try { localStorage.removeItem(scoped(LIVE_KEY)); } catch (e) { /* rien */ } }
  }
  const liveExo = (l = S.live) => (l && l.exos.find((e) => e.id === l.cur)) || null;
  const fmtClock = (ms, up) => {
    const t = Math.max(0, up ? Math.ceil(ms / 1000) : Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  };
  const fmtSec = (sec) => (sec >= 60 ? `${Math.floor(sec / 60)} min${sec % 60 ? ` ${pad(sec % 60)}` : ''}` : `${sec} s`);
  const fmtRest = (sec) => (sec % 60 ? fmtSec(sec) : `${sec / 60} min`);
  const fmtKg = (kg) => fmtDec(kg, 2);
  const rirLabel = (r) => (r >= 4 ? '4+' : String(r));
  function setText(st, mode) {
    if (mode === 'time') return fmtSec(st.sec || 0);
    return `${st.reps} rép.${st.kg ? ` · ${fmtKg(st.kg)} kg` : ''}${st.rir != null ? ` · ${rirLabel(st.rir)} en réserve` : ''}`;
  }
  /* « Squats 3 × 8 à 20 kg · Pompes 10, 10, 8 · Gainage 3 × 45 s » : pour la liste, le tableau et Claude. */
  function exoSummary(e) {
    const sets = e.sets;
    if (!sets.length) return '';
    if (e.mode === 'time') {
      const same = sets.every((x) => x.sec === sets[0].sec);
      return `${e.name} ${same && sets.length > 1 ? `${sets.length} × ${fmtSec(sets[0].sec)}` : sets.map((x) => fmtSec(x.sec)).join(', ')}`;
    }
    const same = sets.every((x) => x.reps === sets[0].reps && (x.kg || 0) === (sets[0].kg || 0));
    if (same && sets.length > 1) return `${e.name} ${sets.length} × ${sets[0].reps}${sets[0].kg ? ` à ${fmtKg(sets[0].kg)} kg` : ''}`;
    return `${e.name} ${sets.map((x) => `${x.reps}${x.kg ? ` × ${fmtKg(x.kg)} kg` : ''}`).join(', ')}`;
  }
  const liveSummary = (l) => l.exos.map(exoSummary).filter(Boolean).join(' · ');
  function liveTotals(l) {
    const sets = l.exos.flatMap((e) => e.sets.map((x) => ({ ...x, mode: e.mode })));
    return { exos: l.exos.filter((e) => e.sets.length).length, sets: sets.length, reps: sets.reduce((a, x) => a + (x.mode === 'reps' ? x.reps || 0 : 0), 0) };
  }
  /* Intensité proposée d'après les répétitions en réserve : 0-1 intense, 2 modérée, 3 et plus légère. */
  function suggestIntensity(l) {
    const rirs = l.exos.flatMap((e) => e.sets.map((x) => x.rir)).filter((x) => x != null);
    if (!rirs.length) { const tp = S.settings.sport.templates.find((x) => x.id === l.tpl); return tp ? tp.intensity : 1; }
    const a = rirs.reduce((x, y) => x + y, 0) / rirs.length;
    return a <= 1.2 ? 3 : a <= 2.5 ? 2 : 1;
  }

  /* Son, vibration, écran allumé, notification Android quand le repos se termine en arrière-plan. */
  let audioCtx = null, wakeLock = null, liveTimer = null;
  function unlockAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function beep() {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime;
      [0, 0.3, 0.6].forEach((dt, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
        g.gain.setValueAtTime(0.0001, t0 + dt);
        g.gain.exponentialRampToValueAtTime(0.4, t0 + dt + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.24);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0 + dt); o.stop(t0 + dt + 0.26);
      });
    } catch (e) { /* pas de son sur cet appareil */ }
  }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300]); } catch (e) { /* rien */ } }
  let wakeAsking = false;
  async function keepAwake(on) {
    try {
      if (on && !wakeLock && !wakeAsking && navigator.wakeLock && document.visibilityState === 'visible') {
        wakeAsking = true;
        try { wakeLock = await navigator.wakeLock.request('screen'); } finally { wakeAsking = false; }
        if (!S.live && !chronoRunning()) { const w = wakeLock; wakeLock = null; await w.release(); return; }
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
    } catch (e) { wakeLock = null; }
  }
  const REST_NOTIF = 7300;
  async function restNotify() {
    const LN = capPlugin('LocalNotifications');
    if (!LN) return;
    try {
      await LN.cancel({ notifications: [{ id: REST_NOTIF }] });
      const l = S.live;
      if (!l || !l.rest) return;
      const perm = await LN.checkPermissions();
      if (perm.display !== 'granted') return;
      const exo = liveExo(l);
      await LN.schedule({ notifications: [{ id: REST_NOTIF, title: 'Repos terminé', body: exo ? `Série suivante : ${exo.name}` : 'À toi pour la série suivante', isExactNotification: false, smallIcon: 'ic_stat_monsuivi', schedule: { at: new Date(l.rest.start + l.rest.dur * 1000), allowWhileIdle: true } }] });
    } catch (e) { /* le minuteur de l'app reste là */ }
  }
  function startRest(dur) {
    const l = S.live;
    l.rest = { start: Date.now(), dur };
    saveLive(); restNotify();
  }
  function restDone(late) {
    const l = S.live;
    l.rest = null;
    saveLive(); restNotify();
    if (!late) { buzz(); if (l.sound !== false) beep(); }
    toast('Repos terminé : série suivante');
    safeRender();
  }
  function liveTick() {
    const l = S.live;
    if (!l) { stopLiveTicker(); return; }
    const now = Date.now();
    const elapsed = fmtClock(now - l.start);
    document.querySelectorAll('[data-tick="elapsed"]').forEach((el) => { if (el.textContent !== elapsed) el.textContent = elapsed; });
    if (l.chrono) document.querySelectorAll('[data-tick="chrono"]').forEach((el) => { el.textContent = fmtClock(now - l.chrono); });
    let restTxt = '';
    if (l.rest) {
      const left = l.rest.start + l.rest.dur * 1000 - now;
      if (left <= 0) { restDone(left < -8000); return; }
      restTxt = fmtClock(left, true);
      document.querySelectorAll('[data-tick="rest"]').forEach((el) => { if (el.textContent !== restTxt) el.textContent = restTxt; });
      document.querySelectorAll('[data-tick="rest-ring"]').forEach((el) => el.style.setProperty('--p', (left / (l.rest.dur * 1000)).toFixed(4)));
    }
    const bar = document.getElementById('livebar');
    if (bar && !bar.hidden) bar.querySelector('.lb-txt').textContent = `Séance ${elapsed}${restTxt ? ` · repos ${restTxt}` : ''}`;
  }
  function startLiveTicker() { if (!liveTimer) liveTimer = setInterval(liveTick, 250); liveTick(); }
  function stopLiveTicker() { clearInterval(liveTimer); liveTimer = null; }
  function refreshLivebar() {
    const bar = document.getElementById('livebar');
    if (!bar) return;
    bar.hidden = !S.live || S.ui.view === 'sport';
    if (!bar.hidden) liveTick();
  }

  /* Rendu : bouton de départ (onglet Sport, aujourd'hui) et séance en cours. */
  function liveLauncher(plan, planDone) {
    return html`<section class="live-start" aria-labelledby="ls-title">
      <span class="live-start-ico" aria-hidden="true">${ICON.timer}</span>

      <div class="actions">
        ${plan && !planDone ? html`<button type="button" class="primary big" data-act="live-start" data-tpl="${plan.id}">Commencer : ${plan.name}</button><button type="button" class="ghost big" data-act="live-start">Autre séance</button>`
          : html`<button type="button" class="primary big" data-act="live-start">Commencer maintenant</button>`}
      </div>
    </section>`;
  }
  function stepper(f, label, value, step, ph) {
    return html`<div class="field stepper"><span id="st-${f}">${label}</span><div class="step" role="group" aria-labelledby="st-${f}">
      <button type="button" class="icon" data-act="live-step" data-f="${f}" data-v="${-step}" aria-label="${label} : moins ${String(step).replace('.', ',')}">−</button>
      <input type="text" inputmode="decimal" id="live-${f}" data-live="${f}" value="${value === '' || value == null ? '' : String(value).replace('.', ',')}" placeholder="${ph || '0'}" autocomplete="off" aria-labelledby="st-${f}">
      <button type="button" class="icon" data-act="live-step" data-f="${f}" data-v="${step}" aria-label="${label} : plus ${String(step).replace('.', ',')}">+</button>
    </div></div>`;
  }
  function livePanel() {
    const l = S.live, exo = liveExo(l), dr = l.draft, tot = liveTotals(l), fin = l.finishing;
    const tp = S.settings.sport.templates.find((x) => x.id === l.tpl);
    const rest = l.rest
      ? html`<div class="rest on" role="group" aria-label="Repos en cours">
          <div class="rest-ring" data-tick="rest-ring" style="--p:1"><span><small>Repos</small><b data-tick="rest">${fmtClock(l.rest.start + l.rest.dur * 1000 - Date.now(), true)}</b></span></div>
          <div class="rest-actions"><button type="button" class="ghost" data-act="live-rest-add" data-v="-15">− 15 s</button><button type="button" class="ghost" data-act="live-rest-add" data-v="15">+ 15 s</button><button type="button" class="primary" data-act="live-rest-skip">Passer</button></div>
        </div>`

    'live-rest': (d) => { const l = S.live; l.restDur = Number(d.v); unlockAudio(); startRest(l.restDur); render(); },

  /* Champs de la séance (saisie directe) : gardés au fil de l'eau, sans redessiner la page. */
  function onLiveInput(f, t) {
    const l = S.live;
    if (!l) return;
    if (f === 'auto') l.autoRest = t.checked;
    else if (f === 'sound') { l.sound = t.checked; if (t.checked) unlockAudio(); }
    else if (f === 'name') l.name = t.value.slice(0, 60);
    else if (f === 'note') l.note = t.value.slice(0, 1000);

  document.addEventListener('visibilitychange', () => {

  });

  /* ---------- Chrono (sprints, corde à sauter) ----------
     Deux modes : chronomètre avec tours, et intervalles (effort / récup × tours) avec bips 3-2-1 et vibration.
     L'état reste sur l'appareil (CHRONO_KEY, par profil) et se calcule depuis les heures de départ : il survit à une fermeture. */
  const CHRONO_KEY = 'mon-suivi-chrono-v1';
  // clé, nom noté, type d'activité, intensité
  const CHRONO_ACTS = [['sprint', 'Sprints', 'course', 3], ['corde', 'Corde à sauter', 'corde', 2], ['course', 'Course', 'course', 2], ['velo', 'Vélo', 'velo', 2], ['autre', 'Autre', 'autre', 2]];
  // nom, effort (s), récup (s), tours, activité
  const INT_PRESETS = [['Sprints', 20, 40, 8, 'sprint'], ['Corde', 60, 30, 5, 'corde'], ['Tabata', 20, 10, 8, 'autre']];
  const freshChrono = () => ({ mode: 'sw', act: 'sprint', sw: { run: null, acc: 0, laps: [] }, it: { work: 20, rest: 40, rounds: 8, run: null, acc: 0, done: false } });
  function loadChrono() {
    const c = lsGet(scoped(CHRONO_KEY));
    if (!isObj(c) || !isObj(c.sw) || !isObj(c.it) || !Array.isArray(c.sw.laps)) return freshChrono();
    return c;
  }
  const saveChrono = () => { if (S.chrono) lsSet(scoped(CHRONO_KEY), S.chrono); };
  const swElapsed = (c = S.chrono) => c.sw.acc + (c.sw.run ? Date.now() - c.sw.run : 0);
  const itElapsed = (c = S.chrono) => c.it.acc + (c.it.run ? Date.now() - c.it.run : 0);
  const chronoRunning = () => !!(S.chrono && (S.chrono.sw.run || S.chrono.it.run));
  const fmtTenths = (ms) => { const t = Math.max(0, Math.floor(ms / 100)), m = Math.floor(t / 600), s = Math.floor((t % 600) / 10); return `${m}:${pad(s)},${t % 10}`; };
  /* Où en sont les intervalles : tour, effort ou récup, temps restant ; fini après le dernier effort. */
  function itPhase(ms, it = S.chrono.it) {
    const w = it.work * 1000, r = it.rest * 1000, cyc = w + r, total = it.rounds * w + (it.rounds - 1) * r;
    if (ms >= total) return { done: true, round: it.rounds, phase: 'fin', left: 0, dur: 1, total };
    const round = Math.floor(ms / cyc) + 1, within = ms % cyc;
    return within < w ? { round, phase: 'work', left: w - within, dur: w, total } : { round, phase: 'rest', left: cyc - within, dur: r, total };
  }
  const PHASE_LABEL = { work: 'Effort', rest: 'Récup', fin: 'Terminé' };
  function tone(freq, dur) {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.45, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) { /* pas de son sur cet appareil */ }
  }
  let chronoTimer = null;
  const chronoMem = { key: null, sec: null };
  function chronoTick() {
    const c = S.chrono;
    if (!chronoRunning()) { stopChrono(); return; }
    if (c.sw.run) { const t = fmtTenths(swElapsed(c)); document.querySelectorAll('[data-tick="sw"]').forEach((el) => { if (el.textContent !== t) el.textContent = t; }); }
    if (c.it.run) {
      const ph = itPhase(itElapsed(c));
      if (ph.done) { finishIntervals(); return; }
      const key = `${ph.round}-${ph.phase}`, sec = Math.ceil(ph.left / 1000);
      if (key !== chronoMem.key) {
        if (chronoMem.key) { tone(ph.phase === 'work' ? 1175 : 660, 0.5); buzz(); }
        chronoMem.key = key; chronoMem.sec = null;
        const card = document.querySelector('[data-tick="it-card"]');
        if (card) card.dataset.phase = ph.phase;
        document.querySelectorAll('[data-tick="it-phase"]').forEach((el) => { el.textContent = PHASE_LABEL[ph.phase]; });
        document.querySelectorAll('[data-tick="it-round"]').forEach((el) => { el.textContent = `Tour ${ph.round} sur ${c.it.rounds}`; });
      } else if (sec >= 1 && sec <= 3 && sec !== chronoMem.sec && ph.dur > 4000) { chronoMem.sec = sec; tone(880, 0.12); }
      const left = fmtClock(ph.left, true);
      document.querySelectorAll('[data-tick="it-left"]').forEach((el) => { if (el.textContent !== left) el.textContent = left; });
      document.querySelectorAll('[data-tick="it-ring"]').forEach((el) => el.style.setProperty('--p', (ph.left / ph.dur).toFixed(4)));
    }
  }
  function startChrono() { if (!chronoTimer) chronoTimer = setInterval(chronoTick, 100); keepAwake(true); chronoTick(); }
  function stopChrono() { clearInterval(chronoTimer); chronoTimer = null; if (!S.live) keepAwake(false); }
  function finishIntervals() {
    const it = S.chrono.it, ph = itPhase(0, it);
    Object.assign(it, { acc: ph.total, run: null, done: true });
    saveChrono(); stopChrono();
    tone(1175, 0.35); setTimeout(() => tone(1175, 0.6), 420); buzz();
    toast(`Intervalles terminés : ${it.rounds} × ${fmtSec(it.work)}`);
    safeRender();
  }
  /* Ce que le chrono a mesuré, pour la journée ou pour la séance en cours. */
  function chronoResult(mode) {
    const c = S.chrono, a = CHRONO_ACTS.find((x) => x[0] === c.act) || CHRONO_ACTS[0];
    if (mode === 'sw') {

    if (withLabs.length) {
      const rows = LABS.filter(([key]) => withLabs.some((k) => str((visitOf(peekDay(k)).labs || {})[key]).trim()))
        .map(([key, label, ref]) => [label, ...withLabs.map((k) => str((visitOf(peekDay(k)).labs || {})[key]).trim()), ref]);
      L.push('', 'Prises de sang (valeur notée ; dernière colonne : repère habituel, le labo donne ses propres normes) :', '', ...mdTable(['Valeur', ...withLabs.map((k) => shortDate(k)), 'Repère'], rows));
      withLabs.forEach((k) => { const tx = str(visitOf(peekDay(k)).labsText).trim(); if (tx) L.push('', `Autres résultats du ${shortDate(k)} : ${tx}`); });
    }

      [listOf(a.exos).length ? listOf(a.exos).map((e) => `${str(e.name)} : ${listOf(e.sets).map((x) => (e.mode === 'time' ? fmtSec(x.sec || 0) : `${x.reps}${x.kg ? `×${fmtKg(x.kg)} kg` : ''}${x.rir != null ? ` (${rirLabel(x.rir)} en réserve)` : ''}`)).join(', ')}`).join(' ; ') : str(a.details), str(a.note)].filter(Boolean).join(' — ')]));

  /* Courbe du poids aux pesées : une série, ligne 2 px, points 8 px, zone à 10 %, grille fine, ligne d'objectif,

  function weightChart() {
    const pts = weighIns(), target = S.settings.health.targetWeight;
    if (pts.length < 2) {
      return html`<p class="empty">${pts.length ? `Une pesée pour l’instant : ${fmtDec(pts[0].w)} kg le ${shortDate(pts[0].k)}. ` : ''}Ta courbe apparaîtra dès la deuxième pesée, à la visite médicale.</p>`;
    }
    const W = Math.round(Math.max(280, Math.min(880, (view.clientWidth || 360) - (innerWidth >= 900 ? 90 : 40)))), H = 230;
    const padL = 40, padR = 64, padT = 18, padB = 30;
    const x0 = dayNum(pts[0].k), x1 = Math.max(x0 + 1, dayNum(pts[pts.length - 1].k));
    let lo = Math.min(...pts.map((p) => p.w)), hi = Math.max(...pts.map((p) => p.w));
    if (target) { lo = Math.min(lo, target); hi = Math.max(hi, target); }
    const range = Math.max(hi - lo, 1), step = range <= 4 ? 1 : range <= 10 ? 2 : range <= 25 ? 5 : 10;
    lo = Math.floor((lo - step * 0.3) / step) * step; hi = Math.ceil((hi + step * 0.3) / step) * step;
    const X = (k) => padL + ((dayNum(k) - x0) / (x1 - x0)) * (W - padL - padR);
    const Y = (w) => padT + ((hi - w) / (hi - lo)) * (H - padT - padB);
    const ticks = [];
    for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.k).toFixed(1)} ${Y(p.w).toFixed(1)}`).join(' ');
    const area = `${line} L${X(pts[pts.length - 1].k).toFixed(1)} ${H - padB} L${X(pts[0].k).toFixed(1)} ${H - padB} Z`;
    const labelled = pts.length <= 6 ? pts : [pts[0], pts[Math.floor(pts.length / 2)], pts[pts.length - 1]];
    const last = pts[pts.length - 1];
    const data = pts.map((p) => ({ x: +X(p.k).toFixed(1), y: +Y(p.w).toFixed(1), d: shortDate(p.k), v: `${fmtDec(p.w)} kg` }));
    const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(`Poids aux pesées : ${pts.map((p) => `${shortDate(p.k)} ${fmtDec(p.w)} kg`).join(', ')}`)}">`
      + ticks.map((v) => `<line x1="${padL}" x2="${W - padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)" font-weight="600">${esc(fmtDec(v, 0))}</text>`).join('')
      + (target ? `<line x1="${padL}" x2="${W - padR}" y1="${Y(target).toFixed(1)}" y2="${Y(target).toFixed(1)}" stroke="var(--fill)" stroke-width="1.5"/><text x="${padL + 6}" y="${(Y(target) - 6).toFixed(1)}" font-size="12" font-weight="700" fill="var(--ink)">${esc(`Objectif ${fmtDec(target)} kg`)}</text>` : '')
      + `<path d="${area}" fill="var(--chart)" fill-opacity=".1" stroke="none"/>`
      + `<path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
      + `<line class="cross" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1" style="display:none"/>`
      + pts.map((p) => `<circle cx="${X(p.k).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="4" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>`).join('')
      + labelled.map((p, i) => `<text x="${X(p.k).toFixed(1)}" y="${H - 8}" text-anchor="${pts.length > 1 && p === pts[0] ? 'start' : p === last ? 'end' : 'middle'}" font-size="12" fill="var(--muted)" font-weight="600">${esc(tinyDate(p.k))}</text>`).join('')
      + `<text x="${(X(last.k) + 10).toFixed(1)}" y="${(Y(last.w) + 4).toFixed(1)}" font-size="13" font-weight="800" fill="var(--ink)">${esc(`${fmtDec(last.w)} kg`)}</text>`
      + `<rect class="hit" x="${padL}" y="0" width="${W - padL - padR}" height="${H}" fill="transparent"/></svg>`;
    return html`<div class="chart-wrap" id="wchart" data-w="${W}" data-pts="${JSON.stringify(data)}">${trusted(svg)}<div class="chart-tip" hidden></div></div>`;
  }
  function bindChart() {
    const wrap = document.getElementById('wchart');

  /* ---------- Événements ---------- */
  const app = document.getElementById('app');
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || !app.contains(b) || !S.ready) return;
    const fn = actions[b.dataset.act];
    if (fn) fn(b.dataset);
  });
  /* Nouvelle cure : le repère connu s'il y en a un (et sa date s'il n'est pas passé), sinon 6 semaines / 4 semaines dès aujourd'hui. */
  function newCure(s) {
    const h = cureHint(s.name), t = todayKey(), from = s.since && s.since > t ? s.since : t;
    return { start: h && h.start && h.start >= t ? h.start : from, on: h ? h.on : 6, off: h ? h.off : 4 };
  }
  function setSupplementField(sid, f, v) {
    const s = S.settings.supplements.find((x) => x.id === sid);
    if (!s) return;
    if (f === 'active') s.active = !!v;
    else if (f === 'weekday') s.weekday = v === '' ? null : Number(v);
    else if (f === 'since') { if (isKey(v)) s.since = v; }
    else if (f === 'moment') { if (MOMENT_KEYS.includes(v)) s.moment = v; }
    else if (f === 'freq') { if (FREQS[v]) s.freq = v; }
    else if (f === 'cure') s.cure = v ? newCure(s) : null;
    else if (f === 'cureOn' || f === 'cureOff') { if (s.cure) { const key = f === 'cureOn' ? 'on' : 'off'; s.cure[key] = intIn(v, 1, 52, s.cure[key]); } }
    else if (f === 'cureStart') { if (s.cure && isKey(v)) s.cure.start = v; }
    else if (f === 'name') s.name = String(v).trim() || 'Sans nom';
    else if (f === 'dose' || f === 'note') s[f] = String(v);
  }
  app.addEventListener('change', (e) => {
    const t = e.target, ds = t.dataset;
    if (!S.ready || !ds) return;
    if (ds.bind === 'wake' || ds.bind === 'bed') {
      // Enregistré tout de suite ; l'affichage (durée de la nuit) suit quand on quitte le champ.
      const field = ds.bind, val = t.value;
      mutateDay(ds.date, field, (d) => { d[field] = val; }, false);
      safeRender();
    } else if (ds.live) {
      onLiveInput(ds.live, t);
    } else if (ds.bind === 'steps') {
      const n = Math.round(num(String(t.value).replace(/[\s.,]/g, '')) || 0);
      if (String(t.value).trim() && (n < 0 || n > 100000)) { toast('Entre 0 et 100 000 pas.'); return; }
      mutateDay(ds.date, 'steps', (d) => { d.steps = n; }, false);
      safeRender();
    } else if (ds.spset) {
      const key = ds.spset;
      mutateSettings((st) => { st.sport = normalizeSport({ ...st.sport, [key]: t.value }); });
    } else if (ds.plan) {
      mutateSettings((st) => { st.sport.plan[Number(ds.plan)] = t.value || null; });
    } else if (ds.tpl && S.ui.tplEdit) {
      S.ui.tplEdit.draft[ds.tpl] = t.value;
    } else if (ds.visit === 'weight') {
      const w = num(t.value);
      if (String(t.value).trim() && (w == null || w < 20 || w > 400)) { toast('Écris ton poids en kilos, par exemple 82,5.'); return; }
      mutateDay(ds.date, 'visit', (d) => { ensureVisit(d).weight = w == null ? null : round1(w); }, false);
      if (w != null) t.value = fmtDec(round1(w));
      safeRender(); // évolution depuis la dernière pesée
    } else if (ds.vset) {
      const key = ds.vset;
      if (key === 'start' && !isKey(t.value)) { toast('Choisis la date de ta première visite.'); return; }
      const every = Math.round(num(t.value) || 0);
      if (key === 'every' && (every < 7 || every > 120)) { toast('Entre 7 et 120 jours.'); t.value = S.settings.visit.every; return; }
      mutateSettings((st) => { st.visit[key] = key === 'notify' ? t.checked : key === 'every' ? every : t.value; });
      scheduleReminders();
    } else if (ds.ui === 'dataDate') {
      S.ui.dataDate = isKey(t.value) ? t.value : null;
      render();
    } else if (ds.draft && S.ui.form) {
      S.ui.form.draft[ds.draft] = t.value;
    } else if (ds.item) {
      onItemInput(ds.item, t.type === 'checkbox' ? t.checked : t.value);
    } else if (ds.ask === 'withWeek') {
      S.ui.ask.withWeek = t.checked;
      refreshReport();
    } else if (ds.ask === 'photo') {
      S.ui.ask.photo = (t.files && t.files[0]) || null;
      render();
    } else if (ds.goal === 'water') {
      const n = posNum(t.value);
      if (!n || n < 0.5 || n > 8) { toast('Entre 0,5 et 8 litres.'); t.value = fmtDec(S.settings.goals.water); return; }
      mutateSettings((st) => { st.goals.water = round1(n); }, false);
      t.value = fmtDec(round1(n));
    } else if (ds.goal === 'glass') {
      mutateSettings((st) => { st.goals.glass = Number(t.value) || 250; }, false);
    } else if (ds.goal) {
      const n = posNum(t.value);
      mutateSettings((st) => { st.goals[ds.goal] = n ? round1(n) : null; }, false);
      t.value = n ? fmtDec(round1(n)) : '';
    } else if (ds.hset && !['treatments', 'conditions', 'allergies'].includes(ds.hset)) {
      const key = ds.hset, v = t.value.trim();
      mutateSettings((st) => { st.health = normalizeHealth({ ...st.health, [key]: key === 'birth' || key === 'activity' ? v : num(v) }); }, false);
      const n = S.settings.health[key];
      if (v && (n == null || n === '')) toast(key === 'height' ? 'Taille en centimètres, par exemple 180.' : key === 'birth' ? 'Choisis ta date de naissance.' : 'Poids en kilos, par exemple 82,5.');
      if (key !== 'birth' && key !== 'activity') t.value = n ? fmtDec(n) : '';
      if (key === 'birth') render();
    } else if (ds.dossier) {
      if (isKey(t.value)) { S.ui.dossier[ds.dossier] = t.value; render(); }
    } else if (ds.setting === 'cureNotify') {
      mutateSettings((st) => { st.cureNotify = t.checked; }, false);
      scheduleReminders();
    } else if (ds.setting === 'claudeUrl') {
      const v = t.value.trim();
      if (v && !isClaudeUrl(v)) { toast('Colle un lien qui commence par https://claude.ai/'); return; }
      mutateSettings((st) => { st.claudeUrl = v; }, false);
      if (v) toast('Lien enregistré');
    } else if (ds.weekly) {
      const v = t.value;
      mutateSettings((st) => { const s = st.supplements.find((x) => x.id === ds.weekly); if (s) s.weekday = v === '' ? null : Number(v); });
      if (v !== '') toast('Jour enregistré');
    } else if (ds.sset) {
      const row = t.closest('[data-sid]');
      if (!row) return;
      const structural = ['moment', 'freq', 'active', 'cure', 'cureOn', 'cureOff', 'cureStart'].includes(ds.sset); // ceux qui changent la fiche affichée
      if (structural && (t.type === 'checkbox' || finePointer())) S.ui.focus = `#${CSS.escape(t.id)}`;
      mutateSettings(() => setSupplementField(row.dataset.sid, ds.sset, t.type === 'checkbox' ? t.checked : t.value), structural);
      if (structural || ds.sset === 'name') scheduleReminders();
    } else if (ds.file === 'import') {
      importFile(t.files && t.files[0]);
      t.value = '';
    }
  });
  app.addEventListener('input', (e) => {
    const t = e.target, ds = t.dataset;
    if (!S.ready || !ds) return;
    if (ds.bind === 'notes') {
      mutateDay(ds.date, 'notes', (d) => { d.notes = t.value; }, false);
    } else if (ds.draft && S.ui.form) {
      S.ui.form.draft[ds.draft] = t.value;
    } else if (ds.item && t.type !== 'checkbox') {
      onItemInput(ds.item, t.value);
    } else if (ds.visit && ds.visit !== 'weight') {
      const path = ds.visit, val = t.value;
      mutateDay(ds.date, 'visit', (d) => {
        const vis = ensureVisit(d);
        if (path.startsWith('labs.')) vis.labs[path.slice(5)] = val; else vis[path] = val;
      }, false);
    } else if (ds.tpl && S.ui.tplEdit) {
      S.ui.tplEdit.draft[ds.tpl] = t.value;
    } else if (ds.live) {
      onLiveInput(ds.live, t);
    } else if (ds.pf === 'new') {
      S.ui.profileNew = t.value;
    } else if (ds.pf === 'name' && S.ui.profileEdit) {
      S.ui.profileEdit.name = t.value;
    } else if (ds.ask === 'q') {
      S.ui.ask.q = t.value;
      refreshReport();
    } else if (ds.fd) {
      S.ui.foodDraft[ds.fd] = t.value;
    } else if (ds.restore) {
      S.ui.restoreText = t.value;
    } else if (['treatments', 'conditions', 'allergies'].includes(ds.hset)) {
      mutateSettings((st) => { st.health[ds.hset] = t.value.slice(0, 2000); }, false);
    } else if (ds.setting === 'profile') {
      mutateSettings((st) => { st.profile = t.value.slice(0, 4000); }, false);
    } else if (['name', 'dose', 'note'].includes(ds.sset)) {
      const row = t.closest('[data-sid]');
      const s = row && S.settings.supplements.find((x) => x.id === row.dataset.sid);
      if (!s) return;
      s[ds.sset] = t.value;
      markDirty('settings');
    }
  });
  // Entrée dans le champ « Exercice » de la séance en direct : l'ajoute.
  app.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key === 'Enter' && t && t.dataset && t.dataset.live === 'exo' && S.live) { e.preventDefault(); pickExo(t.value); }
    if (e.key === 'Enter' && t && t.dataset && t.dataset.pf === 'new') { e.preventDefault(); S.ui.profileNew = t.value; addProfile(); }
    if (e.key === 'Enter' && t && t.dataset && t.dataset.pf === 'name') { e.preventDefault(); S.ui.profileEdit.name = t.value; PROFILE_ACTIONS['profile-save'](); }
  });
  /* Le texte pour Claude affiché suit la question et la case « 6 jours d'avant ». */
  function refreshReport() {
    const rt = document.getElementById('report-text'), area = document.getElementById('ask-area');
    if (rt && area && S.ui.ask.showReport) rt.value = claudeText(area.dataset.scope, area.dataset.key);
  }
  app.addEventListener('toggle', (e) => {
    const t = e.target;
    if (!t.dataset) return;
    if (t.dataset.toggle === 'labs') { S.ui.labsOpen = t.open; return; }
    if (t.dataset.toggle !== 'report') return;
    S.ui.ask.showReport = t.open;
    refreshReport();
  }, true); // « toggle » ne remonte pas : on l'écoute à la descente

  /* Nouveau jour, retour sur la page, connexion retrouvée, fermeture */
  let lastToday = todayKey();
  function checkRollover() {
    const t = todayKey();
    if (t === lastToday) return;
    if (S.ui.date === lastToday) S.ui.date = t;
    if (S.ui.weekOf === startOfWeek(lastToday)) S.ui.weekOf = startOfWeek(t);
    if (S.ui.monthOf === lastToday.slice(0, 7)) S.ui.monthOf = t.slice(0, 7);
    lastToday = t;
    if (S.ready) safeRender();
  }
  function resume() {
    if (store.mode !== 'cloud' || store.stopped) return;
    if (!store.online) { clearTimeout(store.connectTimer); store.connectTimer = null; connect(); }
    else if (store.dirty.size) { clearTimeout(store.retryTimer); store.retryTimer = null; flushAll(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkRollover(); resume(); }
    else flushAll();
  });
  window.addEventListener('online', resume);
  // réseau perdu ou retrouvé : le statut en haut et le rappel d'envoi à Claude suivent
  const netChanged = () => { refreshSync(); if (S.ready) safeRender(); };
  window.addEventListener('online', netChanged);
  window.addEventListener('offline', netChanged);
  window.addEventListener('pagehide', flushAll);
  setInterval(checkRollover, 60000);
  // la courbe du poids se recalcule à la largeur de l'écran
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.ready && S.ui.view === 'sante') safeRender(); }, 200); });

  /* App Android : rappels de la visite médicale (la veille à 19:00, le matin à 7:30), pour les 6 prochaines.
     Identifiants 7000 à 7099 réservés à ces rappels : on les annule tous puis on les recrée. */
  async function scheduleReminders() {
    const LN = capPlugin('LocalNotifications');
    if (!LN || !S.settings) return;
    const v = S.settings.visit, cures = S.settings.cureNotify ? S.settings.supplements.filter((s) => s.active && s.cure) : [];
    try {
      const pending = await LN.getPending();
      const ours = ((pending && pending.notifications) || []).filter((n) => n.id >= 7000 && n.id < 7200);
      if (ours.length) await LN.cancel({ notifications: ours.map((n) => ({ id: n.id })) });
      if (!v.notify && !cures.length) return;
      let perm = await LN.checkPermissions();
      if (perm.display !== 'granted' && perm.display !== 'denied') perm = await LN.requestPermissions();
      const denied = perm.display !== 'granted';
      if (denied !== !!store.notifyDenied) { store.notifyDenied = denied; if (S.ui.view === 'reglages') safeRender(); }
      if (denied) return;
      const now = Date.now(), list = [];
      let k = nextVisit(todayKey());
      for (let i = 0; i < (v.notify ? 6 : 0); i++, k = addDays(k, v.every)) {
        const eve = fromKey(addDays(k, -1)); eve.setHours(19, 0, 0, 0);
        const morning = fromKey(k); morning.setHours(7, 30, 0, 0);
        const common = { isExactNotification: false, smallIcon: 'ic_stat_monsuivi' };
        if (eve.getTime() > now) list.push({ ...common, id: 7000 + i * 2, title: 'Demain : visite médicale', body: 'Prise de sang (souvent à jeun, vérifie avec le labo), pesée et médecin. Note tes questions.', schedule: { at: eve, allowWhileIdle: true } });
        if (morning.getTime() > now) list.push({ ...common, id: 7001 + i * 2, title: 'Aujourd’hui : visite médicale', body: 'Prise de sang, pesée, médecin. Note tout dans Mon suivi pour ton bilan du mois avec Claude.', schedule: { at: morning, allowWhileIdle: true } });
      }
      // Cures : la veille de chacun des 4 prochains changements (début, pause, reprise), à 19:00 ; ids 7100 à 7199.
      let id = 7100;
      cures.forEach((s) => {
        let from = todayKey();
        for (let i = 0; i < 4 && id < 7200; i++) {
          const ph = curePhase(s.cure, from), day = ph.next, eve = fromKey(addDays(day, -1));
          eve.setHours(19, 0, 0, 0);
          const pause = ph.phase === 'prise';
          const title = pause ? `Demain : pause ${deName(s.name)}` : `Demain : ${ph.phase === 'avant' ? 'début de la cure' : 'reprise'} ${deName(s.name)}`;
          const body = pause ? `${s.cure.off} semaines sans, reprise le ${shortDate(addDays(day, s.cure.off * 7))}.` : `${s.cure.on} semaines de prise, jusqu’au ${shortDate(addDays(day, s.cure.on * 7 - 1))} inclus.`;
          if (eve.getTime() > now) list.push({ isExactNotification: false, smallIcon: 'ic_stat_monsuivi', id: id++, title, body, schedule: { at: eve, allowWhileIdle: true } });
          from = day;
        }
      });
      if (list.length) await LN.schedule({ notifications: list });
    } catch (e) { /* notifications indisponibles : les rappels restent dans l'app */ }
  }

  /* App Android : le bouton retour ferme le formulaire ouvert, revient à la vue Jour, puis met l'app en arrière-plan. */
  const capApp = capPlugin('App');
  if (capApp && typeof capApp.addListener === 'function') {
    capApp.addListener('backButton', () => {
      if (S.ui.form || S.ui.confirm || S.ui.exportText != null) { S.ui.form = null; S.ui.confirm = null; S.ui.exportText = null; render(); }
      else if (S.ui.view === 'reglages' && S.ui.settingsPage) { S.ui.settingsPage = null; render(); toTop(); }
      else if (S.ui.view !== 'jour') { S.ui.view = 'jour'; render(); toTop(); }
      else if (typeof capApp.minimizeApp === 'function') capApp.minimizeApp();
    });
  }

  init();
})();
</script>
