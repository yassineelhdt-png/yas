<title>Mon suivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3F4; --surface:#FFFFFF; --surface-2:#FAF7F8; --ink:#1A1417; --muted:#6B6166; --line:#E7E0E3;
  --accent:#D62839; --accent-2:#B51F2F; --on-accent:#FFFFFF; --accent-tint:#FDECEE; --accent-line:#F5C3C9;
  --matin:#E9A62B; --matin-2:#F6D48A; --matin-tint:#FCF2DC; --matin-line:#F0D49B; --matin-on:#1A1417;
  --midi:#1F9C93; --midi-2:#94D8D1; --midi-tint:#DFF2EF; --midi-line:#ABDDD7; --midi-on:#1A1417;
  --aprem:#7C5CD6; --aprem-2:#C4B4F1; --aprem-tint:#EDE7FB; --aprem-line:#CFC2F4; --aprem-on:#FFFFFF;
  --soir:#3557C2; --soir-2:#A3B5EC; --soir-tint:#E2E8F8; --soir-line:#B9C7F0; --soir-on:#FFFFFF;
  --fill:#1F9C93; --bub:#EEE8EB; --danger:#BF3A31; --focus:#1A1417;
  --c-supp:#1F9C93; --c-kcal:#B7770A; --c-water:#3557C2; --c-sport:#D62839; --c-mind:#7C5CD6;
  --chart:#3557C2; --sport:#D62839; --sport-2:#F2A7B0; --sport-tint:#FDECEE; --sport-line:#F5C3C9; --sport-on:#FFFFFF; --shadow:0 1px 2px rgba(26,20,23,.05), 0 8px 24px rgba(26,20,23,.06);
  --font-ui:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display:"Unbounded", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0C0E; --surface:#1A1618; --surface-2:#221D20; --ink:#F6F1F3; --muted:#ABA0A6; --line:#332C30;
    --accent:#F04B5C; --accent-2:#FF8A96; --on-accent:#1A0A0D; --accent-tint:#2E1519; --accent-line:#5A262E;
    --matin:#F2BA4E; --matin-2:#8C6B2B; --matin-tint:#272115; --matin-line:#4A3D1F; --matin-on:#0F0C0E;
    --midi:#3CC0B5; --midi-2:#1F6E68; --midi-tint:#122725; --midi-line:#1F4643; --midi-on:#0F0C0E;
    --aprem:#A78CF3; --aprem-2:#5A4990; --aprem-tint:#1E1A31; --aprem-line:#3A305E; --aprem-on:#0F0C0E;
    --soir:#7C95F3; --soir-2:#3E5192; --soir-tint:#171F36; --soir-line:#2D3C66; --soir-on:#0F0C0E;
    --fill:#3CC0B5; --bub:#2B2428; --danger:#F06C62; --focus:#F6F1F3;
    --chart:#6F88E8; --shadow:none;
    --c-supp:#23A095; --c-kcal:#B98019; --c-water:#6F88E8; --c-sport:#F04B5C; --c-mind:#9272E6;
    --sport:#F04B5C; --sport-2:#6E2530; --sport-tint:#2A1418; --sport-line:#4E232A; --sport-on:#1A0A0D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0C0E; --surface:#1A1618; --surface-2:#221D20; --ink:#F6F1F3; --muted:#ABA0A6; --line:#332C30;
  --accent:#F04B5C; --accent-2:#FF8A96; --on-accent:#1A0A0D; --accent-tint:#2E1519; --accent-line:#5A262E;
  --matin:#F2BA4E; --matin-2:#8C6B2B; --matin-tint:#272115; --matin-line:#4A3D1F; --matin-on:#0F0C0E;
  --midi:#3CC0B5; --midi-2:#1F6E68; --midi-tint:#122725; --midi-line:#1F4643; --midi-on:#0F0C0E;
  --aprem:#A78CF3; --aprem-2:#5A4990; --aprem-tint:#1E1A31; --aprem-line:#3A305E; --aprem-on:#0F0C0E;
  --soir:#7C95F3; --soir-2:#3E5192; --soir-tint:#171F36; --soir-line:#2D3C66; --soir-on:#0F0C0E;
  --fill:#3CC0B5; --bub:#2B2428; --danger:#F06C62; --focus:#F6F1F3;
  --chart:#6F88E8; --shadow:none;
  --c-supp:#23A095; --c-kcal:#B98019; --c-water:#6F88E8; --c-sport:#F04B5C; --c-mind:#9272E6;
  --sport:#F04B5C; --sport-2:#6E2530; --sport-tint:#2A1418; --sport-line:#4E232A; --sport-on:#1A0A0D;
  color-scheme:dark;
}
.m-matin{ --m:var(--matin); --m2:var(--matin-2); --mt:var(--matin-tint); --ml:var(--matin-line); --mo:var(--matin-on); }
.m-midi{ --m:var(--midi); --m2:var(--midi-2); --mt:var(--midi-tint); --ml:var(--midi-line); --mo:var(--midi-on); }
.m-aprem{ --m:var(--aprem); --m2:var(--aprem-2); --mt:var(--aprem-tint); --ml:var(--aprem-line); --mo:var(--aprem-on); }
.m-sport{ --m:var(--sport); --m2:var(--sport-2); --mt:var(--sport-tint); --ml:var(--sport-line); --mo:var(--sport-on); }
.m-soir{ --m:var(--soir); --m2:var(--soir-2); --mt:var(--soir-tint); --ml:var(--soir-line); --mo:var(--soir-on); }

*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 116px); -webkit-text-size-adjust:100%; text-size-adjust:100%; }
@media (min-width:720px){ html{ scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 76px); } }
body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
h1,h2,h3{ margin:0; text-wrap:balance; }
[hidden]{ display:none !important; }
.sr-only{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* Barre du haut */
.top{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:var(--surface); background:color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line); }
.top-in{ max-width:1120px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px 16px; min-height:54px; }
.brand{ display:inline-flex; align-items:center; gap:9px; white-space:nowrap; font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:-.01em; }
.brand svg{ width:28px; height:28px; }
.brand .b-bg{ fill:var(--accent); }
.sync{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.sync::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--dot, var(--muted)); }

/* Navigation : en bas sur téléphone et tablette, sur le côté sur grand écran */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:4px; background:var(--surface); border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.nav button{ border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0 6px; border-radius:14px; font-size:11.5px; min-width:0; font-weight:700; color:var(--muted); min-height:56px; }
.nav-ico{ display:grid; place-items:center; width:100%; max-width:58px; height:30px; border-radius:999px; transition:background-color .15s ease; }
.nav-ico svg{ width:23px; height:23px; }
.nav button[aria-current="page"]{ color:var(--accent-2); }
.nav button[aria-current="page"] .nav-ico{ background:var(--accent-tint); color:var(--accent); }
@media (hover:hover){ .nav button:not([aria-current]):hover{ color:var(--ink); } }

main{ max-width:1120px; margin:0 auto; padding:18px 16px calc(100px + env(safe-area-inset-bottom, 0px)); }
@media (min-width:720px){ main{ padding:26px 24px calc(110px + env(safe-area-inset-bottom, 0px)); } }
@media (min-width:1000px){
  body{ padding-left:100px; }
  .nav{ top:0; right:auto; width:100px; grid-template-columns:none; grid-auto-rows:min-content; align-content:start; gap:8px; padding:calc(76px + env(safe-area-inset-top, 0px)) 8px 16px; border-top:0; border-right:1px solid var(--line); }
  .nav button{ min-height:64px; }
  main{ padding-bottom:64px; }
}
.page-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(26px, 5vw, 38px); letter-spacing:-.025em; line-height:1.1; margin-bottom:18px; }
.loading{ color:var(--muted); font-weight:600; }

/* Boutons */
.icon{ flex:none; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:inline-grid; place-items:center; color:var(--ink); padding:0; }
.ghost{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 16px; font-weight:700; font-size:15px; min-height:42px; }
.primary{ border:0; background:var(--accent); color:var(--on-accent); border-radius:999px; padding:10px 18px; font-weight:700; font-size:15px; min-height:42px; }
@media (hover:hover){ .primary:hover{ background:var(--accent-2); } }
.primary:active{ transform:scale(.98); }
.big{ min-height:54px; font-size:17px; padding:12px 22px; }
.danger{ border:0; background:var(--danger); color:#fff; border-radius:999px; padding:10px 18px; font-weight:700; min-height:42px; }
.link{ border:0; background:transparent; color:var(--muted); font-weight:700; font-size:14px; padding:6px 8px; border-radius:8px; }
.link:hover{ color:var(--ink); }
.link.danger{ color:var(--danger); background:transparent; min-height:0; padding:6px 8px; }
@media (hover:hover){
  .icon:hover,.ghost:hover,.lid:hover{ border-color:var(--muted); }
  .tabs button:not([aria-current]):hover{ color:var(--ink); }
}
.hint{ margin:0 0 12px; color:var(--muted); font-size:14px; font-weight:500; }
.empty{ margin:4px 0 0; color:var(--muted); }
.muted{ color:var(--muted); }
.actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.daynav{ display:flex; align-items:center; gap:8px; margin-left:auto; }

/* Jour */
.date{ font-family:var(--font-display); font-weight:600; font-size:clamp(24px, 4.4vw, 40px); line-height:1.08; letter-spacing:-.025em; }
.strip{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; margin:18px 0 26px; }
.lid{ position:relative; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:7px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:0; }
.lid.visit::before{ content:""; position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--soir); }
.lid[aria-current="date"].visit::before{ background:var(--soir-2); }
.lid .wd{ font-size:12px; font-weight:700; color:var(--muted); }
.lid .dn{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.3; }
.lid .bar{ width:64%; height:4px; border-radius:2px; background:var(--bub); overflow:hidden; margin-top:3px; }
.lid .bar i{ display:block; height:100%; background:var(--fill); border-radius:2px; }
.lid[aria-current="date"]{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.lid[aria-current="date"] .bar i{ background:var(--on-accent); }
.lid[aria-current="date"] .wd{ color:inherit; }
.lid[aria-current="date"] .bar{ background:rgba(127,127,127,.4); }
.lid.today .dn{ text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px; }
.banner{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:-8px 0 24px; padding:12px 14px; border:1.5px dashed var(--matin); background:var(--surface); border-radius:14px; }
.banner.remind{ border:1.5px solid var(--soir-line); background:var(--soir-tint); }
.banner .btxt{ flex:1 1 220px; min-width:0; }
.banner .btxt b{ display:block; font-weight:800; }
.banner .btxt span{ display:block; font-size:14px; font-weight:600; color:var(--muted); }
.banner p{ margin:0; font-weight:700; }
.banner select{ background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-height:42px; }
.daygrid{ display:grid; gap:36px; }
@media (min-width:760px){ .daygrid{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; } }
@media (min-width:1100px){ .daygrid{ gap:44px; } }
.sec-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; min-height:42px; }
.sec-head h2{ font-size:20px; font-weight:800; letter-spacing:-.01em; min-width:0; }
.sec-head .primary,.sec-head .ghost{ white-space:nowrap; flex:none; }
.count{ font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
/* Cartes */
.col{ display:grid; gap:18px; align-content:start; min-width:0; }
.card,.jsec{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; min-width:0; box-shadow:var(--shadow); }
@media (min-width:720px){ .card,.jsec{ padding:18px 20px; } }
.card-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.card-head h2{ flex:1; font-size:20px; font-weight:800; letter-spacing:-.01em; }
[data-patch]{ display:contents; }
.pill{ flex:none; font-size:13px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-variant-numeric:tabular-nums; }
.mico{ flex:none; width:34px; height:34px; border-radius:11px; background:var(--m, var(--ink)); color:var(--mo, var(--bg)); display:grid; place-items:center; }
.mico svg{ width:20px; height:20px; }
.sleep{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 14px; }
.sleep .field{ width:132px; }
.chip{ border:1.5px dashed var(--matin); background:var(--matin-tint); color:var(--ink); border-radius:999px; padding:9px 16px; font-weight:700; min-height:44px; }
.field{ display:flex; flex-direction:column; gap:5px; font-size:14px; font-weight:700; color:var(--muted); min-width:0; }
.field input,.field select,.field textarea,.notes{ width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 11px; min-height:44px; font-weight:500; font-size:16px; }
.field textarea,.notes{ resize:vertical; line-height:1.45; }
/* Compléments */
.supps-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
.supps-head h2{ font-size:20px; font-weight:800; letter-spacing:-.01em; }
.supps-head .sub{ margin:2px 0 0; font-size:14px; font-weight:700; color:var(--muted); }
.supps-head .sub.done{ color:var(--fill); }
.ring{ flex:none; width:54px; height:54px; border-radius:50%; background:conic-gradient(var(--fill) calc(var(--p) * 1turn), var(--bub) 0); display:grid; place-items:center; }
.ring span{ width:42px; height:42px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }
.moments{ display:grid; gap:12px; }
.moment{ background:var(--mt); border:1px solid var(--ml); border-radius:16px; padding:10px; }
.moment-head{ display:flex; align-items:center; gap:10px; padding:2px 2px 10px 4px; }
.mtitle{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25; }
.mtitle h3{ font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:-.01em; }
.mtitle span{ font-size:13px; color:var(--muted); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mcount{ font-size:13px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums; }
.mall{ flex:none; border:1px solid var(--ml); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:800; min-height:36px; }
.mdone{ flex:none; display:inline-flex; align-items:center; gap:5px; padding:6px 11px; border-radius:999px; background:var(--m); color:var(--mo); font-size:13px; font-weight:800; }
.mdone svg{ width:14px; height:14px; }
.mitems{ display:grid; gap:6px; }
.item{ width:100%; display:flex; align-items:center; gap:12px; padding:11px 12px; background:var(--surface); border:1px solid transparent; border-radius:12px; text-align:left; transition:background-color .15s ease, border-color .15s ease; }
@media (hover:hover){ .item:hover{ border-color:var(--ml); } }
.item.on{ border-color:var(--ml); background:var(--surface); background:color-mix(in srgb, var(--m) 9%, var(--surface)); }
.cap{ flex:none; position:relative; width:50px; height:27px; border-radius:999px; border:2px solid var(--m); background:var(--surface); }
.cap::after{ content:""; position:absolute; top:4px; bottom:4px; left:50%; width:2px; margin-left:-1px; background:var(--ml); border-radius:1px; }
.cap.on{ background:linear-gradient(90deg, var(--m) 0 50%, var(--m2) 50% 100%); }
.cap.on::after{ background:rgba(0,0,0,.14); }
.cap svg{ position:absolute; left:4px; top:50%; width:15px; height:15px; margin-top:-7.5px; color:var(--mo); }
.cap.just{ animation:pop .24s ease-out; }
.entry.fresh{ animation:fresh 2.4s ease-out; border-radius:12px; }
@keyframes fresh{ 0%, 40%{ background:var(--accent-tint); } 100%{ background:transparent; } }
@keyframes pop{ 0%{ transform:scale(.86); } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); } }
.it-main{ flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; }
.it-name{ font-weight:800; }
.it-dose{ font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
.it-note{ flex-basis:100%; font-size:14px; color:var(--muted); line-height:1.35; }
.freq{ flex:none; font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--ml); white-space:nowrap; }
.it-cure{ flex-basis:100%; display:flex; margin-top:5px; }
.freq.cure{ background:var(--mt); border-color:var(--m); }
.freq.cure.last{ background:var(--m); color:var(--mo); }
.cure-notes{ list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
.cure-notes li{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; border:1.5px dashed var(--ml); background:var(--surface); }
.cure-notes .mico{ width:30px; height:30px; border-radius:10px; background:var(--mt); color:var(--m); }
.cure-notes .mico svg{ width:17px; height:17px; }
.cure-notes b{ display:block; font-weight:800; }
.cure-notes .ctxt{ min-width:0; }
.cure-notes .ctxt span{ display:block; font-size:13.5px; font-weight:600; color:var(--muted); }
.banner.remind.cure{ border-color:var(--ml); background:var(--mt); }
.banner.send{ border:1.5px solid var(--accent-line); background:var(--accent-tint); }
.banner.send .mico{ background:var(--accent); color:var(--on-accent); }
.pill.sent{ display:inline-flex; align-items:center; gap:5px; background:var(--accent-tint); border-color:var(--accent-line); color:var(--accent-2); font-size:12.5px; white-space:normal; }
.pill.sent svg{ width:13px; height:13px; }
.hint.offline{ padding:10px 12px; border-radius:12px; background:var(--surface-2); border:1px dashed var(--line); }
.livebar:not([hidden]) ~ .toast-wrap{ padding-bottom:calc(142px + env(safe-area-inset-bottom, 0px)); }
@media (min-width:1000px){ .livebar:not([hidden]) ~ .toast-wrap{ padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px)); } }
.cure-box{ display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:14px; border:1px solid var(--line); background:var(--surface); }
.cure-box .hint{ margin:0; }

.list{ list-style:none; margin:0; padding:0; }
.entry{ display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:4px 12px; padding:12px 0; border-top:1px solid var(--line); align-items:start; }
.list > li:first-child{ border-top:0; }
.editing{ padding:6px 0; }
.t{ font-weight:800; font-variant-numeric:tabular-nums; padding-top:3px; }
.ci-line{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
.face{ font-size:26px; line-height:1; }
.meters{ display:flex; flex-wrap:wrap; gap:6px 14px; }
.meter{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--muted); }
.segs{ display:inline-flex; gap:2px; }
.segs i{ width:7px; height:12px; border-radius:2px; background:var(--bub); }
.segs i.on{ background:var(--ink); }
.note{ margin:4px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.kind{ display:block; font-size:13px; font-weight:800; color:var(--muted); }
.kind + .note{ margin-top:0; }
.row-actions{ display:flex; flex-wrap:wrap; justify-content:flex-end; }
@media (max-width:560px){
  .entry{ grid-template-columns:48px minmax(0,1fr); gap:2px 10px; }
  .entry > .row-actions{ grid-column:2; justify-content:flex-start; margin:0 0 -4px -8px; }
}
.form{ display:flex; flex-direction:column; gap:16px; padding:16px; margin-bottom:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:16px; }
.form-row{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
.field-time{ width:132px; }
.scale{ border:0; margin:0; padding:0; min-width:0; }
.scale legend{ padding:0; margin-bottom:6px; font-size:14px; font-weight:800; }
.dots{ display:flex; gap:8px; }
.dot{ width:46px; height:46px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-weight:800; font-size:16px; display:grid; place-items:center; padding:0; }
.dot.emoji{ font-size:23px; }
.dot[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
.dot.emoji[aria-pressed="true"]{ background:var(--matin-tint); border-color:var(--matin); box-shadow:inset 0 0 0 2px var(--matin); color:inherit; }
.ends{ display:flex; justify-content:space-between; width:262px; max-width:100%; margin-top:5px; font-size:12px; font-weight:600; color:var(--muted); }
.seg{ display:inline-flex; max-width:100%; padding:3px; gap:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; }
.field > .seg{ display:flex; flex-wrap:wrap; width:max-content; border-radius:22px; }
.field > .seg button{ flex:1 1 auto; min-width:0; white-space:nowrap; }
.seg button{ border:0; background:transparent; border-radius:999px; padding:8px 14px; font-weight:700; color:var(--muted); min-height:38px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.notes{ min-height:110px; }

/* Semaine */
.wk-head,.yr-head{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:10px; }
.wk-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(20px, 3.4vw, 30px); letter-spacing:-.02em; line-height:1.15; }
.scroller{ overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
.week{ width:100%; min-width:700px; border-collapse:collapse; }
.week th,.week td{ padding:7px 4px; text-align:center; border-bottom:1px solid var(--line); }
.week thead th{ padding:8px 4px; }
.week thead button{ border:0; background:transparent; border-radius:12px; padding:5px 10px; display:inline-flex; flex-direction:column; align-items:center; line-height:1.2; font-weight:700; font-size:13px; color:var(--muted); }
.week thead button b{ font-size:17px; color:var(--ink); font-variant-numeric:tabular-nums; }
.week thead th.today button{ background:var(--ink); color:var(--bg); }
.week thead th.today button b{ color:var(--bg); }
.vtag{ display:block; margin-top:2px; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--soir); }
.week thead th.today .vtag{ color:var(--soir-2); }
.week-claude{ margin-top:22px; }
.week th[scope="row"]{ text-align:left; padding-left:14px; font-weight:700; white-space:nowrap; }
.week th[scope="row"] small{ margin-left:6px; font-size:13px; font-weight:600; color:var(--muted); }
.week tr.grp th{ text-align:left; padding:12px 14px 6px; background:var(--mt); border-bottom:1px solid var(--ml); font-family:var(--font-display); font-weight:600; font-size:15px; }
.week tr.grp th span{ font-family:var(--font-ui); font-size:13px; font-weight:600; color:var(--muted); margin-left:6px; }
.mini{ position:relative; width:36px; height:22px; padding:0; border-radius:999px; border:2px solid var(--m); background:var(--surface); vertical-align:middle; }
.mini.on{ background:linear-gradient(90deg, var(--m) 0 50%, var(--m2) 50% 100%); }
.mini svg{ position:absolute; left:3px; top:50%; width:12px; height:12px; margin-top:-6px; color:var(--mo); }
.week tbody.sum th[scope="row"]{ color:var(--muted); }
.week tbody.sum td{ font-weight:700; font-variant-numeric:tabular-nums; }
.week tbody.sum tr:first-child th,.week tbody.sum tr:first-child td{ border-top:2px solid var(--line); }
.week tbody.sum tr:last-child th,.week tbody.sum tr:last-child td{ border-bottom:0; }

/* Année */
.yr-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(30px, 6vw, 52px); letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
.yr-sum{ margin:6px 0 14px; font-weight:600; }
.legend{ display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:20px; font-size:14px; font-weight:600; color:var(--muted); }
.legend span{ display:inline-flex; align-items:center; gap:7px; }
.months{ display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:16px; }
.month{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 12px 14px; }
.month h3{ font-size:15px; font-weight:800; margin-bottom:8px; }
.blister{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:5px; }
.wdh{ text-align:center; font-size:11px; font-weight:700; color:var(--muted); }
.bub{ display:block; width:100%; max-width:100%; min-height:20px; aspect-ratio:1/1; padding:0; border-radius:50%; border:1px solid var(--line); background:var(--bub); position:relative; box-shadow:inset 0 -2px 0 rgba(0,0,0,.07); }
.bub.none{ background:transparent; border-style:dashed; box-shadow:none; }
.bub.part{ background:conic-gradient(var(--fill) calc(var(--p) * 1turn), var(--bub) 0); }
.bub.full{ background:var(--fill); border-color:var(--fill); }
.bub.future{ opacity:.4; }
.bub.today{ outline:2px solid var(--ink); outline-offset:1px; }
.bub.v{ box-shadow:0 0 0 2px var(--soir); }
.bub.j::after{ content:""; position:absolute; right:-2px; bottom:-2px; width:8px; height:8px; border-radius:50%; background:var(--aprem); border:1.5px solid var(--surface-2); }
.legend .bub{ display:inline-block; width:16px; height:16px; min-height:0; }

/* Réglages */
.set-sec{ max-width:820px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow); }
@media (min-width:720px){ .set-sec{ padding:22px 24px; } }
.set-sec + .set-sec{ margin-top:18px; }
.next-visit{ display:flex; align-items:center; gap:12px; margin:0 0 14px; padding:12px 14px; background:var(--soir-tint); border:1px solid var(--soir-line); border-radius:14px; }
.next-visit b{ display:block; font-weight:800; }
.next-visit span span{ display:block; font-size:14px; font-weight:600; color:var(--muted); }
.dgroups{ display:grid; gap:12px; margin-top:14px; }
.dgroup{ padding:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; }
.dgroup h3{ font-size:16px; font-weight:800; }
.dgroup > p{ margin:2px 0 12px; font-size:14px; color:var(--muted); font-weight:500; }
.dgroup .day-pick{ max-width:220px; margin-bottom:10px; }
.confirm-box{ margin-top:12px; padding:12px 14px; border:1.5px solid var(--danger); border-radius:12px; background:var(--surface); }
.confirm-box p{ margin:0 0 10px; }
.m-title{ display:flex; align-items:center; gap:10px; margin:24px 0 10px; font-family:var(--font-display); font-weight:600; font-size:16px; }
.m-title::before{ content:""; flex:none; width:24px; height:13px; border-radius:999px; background:linear-gradient(90deg, var(--m) 0 50%, var(--m2) 50% 100%); }
.m-title span{ font-family:var(--font-ui); font-size:14px; font-weight:600; color:var(--muted); }
.srow{ display:flex; flex-direction:column; gap:10px; padding:14px; margin-bottom:10px; background:var(--surface-2); border:1px solid var(--line); border-left:5px solid var(--m); border-radius:12px; }
.srow.paused{ opacity:.62; }
.srow-c{ padding:0; }
.srow-open{ width:100%; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; row-gap:2px; padding:13px 14px; min-height:48px; background:transparent; border:0; border-radius:10px; text-align:left; }
.srow-meta{ margin-left:auto; font-size:14px; font-weight:700; color:var(--muted); }
.srow-foot .row-actions{ align-items:center; gap:6px; }
.srow-line{ display:flex; flex-wrap:wrap; gap:10px; }
.srow-line .field{ flex:0 1 auto; }
.srow-line .grow{ flex:1 1 220px; }
.srow-line select{ min-width:130px; }
.srow-foot{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
.switch{ display:inline-flex; align-items:center; gap:8px; font-weight:700; }
.snotify{ margin-top:18px; padding:14px; border-radius:16px; background:var(--surface-2); border:1px solid var(--line); }
.sn-times{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px; margin:12px 0 4px; }
.switch input{ width:22px; height:22px; accent-color:var(--accent); margin:0; }
.filebtn{ display:inline-flex; align-items:center; cursor:pointer; position:relative; }
.filebtn:focus-within{ outline:3px solid var(--focus); outline-offset:2px; }
.exportbox{ margin-top:16px; }
.export{ width:100%; min-height:160px; font-size:13px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
.reset{ margin-top:22px; }
.reset p{ margin:0 0 10px; font-weight:600; }

/* Ce que je ressens */
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chips button{ border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px; min-height:36px; }
.chips .chips-lbl{ align-self:center; font-size:13px; font-weight:700; color:var(--muted); margin-right:2px; }
.level{ flex:none; font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--aprem-tint); border:1px solid var(--aprem-line); color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums; }
.to-claude{ margin-top:10px; }

/* Nutrition */
.nutri{ display:grid; gap:10px; padding:14px; margin-bottom:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:16px; }
.nutri-top{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; }
.nutri-top b{ font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.nutri-top span{ color:var(--muted); font-weight:700; font-size:14px; }
.nutri-top .over{ color:var(--danger); }
.mbars{ display:grid; gap:6px; }
.mbar{ display:grid; grid-template-columns:88px minmax(0,1fr) auto; align-items:center; gap:10px; font-size:13px; font-weight:700; }
.mbar > span:first-child{ color:var(--muted); }
.mbar .track{ height:8px; border-radius:4px; background:var(--bub); overflow:hidden; }
.mbar .track i{ display:block; height:100%; border-radius:4px; background:var(--c); width:var(--w); }
.mbar b{ font-variant-numeric:tabular-nums; min-width:92px; text-align:right; }
.items{ list-style:none; margin:6px 0 0; padding:0; display:grid; gap:2px; font-size:14px; }
.items li{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:0 10px; }
.items li span{ color:var(--muted); font-variant-numeric:tabular-nums; }
.macros{ margin:4px 0 0; font-size:13px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
.foods{ display:grid; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.foods-head{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; font-weight:800; }
.foods-head span{ color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
.food-list{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.food-list li{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; padding:8px 10px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; }
.food-list .fl-name{ font-weight:800; flex:1 1 140px; min-width:0; }
.food-list .fl-vals{ color:var(--muted); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.food-add{ display:grid; gap:10px; }
.food-add .row{ display:grid; grid-template-columns:minmax(0,1fr) 110px; gap:10px; }
.food-add .row4{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
@media (max-width:460px){ .food-add .row4{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
.food-add .field span{ font-size:13px; }
.per100{ margin:0; font-size:13px; font-weight:600; color:var(--muted); }

/* Visite médicale */
.visit{ border:1.5px solid var(--soir-line); margin-bottom:18px; }
.visit-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.visit-head h2{ font-family:var(--font-display); font-weight:600; font-size:20px; letter-spacing:-.02em; }
.visit-head p{ margin:2px 0 0; color:var(--muted); font-size:14px; font-weight:600; }
.vchecks{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.vmove{ display:flex; flex-direction:column; gap:8px; margin:-4px 0 14px; padding:12px 14px; border-radius:14px; background:var(--surface-2); border:1px dashed var(--soir-line); }
.vmove > span{ font-weight:800; font-size:14px; }
.vcheck{ display:inline-flex; align-items:center; gap:9px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:999px; padding:8px 16px 8px 10px; font-weight:800; min-height:44px; }
.vbox{ width:22px; height:22px; border-radius:7px; border:2px solid var(--soir); display:grid; place-items:center; }
.vbox svg{ width:14px; height:14px; }
.vcheck[aria-pressed="true"]{ background:var(--soir-tint); border-color:var(--soir-line); }
.vcheck[aria-pressed="true"] .vbox{ background:var(--soir); color:var(--soir-on); }
.vweight{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 16px; margin-bottom:6px; }
.vweight .field{ width:140px; }
.delta{ margin:0 0 12px; font-weight:800; font-size:14px; }
.vhist{ margin:0 0 14px; font-size:13px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
.labs{ margin:0 0 14px; padding:12px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; }
.labs summary{ cursor:pointer; font-weight:800; display:flex; align-items:center; gap:10px; }
.labs[open] summary{ margin-bottom:8px; }
.labs .count{ font-size:13px; }
.vgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px; margin-bottom:10px; }
.vgrid .field span{ font-size:13px; }
.vitals{ margin:14px 0 6px; padding:14px; border-radius:16px; background:var(--surface-2); border:1px solid var(--line); }
.vsub{ display:flex; align-items:center; gap:4px; margin:0 0 10px; font-size:16px; font-weight:800; }
.bp-in{ display:flex; align-items:center; gap:6px; }
.vitals .vgrid{ grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
.vitals .vgrid > .field:first-child{ grid-column:1 / -1; max-width:340px; }
@media (max-width:520px){ .vitals .vgrid{ grid-template-columns:repeat(2, minmax(0,1fr)); } .vitals{ padding:12px; } }
.bp-in input{ width:0; flex:1 1 0; min-width:0; text-align:center; }
.bp-in span{ font-size:20px; font-weight:800; color:var(--muted); }
.vreads{ list-style:none; margin:4px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:8px; }
.vread{ --lv:var(--c-supp); display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); }
.vread.watch{ --lv:var(--c-kcal); } .vread.alert{ --lv:var(--accent); }
.vread.alert{ border-color:var(--accent-line); background:var(--accent-tint); }
.vdot{ flex:none; width:10px; height:10px; margin-top:6px; border-radius:50%; background:var(--lv); }
.vr-txt{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.vr-txt small{ font-size:12.5px; font-weight:600; color:var(--muted); line-height:1.35; }
.vbadge{ align-self:flex-start; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:800; color:var(--ink); background:color-mix(in srgb, var(--lv) 18%, transparent); border:1px solid color-mix(in srgb, var(--lv) 45%, transparent); }
.vcell.watch, .vcell.alert{ display:inline-block; padding:1px 7px; border-radius:7px; font-weight:800; color:var(--ink); }
.vcell.watch{ background:color-mix(in srgb, var(--c-kcal) 22%, transparent); } .vcell.alert{ background:var(--accent-tint); color:var(--accent-2); }
.lab-note{ font-size:12px; font-weight:600; color:var(--muted); line-height:1.3; }

/* Claude */
.claude{ border:1.5px solid var(--aprem-line); }
.claude .sec-head h2{ font-family:var(--font-display); font-weight:600; font-size:18px; }
.claude > .field{ margin-bottom:10px; }
.ask-opts{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:14px; }
.ask-area{ display:grid; gap:12px; }
.linkbtn{ display:inline-flex; align-items:center; text-decoration:none; color:var(--ink); }
.thinking{ margin:0; font-weight:700; color:var(--aprem); }
.answer{ padding:14px 16px; background:var(--aprem-tint); border:1px solid var(--aprem-line); border-radius:14px; max-width:68ch; overflow-wrap:anywhere; }
.answer h3{ font-size:16px; font-weight:800; margin:14px 0 4px; }
.answer h3:first-child,.answer .answer-meta + h3{ margin-top:0; }
.answer p{ margin:0 0 8px; }
.answer ul,.answer ol{ margin:0 0 8px; padding-left:22px; }
.answer li{ margin:2px 0; }
.answer-meta{ font-size:13px; font-weight:700; color:var(--muted); }
.ask-error{ margin:0; font-weight:700; color:var(--danger); }
.report-box{ margin-top:14px; }
.report-box summary{ cursor:pointer; font-weight:700; color:var(--muted); font-size:14px; padding:6px 0; }
.report-box .export{ margin-top:8px; font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:12.5px; line-height:1.45; }
.restore{ margin-top:14px; }

/* Accueil */
.hero{ margin-bottom:18px; }
.hero-top{ display:flex; flex-wrap:wrap; align-items:center; gap:12px 14px; }
.hero-txt{ flex:1 1 160px; min-width:0; }
.hero-txt .date{ overflow-wrap:anywhere; }
.hero-top .daynav{ margin-left:auto; }
.scene{ flex:none; display:block; width:40px; height:40px; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgb(0 0 0 / .08); }
.scene svg{ display:block; width:100%; height:100%; }
.hero-scene{ width:56px; height:56px; border-radius:17px; }
@media (max-width:480px){ .hero-scene{ width:46px; height:46px; border-radius:14px; } .hero-top{ gap:10px; } .eb-rel{ display:none; } }
@media (max-width:420px){ .mcount{ display:none; } }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .scene{ filter:brightness(.9) saturate(.92); } }
:root[data-theme="dark"] .scene{ filter:brightness(.9) saturate(.92); }
.eyebrow{ margin:0 0 2px; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-2); }
.hero .strip{ margin:16px 0 0; }
.tiles{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-bottom:18px; }
@media (min-width:620px){ .tiles{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
@media (min-width:1180px){ .tiles{ grid-template-columns:repeat(6, minmax(0,1fr)); } }
.tile{ display:flex; align-items:center; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:18px; text-align:left; min-width:0; box-shadow:var(--shadow); }
.tile .ring{ width:48px; height:48px; background:conic-gradient(var(--c, var(--fill)) calc(var(--p) * 1turn), var(--bub) 0); }
.tile .ring span{ width:36px; height:36px; font-size:12px; }
.tile .ring span svg{ width:18px; height:18px; color:var(--c, var(--fill)); }
.tile-txt{ min-width:0; display:flex; flex-direction:column; line-height:1.25; }
.tile-txt b{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile-txt span{ font-size:13px; font-weight:700; color:var(--muted); }
.tile-txt .t-short{ display:none; }
.tile .face{ font-size:24px; }
.c-kcal{ --c:var(--fill); } .c-p{ --c:var(--soir); } .c-g{ --c:var(--matin); } .c-l{ --c:var(--aprem); }

.wdot.done .dotc{ background:var(--sport); box-shadow:none; }

.track.c-sport i{ background:var(--sport); }
.plan-name{ margin:0 0 2px; font-family:var(--font-display); font-weight:600; font-size:20px; letter-spacing:-.01em; }
.steps-row{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 14px; margin-bottom:12px; }

.chips button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.field.grow{ flex:1 1 160px; }
.food-list li.tpl-edit{ display:block; padding:0; border:0; background:transparent; }
.note.muted{ color:var(--muted); }

/* Séance en direct */
.live-start{ display:flex; flex-wrap:wrap; align-items:center; gap:14px 16px; padding:16px 18px; margin-bottom:22px; border-radius:22px; background:var(--accent-tint); border:1px solid var(--accent-line); }
.live-start-ico{ flex:none; width:48px; height:48px; border-radius:15px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; }
.live-start-ico svg{ width:28px; height:28px; }
.ls-txt{ flex:1 1 220px; min-width:0; }
.ls-txt h2{ font-size:20px; font-weight:800; letter-spacing:-.01em; }
.ls-txt p{ margin:2px 0 0; color:var(--muted); font-weight:600; font-size:14.5px; }
.live{ margin-bottom:26px; border-radius:24px; overflow:hidden; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); }
.live-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; background:var(--accent); color:var(--on-accent); }
.live-id{ display:flex; align-items:center; gap:12px; min-width:0; }
.live-id h2{ font-size:17px; font-weight:800; }
.live-since{ display:block; font-size:13px; font-weight:700; opacity:.85; }
.live-dot{ flex:none; width:10px; height:10px; border-radius:50%; background:currentColor; animation:livepulse 1.6s ease-in-out infinite; }
@keyframes livepulse{ 50%{ opacity:.3; } }
@media (prefers-reduced-motion: reduce){ .live-dot{ animation:none; } }
.live-clock{ font-family:var(--font-display); font-size:clamp(34px, 9vw, 52px); font-weight:600; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums; }
.live-body{ display:flex; flex-direction:column; gap:16px; padding:16px 18px 18px; }
.rest{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:18px; background:var(--surface-2); border:1px solid var(--line); }
#live, #sec-sport, #sec-chrono{ scroll-margin-top:calc(env(safe-area-inset-top, 0px) + 72px); }
.rest-side{ flex:1; min-width:0; display:grid; align-items:center; }
.rest-side > *{ grid-area:1 / 1; }
.rest-ghost{ visibility:hidden; pointer-events:none; }
.rest-idle{ display:flex; flex-direction:column; gap:10px; }
.rest-idle .chips{ display:grid; grid-template-columns:repeat(auto-fit, minmax(76px, 1fr)); }
.rest-ring.idle{ background:var(--bub); }
.rest-ring.idle b{ color:var(--muted); }
.rest .chips button{ min-height:44px; padding:6px 8px; font-size:15px; }
.rest.on{ background:var(--accent-tint); border-color:var(--accent-line); }
.rest-ring{ --p:1; flex:none; width:124px; height:124px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--bub) 0); display:grid; place-items:center; }
.rest-ring > span{ width:104px; height:104px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.rest-ring small{ font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.rest-ring b{ font-family:var(--font-display); font-size:32px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; }
.rest-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.rest-actions button{ min-height:50px; font-size:16px; padding:10px 12px; white-space:nowrap; }
.rest-actions .primary{ grid-column:1 / -1; }
@media (max-width:380px){
  .rest{ gap:10px; padding:10px; } .rest-ring{ width:92px; height:92px; } .rest-ring > span{ width:78px; height:78px; } .rest-ring small{ font-size:10px; letter-spacing:.02em; } .rest-ring b{ font-size:24px; }
  .rest-idle .chips{ grid-template-columns:1fr 1fr; } .rest .chips button{ padding:4px 2px; font-size:14px; }
  .rest-actions button{ padding:8px 4px; font-size:14px; }
  .field > .seg{ width:100%; } .field > .seg button{ padding:8px 6px; }
}
@media (max-width:370px){ .sync{ font-size:0; gap:0; } }
.switch.small{ font-size:14px; color:var(--muted); }
.exo-tabs button{ min-height:44px; font-size:15px; }
.exo-tabs .n{ display:inline-grid; place-items:center; min-width:22px; height:22px; margin-left:4px; padding:0 6px; border-radius:999px; background:var(--accent); color:var(--on-accent); font-size:12px; font-variant-numeric:tabular-nums; }
.exo-tabs .add{ border-style:dashed; }
.exo-add{ display:flex; flex-direction:column; gap:10px; }
.exo-add .row{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px; }
.exo-add .row .primary{ min-height:46px; }
.exo{ display:flex; flex-direction:column; gap:12px; padding:14px; border-radius:18px; border:1px solid var(--line); background:var(--surface-2); }
.exo-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
.exo-head h3{ font-family:var(--font-display); font-size:21px; font-weight:600; letter-spacing:-.01em; }
.sets{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.sets li{ display:flex; align-items:center; gap:12px; padding:8px 8px 8px 10px; border-radius:12px; background:var(--surface); border:1px solid var(--line); }
.sets .sn{ flex:none; width:30px; height:30px; border-radius:50%; background:var(--accent-tint); color:var(--accent-2); font-weight:800; display:grid; place-items:center; font-variant-numeric:tabular-nums; }
.sets .sv{ flex:1; min-width:0; font-weight:700; font-variant-numeric:tabular-nums; }
.set-form{ display:flex; flex-direction:column; gap:12px; }
.steps{ display:flex; flex-wrap:wrap; gap:12px 18px; }
.stepper span small, .field span small{ font-weight:600; color:var(--muted); }
.step{ display:flex; align-items:center; gap:8px; }
.step .icon{ width:52px; height:52px; font-size:26px; font-weight:700; line-height:1; }
.step input{ width:92px; min-height:52px; text-align:center; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:6px; }
.step input::placeholder{ font-size:12px; font-weight:600; }
.chips.rir button{ min-width:48px; min-height:46px; font-size:16px; }
.chrono{ display:flex; align-items:center; gap:10px; min-height:52px; }
.chrono b{ font-family:var(--font-display); font-size:26px; font-weight:600; min-width:74px; font-variant-numeric:tabular-nums; }
.wide{ width:100%; }
.live-foot{ display:flex; flex-direction:column; gap:10px; }
.finish{ display:flex; flex-direction:column; gap:14px; }
.finish h3{ font-size:20px; font-weight:800; }
.livebar{ position:fixed; z-index:25; left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom, 0px)); display:inline-flex; align-items:center; gap:9px; max-width:calc(100% - 32px); padding:11px 18px; border:0; border-radius:999px; background:var(--accent); color:var(--on-accent); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; box-shadow:0 8px 24px rgba(26,20,23,.22); white-space:nowrap; }
@media (min-width:1000px){ .livebar{ left:calc(50% + 50px); bottom:calc(24px + env(safe-area-inset-bottom, 0px)); } }

/* Profils */
.avatar{ --pc:var(--accent); --pco:var(--on-accent); flex:none; width:30px; height:30px; border-radius:50%; display:inline-grid; place-items:center; background:var(--pc); color:var(--pco); font-weight:800; font-size:14px; line-height:1; }
.avatar.big{ width:46px; height:46px; font-size:19px; }
.c1{ --pc:var(--soir); --pco:var(--soir-on); } .c2{ --pc:var(--midi); --pco:var(--midi-on); } .c3{ --pc:var(--aprem); --pco:var(--aprem-on); } .c4{ --pc:var(--matin); --pco:var(--matin-on); }
.who{ display:inline-flex; align-items:center; gap:8px; min-width:0; max-width:42vw; min-height:40px; padding:4px 13px 4px 4px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); font-weight:800; font-size:14px; }
.who-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width:370px){ .who-name{ display:none; } .who{ padding-right:4px; } }
.avatar{ display:inline-flex; align-items:center; justify-content:center; aspect-ratio:1 / 1; align-self:center; overflow:hidden; position:relative; text-align:center; }
.avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.avatar.ph{ background:var(--surface-2); box-shadow:0 0 0 2px var(--pc); }
.avatar.em, .emo{ font-family:"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-weight:400; line-height:1; }
.avatar.em{ background:color-mix(in srgb, var(--pc) 22%, var(--surface)); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--pc) 55%, transparent); font-size:18px; }
.avatar.big{ width:56px; height:56px; font-size:23px; }
.avatar.big.em{ font-size:30px; }
.avatar.xl{ width:92px; height:92px; font-size:38px; }
.avatar.xl.em{ font-size:50px; }
.avatar.xl.ph{ box-shadow:0 0 0 3px var(--surface), 0 0 0 6px var(--pc); }
.avatar.plus{ --pc:var(--surface-2); --pco:var(--muted); border:2px dashed var(--line); font-size:28px; font-weight:600; }
.pf-hero{ display:flex; flex-wrap:wrap; align-items:center; gap:14px 18px; padding:18px; border-radius:22px; background:color-mix(in srgb, var(--pc) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--pc) 30%, var(--line)); }
.pf-hero.c0{ --pc:var(--accent); }
.pf-hero-txt{ flex:1 1 180px; min-width:0; }
.pf-hero-txt .eyebrow{ color:var(--muted); }
.pf-hero-txt h2{ margin:0; font-family:var(--font-display); font-size:28px; font-weight:600; letter-spacing:-.02em; overflow-wrap:anywhere; }
.pf-hero-txt p:last-child{ margin:4px 0 0; font-size:14px; font-weight:600; color:var(--muted); }
.pf-sub{ margin:24px 0 10px; }
.pf-grid{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; }
.profile{ display:flex; flex-direction:column; gap:6px; padding:6px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); min-width:0; }
.profile.on{ border-color:var(--accent-line); background:var(--accent-tint); }
.profile.add{ background:transparent; border-style:dashed; }
.pf-tile{ display:flex; align-items:center; gap:12px; width:100%; min-height:72px; padding:8px 10px; border:0; border-radius:15px; background:transparent; color:var(--ink); text-align:left; font:inherit; }
button.pf-tile:hover{ background:color-mix(in srgb, var(--ink) 5%, transparent); }
.pf-txt{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
.pf-txt b{ font-size:17px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pf-txt span{ font-size:13px; font-weight:600; color:var(--muted); }
.pf-mod{ align-self:flex-start; margin:-4px 0 4px 78px; min-height:32px; }
.pill.on{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.pf-new{ display:flex; flex-direction:column; gap:10px; padding:10px; }
.pf-edit{ display:flex; flex-direction:column; gap:14px; margin:12px 0 0; padding:16px; border-radius:18px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); }
.profile .pf-edit{ margin:0 0 4px; }
.pf-edit-top{ display:flex; flex-wrap:wrap; align-items:center; gap:14px 18px; }
.pf-photo-btns{ flex:1 1 180px; display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.emoji-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(46px, 1fr)); gap:6px; }
.emo{ height:46px; border:1px solid var(--line); border-radius:14px; background:var(--surface-2); font-size:24px; line-height:1; padding:0; }
.emo[aria-pressed="true"]{ background:var(--accent-tint); border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }
.pf-colors .swatch{ width:40px; height:40px; min-height:40px; padding:0; border-radius:50%; background:var(--pc); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--line); }
.pf-colors .swatch.c0{ --pc:var(--accent); }
.chips.pf-colors .swatch[aria-pressed="true"]{ background:var(--pc); border-color:var(--surface); box-shadow:0 0 0 3px var(--ink); }

/* Chrono */
.chrono-card .card-head{ flex-wrap:wrap; }
.chrono-card .card-head .seg{ margin-left:auto; }
.chr-face{ display:flex; justify-content:center; padding:8px 0 14px; }
.chr-time{ font-family:var(--font-display); font-weight:600; font-size:clamp(46px, 13vw, 64px); letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums; }
.chr-btns{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
.chr-btns .big{ flex:1 1 140px; max-width:240px; }
.laps{ list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto; }
.laps li{ display:flex; align-items:baseline; gap:12px; padding:8px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-variant-numeric:tabular-nums; }
.laps li span{ flex:1; font-weight:700; }
.laps li b{ font-size:18px; font-weight:800; }
.laps li small{ color:var(--muted); font-weight:600; min-width:64px; text-align:right; }
.laps li.best{ border-color:var(--accent-line); background:var(--accent-tint); }
.bpm-row{ display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr); gap:6px 10px; align-items:end; }
.bpm-row .field input{ width:100%; }
.bpm-ico{ width:40px; height:44px; display:grid; place-items:center; color:var(--accent); }
.bpm-ico svg{ width:26px; height:26px; }
.bpm-ico.sm{ display:inline-grid; width:18px; height:18px; vertical-align:-3px; margin-right:4px; }
.bpm-ico.sm svg{ width:16px; height:16px; }
.bpm-hint{ grid-column:1 / -1; margin:0; }
.bpm-note{ color:var(--accent-2); font-weight:700; }
.add-sheet{ display:flex; flex-direction:column; gap:12px; margin-top:14px; padding:14px; border-radius:16px; background:var(--accent-tint); border:1px solid var(--accent-line); }
.add-sheet h3{ font-size:17px; font-weight:800; }
.add-sheet .actions .big{ flex:1 1 220px; }
.chr-done{ margin:4px 0 12px; font-weight:800; font-size:17px; }
.step-out{ display:inline-grid; place-items:center; width:92px; min-height:52px; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; border-radius:14px; border:1px solid var(--line); background:var(--surface); }
.chrono-card .steps{ margin:12px 0 10px; }
.chrono-card > .chips{ margin-bottom:4px; }
.it-face{ --ph:var(--accent); display:flex; justify-content:center; padding:6px 0 16px; }
.it-face[data-phase="rest"]{ --ph:var(--soir); }
.it-ring{ --p:1; width:220px; height:220px; max-width:100%; border-radius:50%; background:conic-gradient(var(--ph) calc(var(--p) * 1turn), var(--bub) 0); display:grid; place-items:center; }
.it-ring > span{ width:188px; height:188px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }

.it-ring small:first-child{ color:var(--ph); font-size:15px; }
.it-ring .chr-time{ font-size:52px; }

/* Premiers pas, sauvegarde */
.first-steps{ margin-bottom:18px; }
.fs-list{ list-style:none; margin:0 0 6px; padding:0; display:flex; flex-direction:column; gap:8px; }
.fs-list button{ width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px; min-height:56px; border-radius:14px; border:1px solid var(--line); background:var(--surface-2); text-align:left; }
.fs-list .ck{ flex:none; width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; color:var(--on-accent); }
.fs-list .ck svg{ width:15px; height:15px; }
.fs-list li.done .ck{ background:var(--accent); border-color:var(--accent); }

.fs-txt{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
.fs-txt b{ font-weight:800; }
.fs-txt small{ color:var(--muted); font-weight:600; font-size:13.5px; }

.banner.backup{ border:1.5px solid var(--matin-line); background:var(--matin-tint); }
.banner.backup .mico{ background:var(--matin); color:var(--matin-on); }
.last-backup{ margin:0 0 10px; font-weight:700; font-size:14px; color:var(--ink); }

/* Mes moyennes */
.bilan-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:10px; }
.bilan-nav{ display:flex; align-items:center; gap:8px; min-width:0; }
.bilan-label{ font-weight:800; font-size:16px; min-width:0; text-align:center; }

.bilan-tiles{ margin:6px 0 20px; grid-template-columns:repeat(2, minmax(0,1fr)); }

.bilan-tiles .stat{ position:relative; }
.delta{ display:inline-block; margin-top:4px; font-style:normal; font-size:12.5px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
.delta.same{ color:var(--muted); font-weight:700; }
.bcharts{ display:grid; gap:22px 26px; }
@media (min-width:720px){ .bcharts{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
.bfig{ margin:0; min-width:0; }
.bfig figcaption{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:2px 10px; margin-bottom:6px; }
.bfig figcaption b{ font-weight:800; font-size:16px; }
.bfig figcaption span{ font-size:13.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
.bchart{ min-height:140px; position:relative; }
.bchart svg{ display:block; }
.adh{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }

.adh li{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) auto; align-items:center; gap:10px; }
.adh-name{ font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.adh-bar{ height:10px; border-radius:5px; background:var(--bub); overflow:hidden; }
.adh-bar i{ display:block; height:100%; border-radius:5px; background:var(--m); }
.adh-val{ font-weight:800; font-variant-numeric:tabular-nums; font-size:14px; min-width:72px; text-align:right; }
.adh-val small{ color:var(--muted); font-weight:600; }
.dgroup.dossier{ border-color:var(--accent-line); background:var(--accent-tint); }
.dossier-meta{ margin:10px 0 12px; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; }

/* Messages */
.toast-wrap{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:0 16px calc(88px + env(safe-area-inset-bottom, 0px)); pointer-events:none; }
@media (min-width:1000px){ .toast-wrap{ padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px)); left:100px; } }
#toast{ background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-weight:700; font-size:15px; opacity:0; transform:translateY(12px); transition:opacity .18s ease, transform .18s ease; max-width:100%; text-align:center; }
#toast.show{ opacity:1; transform:none; }

<script>
(() => {
  'use strict';

  /* ---------- Réglages techniques ---------- */

  const todayKey = () => toKey(new Date());
  const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); };

    for (let i = 0; i < 30 && out.length < 8; i++) {
      const d = peekDay(addDays(k, -i));
      if (!d) continue;
      listOf(d.meals).slice().sort(byTime).reverse().forEach((m) => mealItems(m).forEach((it) => {
        const n = norm(it.name);
        if (!n || seen.has(n) || out.length >= 8) return;
        seen.add(n);
        out.push(it);
      }));
    }
    return out;
  }

  /* Repas notés ces 30 derniers jours, sans doublon (mêmes aliments, même description) : « Refaire un repas ».
     Ceux du même type (déjeuner…) d'abord. */
  function recentMeals(k, kind) {
    const seen = new Set(), out = [];
    for (let i = 0; i < 30 && out.length < 12; i++) {
      const dk = addDays(k, -i), d = peekDay(dk);
      if (!d) continue;
      listOf(d.meals).slice().sort(byTime).reverse().forEach((m) => {
        const items = mealItems(m);
        if (!items.length && !str(m.text).trim()) return;
        const sig = items.map((it) => norm(it.name)).sort().join('|') + '#' + norm(m.text);
        if (seen.has(sig)) return;
        seen.add(sig);
        out.push({ ref: `${dk}|${m.id}`, m, items });
      });
    }
    return out.sort((a, b) => (b.m.kind === kind) - (a.m.kind === kind)).slice(0, 4);
  }
  const mealLabel = (r) => {
    const names = r.items.map((it) => it.name), t = sumMacros(r.items);
    const what = names.length ? names.slice(0, 3).join(', ') + (names.length > 3 ? '…' : '') : str(r.m.text).slice(0, 40);
    return `${str(r.m.kind) || 'Repas'} · ${what}${t.n ? ` · ${fmtInt(t.kcal)} kcal` : ''}`;
  };

  /* ---------- Enregistrement ----------
     Mode « local » : pas de compte Claude, tout reste dans ce navigateur (LS_KEY).
     Mode « cloud » : un document « settings » et un document par mois (« m2026-09 ») dans data/users/<id>.
     Chaque modification note le jour et le champ touchés (« taken:<id> », « notes »… ou « * » pour le jour entier) :
     seuls ces champs partent en ligne, pour ne pas écraser ce qu'un autre appareil écrit en même temps.
     Tant qu'ils ne sont pas confirmés, ils restent aussi dans la copie de l'appareil (CACHE_KEY) :
     hors ligne ou page fermée trop tôt, ils repartent au prochain chargement. Cette copie sert aussi
     à afficher tes données tout de suite, avant la réponse du compte. */
  const store = {
    mode: 'local', online: false, connecting: false, stopped: false, failed: false,
    col: null, uid: null, downloads: null, sample: null, sampleImages: null, unsub: null,
    trusted: true,        // false : la liste affichée n'est pas (encore) celle du compte
    dirty: new Set(), inflight: new Set(), again: new Set(), timers: {}, last: {}, refs: {},
    dirtyDays: {},        // { 'm2026-09': { '2026-09-26': { 'taken:abc': true, notes: true } } }
    writingDays: {},      // la même chose, pour les écritures en cours
    setKeys: new Set(),   // réglages : clés modifiées ici (« supplements », « goals »… ou « * » pour tout)
    writingKeys: new Set(),
    connectTry: 0, connectTimer: null, retryTry: 0, retryTimer: null, lsTimer: null, status: null,
    gen: 0, db: null, uid0: null // gen change à chaque changement de profil ; db et uid0 : le compte, gardés d'un profil à l'autre
  };

  function lsGet(key) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function lsSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } }

  function addFields(target, src) {
    if (!isObj(src)) return target;
    Object.keys(src).forEach((dk) => {
      if (!isKey(dk) || !isObj(src[dk])) return;
      const t = target[dk] || (target[dk] = {});
      Object.keys(src[dk]).forEach((f) => { t[f] = true; });
    });
    return target;
  }
  function touchDay(k, field = '*') {
    if (store.mode !== 'cloud') return;
    addFields(store.dirtyDays[monthDocId(k)] || (store.dirtyDays[monthDocId(k)] = {}), { [k]: { [field]: true } });
  }
  function pendingFields(docId, dk) {
    const a = store.dirtyDays[docId] && store.dirtyDays[docId][dk];
    const b = store.writingDays[docId] && store.writingDays[docId][dk];
    return a || b ? Object.assign({}, a, b) : null;

  function pendingSnapshot() {
    const days = {};
    new Set([...Object.keys(store.dirtyDays), ...Object.keys(store.writingDays)]).forEach((id) => {

      if (Object.keys(m).length) days[id] = m;
    });
    const keys = [...new Set([...store.setKeys, ...store.writingKeys])];
    return { settings: store.dirty.has('settings') || store.inflight.has('settings') ? (keys.length ? keys : ['*']) : false, days };
  }

  function persistNow() {
    clearTimeout(store.lsTimer); store.lsTimer = null;
    if (!S.settings) return true;
    if (store.mode === 'local') {
      store.failed = !lsSet(lsKey(), { settings: S.settings, months: S.months });
      refreshSync();
      return !store.failed;
    }
    if (!store.uid) return false;
    return lsSet(cacheKey(), { v: 1, uid: store.uid, trusted: store.trusted, settings: S.settings, months: S.months, pending: pendingSnapshot() });
  }
  function persistSoon() { clearTimeout(store.lsTimer); store.lsTimer = setTimeout(persistNow, LOCAL_DELAY); }

  const SYNC = {
    loading: ['Chargement…', 'var(--muted)', ''],
    saved: ['Enregistré', 'var(--fill)', 'Enregistré sur ton compte Claude.'],
    saving: ['Enregistrement…', 'var(--matin)', ''],
    local: ['Sur cet appareil', 'var(--muted)', 'Enregistré sur cet appareil uniquement.'],
    localOffline: ['Hors ligne', 'var(--muted)', 'Pas de réseau : tout est enregistré sur cet appareil. Envoie ta journée à Claude quand tu retrouves du réseau.'],
    offline: ['Hors ligne', 'var(--matin)', 'Pas de connexion à ton compte Claude pour l’instant. Tes modifications sont gardées sur cet appareil et partiront dès que possible.'],
    error: ['Pas enregistré en ligne', 'var(--danger)', 'L’enregistrement en ligne a échoué. Tes modifications sont gardées sur cet appareil et repartiront au prochain essai.'],
    localError: ['Pas enregistré', 'var(--danger)', 'L’appareil refuse d’enregistrer (stockage plein ou bloqué). Fais une sauvegarde depuis Réglages.']
  };
  function syncState() {
    if (store.mode === 'local') return !S.ready ? 'loading' : store.failed ? 'localError' : navigator.onLine === false ? 'localOffline' : 'local';
    if (store.stopped) return 'error';
    if (!store.online) return store.connectTry ? 'offline' : 'loading';
    if (store.failed) return 'error';
    return store.dirty.size || store.inflight.size ? 'saving' : 'saved';
  }
  function refreshSync() {
    const st = syncState();
    if (st === store.status) return;
    store.status = st;
    const el = document.getElementById('sync');
    const [label, dot, title] = SYNC[st];
    el.textContent = label;
    el.style.setProperty('--dot', dot);
    el.title = title;
  }

  function markDirty(docId) {
    if (store.mode === 'local') { persistSoon(); return; }
    store.dirty.add(docId);
    persistSoon();
    if (store.online && !store.stopped) {
      clearTimeout(store.timers[docId]);
      store.timers[docId] = setTimeout(() => flush(docId), SAVE_DELAY);
    }
    refreshSync();
  }
  function docData(docId) {
    if (docId === 'settings') return clone(S.settings);
    const month = S.months[docId.slice(1)];
    return clone({ days: (month && isObj(month.days) && month.days) || {} });
  }
  /* Réglages : seulement les parties modifiées ; en entier la première fois (ou après une restauration). */
  async function writeSettings(ref, full, keys) {
    if (!keys || !keys.size || keys.has('*') || store.last.settings == null) return ref.set(full);
    const part = {};
    keys.forEach((key) => { if (key in full) part[key] = full[key]; });
    if (!Object.keys(part).length) return undefined;
    try { return await ref.update(part); } catch (e) { if (e && e.code === 'invalid_argument') return ref.set(full); throw e; }
  }
  /* Seuls les champs modifiés partent ; si le mois n'existe pas encore en ligne, on l'écrit en entier. */
  async function writeMonth(ref, full, writing) {
    const days = {};
    Object.keys(writing).forEach((dk) => {
      const day = full.days[dk], fields = writing[dk];
      if (!isObj(day)) return;
      if (fields['*']) { days[dk] = day; return; }
      const out = {};
      Object.keys(fields).forEach((f) => {
        if (f.startsWith('taken:')) {
          const sid = f.slice(6);
          (out.taken || (out.taken = {}))[sid] = !!(isObj(day.taken) && day.taken[sid]);
        } else if (f in day) out[f] = day[f];
      });
      days[dk] = out;
    });
    if (!Object.keys(days).length) return;
    try {
      await ref.update({ days });
    } catch (e) {
      if (!e || e.code !== 'invalid_argument') throw e;
      const snap = await ref.get();
      if (snap.exists) throw e;
      await ref.set(full);
    }

  async function withOneRetry(fn) {

      return fn();
    }
  }
  function onWriteError(e) {

    if (code === 'revoked') { stopSync(); return; }
    if (code === 'quota_exceeded') { toast('Plus de place pour enregistrer en ligne. Tes données restent sur cet appareil.'); return; }
    if (code === 'invalid_argument' || code === 'transform_error') return;
    scheduleRetry();
  }
  function scheduleRetry() {
    if (store.retryTimer || store.stopped) return;

    store.retryTimer = setTimeout(() => { store.retryTimer = null; flushAll(); }, delay);
  }

  async function flush(docId) {
    const gen = store.gen;

    if (store.mode !== 'cloud' || !store.online || store.stopped) return;
    if (store.inflight.has(docId)) { store.again.add(docId); return; }
    if (!store.dirty.has(docId)) return;
    store.dirty.delete(docId);
    const isMonth = docId !== 'settings';
    const writing = store.dirtyDays[docId] || {};
    delete store.dirtyDays[docId];
    const keys = isMonth ? null : new Set(store.setKeys);
    if (keys) { store.setKeys.clear(); store.writingKeys = keys; }
    if (isMonth && !Object.keys(writing).length) { refreshSync(); return; }
    store.writingDays[docId] = writing;
    const full = docData(docId), sig = stable(full);
    const restore = () => { addFields(store.dirtyDays[docId] || (store.dirtyDays[docId] = {}), writing); if (keys) keys.forEach((key) => store.setKeys.add(key)); store.dirty.add(docId); };
    if (bytes(sig) > MAX_DOC_BYTES) {
      delete store.writingDays[docId];
      restore();
      store.failed = true;
      toast(isMonth ? 'Ce mois est trop long pour être enregistré en ligne. Raccourcis quelques notes.' : 'Ta liste est trop longue pour être enregistrée en ligne.');
      persistSoon(); refreshSync();
      return;
    }

    refreshSync();
    const ref = store.col.doc(docId);
    let error = null;
    try {
      await withOneRetry(() => (isMonth ? writeMonth(ref, full, writing) : writeSettings(ref, full, keys)));
    } catch (e) { error = e || { code: 'unavailable' }; }

    store.inflight.delete(docId);

    if (keys) store.writingKeys = new Set();
    if (error) { restore(); onWriteError(error); }
    else { store.last[docId] = sig; store.failed = false; store.retryTry = 0; }
    persistSoon();

    refreshSync();
  }
  function flushAll() {
    if (store.mode === 'local') { if (store.lsTimer) persistNow(); return; }
    [...store.dirty].forEach(flush);
    persistNow();
  }

  function applyRemoteDoc(id, data) {
    if (id === 'settings') S.settings = normalizeSettings(data);
    else if (MONTH_DOC.test(id)) S.months[id.slice(1)] = { days: isObj(data && data.days) ? data.days : {} };
  }
  /* Un mois modifié ici pendant qu'un autre appareil écrit : on prend ses jours et ses champs, sauf ceux qu'on est en train d'envoyer. */
  function mergeBusyMonth(id, remoteDays) {
    const mk = id.slice(1);
    const month = S.months[mk] || (S.months[mk] = { days: {} });
    if (!isObj(month.days)) month.days = {};
    const local = month.days;
    let changed = false;
    Object.keys(remoteDays).forEach((dk) => {
      const rd = remoteDays[dk], pend = pendingFields(id, dk);
      if (!pend) {
        if (stable(rd) !== stable(local[dk])) { local[dk] = rd; changed = true; }
        return;
      }
      if (pend['*'] || !isObj(rd)) return;
      const ld = isObj(local[dk]) ? local[dk] : (local[dk] = {});
      Object.keys(rd).forEach((field) => {
        if (field === 'taken') {
          const rt = isObj(rd.taken) ? rd.taken : {};
          if (!isObj(ld.taken)) ld.taken = {};
          Object.keys(rt).forEach((sid) => {
            if (pend['taken:' + sid] || ld.taken[sid] === rt[sid]) return;
            ld.taken[sid] = rt[sid]; changed = true;
          });
          return;
        }
        if (pend[field] || stable(rd[field]) === stable(ld[field])) return;
        ld[field] = rd[field]; changed = true;
      });
    });
    return changed;
  }
  /* Réglages modifiés ici pendant qu'un autre appareil en change d'autres : on prend les siens, sauf nos parties en cours. */
  function mergeBusySettings(data) {
    const pend = new Set([...store.setKeys, ...store.writingKeys]);
    if (!pend.size || pend.has('*')) return false;
    const merged = clone(S.settings);
    let changed = false;
    Object.keys(data).forEach((key) => {
      if (pend.has(key) || stable(data[key]) === stable(merged[key])) return;
      merged[key] = data[key]; changed = true;
    });
    if (changed) S.settings = normalizeSettings(merged);
    return changed;
  }
  function onRemote(snap) {
    let changed = false;
    snap.docs.forEach((ds) => {
      if (!ds.exists) return;
      const raw = ds.data();
      if (store.refs[ds.id] === raw) return; // document inchangé depuis la dernière livraison
      store.refs[ds.id] = raw;
      const id = ds.id, data = clone(raw) || {}, sig = stable(data);
      if (id === 'profiles') { changed = mergeCloudProfiles(data.list) || changed; return; } // liste des profils (autre appareil)
      const busy = store.dirty.has(id) || store.inflight.has(id) || !!store.timers[id];
      if (!busy) {
        if (sig === store.last[id]) return;
        store.last[id] = sig;
        applyRemoteDoc(id, data);
        changed = true;
      } else if (MONTH_DOC.test(id) && isObj(data.days)) {
        changed = mergeBusyMonth(id, data.days) || changed;
      } else if (id === 'settings') {

  /* Remet par-dessus les données du compte ce qui a été modifié sur l'appareil et pas encore envoyé. */
  function copyFields(dk, src, fields) {
    const day = ensureDay(dk);
    if (fields['*']) { S.months[monthKey(dk)].days[dk] = clone(src); return; }
    Object.keys(fields).forEach((f) => {
      if (f.startsWith('taken:')) { const sid = f.slice(6); day.taken[sid] = !!(isObj(src.taken) && src.taken[sid]); }
      else if (f in src) day[f] = clone(src[f]);

    snap.docs.forEach((ds) => {
      if (!ds.exists) return;
      const raw = ds.data(), data = clone(raw) || {};

      const src = before.settings ? before

      S.settings = src.settings;
      store.dirty.add('settings'); store.setKeys.add('*');
      Object.keys(src.months).forEach((mk) => {

        Object.keys(src.months[mk].days || {}).forEach((dk) => touchDay(dk));
      });
    } else if (before.settings && before.trusted && store.dirty.has('settings')) {
      // modifié ici hors ligne : nos parties modifiées, celles du compte pour le reste
      if (!store.setKeys.size || store.setKeys.has('*')) S.settings = before.settings;
      else {
        const merged = clone(S.settings);
        store.setKeys.forEach((key) => { if (key in before.settings) merged[key] = clone(before.settings[key]); });
        S.settings = normalizeSettings(merged);
      }

      store.dirty.delete('settings');

    Object.keys(store.dirtyDays).forEach((docId) => {
      const month = before.months[docId.slice(1)];
      Object.keys(store.dirtyDays[docId]).forEach((dk) => {

  function scheduleConnect() {
    if (store.connectTimer || store.stopped) return;

  }
  async function connect() {

    const gen = store.gen;
    let snap = null, error = null;
    try { snap = await withTimeout(store.col.get(), GET_TIMEOUT, null); } catch (e) { error = e; }
    if (gen !== store.gen) return;

  function startLocal() {
    store.mode = 'local';
    if (localData && localData.settings) { S.settings = normalizeSettings(localData.settings); S.months = sanitizeMonths(localData.months); }

    scheduleReminders();

  function startFromCache(cache) {

    if (p.settings) { store.dirty.add('settings'); (Array.isArray(p.settings) && p.settings.length ? p.settings : ['*']).forEach((key) => store.setKeys.add(String(key))); }
    if (isObj(p.days)) Object.keys(p.days).forEach((docId) => {
      if (!MONTH_DOC.test(docId)) return;
      const days = addFields({}, p.days[docId]);

    });

  /* Le compte ne répond pas et l'appareil n'en a pas de copie : on montre les données locales ou la liste de départ. */
  function startOffline() {
    if (S.ready) return;
    const base = localData && localData.settings ? localData : null;
    S.settings = base ? normalizeSettings(base.settings) : freshSettings();
    S.months = base ? sanitizeMonths(base.months) : {};
    store.trusted = false;
    S.ready = true;
    render();
  }

  async function getCapabilities() {
    const none = { db: null, downloads: null, sample: null, uid: null };
    const claude = window.claude;
    if (!claude || typeof claude.use !== 'function') return none;
    const use = (name) => Promise.resolve().then(() => claude.use(name)).catch(() => null);
    try {
      const [db, user, downloads, sample] = await withTimeout(Promise.all([use('db'), use('user'), use('downloads'), use('sample')]), CAPS_TIMEOUT, [null, null, null, null]);
      const uid = user && typeof user.id === 'function' ? await withTimeout(user.id().catch(() => null), 5000, null) : null;
      return { db, downloads, sample: typeof sample === 'function' ? sample : null, uid };
    } catch (e) { return none; }
  }
  async function init() {
    refreshSync();
    const caps = await getCapabilities();

    store.sample = caps.sample;
    if (store.sample && typeof store.sample.limits === 'function') {
      store.sample.limits().then((l) => { store.sampleImages = (l && l.images) || null; if (S.ready && store.sampleImages) safeRender(); }).catch(() => {});
    }
    store.db = caps.db && caps.uid ? caps.db : null;
    store.uid0 = store.db ? caps.uid : null;
    startProfile();

  }
  /* Démarre le profil affiché : ses données sur l'appareil, puis celles du compte s'il y en a un. */
  function startProfile() {
    localData = lsGet(lsKey());
    S.live = loadLive();
    S.chrono = loadChrono();
    if (!store.db) { startLocal(); return; }
    try { store.col = store.db.collection(profileCollection(store.uid0)); } catch (e) { startLocal(); return; }
    store.mode = 'cloud';
    store.uid = store.uid0;
    const cache = lsGet(cacheKey());
    if (isObj(cache) && cache.uid === store.uid && isObj(cache.settings)) startFromCache(cache);
    refreshSync();
    connect();

  /* ---------- Accueil en onglets ----------
     L'accueil tient sur un écran : l'aperçu montre l'essentiel et ce qu'il y a à faire maintenant,

  const UI_KEY = 'mon-suivi-ui-v1';
  const uiPrefs = (() => { const v = lsGet(UI_KEY); return isObj(v) ? v : {}; })();
  const homeTabs = () => uiPrefs.home !== 'page';
  /* Thème : celui de l'appareil (par défaut), ou clair / sombre imposé ici. Dans l'artefact, « Système » laisse faire claude.ai. */
  let themeSet = false;
  function applyTheme() {
    const t = uiPrefs.theme, root = document.documentElement;
    if (t === 'light' || t === 'dark') { root.setAttribute('data-theme', t); themeSet = true; }
    else if (themeSet) { root.removeAttribute('data-theme'); themeSet = false; }
  }
  applyTheme();
  // clé, libellé, icône, libellé court (téléphone)
  const DAY_TABS = [['apercu', 'Aperçu', 'grid'], ['visite', 'Visite', 'visit'], ['supps', 'Compléments', 'pill'], ['repas', 'Eau et repas', 'bowl', 'Repas'], ['journal', 'Journal', 'smile'], ['claude', 'Claude', 'spark']];
  // L'onglet où vit chaque section (pour les anneaux, les rappels et les formulaires).
  const SECTION_TAB = { 'sec-supps': 'supps', 'sec-water': 'repas', 'sec-meals': 'repas', 'sec-sleep': 'journal', 'sec-checkins': 'journal', 'sec-symptoms': 'journal', 'sec-notes': 'journal', claude: 'claude', visit: 'visite' };
  const FORM_TAB = { checkin: 'journal', symptom: 'journal', meal: 'repas' };
  const dayTabOf = (k) => { const v = S.ui.dayTab; return v === 'visite' && !hasVisit(k) ? 'apercu' : DAY_TABS.some((x) => x[0] === v) ? v : 'apercu'; };
  /* Ouvre l'onglet qui contient une section, puis l'amène sous la barre d'onglets. */
  function showSection(id, { focus } = {}) {

  }
  function setDayTab(tab) {
    S.ui.dayTab = tab; S.ui.form = null; S.ui.confirm = null;
