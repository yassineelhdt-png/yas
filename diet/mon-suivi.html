<title>Mon suivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3F4; --surface:#FFFFFF; --surface-2:#FAF7F8; --ink:#1A1417; --muted:#6B6166; --line:#E7E0E3;
  --accent:#D62839; --accent-2:#B51F2F; --on-accent:#FFFFFF; --accent-tint:#FDECEE; --accent-line:#F5C3C9;
  --matin:#E9A62B; --matin-2:#F6D48A; --matin-tint:#FCF2DC; --matin-line:#F0D49B; --matin-on:#1A1417;
  --midi:#1F9C93; --midi-2:#94D8D1; --midi-tint:#DFF2EF; --midi-line:#ABDDD7; --midi-on:#1A1417;
  --aprem:#7C5CD6; --aprem-2:#C4B4F1; --aprem-tint:#EDE7FB; --aprem-line:#CFC2F4; --aprem-on:#FFFFFF;
  --soir:#3557C2; --soir-2:#A3B5EC; --soir-tint:#E2E8F8; --soir-line:#B9C7F0; --soir-on:#FFFFFF;
  --fill:#1F9C93; --bub:#EEE8EB; --danger:#BF3A31; --focus:#1A1417;
  --c-supp:#1F9C93; --c-kcal:#B7770A; --c-water:#3557C2; --c-sport:#D62839; --c-mind:#7C5CD6;
  --chart:#3557C2; --sport:#D62839; --sport-2:#F2A7B0; --sport-tint:#FDECEE; --sport-line:#F5C3C9; --sport-on:#FFFFFF; --shadow:0 1px 2px rgba(26,20,23,.05), 0 8px 24px rgba(26,20,23,.06);
  --font-ui:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display:"Unbounded", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0C0E; --surface:#1A1618; --surface-2:#221D20; --ink:#F6F1F3; --muted:#ABA0A6; --line:#332C30;
    --accent:#F04B5C; --accent-2:#FF8A96; --on-accent:#1A0A0D; --accent-tint:#2E1519; --accent-line:#5A262E;
    --matin:#F2BA4E; --matin-2:#8C6B2B; --matin-tint:#272115; --matin-line:#4A3D1F; --matin-on:#0F0C0E;
    --midi:#3CC0B5; --midi-2:#1F6E68; --midi-tint:#122725; --midi-line:#1F4643; --midi-on:#0F0C0E;
    --aprem:#A78CF3; --aprem-2:#5A4990; --aprem-tint:#1E1A31; --aprem-line:#3A305E; --aprem-on:#0F0C0E;
    --soir:#7C95F3; --soir-2:#3E5192; --soir-tint:#171F36; --soir-line:#2D3C66; --soir-on:#0F0C0E;
    --fill:#3CC0B5; --bub:#2B2428; --danger:#F06C62; --focus:#F6F1F3;
    --chart:#6F88E8; --shadow:none;
    --c-supp:#23A095; --c-kcal:#B98019; --c-water:#6F88E8; --c-sport:#F04B5C; --c-mind:#9272E6;
    --sport:#F04B5C; --sport-2:#6E2530; --sport-tint:#2A1418; --sport-line:#4E232A; --sport-on:#1A0A0D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0C0E; --surface:#1A1618; --surface-2:#221D20; --ink:#F6F1F3; --muted:#ABA0A6; --line:#332C30;
  --accent:#F04B5C; --accent-2:#FF8A96; --on-accent:#1A0A0D; --accent-tint:#2E1519; --accent-line:#5A262E;
  --matin:#F2BA4E; --matin-2:#8C6B2B; --matin-tint:#272115; --matin-line:#4A3D1F; --matin-on:#0F0C0E;
  --midi:#3CC0B5; --midi-2:#1F6E68; --midi-tint:#122725; --midi-line:#1F4643; --midi-on:#0F0C0E;
  --aprem:#A78CF3; --aprem-2:#5A4990; --aprem-tint:#1E1A31; --aprem-line:#3A305E; --aprem-on:#0F0C0E;
  --soir:#7C95F3; --soir-2:#3E5192; --soir-tint:#171F36; --soir-line:#2D3C66; --soir-on:#0F0C0E;
  --fill:#3CC0B5; --bub:#2B2428; --danger:#F06C62; --focus:#F6F1F3;
  --chart:#6F88E8; --shadow:none;
  --c-supp:#23A095; --c-kcal:#B98019; --c-water:#6F88E8; --c-sport:#F04B5C; --c-mind:#9272E6;
  --sport:#F04B5C; --sport-2:#6E2530; --sport-tint:#2A1418; --sport-line:#4E232A; --sport-on:#1A0A0D;
  color-scheme:dark;
}
.m-matin{ --m:var(--matin); --m2:var(--matin-2); --mt:var(--matin-tint); --ml:var(--matin-line); --mo:var(--matin-on); }
.m-midi{ --m:var(--midi); --m2:var(--midi-2); --mt:var(--midi-tint); --ml:var(--midi-line); --mo:var(--midi-on); }
.m-aprem{ --m:var(--aprem); --m2:var(--aprem-2); --mt:var(--aprem-tint); --ml:var(--aprem-line); --mo:var(--aprem-on); }
.m-sport{ --m:var(--sport); --m2:var(--sport-2); --mt:var(--sport-tint); --ml:var(--sport-line); --mo:var(--sport-on); }
.m-soir{ --m:var(--soir); --m2:var(--soir-2); --mt:var(--soir-tint); --ml:var(--soir-line); --mo:var(--soir-on); }

*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 116px); -webkit-text-size-adjust:100%; text-size-adjust:100%; }
@media (min-width:720px){ html{ scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 76px); } }
body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
h1,h2,h3{ margin:0; text-wrap:balance; }
[hidden]{ display:none !important; }
.sr-only{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* Barre du haut */
.top{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:var(--surface); background:color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line); }
.top-in{ max-width:1120px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px 16px; min-height:54px; }
.brand{ display:inline-flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:-.01em; }
.brand svg{ width:28px; height:28px; }
.brand .b-bg{ fill:var(--accent); }
.sync{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--muted); }
.sync::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--dot, var(--muted)); }

/* Navigation : en bas sur téléphone et tablette, sur le côté sur grand écran */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:4px; background:var(--surface); border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.nav button{ border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0 6px; border-radius:14px; font-size:11.5px; min-width:0; font-weight:700; color:var(--muted); min-height:56px; }
.nav-ico{ display:grid; place-items:center; width:100%; max-width:58px; height:30px; border-radius:999px; transition:background-color .15s ease; }
.nav-ico svg{ width:23px; height:23px; }
.nav button[aria-current="page"]{ color:var(--accent-2); }
.nav button[aria-current="page"] .nav-ico{ background:var(--accent-tint); color:var(--accent); }
@media (hover:hover){ .nav button:not([aria-current]):hover{ color:var(--ink); } }

main{ max-width:1120px; margin:0 auto; padding:18px 16px calc(100px + env(safe-area-inset-bottom, 0px)); }
@media (min-width:720px){ main{ padding:26px 24px calc(110px + env(safe-area-inset-bottom, 0px)); } }
@media (min-width:1000px){
  body{ padding-left:100px; }
  .nav{ top:0; right:auto; width:100px; grid-template-columns:none; grid-auto-rows:min-content; align-content:start; gap:8px; padding:calc(76px + env(safe-area-inset-top, 0px)) 8px 16px; border-top:0; border-right:1px solid var(--line); }
  .nav button{ min-height:64px; }
  main{ padding-bottom:64px; }
}
.page-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(26px, 5vw, 38px); letter-spacing:-.025em; line-height:1.1; margin-bottom:18px; }
.loading{ color:var(--muted); font-weight:600; }

/* Boutons */
.icon{ flex:none; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:inline-grid; place-items:center; color:var(--ink); padding:0; }
.ghost{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 16px; font-weight:700; font-size:15px; min-height:42px; }
.primary{ border:0; background:var(--accent); color:var(--on-accent); border-radius:999px; padding:10px 18px; font-weight:700; font-size:15px; min-height:42px; }
@media (hover:hover){ .primary:hover{ background:var(--accent-2); } }
.primary:active{ transform:scale(.98); }
.big{ min-height:54px; font-size:17px; padding:12px 22px; }
.danger{ border:0; background:var(--danger); color:#fff; border-radius:999px; padding:10px 18px; font-weight:700; min-height:42px; }
.link{ border:0; background:transparent; color:var(--muted); font-weight:700; font-size:14px; padding:6px 8px; border-radius:8px; }
.link:hover{ color:var(--ink); }
.link.danger{ color:var(--danger); background:transparent; min-height:0; padding:6px 8px; }
@media (hover:hover){
  .icon:hover,.ghost:hover,.lid:hover{ border-color:var(--muted); }
  .tabs button:not([aria-current]):hover{ color:var(--ink); }
}
.hint{ margin:0 0 12px; color:var(--muted); font-size:14px; font-weight:500; }
.empty{ margin:4px 0 0; color:var(--muted); }
.muted{ color:var(--muted); }
.actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.daynav{ display:flex; align-items:center; gap:8px; margin-left:auto; }

/* Jour */
.datebar{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
.date{ font-family:var(--font-display); font-weight:600; font-size:clamp(24px, 4.4vw, 40px); line-height:1.08; letter-spacing:-.025em; }
.strip{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; margin:18px 0 26px; }
.lid{ position:relative; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:7px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:0; }
.lid.visit::before{ content:""; position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--soir); }
.lid[aria-current="date"].visit::before{ background:var(--soir-2); }
.lid .wd{ font-size:12px; font-weight:700; color:var(--muted); }
.lid .dn{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.3; }
.lid .bar{ width:64%; height:4px; border-radius:2px; background:var(--bub); overflow:hidden; margin-top:3px; }
.lid .bar i{ display:block; height:100%; background:var(--fill); border-radius:2px; }
.lid[aria-current="date"]{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.lid[aria-current="date"] .bar i{ background:var(--on-accent); }
.lid[aria-current="date"] .wd{ color:inherit; opacity:.7; }
.lid[aria-current="date"] .bar{ background:rgba(127,127,127,.4); }
.lid.today .dn{ text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px; }
.banner{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:-8px 0 24px; padding:12px 14px; border:1.5px dashed var(--matin); background:var(--surface); border-radius:14px; }
.banner.remind{ border:1.5px solid var(--soir-line); background:var(--soir-tint); }
.banner .btxt{ flex:1 1 220px; min-width:0; }
.banner .btxt b{ display:block; font-weight:800; }
.banner .btxt span{ display:block; font-size:14px; font-weight:600; color:var(--muted); }
.banner p{ margin:0; font-weight:700; }
.banner select{ background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-height:42px; }
.daygrid{ display:grid; gap:36px; }
@media (min-width:760px){ .daygrid{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; } }
@media (min-width:1100px){ .daygrid{ gap:44px; } }
.sec-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; min-height:42px; }
.sec-head h2{ font-size:20px; font-weight:800; letter-spacing:-.01em; min-width:0; }
.sec-head .primary,.sec-head .ghost{ white-space:nowrap; flex:none; }
.count{ font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
/* Cartes */
.col{ display:grid; gap:18px; align-content:start; min-width:0; }
.card,.jsec{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; min-width:0; box-shadow:var(--shadow); }
@media (min-width:720px){ .card,.jsec{ padding:18px 20px; } }
.card-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.card-head h2{ flex:1; font-size:20px; font-weight:800; letter-spacing:-.01em; }
.pill{ flex:none; font-size:13px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-variant-numeric:tabular-nums; }
.mico{ flex:none; width:34px; height:34px; border-radius:11px; background:var(--m, var(--ink)); color:var(--mo, var(--bg)); display:grid; place-items:center; }
.mico svg{ width:20px; height:20px; }
.sleep{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 14px; }
.sleep .field{ width:132px; }
.chip{ border:1.5px dashed var(--matin); background:var(--matin-tint); color:var(--ink); border-radius:999px; padding:9px 16px; font-weight:700; min-height:44px; }
.field{ display:flex; flex-direction:column; gap:5px; font-size:14px; font-weight:700; color:var(--muted); min-width:0; }
.field input,.field select,.field textarea,.notes{ width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 11px; min-height:44px; font-weight:500; font-size:16px; }
.field textarea,.notes{ resize:vertical; line-height:1.45; }
/* Compléments */
.supps-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
.supps-head h2{ font-size:20px; font-weight:800; letter-spacing:-.01em; }
.supps-head .sub{ margin:2px 0 0; font-size:14px; font-weight:700; color:var(--muted); }
.supps-head .sub.done{ color:var(--fill); }
.ring{ flex:none; width:54px; height:54px; border-radius:50%; background:conic-gradient(var(--fill) calc(var(--p) * 1turn), var(--bub) 0); display:grid; place-items:center; }
.ring span{ width:42px; height:42px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }
.moments{ display:grid; gap:12px; }
.moment{ background:var(--mt); border:1px solid var(--ml); border-radius:16px; padding:10px; }
.moment-head{ display:flex; align-items:center; gap:10px; padding:2px 2px 10px 4px; }
.mtitle{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25; }
.mtitle h3{ font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:-.01em; }
.mtitle span{ font-size:13px; color:var(--muted); font-weight:600; }
.mcount{ font-size:13px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums; }
.mall{ flex:none; border:1px solid var(--ml); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:800; min-height:36px; }
.mdone{ flex:none; display:inline-flex; align-items:center; gap:5px; padding:6px 11px; border-radius:999px; background:var(--m); color:var(--mo); font-size:13px; font-weight:800; }
.mdone svg{ width:14px; height:14px; }
.mitems{ display:grid; gap:6px; }
.item{ width:100%; display:flex; align-items:center; gap:12px; padding:11px 12px; background:var(--surface); border:1px solid transparent; border-radius:12px; text-align:left; transition:background-color .15s ease, border-color .15s ease; }
@media (hover:hover){ .item:hover{ border-color:var(--ml); } }
.item.on{ border-color:var(--ml); background:var(--surface); background:color-mix(in srgb, var(--m) 9%, var(--surface)); }
.cap{ flex:none; position:relative; width:50px; height:27px; border-radius:999px; border:2px solid var(--m); background:var(--surface); }
.cap::after{ content:""; position:absolute; top:4px; bottom:4px; left:50%; width:2px; margin-left:-1px; background:var(--ml); border-radius:1px; }
.cap.on{ background:linear-gradient(90deg, var(--m) 0 50%, var(--m2) 50% 100%); }
.cap.on::after{ background:rgba(0,0,0,.14); }
.cap svg{ position:absolute; left:4px; top:50%; width:15px; height:15px; margin-top:-7.5px; color:var(--mo); }
.cap.just{ animation:pop .24s ease-out; }
@keyframes pop{ 0%{ transform:scale(.86); } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); } }
.it-main{ flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; }
.it-name{ font-weight:800; }
.it-dose{ font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
.it-note{ flex-basis:100%; font-size:14px; color:var(--muted); line-height:1.35; }
.freq{ flex:none; font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--ml); white-space:nowrap; }
.it-cure{ flex-basis:100%; display:flex; margin-top:5px; }
.freq.cure{ background:var(--mt); border-color:var(--m); }
.freq.cure.last{ background:var(--m); color:var(--mo); }
.cure-notes{ list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
.cure-notes li{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; border:1.5px dashed var(--ml); background:var(--surface); }
.cure-notes .mico{ width:30px; height:30px; border-radius:10px; background:var(--mt); color:var(--m); }
.cure-notes .mico svg{ width:17px; height:17px; }
.cure-notes b{ display:block; font-weight:800; }
.cure-notes .ctxt{ min-width:0; }
.cure-notes .ctxt span{ display:block; font-size:13.5px; font-weight:600; color:var(--muted); }
.banner.remind.cure{ border-color:var(--ml); background:var(--mt); }
.banner.send{ border:1.5px solid var(--accent-line); background:var(--accent-tint); }
.banner.send .mico{ background:var(--accent); color:var(--on-accent); }
.pill.sent{ display:inline-flex; align-items:center; gap:5px; background:var(--accent-tint); border-color:var(--accent-line); color:var(--accent-2); font-size:12.5px; white-space:normal; }
.pill.sent svg{ width:13px; height:13px; }
.hint.offline{ padding:10px 12px; border-radius:12px; background:var(--surface-2); border:1px dashed var(--line); }
.livebar:not([hidden]) ~ .toast-wrap{ padding-bottom:calc(142px + env(safe-area-inset-bottom, 0px)); }
@media (min-width:1000px){ .livebar:not([hidden]) ~ .toast-wrap{ padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px)); } }
.cure-box{ display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:14px; border:1px solid var(--line); background:var(--surface); }
.cure-box .hint{ margin:0; }

.list{ list-style:none; margin:0; padding:0; }
.entry{ display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:4px 12px; padding:12px 0; border-top:1px solid var(--line); align-items:start; }
.list > li:first-child{ border-top:0; }
.editing{ padding:6px 0; }
.t{ font-weight:800; font-variant-numeric:tabular-nums; padding-top:3px; }
.ci-line{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
.face{ font-size:26px; line-height:1; }
.meters{ display:flex; flex-wrap:wrap; gap:6px 14px; }
.meter{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--muted); }
.segs{ display:inline-flex; gap:2px; }
.segs i{ width:7px; height:12px; border-radius:2px; background:var(--bub); }
.segs i.on{ background:var(--ink); }
.note{ margin:4px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.kind{ display:block; font-size:13px; font-weight:800; color:var(--muted); }
.kind + .note{ margin-top:0; }
.row-actions{ display:flex; flex-wrap:wrap; justify-content:flex-end; }
@media (max-width:560px){
  .entry{ grid-template-columns:48px minmax(0,1fr); gap:2px 10px; }
  .entry > .row-actions{ grid-column:2; justify-content:flex-start; margin:0 0 -4px -8px; }
}
.form{ display:flex; flex-direction:column; gap:16px; padding:16px; margin-bottom:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:16px; }
.form-row{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
.field-time{ width:132px; }
.scale{ border:0; margin:0; padding:0; min-width:0; }
.scale legend{ padding:0; margin-bottom:6px; font-size:14px; font-weight:800; }
.dots{ display:flex; gap:8px; }
.dot{ width:46px; height:46px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-weight:800; font-size:16px; display:grid; place-items:center; padding:0; }
.dot.emoji{ font-size:23px; }
.dot[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
.dot.emoji[aria-pressed="true"]{ background:var(--matin-tint); border-color:var(--matin); box-shadow:inset 0 0 0 2px var(--matin); color:inherit; }
.ends{ display:flex; justify-content:space-between; width:262px; max-width:100%; margin-top:5px; font-size:12px; font-weight:600; color:var(--muted); }
.seg{ display:inline-flex; padding:3px; gap:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; }
.seg button{ border:0; background:transparent; border-radius:999px; padding:8px 14px; font-weight:700; color:var(--muted); min-height:38px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.notes{ min-height:110px; }

/* Semaine */
.wk-head,.yr-head{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:10px; }
.wk-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(20px, 3.4vw, 30px); letter-spacing:-.02em; line-height:1.15; }
.scroller{ overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
.week{ width:100%; min-width:700px; border-collapse:collapse; }
.week th,.week td{ padding:7px 4px; text-align:center; border-bottom:1px solid var(--line); }
.week thead th{ padding:8px 4px; }
.week thead button{ border:0; background:transparent; border-radius:12px; padding:5px 10px; display:inline-flex; flex-direction:column; align-items:center; line-height:1.2; font-weight:700; font-size:13px; color:var(--muted); }
.week thead button b{ font-size:17px; color:var(--ink); font-variant-numeric:tabular-nums; }
.week thead th.today button{ background:var(--ink); color:var(--bg); }
.week thead th.today button b{ color:var(--bg); }
.vtag{ display:block; margin-top:2px; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--soir); }
.week thead th.today .vtag{ color:var(--soir-2); }
.week-claude{ margin-top:22px; }
.week th[scope="row"]{ text-align:left; padding-left:14px; font-weight:700; white-space:nowrap; }
.week th[scope="row"] small{ margin-left:6px; font-size:13px; font-weight:600; color:var(--muted); }
.week tr.grp th{ text-align:left; padding:12px 14px 6px; background:var(--mt); border-bottom:1px solid var(--ml); font-family:var(--font-display); font-weight:600; font-size:15px; }
.week tr.grp th span{ font-family:var(--font-ui); font-size:13px; font-weight:600; color:var(--muted); margin-left:6px; }
.mini{ position:relative; width:36px; height:22px; padding:0; border-radius:999px; border:2px solid var(--m); background:var(--surface); vertical-align:middle; }
.mini.on{ background:linear-gradient(90deg, var(--m) 0 50%, var(--m2) 50% 100%); }
.mini svg{ position:absolute; left:3px; top:50%; width:12px; height:12px; margin-top:-6px; color:var(--mo); }
.week tbody.sum th[scope="row"]{ color:var(--muted); }
.week tbody.sum td{ font-weight:700; font-variant-numeric:tabular-nums; }
.week tbody.sum tr:first-child th,.week tbody.sum tr:first-child td{ border-top:2px solid var(--line); }
.week tbody.sum tr:last-child th,.week tbody.sum tr:last-child td{ border-bottom:0; }

/* Année */
.yr-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(30px, 6vw, 52px); letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
.yr-sum{ margin:6px 0 14px; font-weight:600; }
.legend{ display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:20px; font-size:14px; font-weight:600; color:var(--muted); }
.legend span{ display:inline-flex; align-items:center; gap:7px; }
.months{ display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:16px; }
.month{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 12px 14px; }
.month h3{ font-size:15px; font-weight:800; margin-bottom:8px; }
.blister{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:5px; }
.wdh{ text-align:center; font-size:11px; font-weight:700; color:var(--muted); }
.bub{ display:block; width:100%; max-width:100%; min-height:20px; aspect-ratio:1/1; padding:0; border-radius:50%; border:1px solid var(--line); background:var(--bub); position:relative; box-shadow:inset 0 -2px 0 rgba(0,0,0,.07); }
.bub.none{ background:transparent; border-style:dashed; box-shadow:none; }
.bub.part{ background:conic-gradient(var(--fill) calc(var(--p) * 1turn), var(--bub) 0); }
.bub.full{ background:var(--fill); border-color:var(--fill); }
.bub.future{ opacity:.4; }
.bub.today{ outline:2px solid var(--ink); outline-offset:1px; }
.bub.v{ box-shadow:0 0 0 2px var(--soir); }
.bub.j::after{ content:""; position:absolute; right:-2px; bottom:-2px; width:8px; height:8px; border-radius:50%; background:var(--aprem); border:1.5px solid var(--surface-2); }
.legend .bub{ display:inline-block; width:16px; height:16px; min-height:0; }

/* Réglages */
.set-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(24px, 4.4vw, 40px); letter-spacing:-.025em; margin-bottom:22px; }
.set-sec{ max-width:820px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow); }
@media (min-width:720px){ .set-sec{ padding:22px 24px; } }
.set-sec + .set-sec{ margin-top:18px; }
.next-visit{ display:flex; align-items:center; gap:12px; margin:0 0 14px; padding:12px 14px; background:var(--soir-tint); border:1px solid var(--soir-line); border-radius:14px; }
.next-visit b{ display:block; font-weight:800; }
.next-visit span span{ display:block; font-size:14px; font-weight:600; color:var(--muted); }
.dgroups{ display:grid; gap:12px; margin-top:14px; }
.dgroup{ padding:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; }
.dgroup h3{ font-size:16px; font-weight:800; }
.dgroup > p{ margin:2px 0 12px; font-size:14px; color:var(--muted); font-weight:500; }
.dgroup .day-pick{ max-width:220px; margin-bottom:10px; }
.confirm-box{ margin-top:12px; padding:12px 14px; border:1.5px solid var(--danger); border-radius:12px; background:var(--surface); }
.confirm-box p{ margin:0 0 10px; }
.m-title{ display:flex; align-items:center; gap:10px; margin:24px 0 10px; font-family:var(--font-display); font-weight:600; font-size:16px; }
.m-title::before{ content:""; flex:none; width:24px; height:13px; border-radius:999px; background:linear-gradient(90deg, var(--m) 0 50%, var(--m2) 50% 100%); }
.m-title span{ font-family:var(--font-ui); font-size:14px; font-weight:600; color:var(--muted); }
.srow{ display:flex; flex-direction:column; gap:10px; padding:14px; margin-bottom:10px; background:var(--surface-2); border:1px solid var(--line); border-left:5px solid var(--m); border-radius:12px; }
.srow.paused{ opacity:.62; }
.srow-c{ padding:0; }
.srow-open{ width:100%; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; row-gap:2px; padding:13px 14px; min-height:48px; background:transparent; border:0; border-radius:10px; text-align:left; }
.srow-meta{ margin-left:auto; font-size:14px; font-weight:700; color:var(--muted); }
.srow-foot .row-actions{ align-items:center; gap:6px; }
.srow-line{ display:flex; flex-wrap:wrap; gap:10px; }
.srow-line .field{ flex:0 1 auto; }
.srow-line .grow{ flex:1 1 220px; }
.srow-line select{ min-width:130px; }
.srow-foot{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
.switch{ display:inline-flex; align-items:center; gap:8px; font-weight:700; }
.switch input{ width:22px; height:22px; accent-color:var(--accent); margin:0; }
.filebtn{ display:inline-flex; align-items:center; cursor:pointer; position:relative; }
.filebtn:focus-within{ outline:3px solid var(--focus); outline-offset:2px; }
.exportbox{ margin-top:16px; }
.export{ width:100%; min-height:160px; font-size:13px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
.reset{ margin-top:22px; }
.reset p{ margin:0 0 10px; font-weight:600; }

/* Ce que je ressens */
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chips button{ border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px; min-height:36px; }
.chips .chips-lbl{ align-self:center; font-size:13px; font-weight:700; color:var(--muted); margin-right:2px; }
.level{ flex:none; font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--aprem-tint); border:1px solid var(--aprem-line); color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums; }
.to-claude{ margin-top:10px; }

/* Nutrition */
.nutri{ display:grid; gap:10px; padding:14px; margin-bottom:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:16px; }
.nutri-top{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; }
.nutri-top b{ font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.nutri-top span{ color:var(--muted); font-weight:700; font-size:14px; }
.nutri-top .over{ color:var(--danger); }
.mbars{ display:grid; gap:6px; }
.mbar{ display:grid; grid-template-columns:88px minmax(0,1fr) auto; align-items:center; gap:10px; font-size:13px; font-weight:700; }
.mbar > span:first-child{ color:var(--muted); }
.mbar .track{ height:8px; border-radius:4px; background:var(--bub); overflow:hidden; }
.mbar .track i{ display:block; height:100%; border-radius:4px; background:var(--c); width:var(--w); }
.mbar b{ font-variant-numeric:tabular-nums; min-width:92px; text-align:right; }
.c-kcal{ --c:var(--fill); } .c-p{ --c:var(--soir); } .c-g{ --c:var(--matin); } .c-l{ --c:var(--aprem); }
.items{ list-style:none; margin:6px 0 0; padding:0; display:grid; gap:2px; font-size:14px; }
.items li{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:0 10px; }
.items li span{ color:var(--muted); font-variant-numeric:tabular-nums; }
.macros{ margin:4px 0 0; font-size:13px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
.foods{ display:grid; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.foods-head{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; font-weight:800; }
.foods-head span{ color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
.food-list{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.food-list li{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; padding:8px 10px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; }
.food-list .fl-name{ font-weight:800; flex:1 1 140px; min-width:0; }
.food-list .fl-vals{ color:var(--muted); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.food-add{ display:grid; gap:10px; }
.food-add .row{ display:grid; grid-template-columns:minmax(0,1fr) 110px; gap:10px; }
.food-add .row4{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
@media (max-width:460px){ .food-add .row4{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
.food-add .field span{ font-size:13px; }
.per100{ margin:0; font-size:13px; font-weight:600; color:var(--muted); }

/* Visite médicale */
.visit{ border:1.5px solid var(--soir-line); margin-bottom:18px; }
.visit-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.visit-head h2{ font-family:var(--font-display); font-weight:600; font-size:20px; letter-spacing:-.02em; }
.visit-head p{ margin:2px 0 0; color:var(--muted); font-size:14px; font-weight:600; }
.vchecks{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.vcheck{ display:inline-flex; align-items:center; gap:9px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:999px; padding:8px 16px 8px 10px; font-weight:800; min-height:44px; }
.vbox{ width:22px; height:22px; border-radius:7px; border:2px solid var(--soir); display:grid; place-items:center; }
.vbox svg{ width:14px; height:14px; }
.vcheck[aria-pressed="true"]{ background:var(--soir-tint); border-color:var(--soir-line); }
.vcheck[aria-pressed="true"] .vbox{ background:var(--soir); color:var(--soir-on); }
.vweight{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 16px; margin-bottom:6px; }
.vweight .field{ width:140px; }
.delta{ margin:0 0 12px; font-weight:800; font-size:14px; }
.vhist{ margin:0 0 14px; font-size:13px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
.labs{ margin:0 0 14px; padding:12px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; }
.labs summary{ cursor:pointer; font-weight:800; display:flex; align-items:center; gap:10px; }
.labs[open] summary{ margin-bottom:8px; }
.labs .count{ font-size:13px; }
.vgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px; margin-bottom:10px; }
.vgrid .field span{ font-size:13px; }
.lab-note{ font-size:12px; font-weight:600; color:var(--muted); line-height:1.3; }

/* Claude */
.claude{ border:1.5px solid var(--aprem-line); }
.claude .sec-head h2{ font-family:var(--font-display); font-weight:600; font-size:18px; }
.claude > .field{ margin-bottom:10px; }
.ask-opts{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:14px; }
.ask-area{ display:grid; gap:12px; }
.linkbtn{ display:inline-flex; align-items:center; text-decoration:none; color:var(--ink); }
.thinking{ margin:0; font-weight:700; color:var(--aprem); }
.answer{ padding:14px 16px; background:var(--aprem-tint); border:1px solid var(--aprem-line); border-radius:14px; max-width:68ch; overflow-wrap:anywhere; }
.answer h3{ font-size:16px; font-weight:800; margin:14px 0 4px; }
.answer h3:first-child,.answer .answer-meta + h3{ margin-top:0; }
.answer p{ margin:0 0 8px; }
.answer ul,.answer ol{ margin:0 0 8px; padding-left:22px; }
.answer li{ margin:2px 0; }
.answer-meta{ font-size:13px; font-weight:700; color:var(--muted); }
.ask-error{ margin:0; font-weight:700; color:var(--danger); }
.report-box{ margin-top:14px; }
.report-box summary{ cursor:pointer; font-weight:700; color:var(--muted); font-size:14px; padding:6px 0; }
.report-box .export{ margin-top:8px; font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:12.5px; line-height:1.45; }
.set-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin-bottom:10px; }
.restore{ margin-top:14px; }

/* Accueil */
.hero{ margin-bottom:18px; }
.hero-top{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; }
.eyebrow{ margin:0 0 2px; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-2); }
.hero .strip{ margin:16px 0 0; }
.tiles{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-bottom:18px; }
@media (min-width:620px){ .tiles{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
@media (min-width:1180px){ .tiles{ grid-template-columns:repeat(6, minmax(0,1fr)); } }
.tile{ display:flex; align-items:center; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:18px; text-align:left; min-width:0; box-shadow:var(--shadow); }
.tile .ring{ width:48px; height:48px; background:conic-gradient(var(--c, var(--fill)) calc(var(--p) * 1turn), var(--bub) 0); }
.tile .ring span{ width:36px; height:36px; font-size:12px; }
.tile .ring span svg{ width:18px; height:18px; color:var(--c, var(--fill)); }
.tile-txt{ min-width:0; display:flex; flex-direction:column; line-height:1.25; }
.tile-txt b{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile-txt span{ font-size:13px; font-weight:700; color:var(--muted); }
.tile .face{ font-size:24px; }
.c-sport{ --c:var(--sport); } .c-water{ --c:var(--soir); } .c-supps{ --c:var(--fill); } .c-kcal2{ --c:var(--matin); } .c-mood{ --c:var(--aprem); }

/* Eau */
.glasses{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px; }
.glass{ width:26px; height:32px; color:var(--soir); }
.glass svg{ width:100%; height:100%; }
.water-sub{ margin:0 0 12px; font-weight:700; color:var(--muted); font-size:14px; }
.water-sub.done{ color:var(--fill); }
.wminus{ min-width:44px; font-size:20px; line-height:1; }

/* Calendrier */
.seg-nav{ display:flex; padding:4px; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; margin-bottom:18px; max-width:420px; }
.seg-nav button{ flex:1; border:0; background:transparent; border-radius:999px; padding:9px 10px; font-weight:800; color:var(--muted); min-height:40px; }
.seg-nav button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.mgrid{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; }
.mgrid .wdh{ padding-bottom:4px; }
.mday{ position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px 8px; min-height:66px; border:1px solid var(--line); border-radius:14px; background:var(--surface); min-width:0; }
.mday .dn{ font-weight:800; font-variant-numeric:tabular-nums; }
.mday .bar{ width:62%; height:4px; border-radius:2px; background:var(--bub); overflow:hidden; }
.mday .bar i{ display:block; height:100%; background:var(--fill); }
.mday .marks{ display:flex; gap:3px; min-height:7px; }
.mday .marks i{ width:7px; height:7px; border-radius:50%; }
.mday .mk-s{ background:var(--sport); } .mday .mk-v{ background:var(--soir); } .mday .mk-j{ background:var(--aprem); } .mday .mk-w{ background:var(--soir-2); border:1.5px solid var(--soir); }
.mday.future{ opacity:.5; }
.mday.today{ border-color:var(--ink); border-width:2px; }
.mday.visit{ background:var(--soir-tint); border-color:var(--soir-line); }
.mday.out{ visibility:hidden; }
.msum{ margin:14px 0 6px; font-weight:600; }
.legend i.dot{ display:inline-block; width:9px; height:9px; border-radius:50%; }

/* Santé */
.stats{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; }
.stat{ padding:12px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; min-width:0; }
.stat span{ display:block; font-size:13px; font-weight:700; color:var(--muted); }
.stat b{ display:block; font-family:var(--font-display); font-weight:600; font-size:22px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.25; }
.stat small{ display:block; font-size:13px; font-weight:600; color:var(--muted); }
.goalbar{ margin-top:14px; }
.goalbar p{ margin:0 0 6px; font-weight:700; }
.goalbar .track{ height:10px; border-radius:5px; background:var(--bub); overflow:hidden; }
.goalbar .track i{ display:block; height:100%; border-radius:5px; background:var(--fill); }
.hgrid{ display:grid; gap:18px; }
@media (min-width:900px){ .hgrid{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start; } .hgrid .wide{ grid-column:1 / -1; } }

  async function getCapabilities() {
    const none = { db: null, downloads: null, sample: null, uid: null };
    const claude = window.claude;
    if (!claude || typeof claude.use !== 'function') return none;
    const use = (name) => Promise.resolve().then(() => claude.use(name)).catch(() => null);
    try {
      const [db, user, downloads, sample] = await withTimeout(Promise.all([use('db'), use('user'), use('downloads'), use('sample')]), CAPS_TIMEOUT, [null, null, null, null]);
      const uid = user && typeof user.id === 'function' ? await withTimeout(user.id().catch(() => null), 5000, null) : null;
      return { db, downloads, sample: typeof sample === 'function' ? sample : null, uid };
    } catch (e) { return none; }
  }
  async function init() {
    refreshSync();
    const caps = await getCapabilities();
    store.downloads = caps.downloads || null;
    store.sample = caps.sample;
    if (store.sample && typeof store.sample.limits === 'function') {
      store.sample.limits().then((l) => { store.sampleImages = (l && l.images) || null; if (S.ready && store.sampleImages) safeRender(); }).catch(() => {});
    }
    store.db = caps.db && caps.uid ? caps.db : null;
    store.uid0 = store.db ? caps.uid : null;
    startProfile();
    if (store.db) syncProfiles();
  }
  /* Démarre le profil affiché : ses données sur l'appareil, puis celles du compte s'il y en a un. */
  function startProfile() {
    localData = lsGet(lsKey());
    S.live = loadLive();
    S.chrono = loadChrono();
    if (!store.db) { startLocal(); return; }
    try { store.col = store.db.collection(profileCollection(store.uid0)); } catch (e) { startLocal(); return; }
    store.mode = 'cloud';
    store.uid = store.uid0;
    const cache = lsGet(cacheKey());
    if (isObj(cache) && cache.uid === store.uid && isObj(cache.settings)) startFromCache(cache);
    refreshSync();
    connect();
  }

  /* ---------- Rendu : Jour ---------- */
  function renderDay() {
    const k = S.ui.date, t = todayKey(), isToday = k === t;
    const d = peekDay(k) || {};
    const visit = hasVisit(k), gap = daysBetween(t, k);
    const rel = isToday ? 'Aujourd’hui' : gap === -1 ? 'Hier' : gap === 1 ? 'Demain' : gap < 0 ? `Il y a ${-gap} jours` : `Dans ${gap} jours`;
    return html`<section class="hero"><div class="hero-top"><div><p class="eyebrow">${rel}</p><h1 class="date">${longDate(k)}</h1></div>
        <div class="daynav">
          ${isToday ? '' : html`<button type="button" class="ghost" data-act="day-today">Aujourd’hui</button>`}
          <button type="button" class="icon" data-act="day-prev" aria-label="Jour précédent">${ICON.left}</button>
          <button type="button" class="icon" data-act="day-next" aria-label="Jour suivant">${ICON.right}</button>
        </div>
      </div>${weekStrip(k)}</section>
      ${weeklyBanner()}
      ${isToday ? visitBanners(k) : ''}
      ${isToday ? cureBanners(k) : ''}
      ${isToday ? sendBanner() : ''}
      ${isToday ? backupBanner() : ''}
      ${isToday ? firstSteps() : ''}
      ${summaryTiles(k, d)}
      ${visit ? visitCard(k, d) : ''}
      <div class="daygrid">
        <div class="col">${sleepBlock(k, d, isToday)}${supplementBlock(k)}${waterBlock(k, d)}</div>
        <div class="col">${checkinBlock(k, d, isToday)}${symptomBlock(k, d)}${mealBlock(k, d)}${notesBlock(k, d)}${claudeBlock(visit ? 'visit' : 'day', k)}</div>
      </div>`;
  }
  /* Résumé du jour : quatre anneaux qui mènent chacun à sa section. */
  function summaryTiles(k, d) {
    const st = stats(k), ml = waterOf(d), goal = Math.round(S.settings.goals.water * 1000);
    const tot = sumMacros(dayItems(d)), kcalGoal = S.settings.goals.kcal;
    const cis = listOf(d.checkins).sort(byTime), last = cis[cis.length - 1], mood = last ? scaleValue(last.mood) : null;
    const clamp = (x) => Math.max(0, Math.min(1, x)).toFixed(3);
    const wk = sportWeek(k), sp = S.settings.sport, steps = stepsOf(d);
    const tile = (cls, target, p, inner, big, small, label) => html`<button type="button" class="tile ${cls}" ${target.startsWith('tab:') ? html`data-act="tab" data-view="${target.slice(4)}"` : html`data-act="jump" data-v="${target}"`} aria-label="${label}"><span class="ring" style="--p:${clamp(p)}"><span>${inner}</span></span><span class="tile-txt"><b>${big}</b><span>${small}</span></span></button>`;
    return html`<div class="tiles">
      ${tile('c-supps', 'sec-supps', st.total ? st.taken / st.total : 0, ICON.pill, st.total ? `${st.taken}/${st.total}` : '—', 'compléments', `Compléments : ${st.taken} sur ${st.total}`)}
      ${tile('c-water', 'sec-water', goal ? ml / goal : 0, ICON.drop, `${fmtL(ml)} L`, `sur ${fmtL(goal)} L d’eau`, `Eau : ${fmtL(ml)} litre sur ${fmtL(goal)}`)}
      ${tile('c-kcal2', 'sec-meals', kcalGoal ? tot.kcal / kcalGoal : 0, ICON.flame, tot.n ? fmtInt(tot.kcal) : '—', kcalGoal ? `sur ${fmtInt(kcalGoal)} kcal` : 'kcal', `Calories : ${fmtInt(tot.kcal)}${kcalGoal ? ` sur ${fmtInt(kcalGoal)}` : ''}`)}
      ${tile('c-sport', 'tab:sport', wk.count / sp.perWeek, ICON.dumbbell, `${wk.count}/${sp.perWeek}`, 'séances cette semaine', `Sport : ${wk.count} séances sur ${sp.perWeek} cette semaine`)}
      ${tile('c-sport', 'tab:sport', steps / sp.steps, ICON.steps, steps ? fmtInt(steps) : '—', `sur ${fmtInt(sp.steps)} pas`, `Pas : ${fmtInt(steps)} sur ${fmtInt(sp.steps)}`)}
      ${tile('c-mood', 'sec-checkins', mood ? mood / 5 : 0, mood ? html`<span class="face">${FACES[mood - 1]}</span>` : ICON.smile, mood ? `${mood}/5` : '—', last ? `humeur à ${str(last.time)}` : 'pas de check-in', mood ? `Humeur ${mood} sur 5` : 'Pas encore de check-in')}
    </div>`;
  }
  function waterBlock(k, d) {
    const ml = waterOf(d), goal = Math.round(S.settings.goals.water * 1000), glass = S.settings.goals.glass;
    const filled = ml / glass, n = Math.min(16, Math.max(Math.ceil(goal / glass), Math.ceil(filled)));
    const left = goal - ml, glassesLeft = Math.ceil(left / glass);
    const cups = Array.from({ length: n }, (_, i) => html`<span class="glass">${i + 1 <= filled ? ICON.glassFull : i < filled ? ICON.glassHalf : ICON.glassEmpty}</span>`);
    return html`<section class="card m-soir" id="sec-water" aria-labelledby="water-title">
      <div class="card-head"><span class="mico" aria-hidden="true">${ICON.drop}</span><h2 id="water-title">Eau</h2><span class="pill">${fmtL(ml)} / ${fmtL(goal)} L</span></div>
      <div class="glasses" role="img" aria-label="${fmtL(ml)} litre bu sur ${fmtL(goal)}">${cups}</div>
      <p class="water-sub${left <= 0 ? ' done' : ''}">${left <= 0 ? 'Objectif atteint' : `Encore ${fmtL(left)} L, soit ${plural(glassesLeft, 'verre')}`}</p>
      <div class="actions">
        <button type="button" class="primary" data-act="water-add" data-v="${glass}" data-date="${k}">+ 1 verre (${glass / 10} cl)</button>
        <button type="button" class="ghost" data-act="water-add" data-v="500" data-date="${k}">+ 50 cl</button>
        <button type="button" class="ghost wminus" data-act="water-add" data-v="${-glass}" data-date="${k}" aria-label="Retirer un verre"${ml ? '' : html` disabled`}>−</button>
      </div>
    </section>`;
  }
  /* Rappels du jour : visite dans la semaine, résultats de prise de sang à noter. */
  function visitBanners(k) {
    const out = [];
    const nv = nextVisit(k), n = daysBetween(k, nv);
    const banner = (icon, title, text, action) => html`<div class="banner remind m-soir" role="note"><span class="mico" aria-hidden="true">${icon}</span><p class="btxt"><b>${title}</b><span>${text}</span></p>${action}</div>`;
    if (n >= 1 && n <= 7) {
      out.push(banner(ICON.visit, `Visite médicale ${whenLabel(n)} : ${longDate(nv).replace(/^./, (c) => c.toLowerCase())}`,
        'Prise de sang (souvent à jeun, vérifie avec le labo), pesée et médecin. Note tes questions pour le médecin.',
        html`<button type="button" class="ghost" data-act="goto" data-date="${nv}">Voir ce jour</button>`));
    }
    const pv = prevVisit(k);
    if (pv && daysBetween(pv, k) <= 10 && !labsFilled(visitOf(peekDay(pv)))) {
      out.push(banner(ICON.drop, `Résultats de la prise de sang du ${shortDate(pv)} ?`,
        'Note-les dans la visite pour les envoyer à Claude avec ton bilan du mois.',
        html`<button type="button" class="ghost" data-act="goto-labs" data-date="${pv}">Noter les résultats</button>`));
    }
    return out;
  }
  /* La veille d'un début, d'une pause ou d'une reprise de cure. */
  function cureBanners(k) {
    return S.settings.supplements.filter((s) => s.active && s.cure && curePhase(s.cure, k).left === 1).map((s) => {
      const c = s.cure, ph = curePhase(c, k), day = ph.next;
      const [title, text] = ph.phase === 'prise'
        ? [`Demain : pause ${deName(s.name)}`, `${c.off} semaine${c.off > 1 ? 's' : ''} sans, reprise le ${lowDate(addDays(day, c.off * 7))}. Continue tes check-ins : tu verras ce que ça change.`]
        : [`Demain : ${ph.phase === 'avant' ? 'début de ta cure' : 'reprise'} ${deName(s.name)}`, `${c.on} semaine${c.on > 1 ? 's' : ''} de prise${s.dose ? ` (${s.dose})` : ''}, jusqu’au ${lowDate(addDays(day, c.on * 7 - 1))} inclus.`];
      return html`<div class="banner remind cure m-${s.moment}" role="note"><span class="mico" aria-hidden="true">${ph.phase === 'prise' ? ICON.pause : ICON.pill}</span><p class="btxt"><b>${title}</b><span>${text}</span></p></div>`;
    });
  }
  function visitCard(k, d) {
    const vis = visitOf(d) || {};
    const labs = isObj(vis.labs) ? vis.labs : {};
    const w = weightOf(d);
    const before = weighIns().filter((x) => x.k < k);
    const prev = before[before.length - 1];
    const delta = w && prev ? round1(w - prev.w) : null;
    const filled = LABS.filter(([key]) => str(labs[key]).trim()).length;
    const check = (key, label) => html`<button type="button" class="vcheck" data-act="visit-check" data-v="${key}" data-date="${k}" aria-pressed="${bool(!!vis[key])}"><span class="vbox" aria-hidden="true">${vis[key] ? ICON.check : ''}</span>${label}</button>`;
    return html`<section class="card visit" id="visit" aria-labelledby="visit-title">
      <div class="visit-head"><span class="mico m-soir" aria-hidden="true">${ICON.visit}</span><div><h2 id="visit-title">Visite médicale</h2><p>${k === todayKey() ? 'Aujourd’hui · ' : ''}prise de sang, pesée et médecin, ${cycleLabel()}</p></div></div>
      <div class="vchecks">${check('blood', 'Prise de sang faite')}${check('doctor', 'Vu le médecin')}</div>
      <div class="vweight">
        <label class="field"><span>Poids (kg)</span><input type="text" inputmode="decimal" id="vw-${k}" data-visit="weight" data-date="${k}" value="${w ? fmtDec(w) : ''}" placeholder="—" autocomplete="off"></label>
        ${delta != null ? html`<p class="delta">${delta === 0 ? 'Stable' : `${delta > 0 ? '+' : '−'}${fmtDec(Math.abs(delta))} kg`} depuis le ${shortDate(prev.k)}</p>`
          : !before.length ? html`<p class="delta muted">Première pesée : ton point de départ.</p>` : ''}
      </div>
      ${before.length ? html`<p class="vhist">Pesées d’avant : ${before.slice(-4).map((x) => `${shortDate(x.k)} · ${fmtDec(x.w)} kg`).join('  —  ')}</p>` : ''}
      <details class="labs" data-toggle="labs"${S.ui.labsOpen || filled ? html` open` : ''}>
        <summary>Résultats de la prise de sang${filled ? html`<span class="pill">${filled} noté${filled > 1 ? 's' : ''}</span>` : ''}</summary>
        <p class="hint">Recopie chaque valeur avec son unité. En gris, le repère habituel ; ton labo indique ses propres normes.</p>
        <div class="vgrid">${LABS.map(([key, label, ref, note]) => html`<label class="field"><span>${label}</span><input type="text" id="lab-${key}-${k}" data-visit="labs.${key}" data-date="${k}" value="${str(labs[key])}" placeholder="${ref}" autocomplete="off">${note ? html`<small class="lab-note">${note}</small>` : ''}</label>`)}</div>
        <label class="field"><span>Autres résultats ou compte rendu du labo</span><textarea id="vlabs-${k}" data-visit="labsText" data-date="${k}" rows="3" placeholder="Colle ici le reste du compte rendu…">${str(vis.labsText)}</textarea></label>
      </details>
      <label class="field"><span>Ce que dit le médecin</span><textarea id="vnotes-${k}" data-visit="notes" data-date="${k}" rows="3" placeholder="Conseils, changement de dose, examens à faire…">${str(vis.notes)}</textarea></label>
      <p class="hint" style="margin:12px 0 0">Les résultats arrivent souvent un ou deux jours après : reviens les noter ici. Ton bilan du mois pour Claude est en bas de la page.</p>
    </section>`;
  }
  function weekStrip(k) {
    const start = startOfWeek(k), t = todayKey();
    const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    return html`<div class="strip" role="group" aria-label="Jours de la semaine">${days.map((dk, i) => {
      const st = stats(dk), pct = st.total ? Math.round((st.taken / st.total) * 100) : 0, v = hasVisit(dk);
      const label = longDate(dk) + (st.total ? `, ${st.taken} sur ${st.total} compléments` : '') + (v ? ', visite médicale' : '');
      return html`<button type="button" class="lid${dk === t ? ' today' : ''}${v ? ' visit' : ''}" data-act="goto" data-date="${dk}"${dk === k ? html` aria-current="date"` : ''} aria-label="${label}"><span class="wd">${WD_SHORT[i]}</span><span class="dn">${fromKey(dk).getDate()}</span><span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span></button>`;
    })}</div>`;
  }
  function weeklyBanner() {
    return S.settings.supplements.filter((s) => s.active && s.freq === 'weekly' && s.weekday == null).map((s) => html`<div class="banner">
      <p><label for="wk-${s.id}">${s.name} : quel jour de la semaine ?</label></p>
      <select id="wk-${s.id}" data-weekly="${s.id}"><option value="">Choisir le jour</option>${WD_LONG.map((w, i) => html`<option value="${i}">${cap1(w)}</option>`)}</select>
    </div>`);
  }
  function sleepBlock(k, d, isToday) {
    const prev = peekDay(addDays(k, -1));
    const wake = str(d.wake), night = nightLength(prev && prev.bed, wake);
    return html`<section class="card" aria-labelledby="sleep-title">
      <div class="card-head"><span class="mico m-soir" aria-hidden="true">${ICON.moon}</span><h2 id="sleep-title">Sommeil</h2>${night ? html`<span class="pill">Nuit de ${night}</span>` : ''}</div>
      <div class="sleep">
        <label class="field"><span>Réveil</span><input type="time" id="wake-${k}" data-bind="wake" data-date="${k}" value="${wake}"></label>
        <label class="field"><span>Coucher</span><input type="time" id="bed-${k}" data-bind="bed" data-date="${k}" value="${str(d.bed)}"></label>
        ${!wake && isToday ? html`<button type="button" class="chip" data-act="wake-now" data-date="${k}">Je viens de me lever</button>` : ''}
      </div>
    </section>`;
  }
  function supplementItem(s, k) {
    const on = isTaken(s.id, k), just = S.ui.just === `${s.id}|${k}`;
    const ph = s.cure && curePhase(s.cure, k), inCure = ph && ph.phase === 'prise';
    return html`<button type="button" class="item${on ? ' on' : ''}" data-act="toggle" data-sid="${s.id}" data-date="${k}" aria-pressed="${bool(on)}"><span class="cap${on ? ' on' : ''}${just ? ' just' : ''}" aria-hidden="true">${on ? ICON.check : ''}</span><span class="it-main"><span class="it-name">${s.name}</span>${s.dose ? html`<span class="it-dose">${s.dose}</span>` : ''}${s.note ? html`<span class="it-note">${s.note}</span>` : ''}${inCure ? html`<span class="it-cure"><span class="freq cure${ph.left === 1 ? ' last' : ''}">${ph.left === 1 ? 'Dernier jour de cure' : `Cure · semaine ${ph.week} sur ${ph.of}`}</span></span>` : ''}</span>${FREQ_BADGE[s.freq] ? html`<span class="freq">${FREQ_BADGE[s.freq]}</span>` : ''}</button>`;
  }
  const lowDate = (k) => longDate(k).replace(/^./, (c) => c.toLowerCase());
  /* Compléments en pause de cure (ou pas encore commencés) ce jour-là : une ligne chacun, avec la date de reprise. */
  function cureNotes(k) {
    const list = S.settings.supplements.filter((s) => s.active && s.cure && !isTaken(s.id, k) && curePhase(s.cure, k).phase !== 'prise' && !(s.since && k < s.since));
    if (!list.length) return '';
    return html`<ul class="cure-notes">${list.map((s) => {
      const ph = curePhase(s.cure, k), when = whenLabel(ph.left);
      const txt = ph.phase === 'avant' ? `Début de la cure le ${lowDate(ph.next)} (${when}) · ${cureRule(s.cure)}`
        : `En pause, semaine ${ph.week} sur ${ph.of} · reprise le ${lowDate(ph.next)} (${when})`;
      return html`<li class="m-${s.moment}"><span class="mico" aria-hidden="true">${ph.phase === 'avant' ? ICON.pill : ICON.pause}</span><span class="ctxt"><b>${s.name}${s.dose ? ` ${s.dose}` : ''}</b><span>${txt}</span></span></li>`;
    })}</ul>`;
  }
  function supplementBlock(k) {
    const items = itemsForDay(k), st = stats(k);
    const pct = st.total ? st.taken / st.total : 0, all = st.total > 0 && st.taken === st.total;
    const head = html`<div class="supps-head"><div><h2>Compléments</h2><p class="sub${all ? ' done' : ''}">${!st.total ? 'Rien de prévu ce jour-là' : all ? 'Tout est pris' : `${st.taken} sur ${st.total} pris`}</p></div>${st.total ? html`<div class="ring" style="--p:${pct.toFixed(3)}" role="img" aria-label="${st.taken} sur ${st.total} compléments pris"><span>${Math.round(pct * 100)} %</span></div>` : ''}</div>`;
    if (!items.length) return html`<section class="card supps" id="sec-supps">${head}${S.settings.supplements.length ? '' : html`<p class="empty">Ajoute tes compléments dans Réglages.</p>`}${cureNotes(k)}</section>`;
    return html`<section class="card supps" id="sec-supps">${head}<div class="moments">${MOMENTS.map((m) => {
      const list = items.filter((s) => s.moment === m.key);
      if (!list.length) return '';
      const sch = list.filter((s) => isScheduled(s, k)), done = sch.filter((s) => isTaken(s.id, k)).length;
      const status = !sch.length ? ''
        : done === sch.length ? html`<span class="mdone">${ICON.check}Fait</span>`
        : html`<span class="mcount" aria-label="${done} sur ${sch.length} pris">${done}/${sch.length}</span><button type="button" class="mall" data-act="moment-all" data-v="${m.key}" data-date="${k}" aria-label="Tout cocher : ${m.label}">Tout cocher</button>`;
      return html`<div class="moment m-${m.key}" role="group" aria-labelledby="mt-${m.key}">
        <div class="moment-head"><span class="mico" aria-hidden="true">${MOMENT_ICON[m.key]}</span><div class="mtitle"><h3 id="mt-${m.key}">${m.label}</h3>${m.hint ? html`<span>${m.hint}</span>` : ''}</div>${status}</div>
        <div class="mitems">${list.map((s) => supplementItem(s, k))}</div>
      </div>`;
    })}</div>${cureNotes(k)}</section>`;
  }
  const FORM_KINDS = { checkin: { act: 'ci', field: 'checkins' }, meal: { act: 'meal', field: 'meals' }, symptom: { act: 'sym', field: 'symptoms' }, sport: { act: 'spt', field: 'sport' } };
  function rowActions(kind, k, id, what) {

  }
  const openForm = (type, k) => (S.ui.form && S.ui.form.type === type && S.ui.form.date === k ? S.ui.form : null);
  const formActions = (extra) => html`<div class="actions"><button type="button" class="primary" data-act="form-save">Enregistrer</button>${extra || ''}<button type="button" class="ghost" data-act="form-cancel">Annuler</button></div>`;
  function scaleField(sc, value) {
    return html`<fieldset class="scale"><legend>${sc.label}</legend><div class="dots">${[1, 2, 3, 4, 5].map((i) => html`<button type="button" class="dot${sc.faces ? ' emoji' : ''}" data-act="rate" data-scale="${sc.key}" data-v="${i}" aria-pressed="${bool(value === i)}" aria-label="${sc.label} ${i} sur 5">${sc.faces ? sc.faces[i - 1] : i}</button>`)}</div><div class="ends" aria-hidden="true"><span>${sc.lo}</span><span>${sc.hi}</span></div></fieldset>`;
  }

  /* Check-ins */
  function checkinBlock(k, d, isToday) {
    const list = listOf(d.checkins).sort(byTime);
    const f = openForm('checkin', k);
    let hint = '';
    if (isToday && !f) {
      const last = list.length ? toMin(list[list.length - 1].time) : null;
      const now = toMin(nowTime());
      if (!list.length) hint = now < 11 * 60 ? 'Premier check-in : comment tu te sens au réveil ?' : 'Pas encore de check-in aujourd’hui : comment tu te sens ?';
      else if (last != null && now < 23 * 60) {
        if (now >= last + 180) hint = `Un check-in maintenant ? Le dernier date de ${fromMin(last)}.`;
        else if (last + 180 < 23 * 60) hint = `Prochain check-in vers ${fromMin(last + 180)}`;
      }
    }
    return html`<section class="jsec" id="sec-checkins"><div class="sec-head"><h2>Comment je me sens</h2>${f ? '' : html`<button type="button" class="primary" data-act="ci-new" data-date="${k}">Nouveau check-in</button>`}</div>
      ${hint ? html`<p class="hint">${hint}</p>` : ''}
      ${f && !f.id ? checkinForm(f) : ''}
      ${list.length ? html`<ul class="list">${list.map((c) => (f && f.id === c.id ? html`<li class="editing">${checkinForm(f)}</li>` : checkinEntry(c, k)))}</ul>`
        : f ? '' : html`<p class="empty">Aucun check-in pour l’instant.</p>`}
      ${!f && hasJournal(d) ? html`<button type="button" class="link to-claude" data-act="to-claude">Faire le point avec Claude ↓</button>` : ''}

  /* Ce que je ressens (symptômes, sensations, effets secondaires) */

      <label class="field"><span>Qu’est-ce que tu ressens ?</span><textarea id="sym-text" data-draft="text" rows="3" placeholder="J’ai mal au bas du dos depuis ce matin, surtout assis…">${str(dr.text)}</textarea></label>

  /* Repas et macros */
  function nutritionSummary(d) {
    const t = sumMacros(dayItems(d)), goals = S.settings.goals;
    const hasGoals = hasNutriGoals(goals);
    if (!t.n && !hasGoals) return '';
    const bar = (cls, label, val, goal, unit) => {
      const w = goal ? Math.min(100, Math.round((val / goal) * 100)) : 0;
      return html`<div class="mbar ${cls}"><span>${label}</span><span class="track" aria-hidden="true"><i style="--w:${w}%"></i></span><b>${unit === 'kcal' ? fmtInt(val) : fmtG(val)}${goal ? ` / ${unit === 'kcal' ? fmtInt(goal) : fmtG(goal)}` : ''} ${unit}</b></div>`;
    };
    const over = goals.kcal && t.kcal > goals.kcal;
    return html`<div class="nutri" aria-label="Total du jour">
      <div class="nutri-top"><b class="${over ? 'over' : ''}">${fmtInt(t.kcal)}</b><span>${goals.kcal ? `sur ${fmtInt(goals.kcal)} kcal${over ? ` · ${fmtInt(t.kcal - goals.kcal)} de plus` : ` · reste ${fmtInt(goals.kcal - t.kcal)}`}` : 'kcal aujourd’hui'}</span></div>
      <div class="mbars">${MACROS.map(([key, label]) => bar('c-' + key, label, t[key], goals[key], 'g'))}</div>
      ${hasGoals ? '' : html`<p class="per100">Fixe tes objectifs (calories, protéines…) pour suivre ta progression. <button type="button" class="link" data-act="goto-settings" data-v="objectifs">Mes objectifs</button></p>`}
    </div>`;
  }
  function mealBlock(k, d) {
    const list = listOf(d.meals).sort(byTime);
    const f = openForm('meal', k);
    const entry = (m) => {
      const items = mealItems(m), t = sumMacros(items);
      const kind = str(m.kind) || 'Repas';
      return html`<li class="entry"><span class="t">${str(m.time)}</span><div class="e-body"><span class="kind">${kind}${t.n ? ` · ${fmtInt(t.kcal)} kcal` : ''}</span>${m.text ? html`<p class="note">${m.text}</p>` : ''}${items.length ? html`<ul class="items">${items.map((it) => html`<li>${it.name}<span>${num(it.grams) ? `${fmtDec(num(it.grams), 0)} g · ` : ''}${fmtInt(posNum(it.kcal) ?? 0)} kcal</span></li>`)}</ul><p class="macros">${macroLine(t)}</p>` : ''}</div>${rowActions('meal', k, m.id, `${kind.toLowerCase()} de ${str(m.time)}`)}</li>`;
    };
    return html`<section class="jsec" id="sec-meals"><div class="sec-head"><h2>Ce que j’ai mangé</h2>${f ? '' : html`<button type="button" class="primary" data-act="meal-new" data-date="${k}">Ajouter</button>`}</div>
      ${nutritionSummary(d)}
      ${f && !f.id ? mealForm(f) : ''}
      ${list.length ? html`<ul class="list">${list.map((m) => (f && f.id === m.id ? html`<li class="editing">${mealForm(f)}</li>` : entry(m)))}</ul>`
        : f ? '' : html`<p class="empty">Rien de noté pour l’instant.</p>`}
    </section>`;
  }
  function mealForm(f) {
    const dr = f.draft, it = dr.item, t = sumMacros(dr.items);
    const kinds = MEAL_KINDS.includes(dr.kind) ? MEAL_KINDS : [...MEAL_KINDS, dr.kind];
    const recents = recentFoods(f.date).filter((r) => !dr.items.some((x) => norm(x.name) === norm(r.name))).slice(0, 6);

    return html`<div class="form" role="group" aria-label="Repas">

        ${recents.length ? html`<div class="chips" role="group" aria-label="Aliments récents"><span class="chips-lbl">Récents</span>${recents.map((r) => html`<button type="button" data-act="item-recent" data-v="${r.name}">${r.name}${num(r.grams) ? ` · ${fmtDec(num(r.grams), 0)} g` : ''}</button>`)}</div>` : ''}
        <div class="food-add">
          <div class="row">
            <label class="field"><span>Aliment</span><input type="text" id="fi-name" data-item="name" list="food-names" value="${it.name}" placeholder="Riz, poulet, œuf…" autocomplete="off"></label>

            <label class="field"><span>Protéines (g)</span><input type="text" inputmode="decimal" id="fi-p" data-item="p" value="${it.p}" autocomplete="off"></label>
            <label class="field"><span>Glucides (g)</span><input type="text" inputmode="decimal" id="fi-g" data-item="g" value="${it.g}" autocomplete="off"></label>
            <label class="field"><span>Lipides (g)</span><input type="text" inputmode="decimal" id="fi-l" data-item="l" value="${it.l}" autocomplete="off"></label>
            <label class="field"><span>Calories (kcal)</span><input type="text" inputmode="decimal" id="fi-kcal" data-item="kcal" value="${it.kcal}" autocomplete="off"></label>
          </div>
          <p class="per100" id="fi-per100">${per100Text(food)}</p>
          <div class="actions">
            <button type="button" class="ghost" data-act="item-add">${dr.editItem ? 'Mettre à jour l’aliment' : 'Ajouter l’aliment'}</button>

      </div>

  const per100Text = (food) => (food
    ? `Pour 100 g : ${fmtInt(food.kcal)} kcal · ${macroLine(food)}${S.settings.foods.includes(food) ? ' (mes aliments)' : ' (valeur moyenne, ajuste avec l’étiquette)'}`
    : 'Choisis un aliment dans la liste pour remplir les macros, ou saisis-les toi-même : les calories se calculent toutes seules.');
  const blankItem = () => ({ name: '', grams: '', p: '', g: '', l: '', kcal: '', auto: true, kcalAuto: true, save: false });
  const valStr = (n) => (n == null ? '' : fmtDec(n));
  /* Saisie d'un aliment : met à jour les autres champs sans redessiner le formulaire. */
  function onItemInput(field, value) {
    const f = S.ui.form;
    if (!f || f.type !== 'meal') return;
    const it = f.draft.item;
    if (field === 'save') { it.save = !!value; return; }
    it[field] = value;
    if (field === 'name' || field === 'grams') {
      const food = findFood(it.name);
      if (field === 'name' && food) { it.auto = true; it.kcalAuto = true; }
      if (food && it.auto) {
        const v = scaleFood(food, posNum(it.grams));
        it.p = valStr(v.p); it.g = valStr(v.g); it.l = valStr(v.l); it.kcal = valStr(v.kcal);
      }
      const hint = document.getElementById('fi-per100');
      if (hint) hint.textContent = per100Text(food);
    } else if (field === 'kcal') {
      it.kcalAuto = !String(value).trim();
    } else {
      it.auto = false;
    }
    if (it.kcalAuto && field !== 'kcal' && !(findFood(it.name) && it.auto)) {
      const p = posNum(it.p), g = posNum(it.g), l = posNum(it.l);
      it.kcal = p == null && g == null && l == null ? '' : valStr(kcalOf(p ?? 0, g ?? 0, l ?? 0));
    }
    ['p', 'g', 'l', 'kcal'].forEach((key) => {
      const el = document.getElementById('fi-' + key);
      if (el && key !== field && el.value !== it[key]) el.value = it[key];
    });
  }
  /* Ajoute (ou met à jour) l'aliment en cours de saisie ; false s'il n'y a rien à ajouter. */
  function commitItem({ quiet } = {}) {
    const f = S.ui.form, dr = f.draft, it = dr.item;
    const name = String(it.name || '').trim();
    if (!name) { if (!quiet) toast('Écris le nom de l’aliment.'); return false; }
    const grams = posNum(it.grams), p = posNum(it.p) ?? 0, g = posNum(it.g) ?? 0, l = posNum(it.l) ?? 0;
    const kcal = posNum(it.kcal) ?? kcalOf(p, g, l);
    const entry = { id: dr.editItem || newId(), name: name.slice(0, 80), grams: grams ? round1(grams) : null, kcal: round1(kcal), p: round1(p), g: round1(g), l: round1(l) };
    const i = dr.items.findIndex((x) => x.id === entry.id);
    if (i >= 0) dr.items[i] = entry; else dr.items.push(entry);
    if (it.save && grams) {
      const per = { name: entry.name, kcal: (entry.kcal * 100) / grams, p: (entry.p * 100) / grams, g: (entry.g * 100) / grams, l: (entry.l * 100) / grams };
      mutateSettings((st) => {
        const j = st.foods.findIndex((x) => norm(x.name) === norm(per.name));
        const food = normalizeFood({ ...per, id: j >= 0 ? st.foods[j].id : newId() });
        if (j >= 0) st.foods[j] = food; else st.foods.unshift(food);
      }, false);
    } else if (it.save && !quiet) toast('Indique la quantité pour garder cet aliment (valeurs pour 100 g).');
    dr.item = blankItem();
    dr.editItem = null;
    return true;
  }

  function notesBlock(k, d) {
    return html`<section class="jsec"><div class="sec-head"><h2><label for="notes-${k}">Notes du jour</label></h2></div><textarea id="notes-${k}" class="notes" data-bind="notes" data-date="${k}" rows="4" placeholder="Cours, révisions, ce qui s’est passé…">${str(d.notes)}</textarea></section>`;
  }

  /* ---------- Claude ---------- */
  const canShare = () => !!capPlugin('Share') || (!!navigator.share && !PLATFORM.artifact && !PLATFORM.electron);
  const claudeUrl = () => S.settings.claudeUrl || 'https://claude.ai/new';
  /* Ce que fait « … Claude » ici : demander dans la page (artefact), partager (Android) ou copier. */
  const claudeVerb = (prefix = '') => (store.sample ? `${prefix}demander à Claude` : canShare() ? `${prefix}envoyer à Claude` : `${prefix}copier pour Claude`).replace(/^./, (c) => c.toUpperCase());
  const scopeLabel = (scope, key) => (scope === 'dossier' ? 'dossier santé' : scope === 'days' ? plural(key.split(',').length, 'journée') : scope === 'week' ? weekTitle(key).replace(/^Semaine/, 'semaine')
    : scope === 'visit' ? `bilan de la visite du ${shortDate(key)}` : `journée du ${longDate(key).replace(/^./, (c) => c.toLowerCase())}`);
  const SCOPE_TEXT = {
    day: {
      title: 'Faire le point avec Claude',
      what: 'Claude reçoit tout ce que tu as noté ce jour-là : sommeil, compléments, check-ins, symptômes, repas et macros, notes.',
      placeholder: 'Pourquoi j’ai mal au dos depuis trois jours ?'
    },
    week: {
      title: 'Faire le point de la semaine avec Claude',
      what: 'Claude reçoit toute la semaine, jour par jour : sommeil, compléments, check-ins, symptômes, repas et macros, notes.',
      placeholder: 'Qu’est-ce qui a changé cette semaine ?'
    },
    visit: {
      title: 'Bilan du mois avec Claude',
      what: 'Claude reçoit ta visite (poids, prise de sang, médecin) et les 4 semaines d’avant : régularité des compléments, sommeil, check-ins, ressenti, repas et macros, notes.',
      placeholder: 'Est-ce que j’ai des carences ? Quelles questions poser au médecin ?'
    }
  };

  function claudeBlock(scope, key) {
    const a = S.ui.ask, txt = SCOPE_TEXT[scope];
    const sent = scope !== 'week' ? (peekDay(key) || {}).sent : null;
    return html`<section class="jsec claude" id="claude" aria-labelledby="claude-title">
      <div class="sec-head"><h2 id="claude-title">${txt.title}</h2>${isObj(sent) ? html`<span class="pill sent">${ICON.check}Envoyée ${fmtStamp(sent.at)}</span>` : ''}</div>
      ${navigator.onLine === false ? html`<p class="hint offline">Hors ligne : tout est enregistré sur cet appareil. Envoie à Claude dès que tu retrouves du réseau, ce soir avec le wifi par exemple.</p>` : ''}
      <p class="hint">${txt.what}${hasProfile() ? ' Ton profil santé est ajouté.' : ' Remplis ton profil santé (Réglages) pour que Claude te connaisse : âge, taille, traitements.'}</p>
      <label class="field"><span>Ta question (facultatif)</span><textarea id="ask-q" data-ask="q" rows="2" placeholder="${txt.placeholder}">${a.q}</textarea></label>
      <div class="ask-opts">
        ${scope === 'day' ? html`<label class="switch"><input type="checkbox" id="ask-week" data-ask="withWeek"${a.withWeek ? html` checked` : ''}> Ajouter les 6 jours d’avant</label>` : ''}
        ${store.sample && store.sampleImages ? html`<label class="ghost filebtn">${a.photo ? `Photo : ${a.photo.name}` : 'Joindre une photo (prise de sang, ordonnance…)'}<input type="file" id="ask-photo" data-ask="photo" accept="${store.sampleImages.mediaTypes ? store.sampleImages.mediaTypes.join(',') : 'image/jpeg,image/png,image/webp,image/gif'}" class="sr-only"></label>${a.photo ? html`<button type="button" class="link" data-act="ask-photo-clear">Retirer la photo</button>` : ''}` : ''}
      </div>
      ${askArea(scope, key)}
      <details class="report-box" data-toggle="report"${a.showReport ? html` open` : ''}><summary>Voir le texte pour Claude</summary><textarea readonly id="report-text" class="export" rows="12">${claudeText(scope, key)}</textarea></details>
    </section>`;
  }
  function askArea(scope, key) {
    const a = S.ui.ask, mine = a.scope === scope && a.key === key;
    const busy = mine && (a.status === 'thinking' || a.status === 'streaming');
    const saved = !['week', 'days', 'dossier'].includes(scope) && !(mine && (a.text || busy)) ? (peekDay(key) || {}).claude : null;
    const text = mine && a.text ? a.text : isObj(saved) ? str(saved.text) : '';
    const primary = store.sample ? 'ask' : canShare() ? 'share' : 'copy';
    const btn = (act, label, isPrimary) => html`<button type="button" class="${isPrimary ? 'primary' : 'ghost'}" data-act="${act}" data-scope="${scope}" data-key="${key}">${label}</button>`;
    return html`<div id="ask-area" class="ask-area" data-scope="${scope}" data-key="${key}">
      <div class="actions">
        ${store.sample ? (busy ? html`<button type="button" class="ghost" data-act="ask-stop">Arrêter</button>` : btn('claude-ask', text ? 'Redemander à Claude' : 'Demander à Claude', true)) : ''}
        ${canShare() ? btn('claude-share', 'Envoyer à Claude', primary === 'share') : ''}
        ${btn('claude-copy', 'Copier pour Claude', primary === 'copy')}
        <a class="ghost linkbtn" href="${claudeUrl()}"${PLATFORM.native ? '' : html` target="_blank" rel="noopener"`}>${S.settings.claudeUrl ? 'Ouvrir mon projet Claude ↗' : 'Ouvrir Claude ↗'}</a>
      </div>
      ${mine && a.status === 'thinking' ? html`<p class="thinking" role="status">Claude lit ton journal…</p>` : ''}
      ${text ? html`<div class="answer"${busy ? html` aria-busy="true"` : ''}>${!mine && isObj(saved) ? html`<p class="answer-meta">Réponse de Claude${saved.at ? ` · ${fmtStamp(saved.at)}` : ''}${saved.q ? ` · « ${str(saved.q).slice(0, 80)} »` : ''}</p>` : ''}${mdToHtml(text)}</div>
        ${busy ? '' : html`<div class="actions"><button type="button" class="link" data-act="answer-copy" data-scope="${scope}" data-key="${key}">Copier la réponse</button></div>`}` : ''}
      ${mine && a.error ? html`<p class="ask-error" role="alert">${a.error}</p>` : ''}
    </div>`;
  }
  function renderAsk() {
    const a = S.ui.ask, el = document.getElementById('ask-area');
    if (!el || el.dataset.scope !== a.scope || el.dataset.key !== a.key) return;
    const keep = focusedButton();
    el.outerHTML = String(askArea(a.scope, a.key));
    if (keep) { const b = view.querySelector(keep); if (b) b.focus({ preventScroll: true }); }
  }
  function fmtStamp(iso) {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '' : `le ${d.getDate()} ${MONTHS[d.getMonth()]} à ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  /* Markdown simple (titres, listes, gras) → HTML, après échappement : rien de la réponse n'est interprété comme du code. */
  function mdToHtml(text) {
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<em>$2</em>');
    const out = [];
    let list = null;
    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    String(text).replace(/\r/g, '').split('\n').forEach((line) => {
      const t = line.trim();
      let m;
      if (!t) { close(); return; }
      if ((m = /^#{1,6}\s+(.*)$/.exec(t))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); return; }
      if ((m = /^[-*•]\s+(.*)$/.exec(t))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); return; }
      if ((m = /^\d+[.)]\s+(.*)$/.exec(t))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); return; }
      close();
      out.push(`<p>${inline(t)}</p>`);
    });
    close();
    return trusted(out.join(''));
  }

  /* Rapports texte : ce que Claude lit, et ce qui est copié ou partagé. */
  /* La visite de ce jour : pesée (et évolution), prise de sang, médecin. */
  function visitLines(k) {
    const d = peekDay(k) || {}, vis = visitOf(d) || {}, labs = isObj(vis.labs) ? vis.labs : {};
    const L = [];
    const done = [vis.blood ? 'prise de sang faite' : '', vis.doctor ? 'médecin vu' : ''].filter(Boolean);
