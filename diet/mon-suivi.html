    if (bar) { const top = bar.getBoundingClientRect().top + window.scrollY - (document.querySelector('.top') || { offsetHeight: 60 }).offsetHeight; if (window.scrollY > top) window.scrollTo(0, top); }
  }
  function dayTabBar(k, d, cur) {
    const st = stats(k), ml = waterOf(d), cis = listOf(d.checkins).length, visit = hasVisit(k);
    const badge = { supps: st.total ? `${st.taken}/${st.total}` : '', repas: ml ? `${fmtL(ml)} L` : '', journal: cis ? String(cis) : '', visite: '', claude: (peekDay(k) || {}).sent ? '✓' : '' };

  /* Le moment de la journée à mettre en avant : aujourd'hui, celui en cours s'il reste quelque chose, sinon le prochain

  /* Le jour de la visite, l'aperçu l'annonce et ouvre son onglet. */
  function visitTeaser(k, d) {

        ${summaryTiles(k, d)}

  /* Les rappels du jour dans une seule carte compacte, en tête de l'aperçu. */
  function todoCard(k, isToday) {

  /* « Premiers pas » en une ligne : la prochaine étape et la progression. */

  const HOME_ACTIONS = {

  function displaySettings() {

  /* ---------- Rendu : Jour ---------- */
  function renderDay() {

  /* Résumé du jour : quatre anneaux qui mènent chacun à sa section. */

        <label class="field"><span>Autres résultats ou compte rendu du labo</span><textarea id="vlabs-${k}" data-visit="labsText" data-date="${k}" rows="3" placeholder="Colle ici le reste du compte rendu…">${str(vis.labsText)}</textarea></label>
      </details>
      <label class="field"><span>Ce que dit le médecin</span><textarea id="vnotes-${k}" data-visit="notes" data-date="${k}" rows="3" placeholder="Conseils, changement de dose, examens à faire…">${str(vis.notes)}</textarea></label>
      <p class="hint" style="margin:12px 0 0">Les résultats arrivent souvent un ou deux jours après : reviens les noter ici. Ton bilan du mois pour Claude est en bas de la page.</p>
    </section>`;
  }
  function vitalsBlock(k, vis) {
    const reads = vitalsRead(vis), female = S.settings.health.sex === 'femme';
    const val = (key) => { const x = vis[key]; return x == null ? '' : typeof x === 'number' ? fmtDec(x) : str(x); };
    const inp = (key, label, ph, mode = 'numeric') => html`<label class="field"><span>${label}</span><input type="text" inputmode="${mode}" id="vm-${key}-${k}" data-vm="${key}" data-date="${k}" value="${val(key)}" placeholder="${ph}" autocomplete="off"></label>`;
    const prev = [...Object.keys(S.months)].sort().flatMap((mk) => Object.keys(S.months[mk].days || {}).sort()).filter((dk) => dk < k && hasVitals(visitOf(peekDay(dk)))).slice(-3);
    return html`<div class="vitals" role="group" aria-labelledby="vit-${k}">
      <h3 class="vsub" id="vit-${k}"><span class="bpm-ico sm" aria-hidden="true">${ICON.heart}</span>Tension, pouls et mesures</h3>
      <div class="vgrid">
        <div class="field"><span id="bp-l-${k}">Tension (mmHg)</span><div class="bp-in" role="group" aria-labelledby="bp-l-${k}"><input type="text" inputmode="numeric" id="vm-sys-${k}" data-vm="sys" data-date="${k}" value="${val('sys')}" placeholder="120" aria-label="Tension haute (systolique)" autocomplete="off"><span aria-hidden="true">/</span><input type="text" inputmode="numeric" id="vm-dia-${k}" data-vm="dia" data-date="${k}" value="${val('dia')}" placeholder="80" aria-label="Tension basse (diastolique)" autocomplete="off"></div></div>
        ${inp('pulse', 'Pouls au repos (bpm)', '50 à 100')}

        ${inp('temp', 'Température (°C)', '35,5 à 37,5', 'decimal')}
        ${inp('waist', 'Tour de taille (cm)', female ? 'moins de 80' : 'moins de 94', 'decimal')}
      </div>
      <div data-patch="vreads-${k}">${reads.length ? html`<ul class="vreads">${reads.map((r) => html`<li class="vread ${r.level}"><span class="vdot" aria-hidden="true"></span><span class="vr-txt"><b>${r.what} : ${r.value}</b><span class="vbadge">${r.label}<span class="sr-only"> (${LEVEL_TXT[r.level]})</span></span>${r.tip ? html`<small>${r.tip}</small>` : ''}</span></li>`)}</ul>` : ''}</div>
      ${prev.length ? html`<p class="vhist">Avant : ${prev.map((dk) => `${shortDate(dk)} · ${vitalsRead(visitOf(peekDay(dk))).filter((r) => r.key === 'bp' || r.key === 'pulse').map((r) => r.value).join(', ') || 'mesures notées'}`).join('  —  ')}</p>` : ''}
      <p class="hint" style="margin:6px 0 0">Tension : assis, au calme depuis 5 minutes, bras posé à hauteur du cœur ; fais 2 mesures à 1 minute d’écart et note la moyenne des deux. Repères d’adulte au repos : ton médecin juge selon ton cas.</p>
    </div>`;
  }
  /* Visite pas faite ce jour-là : on la reporte (les suivantes repartent de la nouvelle date). */
  function visitMoveRow(k) {
    const from = k > todayKey() ? k : todayKey();
    const days = Array.from({ length: 7 }, (_, i) => addDays(from, i + 1));
    const lbl = (dk) => (dk === addDays(todayKey(), 1) ? 'Demain' : `${WD_SHORT[weekdayOf(dk)]} ${fromKey(dk).getDate()}`);
    return html`<div class="vmove" role="group" aria-labelledby="vmove-${k}">
      <span id="vmove-${k}">Pas faite ${k === todayKey() ? 'aujourd’hui' : 'ce jour-là'} ? Reporter à :</span>
      <div class="chips">${days.map((dk) => html`<button type="button" data-act="visit-move" data-from="${k}" data-v="${dk}" aria-label="Reporter la visite au ${longDate(dk)}">${lbl(dk)}</button>`)}</div>
    </div>`;
  }
  const visitIsEmpty = (vis) => !vis || (!vis.blood && !vis.doctor && !num(vis.weight) && !labsFilled(vis) && !str(vis.notes).trim() && !hasVitals(vis));
  function weekStrip(k) {
    const start = startOfWeek(k), t = todayKey();
    const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    return html`<div class="strip" role="group" aria-label="Jours de la semaine">${days.map((dk, i) => {
      const st = stats(dk), pct = st.total ? Math.round((st.taken / st.total) * 100) : 0, v = hasVisit(dk), ap = apptsOn(dk);
      const label = longDate(dk) + (st.total ? `, ${st.taken} sur ${st.total} compléments` : '') + (v ? ', visite médicale' : '') + ap.map((a) => `, ${a.title}${a.time ? ` à ${a.time}` : ''}`).join('');
      return html`<button type="button" class="lid${dk === t ? ' today' : ''}${v ? ' visit' : ''}${ap.length ? ' has-appt' : ''}" data-act="goto" data-date="${dk}"${dk === k ? html` aria-current="date"` : ''} aria-label="${label}"><span class="wd">${WD_SHORT[i]}</span><span class="dn">${fromKey(dk).getDate()}</span><span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span></button>`;
    })}</div>`;
  }
  function weeklyBanner() {
    return S.settings.supplements.filter((s) => s.active && s.freq === 'weekly' && s.weekday == null).map((s) => html`<div class="banner">
      <p><label for="wk-${s.id}">${s.name} : quel jour de la semaine ?</label></p>
      <select id="wk-${s.id}" data-weekly="${s.id}"><option value="">Choisir le jour</option>${WD_LONG.map((w, i) => html`<option value="${i}">${cap1(w)}</option>`)}</select>
    </div>`);
  }
  function sleepBlock(k, d, isToday) {
    const prev = peekDay(addDays(k, -1));
    const wake = str(d.wake), night = nightLength(prev && prev.bed, wake);
    return html`<section class="card" id="sec-sleep" aria-labelledby="sleep-title">
      <div class="card-head"><span class="scene" aria-hidden="true">${SCENE.soir}</span><h2 id="sleep-title">Sommeil</h2><span data-patch="night-${k}">${night ? html`<span class="pill">Nuit de ${night}</span>` : ''}</span></div>
      <div class="sleep">
        <label class="field"><span>Réveil</span><input type="time" id="wake-${k}" data-bind="wake" data-date="${k}" value="${wake}"></label>
        <label class="field"><span>Coucher</span><input type="time" id="bed-${k}" data-bind="bed" data-date="${k}" value="${str(d.bed)}"></label>
        ${!wake && isToday && new Date().getHours() >= 5 ? html`<button type="button" class="chip" data-act="wake-now" data-date="${k}">Je viens de me lever</button>` : ''}
        ${bedNowOffer(k, d, isToday) ? html`<button type="button" class="chip night" data-act="bed-now">Je vais me coucher</button>` : ''}
      </div>
      <p class="hint" style="margin:10px 0 0">La nuit va du coucher de la veille au réveil du matin. Couché après minuit ? « Je vais me coucher » la range sur la bonne nuit.</p>
    </section>`;
  }
  /* « Je vais me coucher » : le soir dès 18 h, ou après minuit (jusqu'à 5 h) pour la nuit de la veille. */
  function bedNowOffer(k, d, isToday) {
    if (!isToday) return false;
    const h = new Date().getHours();
    if (h >= 18) return !str(d.bed);
    if (h < 5) return !str((peekDay(addDays(k, -1)) || {}).bed);
    return false;
  }
  function supplementItem(s, k) {
    const on = isTaken(s.id, k), just = S.ui.just === `${s.id}|${k}`;
    const ph = s.cure && curePhase(s.cure, k), inCure = ph && ph.phase === 'prise';
    return html`<button type="button" class="item${on ? ' on' : ''}" data-act="toggle" data-sid="${s.id}" data-date="${k}" aria-pressed="${bool(on)}"><span class="cap${on ? ' on' : ''}${just ? ' just' : ''}" aria-hidden="true">${on ? ICON.check : ''}</span><span class="it-main"><span class="it-name">${s.name}</span>${s.dose ? html`<span class="it-dose">${s.dose}</span>` : ''}${s.note ? html`<span class="it-note">${s.note}</span>` : ''}${inCure ? html`<span class="it-cure"><span class="freq cure${ph.left === 1 ? ' last' : ''}">${ph.left === 1 ? 'Dernier jour de cure' : `Cure · semaine ${ph.week} sur ${ph.of}`}</span></span>` : ''}</span>${FREQ_BADGE[s.freq] ? html`<span class="freq">${FREQ_BADGE[s.freq]}</span>` : ''}</button>`;
  }
  const lowDate = (k) => longDate(k).replace(/^./, (c) => c.toLowerCase());
  /* Compléments en pause de cure (ou pas encore commencés) ce jour-là : une ligne chacun, avec la date de reprise. */
  function cureNotes(k) {
    const list = S.settings.supplements.filter((s) => s.active && s.cure && !isTaken(s.id, k) && curePhase(s.cure, k).phase !== 'prise' && !(s.since && k < s.since));
    if (!list.length) return '';
    return html`<ul class="cure-notes">${list.map((s) => {
      const ph = curePhase(s.cure, k), gap = daysBetween(todayKey(), ph.next), when = gap >= 0 ? ` (${whenLabel(gap)})` : '';
      const txt = ph.phase === 'avant' ? `Début de la cure le ${lowDate(ph.next)}${when} · ${cureRule(s.cure)}`
        : `En pause, semaine ${ph.week} sur ${ph.of} · reprise le ${lowDate(ph.next)}${when}`;
      return html`<li class="m-${s.moment}"><span class="mico" aria-hidden="true">${ph.phase === 'avant' ? ICON.pill : ICON.pause}</span><span class="ctxt"><b>${s.name}${s.dose ? ` ${s.dose}` : ''}</b><span>${txt}</span></span></li>`;
    })}</ul>`;
  }
  function supplementBlock(k) {
    const items = itemsForDay(k), st = stats(k);
    const pct = st.total ? st.taken / st.total : 0, all = st.total > 0 && st.taken === st.total;
    const streak = k === todayKey() ? suppStreak() : { n: 0 };
    const head = html`<div class="supps-head"><div><h2>Compléments</h2><p class="sub${all ? ' done' : ''}">${!st.total ? 'Rien de prévu ce jour-là' : all ? 'Tout est pris' : `${st.taken} sur ${st.total} pris`}${streak.n >= 2 ? html` · <span class="streak-txt">${ICON.flame}${streak.n} jours d’affilée</span>` : ''}</p></div>${st.total ? html`<div class="ring" style="--p:${pct.toFixed(3)}" role="img" aria-label="${st.taken} sur ${st.total} compléments pris"><span>${Math.round(pct * 100)} %</span></div>` : ''}</div>`;
    if (!items.length) return html`<section class="card supps" id="sec-supps">${head}${S.settings.supplements.length ? '' : html`<p class="empty">Ajoute tes compléments dans Réglages.</p>`}${cureNotes(k)}</section>`;
    return html`<section class="card supps" id="sec-supps">${head}<div class="moments">${MOMENTS.map((m) => {
      const list = items.filter((s) => s.moment === m.key);
      return list.length ? momentGroup(m, k, list) : '';
    })}</div>${cureNotes(k)}</section>`;
  }
  function momentGroup(m, k, list) {
    const sch = list.filter((s) => isScheduled(s, k)), done = sch.filter((s) => isTaken(s.id, k)).length;
    const status = !sch.length ? ''
      : done === sch.length ? html`<span class="mdone">${ICON.check}Fait</span>`
      : html`<span class="mcount" aria-label="${done} sur ${sch.length} pris">${done}/${sch.length}</span><button type="button" class="mall" data-act="moment-all" data-v="${m.key}" data-date="${k}" aria-label="Tout cocher : ${m.label}">Tout cocher</button>`;
    return html`<div class="moment m-${m.key}" role="group" aria-labelledby="mt-${m.key}">
      <div class="moment-head"><span class="scene" aria-hidden="true">${SCENE[m.key]}</span><div class="mtitle"><h3 id="mt-${m.key}">${m.label}</h3>${m.hint ? html`<span>${m.hint}</span>` : ''}</div>${status}</div>

  }
  const FORM_KINDS = { checkin: { act: 'ci', field: 'checkins' }, meal: { act: 'meal', field: 'meals' }, symptom: { act: 'sym', field: 'symptoms' }, sport: { act: 'spt', field: 'sport' } };
  function rowActions(kind, k, id, what) {
    if (S.ui.confirm === `${kind}:${id}`) {
      return html`<span class="row-actions"><button type="button" class="link danger" data-act="${kind}-del" data-date="${k}" data-id="${id}" aria-label="Oui, supprimer ${what}">Oui, supprimer</button><button type="button" class="link" data-act="confirm-cancel">Non</button></span>`;
    }
    return html`<span class="row-actions"><button type="button" class="link" data-act="${kind}-edit" data-date="${k}" data-id="${id}" aria-label="Modifier ${what}">Modifier</button><button type="button" class="link" data-act="${kind}-ask" data-date="${k}" data-id="${id}" aria-label="Supprimer ${what}">Supprimer</button></span>`;

  const openForm = (type, k) => (S.ui.form && S.ui.form.type === type && S.ui.form.date === k ? S.ui.form : null);
  const formActions = (extra) => html`<div class="actions"><button type="button" class="primary" data-act="form-save">Enregistrer</button>${extra || ''}<button type="button" class="ghost" data-act="form-cancel">Annuler</button></div>`;
  function scaleField(sc, value) {
    return html`<fieldset class="scale"><legend>${sc.label}</legend><div class="dots">${[1, 2, 3, 4, 5].map((i) => html`<button type="button" class="dot${sc.faces ? ' emoji' : ''}" data-act="rate" data-scale="${sc.key}" data-v="${i}" aria-pressed="${bool(value === i)}" aria-label="${sc.label} ${i} sur 5">${sc.faces ? sc.faces[i - 1] : i}</button>`)}</div><div class="ends" aria-hidden="true"><span>${sc.lo}</span><span>${sc.hi}</span></div></fieldset>`;
  }

  /* Check-ins */
  function checkinBlock(k, d, isToday) {
    const list = listOf(d.checkins).sort(byTime);
    const f = openForm('checkin', k);
    let hint = '';
    if (isToday && !f) {
      const last = list.length ? toMin(list[list.length - 1].time) : null;
      const now = toMin(nowTime());
      if (!list.length) hint = now < 11 * 60 ? 'Premier check-in : comment tu te sens au réveil ?' : 'Pas encore de check-in aujourd’hui : comment tu te sens ?';

        : f ? '' : html`<p class="empty">Aucun check-in pour l’instant.</p>`}

  function checkinEntry(c, k) {

  function checkinForm(f) {
    const dr = f.draft;

  /* Ce que je ressens (symptômes, sensations, effets secondaires) */

  /* Repas et macros */
  function nutritionSummary(k, d) {
    const t = sumMacros(dayItems(d)), goals = S.settings.goals;
    const hasGoals = hasNutriGoals(goals);

    const bar = (cls, label, val, goal, unit) => {

      ${hasGoals ? '' : html`<p class="per100">Fixe tes objectifs (calories, protéines…) pour suivre ta progression. <button type="button" class="link" data-act="goto-settings" data-v="objectifs">Mes objectifs</button></p>`}

  function mealBlock(k, d) {

  /* Markdown simple (titres, listes, gras) → HTML, après échappement : rien de la réponse n'est interprété comme du code. */
  function mdToHtml(text) {
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<em>$2</em>');

    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    String(text).replace(/\r/g, '').split('\n').forEach((line) => {
      const t = line.trim();
      let m;
      if (!t) { close(); return; }
      if ((m = /^#{1,6}\s+(.*)$/.exec(t))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); return; }
      if ((m = /^[-*•]\s+(.*)$/.exec(t))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); return; }

      close();
      out.push(`<p>${inline(t)}</p>`);

  /* Rapports texte : ce que Claude lit, et ce qui est copié ou partagé. */

  function visitLines(k) {

    else L.push('- Poids : pas encore noté');

        .filter((dk) => dk < k && bpClass(vitalOf(visitOf(peekDay(dk)), 'sys'), vitalOf(visitOf(peekDay(dk)), 'dia'))).slice(-5);
      if (bpHist.length) L.push(`  - Tensions d’avant : ${bpHist.map((dk) => { const v2 = visitOf(peekDay(dk)); return `${shortDate(dk)} ${vitalOf(v2, 'sys')}/${vitalOf(v2, 'dia')}`; }).join(' → ')}`);
    } else L.push('- Tension et pouls : pas encore notés');
    const got = LABS.filter(([key]) => str(labs[key]).trim());
    if (got.length) {
      L.push('- Prise de sang (valeur notée ; entre parenthèses, repère habituel) :');
      got.forEach(([key, label, ref, note]) => L.push(`  - ${label} : ${str(labs[key]).trim()} (${labRef(key, ref)})${note ? ` — ${note.toLowerCase()}` : ''}`));
    } else if (!str(vis.labsText).trim()) L.push('- Prise de sang : résultats pas encore notés');
    if (str(vis.labsText).trim()) L.push(`- Autres résultats : ${str(vis.labsText).trim()}`);

  function dayReport(k, { compact, skipVisit } = {}) {
    const d = peekDay(k) || {}, prev = peekDay(addDays(k, -1)) || {};
    const L = [];
    const night = nightLength(prev.bed, d.wake), weight = weightOf(d);
    const sch = scheduledFor(k), taken = sch.filter((s) => isTaken(s.id, k)), missed = sch.filter((s) => !isTaken(s.id, k));
    const extra = S.settings.supplements.filter((s) => !isScheduled(s, k) && isTaken(s.id, k));
    const cis = listOf(d.checkins).sort(byTime), syms = listOf(d.symptoms).sort(byTime), meals = listOf(d.meals).sort(byTime);
    const tot = sumMacros(dayItems(d));
    const scoreLine = (c) => SCALES.map((sc) => { const v = scaleValue(c[sc.key]); return v ? `${sc.label.toLowerCase()} ${v}` : ''; }).filter(Boolean).join(', ');
    if (compact) {
      const parts = [];
      if (night) parts.push(`nuit ${night}`);
      if (waterOf(d)) parts.push(`eau ${fmtL(waterOf(d))} L`);
      if (sportOf(d).length) parts.push(`sport ${sportOf(d).map((a) => `${entryName(a).toLowerCase()}${a.minutes ? ` ${a.minutes} min` : ''}`).join(', ')}`);
      if (stepsOf(d)) parts.push(`${fmtInt(stepsOf(d))} pas`);
      if (weight) parts.push(`${fmtDec(weight)} kg`);
      if (sch.length) parts.push(`compléments ${taken.length}/${sch.length}`);
      const avg = SCALES.map((sc) => { const v = avgScale(k, sc.key); return v != null ? `${sc.label.toLowerCase()} ${fmtAvg(v)}` : ''; }).filter(Boolean);
      if (avg.length) parts.push(avg.join(', '));
      if (tot.n) parts.push(`${fmtInt(tot.kcal)} kcal (${macroLine(tot)})`);
      if (syms.length) parts.push('ressenti : ' + syms.map((s) => `${str(s.text)}${scaleValue(s.intensity) ? ` ${s.intensity}/5` : ''}`).join(' ; '));
      if (str(d.notes).trim()) parts.push(`notes : ${str(d.notes).trim().replace(/\s+/g, ' ').slice(0, 200)}`);
      if (apptsOn(k).length) parts.push(`rendez-vous : ${apptsOn(k).map((a) => `${a.title}${a.time ? ` ${a.time}` : ''}`).join(', ')}`);
      return `- ${longDate(k)} : ${parts.length ? parts.join(' · ') : 'rien de noté'}`;
    }
    L.push(`## ${longDate(k)} ${fromKey(k).getFullYear()}`.replace(/(\d{4}) \1$/, '$1'));
    const ap = apptsOn(k);

    const names = days.map((dk) => (dk === t ? 'aujourd’hui' : dk === addDays(t, -1) ? 'hier' : `${WD_LONG[weekdayOf(dk)]} ${dayNumber(fromKey(dk).getDate())}`));
    const lastN = names[names.length - 1];
    const list = names.length > 3 ? `du ${names[0]} ${/^(hier|aujourd’hui)$/.test(lastN) ? 'jusqu’à' : 'au'} ${lastN}` : names.length > 1 ? `${names.slice(0, -1).join(', ')} et ${lastN}` : names[0];
    const off = navigator.onLine === false;
    const title = onlyToday ? 'Ce soir : envoie ta journée à Claude' : `${plural(days.length, 'journée')} pas encore envoyée${days.length > 1 ? 's' : ''} à Claude`;
    const text = `${onlyToday ? 'Tout ce que tu as noté aujourd’hui part en un seul texte.' : `${cap1(list)}, en un seul envoi.`}${off ? ' Pas de réseau pour l’instant : c’est enregistré, envoie dès que tu as le wifi.' : ''}`;
    const label = canShare() ? 'Envoyer à Claude' : store.sample && scope !== 'days' ? 'Demander à Claude' : 'Copier pour Claude';
    return html`<div class="banner send" role="note"><span class="mico" aria-hidden="true">${ICON.send}</span><p class="btxt"><b>${title}</b><span>${text}</span></p><div class="actions"><button type="button" class="primary" data-act="send-pending" data-scope="${scope}" data-key="${key}">${label}</button><button type="button" class="link" data-act="send-done" data-key="${key}">Déjà fait</button></div></div>`;
  }
  function scrollToClaude() { showSection('claude'); }
  /* Le bouton « … Claude » du check-in : la meilleure action possible ici. */
  function claudeGo(k) {
    const scope = hasVisit(k) ? 'visit' : 'day';
    if (store.sample) { askClaude(scope, k); scrollToClaude(); }
    else if (canShare()) shareClaude(scope, k);
    else { copyClaude(scope, k); scrollToClaude(); }
  }

  /* ---------- Rendu : Semaine ---------- */
  function renderWeek() {
    const start = S.ui.weekOf, t = todayKey();
    const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    const rows = MOMENTS.map((m) => {
      const sups = S.settings.supplements.filter((s) => s.moment === m.key && days.some((dk) => isScheduled(s, dk) || isTaken(s.id, dk)));
      if (!sups.length) return '';
      return html`<tr class="grp m-${m.key}"><th colspan="8" scope="colgroup">${m.label}${m.hint ? html` <span>${m.hint}</span>` : ''}</th></tr>${sups.map((s) => html`<tr class="m-${m.key}"><th scope="row">${s.name}${s.dose ? html` <small>${s.dose}</small>` : ''}</th>${days.map((dk) => {
        const on = isTaken(s.id, dk);
        if (!on && !isScheduled(s, dk)) return html`<td></td>`;
        return html`<td><button type="button" class="mini${on ? ' on' : ''}" data-act="toggle" data-sid="${s.id}" data-date="${dk}" aria-pressed="${bool(on)}" aria-label="${s.name}, ${longDate(dk)}">${on ? ICON.check : ''}</button></td>`;
      })}</tr>`)}`;
    });
    const cell = (fn) => days.map((dk) => html`<td>${fn(dk, peekDay(dk) || {})}</td>`);
    const summary = [
      html`<tr><th scope="row">Pris</th>${cell((dk) => { const st = stats(dk); return st.total ? `${st.taken}/${st.total}` : ''; })}</tr>`,
      html`<tr><th scope="row">Réveil</th>${cell((dk, d) => str(d.wake))}</tr>`,
      html`<tr><th scope="row">Eau <small>L</small></th>${cell((dk, d) => (waterOf(d) ? fmtL(waterOf(d)) : ''))}</tr>`,
      html`<tr><th scope="row">Calories</th>${cell((dk, d) => { const x = sumMacros(dayItems(d)); return x.n ? fmtInt(x.kcal) : ''; })}</tr>`,
      html`<tr><th scope="row">Protéines <small>g</small></th>${cell((dk, d) => { const x = sumMacros(dayItems(d)); return x.n ? fmtG(x.p) : ''; })}</tr>`,
      SCALES.map((sc) => html`<tr><th scope="row">${sc.label}${sc.faces ? '' : html` <small>sur 5</small>`}</th>${days.map((dk) => {
        const v = avgScale(dk, sc.key);
        if (v == null) return html`<td></td>`;
        if (sc.faces) return html`<td><span role="img" aria-label="${sc.label} ${fmtAvg(v)} sur 5">${sc.faces[Math.min(4, Math.max(0, Math.round(v) - 1))]}</span></td>`;
        return html`<td>${fmtAvg(v)}</td>`;
      })}</tr>`),
      html`<tr><th scope="row">Sport <small>min</small></th>${cell((dk, d) => { const m = minutesOf(sportOf(d)); return m ? String(m) : ''; })}</tr>`,
      html`<tr><th scope="row">Pas</th>${cell((dk, d) => (stepsOf(d) ? fmtInt(stepsOf(d)) : ''))}</tr>`,
      html`<tr><th scope="row">Ressenti</th>${cell((dk, d) => { const n = listOf(d.symptoms).length; return n ? String(n) : ''; })}</tr>`
    ];
    return html`<div class="wk-head"><h2 class="wk-title">${weekTitle(start)}</h2><div class="daynav">
        ${start !== startOfWeek(t) ? html`<button type="button" class="ghost" data-act="week-now">Cette semaine</button>` : ''}
        <button type="button" class="icon" data-act="week-prev" aria-label="Semaine précédente">${ICON.left}</button>
        <button type="button" class="icon" data-act="week-next" aria-label="Semaine suivante">${ICON.right}</button>
      </div></div>
      <p class="hint">Touche une gélule pour la cocher, ou un jour pour ouvrir son journal.</p>
      <div class="scroller"><table class="week"><thead><tr><th scope="col"><span class="sr-only">Complément</span></th>${days.map((dk, i) => html`<th scope="col"${dk === t ? html` class="today"` : ''}><button type="button" data-act="goto" data-date="${dk}" aria-label="${longDate(dk)}${hasVisit(dk) ? ', visite médicale' : ''}${apptsOn(dk).map((a) => `, ${a.title}${a.time ? ` à ${a.time}` : ''}`).join('')}"><span>${WD_SHORT[i]}</span><b>${fromKey(dk).getDate()}</b>${hasVisit(dk) ? html`<small class="vtag" aria-hidden="true">Visite</small>` : ''}${apptsOn(dk).slice(0, 2).map((a) => html`<small class="vtag rtag" aria-hidden="true">${a.title}</small>`)}</button></th>`)}</tr></thead>
      <tbody>${rows}</tbody><tbody class="sum">${summary}</tbody></table></div>
      ${S.settings.supplements.length ? '' : html`<p class="empty">Ta liste est vide. Ajoute tes compléments dans Réglages.</p>`}
      <div class="week-claude">${start <= t ? claudeBlock('week', start) : ''}</div>`;
  }

  /* ---------- Rendu : Année ---------- */
  function renderYear() {
    const y = S.ui.year, t = todayKey();
    let full = 0, tracked = 0;
    const months = MONTHS.map((name, m) => {
      const offset = (new Date(y, m, 1).getDay() + 6) % 7, nDays = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let dn = 1; dn <= nDays; dn++) {
        const k = `${y}-${pad(m + 1)}-${pad(dn)}`, st = stats(k), j = hasJournal(peekDay(k)), v = hasVisit(k);
        const future = k > t, p = st.total ? st.taken / st.total : 0;
        if (!future && st.total) { tracked++; if (p >= 1) full++; }
        const cls = 'bub' + (future ? ' future' : '') + (!st.total ? ' none' : p >= 1 ? ' full' : p > 0 ? ' part' : '') + (j ? ' j' : '') + (v ? ' v' : '') + (k === t ? ' today' : '');
        const label = `${longDate(k)} : ${st.total ? `${st.taken} sur ${st.total} compléments` : 'rien de prévu'}${j ? ', journal rempli' : ''}${v ? ', visite médicale' : ''}`;
        cells.push(html`<button type="button" class="${cls}" style="--p:${p.toFixed(3)}" data-act="goto" data-date="${k}" aria-label="${label}"></button>`);
      }
      return html`<section class="month"><h3>${cap1(name)}</h3><div class="blister">${WD_LETTER.map((l) => html`<span class="wdh" aria-hidden="true">${l}</span>`)}${Array.from({ length: offset }, () => html`<span aria-hidden="true"></span>`)}${cells}</div></section>`;
    });
    return html`<div class="yr-head"><h2 class="yr-title">${y}</h2><div class="daynav">
        ${y !== new Date().getFullYear() ? html`<button type="button" class="ghost" data-act="year-now">Cette année</button>` : ''}
        <button type="button" class="icon" data-act="year-prev" aria-label="Année précédente">${ICON.left}</button>
        <button type="button" class="icon" data-act="year-next" aria-label="Année suivante">${ICON.right}</button>
      </div></div>
      <p class="yr-sum">${tracked ? `Tout pris ${plural(full, 'jour')} sur ${plural(tracked, 'suivi')}.` : 'Rien de suivi cette année pour l’instant.'}</p>
      <div class="legend" aria-hidden="true"><span><i class="bub"></i>Rien pris</span><span><i class="bub part" style="--p:.5"></i>En partie</span><span><i class="bub full"></i>Tout pris</span><span><i class="bub j"></i>Journal rempli</span><span><i class="bub v"></i>Visite médicale</span></div>
      <div class="months">${months}</div>`;
  }

  /* ---------- Rendu : Réglages ---------- */
  function supSummary(s) {
    if (!s.active) return 'En pause';
    const base = s.freq === 'alt' ? 'Un jour sur deux' : s.freq === 'weekly' ? (s.weekday == null ? 'Jour à choisir' : 'Chaque ' + WD_LONG[s.weekday]) : 'Tous les jours';
    if (!s.cure) return base;
    const ph = curePhase(s.cure, todayKey());
    return `${base} · cure ${s.cure.on} sem. / pause ${s.cure.off} sem. · ${ph.phase === 'avant' ? `dès le ${tinyDate(ph.next)}` : ph.phase === 'prise' ? `sem. ${ph.week}/${ph.of}` : `reprise le ${tinyDate(ph.next)}`}`;
  }
  function supRow(s) {
    const cls = `srow m-${s.moment}${s.active ? '' : ' paused'}`;
    if (S.ui.openSup !== s.id) {
      return html`<div class="${cls} srow-c" data-sid="${s.id}"><button type="button" class="srow-open" data-act="sup-open" data-sid="${s.id}" aria-expanded="false"><span class="it-name">${s.name}</span>${s.dose ? html`<span class="it-dose">${s.dose}</span>` : ''}<span class="srow-meta">${supSummary(s)}</span></button></div>`;
    }
    const id = (f) => `sup-${s.id}-${f}`;
    const options = (entries, current) => entries.map(([v, label]) => html`<option value="${v}"${String(v) === String(current) ? html` selected` : ''}>${label}</option>`);
    return html`<div class="${cls}" data-sid="${s.id}">
      <div class="srow-line">
        <label class="field grow"><span>Nom</span><input type="text" id="${id('name')}" data-sset="name" value="${s.name}" autocomplete="off"></label>
        <label class="field"><span>Dose</span><input type="text" id="${id('dose')}" data-sset="dose" value="${s.dose}" autocomplete="off" size="10"></label>
      </div>
      <div class="srow-line">
        <label class="field"><span>Moment</span><select id="${id('moment')}" data-sset="moment">${options(MOMENTS.map((m) => [m.key, m.label]), s.moment)}</select></label>
        <label class="field"><span>Fréquence</span><select id="${id('freq')}" data-sset="freq">${options(Object.entries(FREQS), s.freq)}</select></label>
        ${s.freq === 'weekly' ? html`<label class="field"><span>Jour</span><select id="${id('weekday')}" data-sset="weekday">${options([['', 'Choisir'], ...WD_LONG.map((w, i) => [i, cap1(w)])], s.weekday == null ? '' : s.weekday)}</select></label>` : ''}
        <label class="field"><span>${s.freq === 'alt' ? 'Premier jour' : 'Depuis le'}</span><input type="date" id="${id('since')}" data-sset="since" value="${s.since}"></label>
      </div>
      <div class="cure-box">
        <label class="switch"><input type="checkbox" id="${id('cure')}" data-sset="cure"${s.cure ? html` checked` : ''}> Prendre en cure (des semaines de prise, puis de pause)</label>
        ${s.cure ? html`<div class="srow-line">
          <label class="field"><span>Semaines de prise</span><input type="number" inputmode="numeric" min="1" max="52" id="${id('cureOn')}" data-sset="cureOn" value="${s.cure.on}"></label>
          <label class="field"><span>Semaines de pause</span><input type="number" inputmode="numeric" min="1" max="52" id="${id('cureOff')}" data-sset="cureOff" value="${s.cure.off}"></label>
          <label class="field"><span>Début de la cure</span><input type="date" id="${id('cureStart')}" data-sset="cureStart" value="${s.cure.start}"></label>
        </div>
        <p class="hint">${curePlan(s.cure, todayKey())}.</p>` : ''}
        ${cureHint(s.name) ? html`<p class="hint">${cureHint(s.name).why}${s.cure ? '' : html` <button type="button" class="link" data-act="sup-cure" data-sid="${s.id}">Programmer la cure</button>`}</p>` : ''}
      </div>
      <label class="field"><span>Note</span><input type="text" id="${id('note')}" data-sset="note" value="${s.note}" placeholder="Optionnel" autocomplete="off"></label>
      <div class="srow-foot"><label class="switch"><input type="checkbox" id="${id('active')}" data-sset="active"${s.active ? html` checked` : ''}> Actif</label>
        ${S.ui.confirm === `sup:${s.id}`
          ? html`<span class="row-actions"><button type="button" class="link danger" data-act="sup-del" data-sid="${s.id}">Oui, supprimer</button><button type="button" class="link" data-act="confirm-cancel">Non</button></span>`
          : html`<span class="row-actions"><button type="button" class="link" data-act="sup-ask" data-sid="${s.id}">Supprimer</button><button type="button" class="ghost" data-act="sup-close" data-sid="${s.id}">Terminé</button></span>`}
      </div>
    </div>`;
  }
  /* ---------- Réglages : une liste, puis une page par sujet ---------- */
  function profileSettings() {
    const h = S.settings.health, age = ageOf(h.birth), b = bmi();
    const numField = (key, label, ph) => html`<label class="field"><span>${label}</span><input type="text" inputmode="decimal" id="h-${key}" data-hset="${key}" value="${h[key] ? fmtDec(h[key]) : ''}" placeholder="${ph}" autocomplete="off"></label>`;
    return html`<section class="set-sec">
      <h2 class="sub-title">Toi</h2>
      <div class="form-grid">
        <label class="field"><span>Date de naissance${age != null ? ` · ${age} ans` : ''}</span><input type="date" id="h-birth" data-hset="birth" value="${h.birth}" max="${todayKey()}"></label>
        <div class="field"><span id="sex-lbl">Sexe</span><div class="seg" role="group" aria-labelledby="sex-lbl">${[['homme', 'Homme'], ['femme', 'Femme'], ['autre', 'Autre']].map(([v, l]) => html`<button type="button" data-act="h-sex" data-v="${v}" aria-pressed="${bool(h.sex === v)}">${l}</button>`)}</div></div>
        ${numField('height', 'Taille (cm)', '180')}
        <label class="field"><span>Activité physique</span><select id="h-activity" data-hset="activity"><option value="">Non précisée</option>${Object.entries(ACTIVITY).map(([v, l]) => html`<option value="${v}"${h.activity === v ? html` selected` : ''}>${l}</option>`)}</select></label>
      </div>
      <h2 class="sub-title">Poids</h2>
      <div class="form-grid">
        ${numField('startWeight', 'Poids de départ (kg)', '95')}
        ${numField('targetWeight', 'Objectif (kg)', '80')}
      </div>
      <p class="hint">Ensuite, tu te pèses à chaque visite médicale : ta courbe et ton IMC sont dans l’onglet Santé.${b ? ` IMC actuel : ${fmtDec(b)} (${bmiLabel(b).toLowerCase()}).` : ''}</p>
      <h2 class="sub-title">Médical</h2>
      <label class="field"><span>Traitements en cours</span><textarea id="h-treatments" data-hset="treatments" rows="2" placeholder="Mounjaro 2,5 mg une fois par semaine depuis…">${h.treatments}</textarea></label>
      <label class="field"><span>Problèmes de santé, antécédents</span><textarea id="h-conditions" data-hset="conditions" rows="2" placeholder="Tension, asthme, opération, carence connue…">${h.conditions}</textarea></label>
      <label class="field"><span>Allergies et intolérances</span><textarea id="h-allergies" data-hset="allergies" maxlength="1000" rows="2" placeholder="Pénicilline, lactose…">${h.allergies}</textarea></label>
      <label class="field"><span>Autres infos pour Claude</span><textarea id="set-profile" data-setting="profile" rows="3" placeholder="Ce que tu veux que Claude sache en plus : études, sport, sommeil…">${S.settings.profile}</textarea></label>
      <p class="hint">Tout ce profil est ajouté à chaque envoi à Claude (journée, semaine, bilan du mois).</p>
    </section>`;
  }
  function goalsSettings() {
    const g = S.settings.goals, w = weightNow();
    const suggest = w ? Math.round(w * 0.35) / 10 : null; // 35 mL par kilo, arrondi à 0,1 L
    const goal = (key, label) => html`<label class="field"><span>${label}</span><input type="text" inputmode="decimal" id="goal-${key}" data-goal="${key}" value="${g[key] ? fmtDec(g[key]) : ''}" placeholder="—" autocomplete="off"></label>`;
    return html`<section class="set-sec">
      <h2 class="sub-title">Eau</h2>
      <div class="form-grid">
        <label class="field"><span>Objectif par jour (litres)</span><input type="text" inputmode="decimal" id="goal-water" data-goal="water" value="${fmtDec(g.water)}" autocomplete="off"></label>
        <label class="field"><span>Taille d’un verre</span><select id="goal-glass" data-goal="glass">${[200, 250, 330, 500].map((v) => html`<option value="${v}"${g.glass === v ? html` selected` : ''}>${v / 10} cl</option>`)}</select></label>
      </div>
      ${suggest ? html`<p class="suggest">Repère courant : 35 mL par kilo, soit ${fmtDec(suggest)} L pour ${fmtDec(w)} kg.${suggest !== g.water ? html` <button type="button" class="link" data-act="water-suggest" data-v="${suggest}">Mettre ${fmtDec(suggest)} L</button>` : ''}</p>` : ''}
      <h2 class="sub-title">Nutrition</h2>
      <div class="form-grid">${goal('kcal', 'Calories (kcal)')}${goal('p', 'Protéines (g)')}${goal('g', 'Glucides (g)')}${goal('l', 'Lipides (g)')}</div>
      <p class="hint">Laisse vide ce que tu ne suis pas. Ces objectifs s’affichent sur l’accueil et partent avec tes journées à Claude.</p>
    </section>`;
  }
  function visitSettings() {
    const v = S.settings.visit, t = todayKey();
    const nv = nextVisit(t), n = daysBetween(t, nv);
    const after = [1, 2, 3].map((i) => shortDate(addDays(nv, i * v.every)));
    return html`<section class="set-sec">
      <p class="next-visit m-soir"><span class="mico" aria-hidden="true">${ICON.visit}</span><span><b>Prochaine visite : ${longDate(nv).replace(/^./, (c) => c.toLowerCase())}</b><span>${cap1(whenLabel(n))} · prise de sang, pesée, tension et médecin</span></span></p>
      <div class="form-grid">
        <label class="field"><span>Visite de départ</span><input type="date" id="visit-start" data-vset="start" value="${v.start}"></label>
        <label class="field"><span>Tous les (jours)</span><input type="number" inputmode="numeric" min="7" max="120" id="visit-every" data-vset="every" value="${v.every}"></label>
      </div>
      <p class="hint">Ensuite : ${after.join(' · ')}. La semaine d’avant, un rappel s’affiche sur l’accueil. Le jour même, l’accueil montre la visite (poids, prise de sang, médecin) et le bilan des ${v.every} jours à envoyer à Claude.</p>
      ${PLATFORM.native ? html`<label class="switch"><input type="checkbox" id="visit-notify" data-vset="notify"${v.notify ? html` checked` : ''}> Notification la veille à 19:00 et le matin à 7:30</label>
        ${store.notifyDenied ? html`<p class="hint">Les notifications sont bloquées : autorise-les pour Mon suivi dans les réglages Android.</p>` : ''}` : ''}
    </section>`;
  }
  function supplementSettings() {
    const sups = S.settings.supplements;
    const groups = MOMENTS.map((m) => {
      const list = sups.filter((s) => s.moment === m.key);
      return list.length ? html`<h3 class="m-title m-${m.key}">${m.label}${m.hint ? html` <span>${m.hint}</span>` : ''}</h3>${list.map(supRow)}` : '';
    });
    return html`<section class="set-sec">
      <div class="sec-head"><p class="hint" style="margin:0">Touche un complément pour le modifier. Pour « un jour sur deux », le premier jour décide lesquels tombent.</p><button type="button" class="primary" data-act="sup-add">Ajouter</button></div>
      ${groups}${sups.length ? '' : html`<p class="empty">Ta liste est vide.</p>`}
      ${PROFILES.active !== MAIN ? '' : html`<div class="reset">${S.ui.confirm === 'reset'
        ? html`<p>Ta liste actuelle sera remplacée par la liste de départ. Ton journal ne bouge pas.</p><div class="actions"><button type="button" class="danger" data-act="reset-yes">Remplacer ma liste</button><button type="button" class="ghost" data-act="confirm-cancel">Annuler</button></div>`
        : html`<button type="button" class="link" data-act="reset-ask">Remettre la liste de départ</button>`}</div>`}
      ${suppNotifySettings()}
      ${PLATFORM.native && sups.some((x) => x.cure) ? html`<label class="switch" style="margin-top:14px"><input type="checkbox" id="cure-notify" data-setting="cureNotify"${S.settings.cureNotify ? html` checked` : ''}> Notification la veille d’un début, d’une pause ou d’une reprise de cure (19:00)</label>
        ${store.notifyDenied ? html`<p class="hint">Les notifications sont bloquées : autorise-les pour Mon suivi dans les réglages Android.</p>` : ''}` : ''}
    </section>`;
  }
  function suppNotifySettings() {
    if (!S.settings.supplements.some((x) => x.active)) return '';
    if (!PLATFORM.native) return html`<p class="hint" style="margin-top:16px">Dans l’app Android, Mon suivi peut te rappeler tes compléments à l’heure de chaque moment.</p>`;
    const sn = S.settings.suppNotify;
    return html`<div class="snotify">
      <label class="switch"><input type="checkbox" id="supp-notify" data-sn="on"${sn.on ? html` checked` : ''}> Me rappeler mes compléments à l’heure de chaque moment</label>
      ${sn.on ? html`<div class="sn-times">${MOMENTS.filter((m) => S.settings.supplements.some((x) => x.active && x.moment === m.key)).map((m) => html`<label class="field"><span>${m.label}</span><input type="time" id="sn-${m.key}" data-sn="${m.key}" value="${sn.times[m.key]}"></label>`)}</div>
        <p class="hint">Seulement s’il reste quelque chose à prendre à ce moment-là : ce qui est déjà coché ne sonne pas. Les rappels sont prévus 14 jours à l’avance ; ouvrir l’app les prolonge.</p>` : ''}
      ${sn.on && store.notifyDenied ? html`<p class="hint">Les notifications sont bloquées : autorise-les pour Mon suivi dans les réglages Android.</p>` : ''}
    </div>`;
  }
  function foodSettings() {
    const fd = S.ui.foodDraft;

  /* ---------- Recherche dans le journal ----------
     Tous les mots doivent se trouver dans la même entrée ; accents et majuscules ne comptent pas. */
  const SEARCH_MAX = 60;
  // « mal à la tête » trouve aussi « mal de tête » : les petits mots ne comptent pas (sauf s'il n'y a qu'eux).
  const STOP_WORDS = new Set(['de', 'du', 'des', 'd', 'la', 'le', 'les', 'l', 'a', 'au', 'aux', 'et', 'un', 'une', 'en', 'ma', 'mon', 'mes']);
  function searchWords(q) {
    const all = norm(q).replace(/[’']/g, ' ').split(' ').filter(Boolean), kept = all.filter((w) => !STOP_WORDS.has(w));
    return kept.length ? kept : all;
  }
  function searchJournal(q) {
    const words = searchWords(q), out = [];
    if (!words.length) return out;
    const hit = (txt) => { const n = norm(txt); return !!n && words.every((w) => n.includes(w)); };
    const add = (k, label, text, go) => { if (hit(text)) out.push({ k, label, text: String(text), ...go }); };
    const days = Object.keys(S.months).sort().reverse().flatMap((mk) => Object.keys(S.months[mk].days || {}).sort().reverse());
    const t = todayKey();
    S.settings.appts.filter((a) => a.date >= t).sort(byWhen).forEach((a) => add(a.date, `Rendez-vous${a.time ? ` · ${a.time}` : ''}`, [a.title, a.place, a.note].filter(Boolean).join(' · '), { tab: 'apercu' }));
    days.forEach((k) => {
      const d = peekDay(k);
      if (!d) return;
      const vis = visitOf(d);
      if (vis) add(k, 'Visite médicale', [str(vis.notes), str(vis.labsText), ...LABS.filter(([key]) => str((vis.labs || {})[key]).trim()).map(([key, lbl]) => `${lbl} ${str(vis.labs[key]).trim()}`)].filter(Boolean).join(' · '), { tab: 'visite' });
      listOf(d.symptoms).slice().sort(byTime).forEach((x) => add(k, `Ressenti · ${str(x.time)}`, x.text, { tab: 'journal' }));
      listOf(d.checkins).slice().sort(byTime).forEach((x) => add(k, `Check-in · ${str(x.time)}`, x.note, { tab: 'journal' }));
      listOf(d.meals).slice().sort(byTime).forEach((m) => add(k, `${str(m.kind) || 'Repas'} · ${str(m.time)}`, [str(m.text), mealItems(m).map((it) => it.name).join(', ')].filter(Boolean).join(' — '), { tab: 'repas' }));
      sportOf(d).slice().sort(byTime).forEach((a) => add(k, `${entryName(a)} · ${str(a.time)}`, [entryName(a), str(a.details), str(a.note)].filter(Boolean).join(' — '), { view: 'sport' }));
      add(k, 'Notes du jour', d.notes, { tab: 'journal' });
      S.settings.appts.filter((a) => a.date === k && a.date < t).forEach((a) => add(k, `Rendez-vous${a.time ? ` · ${a.time}` : ''}`, [a.title, a.place, a.note].filter(Boolean).join(' · '), { tab: 'apercu' }));
    });
    return out;
  }
  // Le texte d'une entrée, raccourci autour du premier mot trouvé, les mots surlignés.
  function highlight(text, words) {
    const chars = [...String(text || '').replace(/\s+/g, ' ').trim()];
    let f = '';
    const map = [];
    chars.forEach((c, i) => { for (const ch of c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[’']/g, "'")) { f += ch; map.push(i); } });
    const marks = chars.map(() => false);
    let first = chars.length;
    words.forEach((w) => { for (let p = f.indexOf(w); p >= 0; p = f.indexOf(w, p + w.length)) { for (let j = p; j < p + w.length; j++) marks[map[j]] = true; first = Math.min(first, map[p]); } });
    const a = chars.length > 150 ? Math.max(0, Math.min(first - 40, chars.length - 150)) : 0, b = Math.min(chars.length, a + 150);
    const segs = [];
    for (let i = a; i < b; i++) { const last = segs[segs.length - 1]; if (last && last.m === marks[i]) last.t += chars[i]; else segs.push({ m: marks[i], t: chars[i] }); }
    return html`${a > 0 ? '…' : ''}${segs.map((x) => (x.m ? html`<mark>${x.t}</mark>` : x.t))}${b < chars.length ? '…' : ''}`;
  }
  function searchResults(q) {
    if (norm(q).length < 2) return '';
    const res = searchJournal(q), words = searchWords(q);
    if (!res.length) return html`<p class="s-none">Rien trouvé pour « ${q.trim()} ». Essaie un autre mot, sans faute de frappe.</p>`;
    return html`<section class="card s-results" aria-label="Résultats de la recherche">

      <ul class="s-list">${res.slice(0, SEARCH_MAX).map((r) => html`<li><button type="button" class="s-row" data-act="search-go" data-date="${r.k}"${r.view ? html` data-view="${r.view}"` : html` data-tab="${r.tab}"`}><span class="s-when"><b>${longDate(r.k)}</b> · ${r.label}</span><span class="s-txt">${highlight(r.text, words)}</span></button></li>`)}</ul>

      cells.push(html`<button type="button" class="mday${future ? ' future' : ''}${k === t ? ' today' : ''}${v ? ' visit' : ''}${ap.length ? ' has-appt' : ''}" data-act="goto" data-date="${k}" aria-label="${label}"><span class="dn">${dn}</span><span class="bar" aria-hidden="true"><i style="width:${Math.round(p * 100)}%"></i></span>${ap.length ? html`<span class="mtag" aria-hidden="true">${ap[0].title}${ap.length > 1 ? ` +${ap.length - 1}` : ''}</span>` : ''}<span class="marks" aria-hidden="true">${ap.length ? html`<i class="mk-r"></i>` : ''}${v ? html`<i class="mk-v"></i>` : ''}${ns ? html`<i class="mk-s"></i>` : ''}${wOk ? html`<i class="mk-w"></i>` : ''}${j ? html`<i class="mk-j"></i>` : ''}</span></button>`);
    }
    const summary = [tracked ? `Tout pris ${plural(full, 'jour')} sur ${tracked}` : 'Rien de suivi ce mois-ci pour l’instant', waterOk ? `eau : objectif atteint ${plural(waterOk, 'jour')}` : '', visits.length ? `visite ${visits.map((k) => `le ${dayNumber(fromKey(k).getDate())}`).join(' et ')}` : ''].filter(Boolean).join(' · ');
    return html`<div class="wk-head"><h2 class="wk-title">${cap1(MONTHS[m - 1])} ${y}</h2><div class="daynav">
        ${mk !== t.slice(0, 7) ? html`<button type="button" class="ghost" data-act="month-now">Ce mois-ci</button>` : ''}
        <button type="button" class="icon" data-act="month-prev" aria-label="Mois précédent">${ICON.left}</button>

      </div></div>
      <p class="msum">${summary}.</p>
      <div class="card"><div class="mgrid">${WD_SHORT.map((l) => html`<span class="wdh" aria-hidden="true">${l}</span>`)}${cells}</div></div>
      <div class="legend" aria-hidden="true" style="margin-top:14px"><span><i class="dot" style="background:var(--ink)"></i>Rendez-vous</span><span><i class="dot" style="background:var(--fill)"></i>Barre : compléments pris</span><span><i class="dot" style="background:var(--soir)"></i>Visite médicale</span><span><i class="dot" style="background:var(--sport)"></i>Séance de sport</span><span><i class="dot" style="background:var(--soir-2);border:1.5px solid var(--soir)"></i>Objectif d’eau atteint</span><span><i class="dot" style="background:var(--aprem)"></i>Journal rempli</span></div>`;
  }

  /* ---------- Rendez-vous et dates à retenir ----------
     Rangés avec les réglages du profil (settings.appts) : ils suivent le compte Claude et les sauvegardes. */
  const byWhen = (a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));
  const apptsOn = (k) => S.settings.appts.filter((a) => a.date === k).sort(byWhen);
  const apptsBetween = (a, b) => S.settings.appts.filter((x) => x.date >= a && x.date <= b).sort(byWhen);
  const apptCat = (a) => APPT_CATS[a.kind].find((c) => c[0] === a.cat) || null;
  function relDay(k) {
    const n = daysBetween(todayKey(), k);
    return n === 0 ? 'aujourd’hui' : n === 1 ? 'demain' : n === -1 ? 'hier' : n > 1 ? `dans ${n} jours` : `il y a ${-n} jours`;
  }
  /* « Dentiste à 14:30 (Cabinet du Dr Martin) » : pour Claude, le dossier et les rappels. */
  const apptText = (a) => `${a.title}${a.time ? ` à ${a.time}` : ''}${a.place ? ` (${a.place})` : ''}${a.note ? ` — ${a.note.replace(/\s+/g, ' ')}` : ''}`;
  function apptRow(a) {
    const t = todayKey(), d = fromKey(a.date), cat = apptCat(a);

  function apptForm() {

    return html`<div class="form appt-form" id="appt-form" role="group" aria-label="${f.id ? 'Modifier' : 'Ajouter'} ${rdv ? 'un rendez-vous' : 'une date à retenir'}">

      <label class="field"><span>Note (facultatif)</span><textarea id="appt-note" data-appt="note" rows="2" placeholder="${rdv ? 'Venir à jeun, apporter l’ordonnance, questions à poser…' : 'Idée de cadeau, heure de la fête…'}">${dr.note}</textarea></label>
      ${PLATFORM.native ? html`<label class="switch"><input type="checkbox" id="appt-remind" data-appt="remind"${dr.remind ? html` checked` : ''}> Rappel la veille à 19:00${rdv && dr.time ? ' et 1 h avant' : ' et le matin à 8:00'}</label>` : ''}

  /* Calendrier : le formulaire, les rendez-vous à venir, puis les passés (repliés). */
  function apptCard() {
    const t = todayKey(), f = S.ui.appt && S.ui.appt.where === 'cal' ? S.ui.appt : null, all = S.settings.appts;

  /* Accueil : les rendez-vous du jour affiché et, aujourd'hui, ceux des deux semaines à venir. */
  function apptDayCard(k, isToday) {
    const f = S.ui.appt && S.ui.appt.where === 'day' ? S.ui.appt : null;

  function saveAppt() {
    const f = S.ui.appt;
    if (!f) return;
    const dr = f.draft;
    if (!isKey(dr.date)) { toast('Choisis le jour.'); S.ui.focus = '#appt-date'; render(); return; }
    if (dr.time && toMin(dr.time) == null) { toast('L’heure n’est pas valable.'); return; }
    const cat = APPT_CATS[dr.kind].find((c) => c[0] === dr.cat);

    if (!title) { toast(dr.kind === 'rdv' ? 'Écris le rendez-vous, par exemple « Dentiste ».' : 'Écris ce qu’il faut retenir.'); S.ui.focus = '#appt-title'; render(); return; }
    const entry = normalizeAppt({ ...dr, id: f.id || newId(), title, time: dr.kind === 'rdv' ? dr.time : '', place: dr.kind === 'rdv' ? dr.place : '' });
    mutateSettings((st) => {
      const i = st.appts.findIndex((x) => x.id === entry.id);
      if (i >= 0) st.appts[i] = entry; else st.appts.push(entry);
      st.appts.sort(byWhen);

    S.ui.appt = null; S.ui.just = entry.id; S.ui.reveal = '#sec-appts';

  const APPT_ACTIONS = {

      toast('Rendez-vous supprimé', () => { mutateSettings((st) => { if (!st.appts.some((x) => x.id === back.id)) { st.appts.push(back); st.appts.sort(byWhen); } }); scheduleReminders(); toast('Remis'); });
    },

    'appt-cat': (d) => {
      const dr = S.ui.appt && S.ui.appt.draft, c = dr && APPT_CATS[dr.kind].find((x) => x[0] === d.v);
      if (!c) return;
      dr.cat = dr.cat === c[0] ? '' : c[0];

  };
  function onApptInput(f, t, change) {
    const dr = S.ui.appt && S.ui.appt.draft;

  }

              : html`<p class="plan-name">Repos</p><p class="hint">Pas de séance prévue. Une marche ou un déménagement comptent aussi : note-les en activité du quotidien.</p>`}
            <div class="actions">
              ${plan && k <= t ? (planDone ? html`<span class="mdone">${ICON.check}Séance faite</span>` : html`<button type="button" class="primary" data-act="plan-done" data-date="${k}">C’est fait</button>`) : ''}

        <div class="col">

            ${burned.length ? html`<p class="hint">Environ ${fmtInt(burned.reduce((a, b) => a + b, 0))} kcal dépensées en activité (estimation d’après ton poids).</p>` : ''}

  function sportForm(f) {
    const dr = f.draft, types = SPORT_TYPES[dr.kind] || SPORT_TYPES.seance, tpls = S.settings.sport.templates;
    return html`<div class="form" role="group" aria-label="Activité">
      <div class="seg" role="group" aria-label="Type d’activité">${Object.entries(KIND_LABEL).map(([v, l]) => html`<button type="button" data-act="spt-kind" data-v="${v}" aria-pressed="${bool(dr.kind === v)}">${l}</button>`)}</div>

      <div class="field"><span id="int-lbl">Intensité</span><div class="seg" role="group" aria-labelledby="int-lbl">${INTENSITIES.map(([v, l]) => html`<button type="button" data-act="spt-int" data-v="${v}" aria-pressed="${bool(Number(dr.intensity) === v)}">${l}</button>`)}</div></div>
      ${bpmFields(dr.bpmMax, dr.bpmAvg, { id: 'draft-bpm', data: 'data-draft', max: 'bpmMax', avg: 'bpmAvg' })}
      <label class="field"><span>Détails</span><textarea id="draft-details" data-draft="details" rows="2" placeholder="${dr.kind === 'seance' ? '50 squats, 3 × 10 pompes, 10 min de corde à sauter…' : 'Déménagement, 3 étages sans ascenseur…'}">${str(dr.details)}</textarea></label>
      ${formActions()}

  }
  /* Séances par semaine sur 8 semaines : colonnes de 24 px au plus, bouts arrondis de 4 px, valeur au sommet,
     ligne d'objectif fine ; chaque colonne porte sa bulle (title) avec les minutes. */
  function sportChart() {
    const sp = S.settings.sport, cur = startOfWeek(todayKey());
    const weeks = Array.from({ length: 8 }, (_, i) => { const w = addDays(cur, (i - 7) * 7), s = sportWeek(w); return { w, n: s.count, min: s.minutes }; });
    if (!weeks.some((x) => x.n)) return html`<p class="empty">Ton historique apparaîtra ici dès ta première séance.</p>`;
    const colW = innerWidth >= 900 ? (Math.min(view.clientWidth || 900, 1120) - 90) / 2 - 40 : (view.clientWidth || 360) - 66;
    // marge de droite réservée à « Objectif N » : il ne chevauche plus la dernière colonne
    const W = Math.round(Math.max(270, Math.min(560, colW))), H = 190, padL = 10, padR = 66, padT = 22, padB = 28;
    const top = Math.max(sp.perWeek, ...weeks.map((x) => x.n)) + 1;
    const slot = (W - padL - padR) / weeks.length, bw = Math.min(24, slot * 0.55);
    const Y = (v) => padT + (1 - v / top) * (H - padT - padB), base = H - padB;
    const bar = (x, y) => {
      const h = base - y, r = Math.min(4, h);
      return `M${x.toFixed(1)} ${base} V${(y + r).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)} H${(x + bw - r).toFixed(1)} Q${(x + bw).toFixed(1)} ${y.toFixed(1)} ${(x + bw).toFixed(1)} ${(y + r).toFixed(1)} V${base} Z`;
    };
    const every = slot < 44 ? 2 : 1;
    const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(`Séances par semaine : ${weeks.map((x) => `semaine du ${shortDate(x.w)}, ${x.n}`).join(' ; ')}`)}">`
      + `<line x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1"/>`
      + `<line x1="${padL}" x2="${W - padR}" y1="${Y(sp.perWeek).toFixed(1)}" y2="${Y(sp.perWeek).toFixed(1)}" stroke="var(--muted)" stroke-width="1"/>`
      + `<text x="${W - padR + 6}" y="${(Y(sp.perWeek) + 4).toFixed(1)}" text-anchor="start" font-size="11.5" font-weight="700" fill="var(--ink)">${esc(`Objectif ${sp.perWeek}`)}</text>`
      + weeks.map((x, i) => {
        const cx = padL + slot * i + slot / 2, bx = cx - bw / 2;
        const tip = `<title>${esc(`Semaine du ${shortDate(x.w)} : ${plural(x.n, 'séance')}, ${x.min} min`)}</title>`;
        const mark = x.n ? `<path d="${bar(bx, Y(x.n))}" fill="var(--sport)"/><text x="${cx.toFixed(1)}" y="${(Y(x.n) - 6).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${x.n}</text>` : '';
        const lbl = (weeks.length - 1 - i) % every === 0 ? `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" font-weight="${i === weeks.length - 1 ? 800 : 600}" fill="var(--muted)">${esc(i === weeks.length - 1 ? 'Cette sem.' : tinyDate(x.w))}</text>` : '';
        return `<g>${tip}<rect x="${(cx - slot / 2).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${H - padT}" fill="transparent"/>${mark}${lbl}</g>`;
      }).join('')
      + '</svg>';
    return html`<div class="chart-wrap">${trusted(svg)}</div>`;
  }

  /* ---------- Séance en direct ---------- */
  /* La séance en cours vit sur cet appareil (LIVE_KEY) jusqu'à « Enregistrer » : elle survit à une fermeture de l'app.
     Chrono et repos se calculent à partir des heures de début, jamais en comptant les secondes. */
  const LIVE_KEY = 'mon-suivi-live-v1';
  const REST_CHOICES = [60, 90, 120, 180];
  // Exercices proposés : nom, et « time » quand il se compte en secondes plutôt qu'en répétitions.
  const EXOS = [
    ['Squats', 'reps'], ['Pompes', 'reps'], ['Fentes', 'reps'], ['Gainage', 'time'], ['Gainage latéral', 'time'],
    ['Pont fessier', 'reps'], ['Hip thrust', 'reps'], ['Tractions', 'reps'], ['Dips', 'reps'], ['Rowing haltère', 'reps'],
    ['Développé couché', 'reps'], ['Développé militaire', 'reps'], ['Soulevé de terre', 'reps'], ['Curl biceps', 'reps'],
    ['Extensions triceps', 'reps'], ['Crunchs', 'reps'], ['Mollets', 'reps'], ['Burpees', 'reps'],
    ['Mountain climbers', 'time'], ['Corde à sauter', 'time'], ['Jumping jacks', 'time'], ['Chaise', 'time'], ['Vélo', 'time'], ['Rameur', 'time']
  ];
  const exoMode = (name) => { const e = EXOS.find(([n]) => norm(n) === norm(name)); return e ? e[1] : 'reps'; };
  function loadLive() {
    const l = lsGet(scoped(LIVE_KEY));
    if (!isObj(l) || !Number.isFinite(l.start) || !isKey(l.date) || !Array.isArray(l.exos)) return null;
    l.exos = l.exos.filter(isObj).map((e) => ({ id: String(e.id || newId()), name: str(e.name) || 'Exercice', mode: e.mode === 'time' ? 'time' : 'reps', sets: Array.isArray(e.sets) ? e.sets.filter(isObj) : [] }));
    l.draft = isObj(l.draft) ? l.draft : { exo: '', reps: 10, kg: '', rir: null, sec: 30 };
    return l;
  }
  function saveLive() {
    if (S.live) { if (!lsSet(scoped(LIVE_KEY), S.live)) toast('Cet appareil refuse d’enregistrer la séance en cours : ne ferme pas l’app avant de l’enregistrer.'); }
    else { try { localStorage.removeItem(scoped(LIVE_KEY)); } catch (e) { /* rien */ } }
  }
  const liveExo = (l = S.live) => (l && l.exos.find((e) => e.id === l.cur)) || null;
  const fmtClock = (ms, up) => {
    const t = Math.max(0, up ? Math.ceil(ms / 1000) : Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  };
  const fmtSec = (sec) => (sec >= 60 ? `${Math.floor(sec / 60)} min${sec % 60 ? ` ${pad(sec % 60)}` : ''}` : `${sec} s`);
  const fmtRest = (sec) => (sec % 60 ? fmtSec(sec) : `${sec / 60} min`);
  const fmtKg = (kg) => fmtDec(kg, 2);
  const rirLabel = (r) => (r >= 4 ? '4+' : String(r));
  function setText(st, mode) {
    if (mode === 'time') return fmtSec(st.sec || 0);
    return `${st.reps} rép.${st.kg ? ` · ${fmtKg(st.kg)} kg` : ''}${st.rir != null ? ` · ${rirLabel(st.rir)} en réserve` : ''}`;
  }
  /* « Squats 3 × 8 à 20 kg · Pompes 10, 10, 8 · Gainage 3 × 45 s » : pour la liste, le tableau et Claude. */
  function exoSummary(e) {
    const sets = e.sets;
    if (!sets.length) return '';
    if (e.mode === 'time') {
      const same = sets.every((x) => x.sec === sets[0].sec);
      return `${e.name} ${same && sets.length > 1 ? `${sets.length} × ${fmtSec(sets[0].sec)}` : sets.map((x) => fmtSec(x.sec)).join(', ')}`;
    }
    const same = sets.every((x) => x.reps === sets[0].reps && (x.kg || 0) === (sets[0].kg || 0));
    if (same && sets.length > 1) return `${e.name} ${sets.length} × ${sets[0].reps}${sets[0].kg ? ` à ${fmtKg(sets[0].kg)} kg` : ''}`;
    return `${e.name} ${sets.map((x) => `${x.reps}${x.kg ? ` × ${fmtKg(x.kg)} kg` : ''}`).join(', ')}`;
  }
  const liveSummary = (l) => l.exos.map(exoSummary).filter(Boolean).join(' · ');
  function liveTotals(l) {
    const sets = l.exos.flatMap((e) => e.sets.map((x) => ({ ...x, mode: e.mode })));
    return { exos: l.exos.filter((e) => e.sets.length).length, sets: sets.length, reps: sets.reduce((a, x) => a + (x.mode === 'reps' ? x.reps || 0 : 0), 0) };
  }
  /* Intensité proposée d'après les répétitions en réserve : 0-1 intense, 2 modérée, 3 et plus légère. */
  function suggestIntensity(l) {
    const rirs = l.exos.flatMap((e) => e.sets.map((x) => x.rir)).filter((x) => x != null);
    if (!rirs.length) { const tp = S.settings.sport.templates.find((x) => x.id === l.tpl); return tp ? tp.intensity : 1; }
    const a = rirs.reduce((x, y) => x + y, 0) / rirs.length;
    return a <= 1.2 ? 3 : a <= 2.5 ? 2 : 1;
  }

  /* Son, vibration, écran allumé, notification Android quand le repos se termine en arrière-plan. */
  let audioCtx = null, wakeLock = null, liveTimer = null;
  function unlockAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function beep() {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime;
      [0, 0.3, 0.6].forEach((dt, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
        g.gain.setValueAtTime(0.0001, t0 + dt);
        g.gain.exponentialRampToValueAtTime(0.4, t0 + dt + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.24);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0 + dt); o.stop(t0 + dt + 0.26);
      });
    } catch (e) { /* pas de son sur cet appareil */ }
  }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300]); } catch (e) { /* rien */ } }
  let wakeAsking = false;
  async function keepAwake(on) {
    try {
      if (on && !wakeLock && !wakeAsking && navigator.wakeLock && document.visibilityState === 'visible') {
        wakeAsking = true;
        try { wakeLock = await navigator.wakeLock.request('screen'); } finally { wakeAsking = false; }
        if (!S.live && !chronoRunning()) { const w = wakeLock; wakeLock = null; await w.release(); return; }
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
    } catch (e) { wakeLock = null; }
  }
  const REST_NOTIF = 7300;
  async function restNotify() {
    const LN = capPlugin('LocalNotifications');
    if (!LN) return;
    try {
      await LN.cancel({ notifications: [{ id: REST_NOTIF }] });
      const l = S.live;
      if (!l || !l.rest) return;
      const perm = await LN.checkPermissions();
      if (perm.display !== 'granted') return;
      const exo = liveExo(l);
      await LN.schedule({ notifications: [{ id: REST_NOTIF, title: 'Repos terminé', body: exo ? `Série suivante : ${exo.name}` : 'À toi pour la série suivante', isExactNotification: false, smallIcon: 'ic_stat_monsuivi', schedule: { at: new Date(l.rest.start + l.rest.dur * 1000), allowWhileIdle: true } }] });
    } catch (e) { /* le minuteur de l'app reste là */ }
  }
  function startRest(dur) {
    const l = S.live;
    l.rest = { start: Date.now(), dur };
    saveLive(); restNotify();
  }
  function restDone(late) {
    const l = S.live;
    l.rest = null;
    saveLive(); restNotify();
    if (!late) { buzz(); if (l.sound !== false) beep(); }
    toast('Repos terminé : série suivante');
    safeRender();
  }
  function liveTick() {
    const l = S.live;
    if (!l) { stopLiveTicker(); return; }
    const now = Date.now();
    const elapsed = fmtClock(now - l.start);
    document.querySelectorAll('[data-tick="elapsed"]').forEach((el) => { if (el.textContent !== elapsed) el.textContent = elapsed; });
    if (l.chrono) document.querySelectorAll('[data-tick="chrono"]').forEach((el) => { el.textContent = fmtClock(now - l.chrono); });
    let restTxt = '';
    if (l.rest) {
      const left = l.rest.start + l.rest.dur * 1000 - now;
      if (left <= 0) { restDone(left < -8000); return; }
      restTxt = fmtClock(left, true);
      document.querySelectorAll('[data-tick="rest"]').forEach((el) => { if (el.textContent !== restTxt) el.textContent = restTxt; });
      document.querySelectorAll('[data-tick="rest-ring"]').forEach((el) => el.style.setProperty('--p', (left / (l.rest.dur * 1000)).toFixed(4)));
    }
    updateLivebar();
  }
  /* Le bandeau en bas des autres onglets : séance en cours, repos, chrono ou intervalles. */
  function livebarText() {
    const parts = [], now = Date.now(), l = S.live, c = S.chrono;
    if (l) { parts.push(`Séance ${fmtClock(now - l.start)}`); if (l.rest) parts.push(`repos ${fmtClock(l.rest.start + l.rest.dur * 1000 - now, true)}`); }
    if (c && c.sw.run) parts.push(`chrono ${fmtClock(swElapsed(c))}`);
    if (c && c.it.run) { const ph = itPhase(itElapsed(c)); if (!ph.done) parts.push(`${PHASE_LABEL[ph.phase].toLowerCase()} ${fmtClock(ph.left, true)} · tour ${ph.round}/${c.it.rounds}`); }
    return cap1(parts.join(' · '));
  }
  function updateLivebar() {
    const bar = document.getElementById('livebar');

  }
  function startLiveTicker() { if (!liveTimer) liveTimer = setInterval(liveTick, 250); liveTick(); }
  function stopLiveTicker() { clearInterval(liveTimer); liveTimer = null; }
  function refreshLivebar() {
    const bar = document.getElementById('livebar');
    if (!bar) return;
    bar.hidden = !(S.live || chronoRunning()) || S.ui.view === 'sport';
    if (!bar.hidden) updateLivebar();

  function livePanel() {
    const l = S.live, exo = liveExo(l), dr = l.draft, tot = liveTotals(l), fin = l.finishing;

    const rest = html`<div class="rest${l.rest ? ' on' : ''}" role="group" aria-label="${l.rest ? 'Repos en cours' : 'Repos'}">
        <div class="rest-ring${l.rest ? '' : ' idle'}" data-tick="rest-ring" style="--p:1"><span><small>${l.rest ? 'Repos' : 'Repos prévu'}</small><b data-tick="rest">${fmtClock(l.rest ? l.rest.start + l.rest.dur * 1000 - Date.now() : l.restDur * 1000, true)}</b></span></div>

    const tabs = html`<div class="exo-tabs chips" role="group" aria-label="Exercices de la séance">${l.exos.map((e) => html`<button type="button" data-act="live-exo" data-id="${e.id}" aria-pressed="${bool(e.id === l.cur)}">${e.name}${e.sets.length ? html` <span class="n">${e.sets.length}</span>` : ''}</button>`)}<button type="button" class="add" data-act="live-exo-new" aria-pressed="${bool(!!l.adding)}">+ Exercice</button></div>`;

  /* Champs de la séance (saisie directe) : gardés au fil de l'eau, sans redessiner la page. */

  function onSheetInput(f, t) {

    if (!sh) return;
    if (f === 'name') { sh.name = t.value.slice(0, 60); sh.nameTouched = true; } else if (f === 'minutes' || f === 'bpmMax' || f === 'bpmAvg') sh[f] = t.value;

  /* ---------- Chrono (sprints, corde à sauter) ----------
     Deux modes : chronomètre avec tours, et intervalles (effort / récup × tours) avec bips 3-2-1 et vibration.
     L'état reste sur l'appareil (CHRONO_KEY, par profil) et se calcule depuis les heures de départ : il survit à une fermeture. */
  const CHRONO_KEY = 'mon-suivi-chrono-v1';
  // clé, nom noté, type d'activité, intensité
  const CHRONO_ACTS = [['sprint', 'Sprints', 'course', 3], ['corde', 'Corde à sauter', 'corde', 2], ['course', 'Course', 'course', 2], ['velo', 'Vélo', 'velo', 2], ['autre', 'Autre', 'autre', 2]];
  // nom, effort (s), récup (s), tours, activité
  const INT_PRESETS = [['Sprints', 20, 40, 8, 'sprint'], ['Corde', 60, 30, 5, 'corde'], ['Tabata', 20, 10, 8, 'autre']];
  const freshChrono = () => ({ mode: 'sw', act: 'sprint', sw: { run: null, acc: 0, laps: [] }, it: { work: 20, rest: 40, rounds: 8, run: null, acc: 0, done: false } });
  function loadChrono() {
    const c = lsGet(scoped(CHRONO_KEY));
    if (!isObj(c) || !isObj(c.sw) || !isObj(c.it) || !Array.isArray(c.sw.laps)) return freshChrono();
    if (!isObj(c.sheet) || !['sw', 'it'].includes(c.sheet.mode)) c.sheet = null;
    return c;
  }
  const saveChrono = () => { if (S.chrono) lsSet(scoped(CHRONO_KEY), S.chrono); };
  const swElapsed = (c = S.chrono) => c.sw.acc + (c.sw.run ? Date.now() - c.sw.run : 0);
  const itElapsed = (c = S.chrono) => c.it.acc + (c.it.run ? Date.now() - c.it.run : 0);
  const chronoRunning = () => !!(S.chrono && (S.chrono.sw.run || S.chrono.it.run));
  const fmtTenths = (ms) => { const t = Math.max(0, Math.floor(ms / 100)), m = Math.floor(t / 600), s = Math.floor((t % 600) / 10); return `${m}:${pad(s)},${t % 10}`; };
  /* Où en sont les intervalles : tour, effort ou récup, temps restant ; fini après le dernier effort. */
  function itPhase(ms, it = S.chrono.it) {
    const w = it.work * 1000, r = it.rest * 1000, cyc = w + r, total = it.rounds * w + (it.rounds - 1) * r;
    if (ms >= total) return { done: true, round: it.rounds, phase: 'fin', left: 0, dur: 1, total };
    const round = Math.floor(ms / cyc) + 1, within = ms % cyc;
    return within < w ? { round, phase: 'work', left: w - within, dur: w, total } : { round, phase: 'rest', left: cyc - within, dur: r, total };
  }
  const PHASE_LABEL = { work: 'Effort', rest: 'Récup', fin: 'Terminé' };
  function tone(freq, dur) {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.45, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) { /* pas de son sur cet appareil */ }
  }
  let chronoTimer = null;
  const chronoMem = { key: null, sec: null };
  function chronoTick() {
    const c = S.chrono;
    if (!chronoRunning()) { stopChrono(); return; }
    if (c.sw.run) { const t = fmtTenths(swElapsed(c)); document.querySelectorAll('[data-tick="sw"]').forEach((el) => { if (el.textContent !== t) el.textContent = t; }); }
    if (c.it.run) {
      const ph = itPhase(itElapsed(c));
      if (ph.done) { finishIntervals(); return; }
      const key = `${ph.round}-${ph.phase}`, sec = Math.ceil(ph.left / 1000);
      if (key !== chronoMem.key) {
        if (chronoMem.key) { tone(ph.phase === 'work' ? 1175 : 660, 0.5); buzz(); }
        chronoMem.key = key; chronoMem.sec = null;
        const card = document.querySelector('[data-tick="it-card"]');
        if (card) card.dataset.phase = ph.phase;
        document.querySelectorAll('[data-tick="it-phase"]').forEach((el) => { el.textContent = PHASE_LABEL[ph.phase]; });
        document.querySelectorAll('[data-tick="it-round"]').forEach((el) => { el.textContent = `Tour ${ph.round} sur ${c.it.rounds}`; });
      } else if (sec >= 1 && sec <= 3 && sec !== chronoMem.sec && ph.dur > 4000) { chronoMem.sec = sec; tone(880, 0.12); }
      const left = fmtClock(ph.left, true);
      document.querySelectorAll('[data-tick="it-left"]').forEach((el) => { if (el.textContent !== left) el.textContent = left; });
      document.querySelectorAll('[data-tick="it-ring"]').forEach((el) => el.style.setProperty('--p', (ph.left / ph.dur).toFixed(4)));
    }
    updateLivebar();
  }
  function startChrono() { if (!chronoTimer) chronoTimer = setInterval(chronoTick, 100); keepAwake(true); chronoTick(); }
  function stopChrono() { clearInterval(chronoTimer); chronoTimer = null; if (!S.live) keepAwake(false); refreshLivebar(); }
  function finishIntervals() {
    const it = S.chrono.it, ph = itPhase(0, it);
    Object.assign(it, { acc: ph.total, run: null, done: true });
    saveChrono(); stopChrono();
    tone(1175, 0.35); setTimeout(() => tone(1175, 0.6), 420); buzz();
    toast(`Intervalles terminés : ${it.rounds} × ${fmtSec(it.work)}`);
    safeRender();
  }
  /* Ce que le chrono a mesuré, pour la journée ou pour la séance en cours. */
  function chronoResult(mode) {
    const c = S.chrono, a = CHRONO_ACTS.find((x) => x[0] === c.act) || CHRONO_ACTS[0];
    if (mode === 'sw') {
      const total = swElapsed(c), laps = c.sw.laps, splits = laps.map((t, i) => t - (i ? laps[i - 1] : 0));
      if (total < 1000) return null;

  /* ---------- Bilans : moyennes de la semaine, du mois ou de l'année ----------

  const mean = (xs) => { const v = xs.filter((x) => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const metricsCache = new Map();
  function dayMetrics(k) {

    const used = took > 0 || hasJournal(d);

    const m = {

  /* ---------- Ce que disent tes données ----------

  const INSIGHT_DAYS = 90, INSIGHT_MIN = 5, INSIGHT_GAP = 0.4;

  function insights() {
    const t = todayKey(), goalW = S.settings.goals.water, goalS = S.settings.sport.steps;
    const days = daysIn(addDays(t, -(INSIGHT_DAYS - 1)), t).map(dayMetrics).filter((m) => m.used);
    const tests = [
      { id: 'sleep', a: (m) => m.sleep != null && m.sleep >= 7, b: (m) => m.sleep != null && m.sleep < 7, aTxt: 'après une nuit d’au moins 7 h', bTxt: 'après une nuit plus courte' },
      { id: 'sport', a: (m) => m.sessions > 0, b: (m) => m.sessions === 0, aTxt: 'les jours avec une séance de sport', bTxt: 'les jours sans' },
      { id: 'steps', a: (m) => m.steps != null && m.steps >= goalS, b: (m) => m.steps != null && m.steps < goalS, aTxt: `les jours à ${fmtInt(goalS)} pas ou plus`, bTxt: 'les jours en dessous' },
      { id: 'water', a: (m) => m.water != null && m.water >= goalW, b: (m) => m.water != null && m.water < goalW, aTxt: `les jours à ${fmtDec(goalW)} L d’eau ou plus`, bTxt: 'les autres jours' }
    ];
    const out = [];
    tests.forEach((ts) => {
      const A = days.filter(ts.a), B = days.filter(ts.b);
      let best = null;
      INSIGHT_MEASURES.forEach(([f, who, dir]) => {
        const va = A.map((m) => m[f]).filter((v) => v != null), vb = B.map((m) => m[f]).filter((v) => v != null);
        if (va.length < INSIGHT_MIN || vb.length < INSIGHT_MIN) return;
        const ma = mean(va), mb = mean(vb);
        if (Math.abs(ma - mb) < INSIGHT_GAP || (best && Math.abs(ma - mb) <= Math.abs(best.ma - best.mb))) return;
        best = { f, who, better: (ma - mb) * dir > 0, ma, mb, na: va.length, nb: vb.length };

  }
  const insightText = (x) => `${cap1(x.aTxt)}, ${x.who} est en moyenne à ${fmtAvg(x.ma)}/5, contre ${fmtAvg(x.mb)}/5 ${x.bTxt} (${x.na} et ${x.nb} jours).`;
  function insightsCard() {
    const r = insights();
    const bar = (v, cls) => html`<span class="ins-bar ${cls}" aria-hidden="true"><i style="width:${Math.round((v / 5) * 100)}%"></i></span>`;
    return html`<section class="card wide insights" aria-labelledby="h-ins">
      <div class="card-head"><span class="mico m-sport" aria-hidden="true">${ICON.spark}</span><h2 id="h-ins">Ce que disent tes données</h2><span class="pill">${INSIGHT_DAYS} derniers jours</span></div>
      ${r.list.length ? html`<ul class="ins-list">${r.list.map((x) => html`<li>
          <p>${insightText(x)}</p>

      : html`<p class="hint" style="margin:0">${r.used < 20 ? `Encore quelques jours : avec au moins 5 jours notés de chaque côté (nuits, sport, pas, eau, et des check-ins d’humeur), l’app te montrera ce qui va avec tes meilleurs jours. ${plural(r.used, 'jour noté')} pour l’instant.` : 'Pas d’écart net pour l’instant entre tes nuits, ton sport, tes pas ou ton eau et ton humeur, ton énergie, ton stress ou tes douleurs.'}</p>`}
    </section>`;
  }
  function summarize(keys) {

  const daysIn = (a, b) => { const out = []; for (let k = a; k <= b; k = addDays(k, 1)) out.push(k); return out; };

  /* Les graphiques : une colonne par jour (par mois pour l'année). Couleurs de graphique vérifiées (clair et sombre). */
  const BILAN_CHARTS = [
    { id: 'supp', title: 'Compléments', color: 'var(--c-supp)', top: 100, val: (m) => (m.supp == null ? null : m.supp * 100), fmt: (v) => `${Math.round(v)} %`,

  const MONTH_INITIALS = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
  /* Écart avec la période d'avant, sans jugement de couleur (plus n'est pas toujours mieux). */

  function bilanCard() {

      const got = vals.map((v, i) => [v, i]).filter(([v]) => v != null);

      const goal = c.goal ? c.goal() : null;

  /* Dessin à la largeur réelle, après l'affichage : colonnes de 24 px au plus, bouts arrondis de 4 px posés sur la base,

    document.querySelectorAll('[data-bchart]').forEach((el) => {
      let sp;
      try { sp = JSON.parse(el.dataset.bchart); } catch (e) { return; }
      const W = Math.max(220, Math.round(el.clientWidth)), H = 140;
      const n = sp.vals.length, padT = 20, padB = 20, base = H - padB;

      const top = sp.top || Math.max(sp.goal || 0, ...got, 1) * 1.15;
      const Y = (v) => padT + (1 - Math.min(v, top) / top) * (base - padT);
      const slot = W / n, bw = Math.max(2, Math.min(24, slot - Math.max(2, slot * 0.3)));

      if (sp.goal) {
        const gy = Y(sp.goal).toFixed(1);
        out.push(`<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>`);
        out.push(`<text x="${W}" y="${(Y(sp.goal) - 5).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--muted)">${esc(sp.goalLabel)}</text>`);
      }
      out.push(`<line x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}" stroke="var(--line)" stroke-width="1"/>`);
      sp.vals.forEach((v, i) => {
        const cx = i * slot + slot / 2, x = cx - bw / 2;
        if (v == null) { if (i <= (sp.now >= 0 ? sp.now : n - 1)) out.push(`<rect x="${x.toFixed(1)}" y="${base - 2}" width="${bw.toFixed(1)}" height="2" rx="1" fill="var(--bub)"/>`); }
        else {
          const y = Y(v), h = base - y, r = Math.min(4, bw / 2, h);
          out.push(h < 1.5 ? `<rect x="${x.toFixed(1)}" y="${(base - 1.5).toFixed(1)}" width="${bw.toFixed(1)}" height="1.5" fill="${sp.color}"/>`
            : `<path d="M${x.toFixed(1)} ${base} V${(y + r).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)} H${(x + bw - r).toFixed(1)} Q${(x + bw).toFixed(1)} ${y.toFixed(1)} ${(x + bw).toFixed(1)} ${(y + r).toFixed(1)} V${base} Z" fill="${sp.color}"/>`);
          if (i === sp.maxI) out.push(`<text x="${Math.min(W - 2, Math.max(2, cx)).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="${cx < 30 ? 'start' : cx > W - 30 ? 'end' : 'middle'}" font-size="11.5" font-weight="800" fill="var(--ink)">${esc(sp.maxLabel)}</text>`);
        }
        if (sp.labels[i]) out.push(`<text x="${cx.toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="11" font-weight="${i === sp.now ? 800 : 600}" fill="${i === sp.now ? 'var(--ink)' : 'var(--muted)'}">${esc(sp.labels[i])}</text>`);
      });
      out.push(`<rect class="bc-hi" x="0" y="0" width="${slot.toFixed(1)}" height="${base}" rx="6" fill="var(--ink)" fill-opacity=".07" style="display:none"/>`);
      out.push('</svg>');
      el.innerHTML = out.join('') + '<div class="chart-tip" hidden></div>';
      // toucher (ou survoler) une colonne affiche sa valeur

      svg.style.touchAction = 'pan-y';

  }
  const BILAN_ACTIONS = {
    'bilan-kind': (d) => { S.ui.bilan.kind = d.v; render(); },
    'bilan-move': (d) => {
      const p = periodOf(S.ui.bilan.kind, S.ui.bilan.anchor), next = shiftPeriod(p, Number(d.v));
      if (Number(d.v) > 0 && next > todayKey()) return;
