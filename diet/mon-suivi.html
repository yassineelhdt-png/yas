    },
    'bilan-now': () => { S.ui.bilan.anchor = todayKey(); render(); }
  };
  /* ---------- Dossier complet : tout le journal d'une période, rangé pour Claude, une autre IA ou un médecin ---------- */
  function firstDataDay() {
    let min = null;
    Object.keys(S.months).forEach((mk) => Object.keys(isObj(S.months[mk].days) ? S.months[mk].days : {}).forEach((dk) => { if (isKey(dk) && (!min || dk < min)) min = dk; }));
    return min || (isKey(S.settings.created) ? S.settings.created : todayKey());
  }
  /* Période choisie dans Données : tout, 12 mois, 3 mois, 30 jours, ou du… au… */
  function dossierRange() {
    const t = todayKey(), dz = S.ui.dossier, first = firstDataDay();
    let from = first, to = t;
    if (dz.range === '365') from = addDays(t, -364);
    else if (dz.range === '90') from = addDays(t, -89);
    else if (dz.range === '30') from = addDays(t, -29);
    else if (dz.range === 'custom') { from = isKey(dz.from) ? dz.from : first; to = isKey(dz.to) && dz.to <= t ? dz.to : t; }
    if (from > to) from = to;
    return { from, to };
  }
  const mdCell = (v) => String(v == null || v === '' ? '—' : v).replace(/\|/g, '/').replace(/\s*\n\s*/g, ' ').trim();
  const mdRow = (cells) => `| ${cells.map(mdCell).join(' | ')} |`;
  const mdTable = (head, rows) => [mdRow(head), `|${head.map(() => ' --- ').join('|')}|`, ...rows.map(mdRow)];
  const fullDate = (k) => `${lowDate(k)} ${fromKey(k).getFullYear()}`.replace(/(\d{4}) \1$/, '$1');
  const DOSSIER_ASK = [
    '> **Consigne pour Claude ou une autre IA.** Ce dossier vient de mon journal de santé (app « Mon suivi »). À partir de ces données seulement :',
    '> 1. Fais un bilan général : sommeil, hydratation, alimentation (calories, protéines), activité physique, humeur, stress, douleurs, et leur évolution sur la période.',
    '> 2. Passe en revue mes traitements et compléments : doses, régularité, cures, doublons ou interactions possibles à vérifier.',
    '> 3. Analyse mes pesées et prises de sang : évolution, valeurs hors des repères.',
    '> 4. Relève les liens possibles (par exemple sommeil et humeur, compléments et résultats sanguins) et ce qui manque pour mieux juger.',

    '>',

    const L = [];
    const who = activeProfile().name;
    L.push(`# Dossier santé${PROFILES.active !== MAIN ? ` — ${who}` : ''}`, '');
    L.push(`Période : du ${fullDate(from)} au ${fullDate(to)} (${plural(days.length, 'jour')}, ${plural(filled.length, 'jour')} rempli${filled.length > 1 ? 's' : ''}).`);
    L.push(`Exporté le ${fullDate(t)} à ${nowTime()} depuis l’app « Mon suivi ». Données de santé personnelles.`, '');

    if (h.allergies.trim()) L.push(`Allergies : ${h.allergies.trim()}`);
    L.push('');
    if (sups.length) {
      L.push(...mdTable(['Moment', 'Complément', 'Dose', 'Fréquence', 'Depuis', 'Cure', 'Note', 'État'], sups.map((sp) => [
        MOMENTS.find((m) => m.key === sp.moment).label, sp.name, sp.dose, supSummary({ ...sp, cure: null, active: true }), shortDate(sp.since),
        sp.cure ? `${cureRule(sp.cure)}, depuis le ${shortDate(sp.cure.start)} ; aujourd’hui : ${cureStatus(sp.cure, t)}` : '', sp.note, sp.active ? 'actif' : 'en pause'])), '');
    } else L.push('Aucun complément dans la liste.', '');

      let sch = 0, took = 0, first = null, last = null;

      return { sp, sch, took, first, last };
    }).filter((x) => x.sch || x.took);
    if (adh.length) L.push(...mdTable(['Complément', 'Pris', 'Prévu', 'Régularité', 'Première prise notée', 'Dernière prise notée'], adh.map((x) => [
      `${x.sp.name}${x.sp.dose ? ` ${x.sp.dose}` : ''}`, x.took, x.sch, x.sch ? `${Math.round((x.took / x.sch) * 100)} %` : '', x.first ? shortDate(x.first) : '', x.last ? shortDate(x.last) : ''])), '');
    else L.push('Rien de coché sur la période.', '');

    // 4 et 5. Moyennes par mois et par semaine
    const avgRow = (label, keys) => {

    if (withLabs.length) {

      L.push('', 'Prises de sang (valeur notée ; dernière colonne : repère habituel, le labo donne ses propres normes) :', '', ...mdTable(['Analyse', ...withLabs.map((k) => shortDate(k)), 'Repère'], rows));
      withLabs.forEach((k) => { const tx = str(visitOf(peekDay(k)).labsText).trim(); if (tx) L.push('', `Autres résultats du ${shortDate(k)} : ${tx}`); });

  /* Courbe du poids aux pesées : une série, ligne 2 px, points 8 px, zone à 10 %, grille fine, ligne d'objectif,

  function weightChart() {

      return html`<p class="empty">${pts.length ? `Une pesée pour l’instant : ${fmtDec(pts[0].w)} kg le ${shortDate(pts[0].k)}. ` : ''}Ta courbe apparaîtra dès la deuxième pesée, à la visite médicale.</p>`;

    const labelled = pts.length <= 6 ? pts : [pts[0], pts[Math.floor(pts.length / 2)], pts[pts.length - 1]];
    const last = pts[pts.length - 1];

      + `<path d="${area}" fill="var(--chart)" fill-opacity=".1" stroke="none"/>`
      + `<path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
      + `<line class="cross" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1" style="display:none"/>`

      + `<text x="${(X(last.k) + 10).toFixed(1)}" y="${(Y(last.w) + 4).toFixed(1)}" font-size="13" font-weight="800" fill="var(--ink)">${esc(`${fmtDec(last.w)} kg`)}</text>`

  function bindChart() {

  app.addEventListener('change', (e) => { if (document.activeElement !== e.target) { leaving = true; setTimeout(() => { leaving = false; }, 0); } }, true);
  app.addEventListener('change', (e) => {
    const t = e.target, ds = t.dataset;
    if (!S.ready || !ds) return;
    if (ds.bind === 'wake' || ds.bind === 'bed') {
      // Enregistré tout de suite ; l'affichage (durée de la nuit) suit quand on quitte le champ.
      const field = ds.bind, val = t.value;
      mutateDay(ds.date, field, (d) => { d[field] = val; }, false);
      safeRender();
    } else if (ds.live) {
      onLiveInput(ds.live, t);
    } else if (ds.bind === 'steps') {
      const raw = String(t.value).trim(), n = raw ? num(raw.replace(/[\s.,]/g, '')) : 0;
      if (raw && (n == null || n < 0 || n > 100000)) { toast('Entre 0 et 100 000 pas.'); t.value = stepsOf(peekDay(ds.date)) ? String(stepsOf(peekDay(ds.date))) : ''; return; }
      mutateDay(ds.date, 'steps', (d) => { d.steps = Math.round(n); }, false);
      t.value = n ? String(Math.round(n)) : '';
      safeRender();
    } else if (ds.spset) {
      const key = ds.spset, lim = { perWeek: [1, 14, 'séances par semaine'], minMin: [5, 240, 'minutes'], maxMin: [5, 240, 'minutes'], steps: [1000, 50000, 'pas'] }[key];
      const n = Math.round(num(String(t.value).replace(/\s/g, '')));
      if (!lim || !Number.isFinite(n) || n < lim[0] || n > lim[1]) { toast(`Entre ${fmtInt(lim ? lim[0] : 0)} et ${fmtInt(lim ? lim[1] : 0)} ${lim ? lim[2] : ''}.`); t.value = S.settings.sport[key]; return; }
      mutateSettings((st) => { st.sport = normalizeSport({ ...st.sport, [key]: n }); }, false);
      t.value = S.settings.sport[key]; // valeur retenue (la durée max ne descend pas sous la durée min)
      if (key === 'minMin') { const mx = document.getElementById('sp-maxMin'); if (mx) mx.value = S.settings.sport.maxMin; }
      safeRender(); // le résumé suit quand on quitte le champ
    } else if (ds.plan) {
      mutateSettings((st) => { st.sport.plan[Number(ds.plan)] = t.value || null; }, false);
      safeRender();
    } else if (ds.tpl && S.ui.tplEdit) {
      S.ui.tplEdit.draft[ds.tpl] = t.value;
    } else if (ds.vm) {
      const def = VITALS.find((x) => x[0] === ds.vm);
      if (!def) return;
      const n = num(t.value), empty = !String(t.value).trim();
      if (!empty && (n == null || n < def[3] || n > def[4])) {
        toast(`${def[1]} : entre ${def[3]} et ${def[4]} ${def[2]}.`);
        const old = vitalOf(visitOf(peekDay(ds.date)), ds.vm); t.value = old == null ? '' : fmtDec(old);
        return;
      }
      const v = empty ? null : ds.vm === 'temp' || ds.vm === 'waist' ? round1(n) : Math.round(n);
      mutateDay(ds.date, 'visit', (d) => { ensureVisit(d)[ds.vm] = v; }, false);
      if (v != null) t.value = fmtDec(v);
      safeRender(); // lecture de la mesure
    } else if (ds.visit === 'weight') {
      const w = num(t.value);
      if (String(t.value).trim() && (w == null || w < 20 || w > 400)) { toast('Écris ton poids en kilos, par exemple 82,5.'); return; }
      mutateDay(ds.date, 'visit', (d) => { ensureVisit(d).weight = w == null ? null : round1(w); }, false);
      if (w != null) t.value = fmtDec(round1(w));
      safeRender(); // évolution depuis la dernière pesée
    } else if (ds.vset) {
      const key = ds.vset;
      if (key === 'start' && !isKey(t.value)) { toast('Choisis la date de ta première visite.'); return; }
      const every = Math.round(num(t.value) || 0);
      if (key === 'every' && (every < 7 || every > 120)) { toast('Entre 7 et 120 jours.'); t.value = S.settings.visit.every; return; }
      mutateSettings((st) => { st.visit[key] = key === 'notify' ? t.checked : key === 'every' ? every : t.value; if (key === 'start') st.visit.moved = true; });
      scheduleReminders();
    } else if (ds.ui === 'dataDate') {
      S.ui.dataDate = isKey(t.value) ? t.value : null;
      render();
    } else if (ds.draft && S.ui.form) {
      S.ui.form.draft[ds.draft] = t.value;
    } else if (ds.item) {
      onItemInput(ds.item, t.type === 'checkbox' ? t.checked : t.value);
    } else if (ds.appt) {
      onApptInput(ds.appt, t, true);
    } else if (ds.ask === 'withWeek') {
      S.ui.ask.withWeek = t.checked;
      refreshReport();
    } else if (ds.pf === 'photo') {
      const file = t.files && t.files[0];
      t.value = '';
      if (!file || !S.ui.profileEdit) return;
      photoToAvatar(file).then((url) => { if (S.ui.profileEdit) { S.ui.profileEdit.photo = url; S.ui.profileEdit.emoji = ''; render(); toast('Photo prête : touche « Enregistrer »'); } })
        .catch(() => toast('Cette image ne passe pas : choisis une photo JPEG ou PNG.'));
    } else if (ds.ask === 'photo') {
      S.ui.ask.photo = (t.files && t.files[0]) || null;
      render();
    } else if (ds.goal === 'water') {
      const n = posNum(t.value);
      if (!n || n < 0.5 || n > 8) { toast('Entre 0,5 et 8 litres.'); t.value = fmtDec(S.settings.goals.water); return; }
      mutateSettings((st) => { st.goals.water = round1(n); }, false);
      t.value = fmtDec(round1(n));
    } else if (ds.goal === 'glass') {
      mutateSettings((st) => { st.goals.glass = Number(t.value) || 250; }, false);
    } else if (ds.goal) {
      const n = posNum(t.value), old = S.settings.goals[ds.goal];
      if (String(t.value).trim() && !n) { toast(ds.goal === 'kcal' ? 'Écris un nombre de calories, par exemple 2 000.' : 'Écris un nombre de grammes, par exemple 120.'); t.value = old ? fmtDec(old) : ''; return; }
      mutateSettings((st) => { st.goals[ds.goal] = n ? round1(n) : null; }, false);
      t.value = n ? fmtDec(round1(n)) : '';
    } else if (ds.hset && !['treatments', 'conditions', 'allergies'].includes(ds.hset)) {
      const key = ds.hset, v = t.value.trim(), old = S.settings.health[key];
      let val = key === 'birth' || key === 'activity' ? v : num(v.replace(/\s*(cm|kg|m)$/i, ''));
      if (key === 'height' && val != null && val >= 1 && val <= 2.5) val = val * 100; // « 1,80 » : des mètres
      const next = normalizeHealth({ ...S.settings.health, [key]: val }), n = next[key];
      if (v && (n == null || n === '')) {
        toast(key === 'height' ? 'Taille en centimètres, par exemple 180 (ou 1,80 m).' : key === 'birth' ? 'Choisis ta date de naissance.' : 'Poids en kilos, par exemple 82,5.');
        if (key !== 'birth' && key !== 'activity') t.value = old ? fmtDec(old) : '';
        return;
      }
      mutateSettings((st) => { st.health = next; }, false);
      if (key !== 'birth' && key !== 'activity') t.value = n ? fmtDec(n) : '';
      safeRender(); // âge, IMC…
    } else if (ds.dossier) {
      if (isKey(t.value)) { S.ui.dossier[ds.dossier] = t.value; render(); }
    } else if (ds.sn) {
      if (ds.sn === 'on') { mutateSettings((st) => { st.suppNotify.on = t.checked; }); if (t.checked) toast('Rappels des compléments activés'); }
      else if (MOMENT_KEYS.includes(ds.sn)) {
        if (!validTime(t.value)) { t.value = S.settings.suppNotify.times[ds.sn]; return; }
        mutateSettings((st) => { st.suppNotify.times[ds.sn] = t.value; }, false);
      }
      scheduleReminders();
    } else if (ds.setting === 'cureNotify') {
      mutateSettings((st) => { st.cureNotify = t.checked; }, false);
      scheduleReminders();
    } else if (ds.setting === 'claudeUrl') {
      const v = t.value.trim();
      if (v && !isClaudeUrl(v)) { toast('Colle un lien qui commence par https://claude.ai/'); return; }
      mutateSettings((st) => { st.claudeUrl = v; }, false);
      if (v) toast('Lien enregistré');
    } else if (ds.weekly) {
      const v = t.value;
      mutateSettings((st) => { const s = st.supplements.find((x) => x.id === ds.weekly); if (s) s.weekday = v === '' ? null : Number(v); });
      if (v !== '') toast('Jour enregistré');
    } else if (ds.sset) {
      const row = t.closest('[data-sid]');
      if (!row) return;
      const structural = ['moment', 'freq', 'active', 'cure', 'cureOn', 'cureOff', 'cureStart'].includes(ds.sset); // ceux qui changent la fiche affichée
      if (structural && (t.type === 'checkbox' || finePointer())) S.ui.focus = `#${CSS.escape(t.id)}`;
      mutateSettings(() => setSupplementField(row.dataset.sid, ds.sset, t.type === 'checkbox' ? t.checked : t.value), structural);
      if (structural || ds.sset === 'name') scheduleReminders();
    } else if (ds.file === 'import') {
      importFile(t.files && t.files[0]);
      t.value = '';
    }
  });
  app.addEventListener('input', (e) => {
    const t = e.target, ds = t.dataset;
    if (!S.ready || !ds) return;
    if (ds.search) {
      S.ui.q = t.value.slice(0, 80);
      safeRender(); // les résultats suivent la frappe, le champ garde le curseur
    } else if (ds.bind === 'notes') {
      mutateDay(ds.date, 'notes', (d) => { d.notes = t.value; }, false);
    } else if (ds.draft && S.ui.form) {
      S.ui.form.draft[ds.draft] = t.value;
    } else if (ds.item && t.type !== 'checkbox') {
      onItemInput(ds.item, t.value);
    } else if (ds.vm) {
      const key = ds.vm, val = t.value, def = VITALS.find((x) => x[0] === key), n = num(val);
      if (def && (!val.trim() || (n != null && n >= def[3] && n <= def[4]))) mutateDay(ds.date, 'visit', (d) => { ensureVisit(d)[key] = val.trim() ? n : null; }, false);
    } else if (ds.visit && ds.visit !== 'weight') {
      const path = ds.visit, val = t.value;
      mutateDay(ds.date, 'visit', (d) => {
        const vis = ensureVisit(d);
        if (path.startsWith('labs.')) vis.labs[path.slice(5)] = val; else vis[path] = val;
      }, false);
    } else if (ds.tpl && S.ui.tplEdit) {
      S.ui.tplEdit.draft[ds.tpl] = t.value;
    } else if (ds.live) {
      onLiveInput(ds.live, t);
    } else if (ds.appt) {
      onApptInput(ds.appt, t, false);
    } else if (ds.as) {
      onSheetInput(ds.as, t);
    } else if (ds.pf === 'new') {
      S.ui.profileNew = t.value;
    } else if (ds.pf === 'name' && S.ui.profileEdit) {
      S.ui.profileEdit.name = t.value;
    } else if (ds.ask === 'q') {
      S.ui.ask.q = t.value;
      refreshReport();
    } else if (ds.fd) {
      S.ui.foodDraft[ds.fd] = t.value;
    } else if (ds.restore) {
      S.ui.restoreText = t.value;
    } else if (['treatments', 'conditions', 'allergies'].includes(ds.hset)) {
      mutateSettings((st) => { st.health[ds.hset] = t.value.slice(0, 2000); }, false);
    } else if (ds.setting === 'profile') {
      mutateSettings((st) => { st.profile = t.value.slice(0, 4000); }, false);
    } else if (['name', 'dose', 'note'].includes(ds.sset)) {
      const row = t.closest('[data-sid]');
      const s = row && S.settings.supplements.find((x) => x.id === row.dataset.sid);
      if (!s) return;
      s[ds.sset] = t.value;
      markSettings(['supplements']);
    }
  });
  // Entrée dans le champ « Exercice » de la séance en direct : l'ajoute.
  app.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key === 'Enter' && t && t.dataset && t.dataset.live === 'exo' && S.live) { e.preventDefault(); pickExo(t.value); }
    if (e.key === 'Enter' && t && t.dataset && t.dataset.pf === 'new') { e.preventDefault(); S.ui.profileNew = t.value; addProfile(); }
    if (e.key === 'Enter' && t && t.dataset && t.dataset.pf === 'name') { e.preventDefault(); S.ui.profileEdit.name = t.value; PROFILE_ACTIONS['profile-save'](); }
  });
  /* Le texte pour Claude affiché suit la question et la case « 6 jours d'avant ». */
  function refreshReport() {
    const rt = document.getElementById('report-text'), area = document.getElementById('ask-area');
    if (rt && area && S.ui.ask.showReport) rt.value = claudeText(area.dataset.scope, area.dataset.key);
  }
  app.addEventListener('toggle', (e) => {
    const t = e.target;
    if (!t.dataset || !t.dataset.toggle) return;
    if (toggling === t) toggling = null;
    noteToggle(t);
    if (t.dataset.toggle === 'report') refreshReport();
  }, true); // « toggle » ne remonte pas : on l'écoute à la descente
  // Un volet qu'on vient d'ouvrir : si un rendu passe avant son « toggle », il le retrouve ouvert.
  app.addEventListener('click', (e) => { const sm = e.target.closest && e.target.closest('summary'); if (sm && sm.parentElement && sm.parentElement.dataset.toggle) toggling = sm.parentElement; }, true);

  /* Nouveau jour, retour sur la page, connexion retrouvée, fermeture */
  let lastToday = todayKey();
  function checkRollover() {
    const t = todayKey();
    if (t === lastToday) return;
    if (S.ui.date === lastToday) S.ui.date = t;
    if (S.ui.weekOf === startOfWeek(lastToday)) S.ui.weekOf = startOfWeek(t);
    if (S.ui.monthOf === lastToday.slice(0, 7)) S.ui.monthOf = t.slice(0, 7);
    lastToday = t;
    if (S.ready) safeRender();
  }
  function resume() {
    if (store.mode !== 'cloud' || store.stopped) return;
    if (!store.online) { clearTimeout(store.connectTimer); store.connectTimer = null; connect(); }
    else if (store.dirty.size) { clearTimeout(store.retryTimer); store.retryTimer = null; flushAll(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkRollover(); resume(); }
    else flushAll();
  });
  window.addEventListener('online', resume);
  // réseau perdu ou retrouvé : le statut en haut et le rappel d'envoi à Claude suivent
  const netChanged = () => { refreshSync(); if (S.ready) safeRender(); };
  window.addEventListener('online', netChanged);
  window.addEventListener('offline', netChanged);
  window.addEventListener('pagehide', flushAll);
  setInterval(checkRollover, 60000);
  // la courbe du poids se recalcule à la largeur de l'écran
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.ready && S.ui.view === 'sante') safeRender(); }, 200); });

  /* App Android : rappels de la visite médicale (la veille à 19:00, le matin à 7:30), pour les 6 prochaines.
     Identifiants 7000 à 7099 réservés à ces rappels : on les annule tous puis on les recrée. */
  let remindChain = Promise.resolve();
  const scheduleReminders = () => (remindChain = remindChain.then(doScheduleReminders, doScheduleReminders));
  async function doScheduleReminders() {
    const LN = capPlugin('LocalNotifications');
    if (!LN || !S.settings) return;
    const v = S.settings.visit, cures = S.settings.cureNotify ? S.settings.supplements.filter((s) => s.active && s.cure) : [];
    try {
      const pending = await LN.getPending();
      const ours = ((pending && pending.notifications) || []).filter((n) => (n.id >= 7000 && n.id < 7300) || (n.id >= 7400 && n.id < 7500)); // 7300 : fin du repos
      if (ours.length) await LN.cancel({ notifications: ours.map((n) => ({ id: n.id })) });
      const appts = S.settings.appts.filter((a) => a.remind && a.date >= todayKey()).sort(byWhen).slice(0, 50);
      const sn = S.settings.suppNotify, suppOn = sn.on && S.settings.supplements.some((x) => x.active);
      if (!v.notify && !cures.length && !appts.length && !suppOn) return;
      let perm = await LN.checkPermissions();
      if (perm.display !== 'granted' && perm.display !== 'denied') perm = await LN.requestPermissions();
      const denied = perm.display !== 'granted';
      if (denied !== !!store.notifyDenied) { store.notifyDenied = denied; if (S.ui.view === 'reglages') safeRender(); }
      if (denied) return;
      const now = Date.now(), list = [];
      let k = nextVisit(todayKey());
      for (let i = 0; i < (v.notify ? 6 : 0); i++, k = addDays(k, v.every)) {
        const eve = fromKey(addDays(k, -1)); eve.setHours(19, 0, 0, 0);
        const morning = fromKey(k); morning.setHours(7, 30, 0, 0);
        const common = { isExactNotification: false, smallIcon: 'ic_stat_monsuivi' };
        if (eve.getTime() > now) list.push({ ...common, id: 7000 + i * 2, title: 'Demain : visite médicale', body: 'Prise de sang (souvent à jeun, vérifie avec le labo), pesée, tension et médecin. Note tes questions.', schedule: { at: eve, allowWhileIdle: true } });
        if (morning.getTime() > now) list.push({ ...common, id: 7001 + i * 2, title: 'Aujourd’hui : visite médicale', body: 'Prise de sang, pesée, tension, médecin. Note tout dans Mon suivi pour ton bilan du mois avec Claude.', extra: { date: k, tab: 'visite' }, schedule: { at: morning, allowWhileIdle: true } });
      }
      // Cures : la veille de chacun des 4 prochains changements (début, pause, reprise), à 19:00 ; ids 7100 à 7199.
      let id = 7100;
      cures.forEach((s) => {
        let from = todayKey();
        for (let i = 0; i < 4 && id < 7200; i++) {
          const ph = curePhase(s.cure, from), day = ph.next, eve = fromKey(addDays(day, -1));
          eve.setHours(19, 0, 0, 0);
          const pause = ph.phase === 'prise';
          const title = pause ? `Demain : pause ${deName(s.name)}` : `Demain : ${ph.phase === 'avant' ? 'début de la cure' : 'reprise'} ${deName(s.name)}`;
          const body = pause ? `${plural(s.cure.off, 'semaine')} sans, reprise le ${shortDate(addDays(day, s.cure.off * 7))}.` : `${plural(s.cure.on, 'semaine')} de prise, jusqu’au ${shortDate(addDays(day, s.cure.on * 7 - 1))} inclus.`;
          if (eve.getTime() > now) list.push({ isExactNotification: false, smallIcon: 'ic_stat_monsuivi', id: id++, title, body, schedule: { at: eve, allowWhileIdle: true } });
          from = day;
        }
      });
      // Rendez-vous : la veille à 19:00, puis 1 h avant (ou le matin à 8:00 sans heure) ; ids 7200 à 7299.
      appts.forEach((a, i) => {
        const eve = fromKey(addDays(a.date, -1)); eve.setHours(19, 0, 0, 0);
        const soon = fromKey(a.date);
        if (a.time) { soon.setHours(0, 0, 0, 0); soon.setMinutes(toMin(a.time) - 60); } else soon.setHours(8, 0, 0, 0); // 00:30 → 23:30 la veille
        const what = `${a.title}${a.time ? ` à ${a.time}` : ''}`, body = [a.place, a.note].filter(Boolean).join(' · ').slice(0, 180) || (a.kind === 'rdv' ? 'Rendez-vous noté dans Mon suivi.' : 'Date notée dans Mon suivi.');
        if (eve.getTime() > now) list.push({ isExactNotification: false, smallIcon: 'ic_stat_monsuivi', id: 7200 + i * 2, title: `Demain : ${what}`, body, schedule: { at: eve, allowWhileIdle: true } });
        if (soon.getTime() > now) list.push({ isExactNotification: false, smallIcon: 'ic_stat_monsuivi', id: 7201 + i * 2, title: a.time ? `Dans 1 h : ${what}` : `Aujourd’hui : ${what}`, body, schedule: { at: soon, allowWhileIdle: true } });
      });
      // Compléments : à l'heure de chaque moment, 14 jours d'avance, s'il reste quelque chose à prendre ; ids 7400 à 7455.
      for (let d = 0; suppOn && d < 14; d++) {
        const k = addDays(todayKey(), d);
        MOMENTS.forEach((m, mi) => {
          const left = scheduledFor(k).filter((x) => x.moment === m.key && !isTaken(x.id, k));
          if (!left.length) return;
          const at = fromKey(k); at.setHours(0, toMin(sn.times[m.key]), 0, 0);
          if (at.getTime() <= now) return;
          list.push({ isExactNotification: false, smallIcon: 'ic_stat_monsuivi', id: 7400 + d * 4 + mi, title: `${m.label} : ${left.map((x) => x.name).join(', ')}`.slice(0, 120),
            body: `${left.map((x) => `${x.name}${x.dose ? ' ' + x.dose : ''}`).join(' · ')}. Coche-les dans Mon suivi une fois pris.`.slice(0, 240), extra: { date: k, tab: 'supps' }, schedule: { at, allowWhileIdle: true } });
        });
      }
      if (list.length) await LN.schedule({ notifications: list });
    } catch (e) { /* notifications indisponibles : les rappels restent dans l'app */ }
  }

  // Toucher un rappel (compléments, visite) ouvre la bonne journée, au bon onglet.
  const capLN = capPlugin('LocalNotifications');
  if (capLN && typeof capLN.addListener === 'function') {
    capLN.addListener('localNotificationActionPerformed', (ev) => {
      const x = ev && ev.notification && ev.notification.extra;
      if (!x || !isKey(x.date) || !S.ready) return;
      Object.assign(S.ui, { view: 'jour', form: null, dayTab: DAY_TABS.some((t) => t[0] === x.tab) ? x.tab : S.ui.dayTab });
      go(x.date); toTop();
    });
  }
  // Un complément coché : ses rappels du jour sont revus (sans rien faire si l'app n'a pas de notifications).
  let remindTimer = null;
  const remindSoon = () => { if (!capPlugin('LocalNotifications')) return; clearTimeout(remindTimer); remindTimer = setTimeout(scheduleReminders, 1500); };

  /* App Android : le bouton retour ferme le formulaire ouvert, revient à la vue Jour, puis met l'app en arrière-plan. */
  const capApp = capPlugin('App');
  if (capApp && typeof capApp.addListener === 'function') {
    capApp.addListener('backButton', () => {
      if (S.ui.form || S.ui.appt || S.ui.confirm || S.ui.exportText != null || S.ui.tplEdit || S.ui.pendingRestore || S.ui.restoreOpen || S.ui.profileEdit || S.ui.profileAdd || S.ui.openSup) {
        Object.assign(S.ui, { form: null, appt: null, confirm: null, exportText: null, tplEdit: null, pendingRestore: null, restoreOpen: false, profileEdit: null, profileAdd: false, openSup: null });
        render();
      }
      else if (S.ui.view === 'reglages' && S.ui.settingsPage) { S.ui.settingsPage = null; render(); toTop(); }
      else if (S.ui.view !== 'jour') { S.ui.view = 'jour'; render(); toTop(); }
      else if (typeof capApp.minimizeApp === 'function') capApp.minimizeApp();
    });
  }

  init();
})();
</script>
