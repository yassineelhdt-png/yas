    </section>`;
  }
  function symptomForm(f) {
    const dr = f.draft;
    return html`<div class="form" role="group" aria-label="Ce que je ressens">
      <label class="field field-time"><span>Heure</span><input type="time" id="draft-time" data-draft="time" value="${str(dr.time)}"></label>
      <div class="chips" role="group" aria-label="Raccourcis">${SYMPTOM_CHIPS.map((c) => html`<button type="button" data-act="sym-chip" data-v="${c}">${c}</button>`)}</div>
      <label class="field"><span>Qu’est-ce que tu ressens ?</span><textarea id="sym-text" data-draft="text" rows="3" placeholder="J’ai mal au bas du dos depuis ce matin, surtout assis…">${str(dr.text)}</textarea></label>
      ${scaleField(INTENSITY, dr.intensity)}
      ${formActions()}
    </div>`;
  }

  /* Repas et macros */
  function nutritionSummary(d) {
    const t = sumMacros(dayItems(d)), goals = S.settings.goals;
    const hasGoals = hasNutriGoals(goals);
    if (!t.n && !hasGoals) return '';
    const bar = (cls, label, val, goal, unit) => {
      const w = goal ? Math.min(100, Math.round((val / goal) * 100)) : 0;
      return html`<div class="mbar ${cls}"><span>${label}</span><span class="track" aria-hidden="true"><i style="--w:${w}%"></i></span><b>${unit === 'kcal' ? fmtInt(val) : fmtG(val)}${goal ? ` / ${unit === 'kcal' ? fmtInt(goal) : fmtG(goal)}` : ''} ${unit}</b></div>`;
    };
    const over = goals.kcal && t.kcal > goals.kcal;
    return html`<div class="nutri" aria-label="Total du jour">
      <div class="nutri-top"><b class="${over ? 'over' : ''}">${fmtInt(t.kcal)}</b><span>${goals.kcal ? `sur ${fmtInt(goals.kcal)} kcal${over ? ` · ${fmtInt(t.kcal - goals.kcal)} de plus` : ` · reste ${fmtInt(goals.kcal - t.kcal)}`}` : 'kcal aujourd’hui'}</span></div>
      <div class="mbars">${MACROS.map(([key, label]) => bar('c-' + key, label, t[key], goals[key], 'g'))}</div>
      ${hasGoals ? '' : html`<p class="per100">Fixe tes objectifs (calories, protéines…) pour suivre ta progression. <button type="button" class="link" data-act="goto-settings" data-v="objectifs">Mes objectifs</button></p>`}
    </div>`;
  }
  function mealBlock(k, d) {
    const list = listOf(d.meals).sort(byTime);
    const f = openForm('meal', k);
    const entry = (m) => {
      const items = mealItems(m), t = sumMacros(items);
      const kind = str(m.kind) || 'Repas';
      return html`<li class="entry"><span class="t">${str(m.time)}</span><div class="e-body"><span class="kind">${kind}${t.n ? ` · ${fmtInt(t.kcal)} kcal` : ''}</span>${m.text ? html`<p class="note">${m.text}</p>` : ''}${items.length ? html`<ul class="items">${items.map((it) => html`<li>${it.name}<span>${num(it.grams) ? `${fmtDec(num(it.grams), 0)} g · ` : ''}${fmtInt(posNum(it.kcal) ?? 0)} kcal</span></li>`)}</ul><p class="macros">${macroLine(t)}</p>` : ''}</div>${rowActions('meal', k, m.id, `${kind.toLowerCase()} de ${str(m.time)}`)}</li>`;

    </section>`;

  function mealForm(f) {

    const recents = recentFoods(f.date).filter((r) => !dr.items.some((x) => norm(x.name) === norm(r.name))).slice(0, 6);
    const food = findFood(it.name);
    return html`<div class="form" role="group" aria-label="Repas">
      <div class="form-row">
        <label class="field field-time"><span>Heure</span><input type="time" id="draft-time" data-draft="time" value="${str(dr.time)}"></label>
        <div class="field"><span id="kind-lbl">Type</span><div class="seg" role="group" aria-labelledby="kind-lbl">${kinds.map((v) => html`<button type="button" data-act="meal-kind" data-v="${v}" aria-pressed="${bool(dr.kind === v)}">${v}</button>`)}</div></div>
      </div>
      <div class="foods">
        <div class="foods-head">Aliments${t.n ? html`<span>${fmtInt(t.kcal)} kcal · ${macroLine(t)}</span>` : ''}</div>
        ${dr.items.length ? html`<ul class="food-list">${dr.items.map((x) => html`<li><span class="fl-name">${x.name}${num(x.grams) ? ` · ${fmtDec(num(x.grams), 0)} g` : ''}</span><span class="fl-vals">${fmtInt(x.kcal)} kcal · ${macroLine(x)}</span><button type="button" class="link" data-act="item-edit" data-id="${x.id}" aria-label="Modifier ${x.name}">Modifier</button><button type="button" class="link danger" data-act="item-del" data-id="${x.id}" aria-label="Retirer ${x.name}">Retirer</button></li>`)}</ul>` : ''}
        ${recents.length ? html`<div class="chips" role="group" aria-label="Aliments récents"><span class="chips-lbl">Récents</span>${recents.map((r) => html`<button type="button" data-act="item-recent" data-v="${r.name}">${r.name}${num(r.grams) ? ` · ${fmtDec(num(r.grams), 0)} g` : ''}</button>`)}</div>` : ''}
        <div class="food-add">
          <div class="row">
            <label class="field"><span>Aliment</span><input type="text" id="fi-name" data-item="name" list="food-names" value="${it.name}" placeholder="Riz, poulet, œuf…" autocomplete="off"></label>
            <label class="field"><span>Quantité (g)</span><input type="text" inputmode="decimal" id="fi-grams" data-item="grams" value="${it.grams}" placeholder="100" autocomplete="off"></label>
          </div>
          <div class="row4">
            <label class="field"><span>Protéines (g)</span><input type="text" inputmode="decimal" id="fi-p" data-item="p" value="${it.p}" autocomplete="off"></label>
            <label class="field"><span>Glucides (g)</span><input type="text" inputmode="decimal" id="fi-g" data-item="g" value="${it.g}" autocomplete="off"></label>
            <label class="field"><span>Lipides (g)</span><input type="text" inputmode="decimal" id="fi-l" data-item="l" value="${it.l}" autocomplete="off"></label>

  /* Ajoute (ou met à jour) l'aliment en cours de saisie ; false s'il n'y a rien à ajouter. */

  /* Markdown simple (titres, listes, gras) → HTML, après échappement : rien de la réponse n'est interprété comme du code. */
  function mdToHtml(text) {
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<em>$2</em>');

    let list = null;
    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    String(text).replace(/\r/g, '').split('\n').forEach((line) => {
      const t = line.trim();
      let m;
      if (!t) { close(); return; }
      if ((m = /^#{1,6}\s+(.*)$/.exec(t))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); return; }
      if ((m = /^[-*•]\s+(.*)$/.exec(t))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); return; }

  /* Rapports texte : ce que Claude lit, et ce qui est copié ou partagé. */

  function visitLines(k) {

      L.push('- Prise de sang (valeur notée ; entre parenthèses, repère habituel) :');

  function dayReport(k, { compact, skipVisit } = {}) {
    const d = peekDay(k) || {}, prev = peekDay(addDays(k, -1)) || {};

    const sch = scheduledFor(k), taken = sch.filter((s) => isTaken(s.id, k)), missed = sch.filter((s) => !isTaken(s.id, k));
    const extra = S.settings.supplements.filter((s) => !isScheduled(s, k) && isTaken(s.id, k));
    const cis = listOf(d.checkins).sort(byTime), syms = listOf(d.symptoms).sort(byTime), meals = listOf(d.meals).sort(byTime);
    const tot = sumMacros(dayItems(d));
    const scoreLine = (c) => SCALES.map((sc) => { const v = scaleValue(c[sc.key]); return v ? `${sc.label.toLowerCase()} ${v}` : ''; }).filter(Boolean).join(', ');
    if (compact) {

      if (sch.length) parts.push(`compléments ${taken.length}/${sch.length}`);
      const avg = SCALES.map((sc) => { const v = avgScale(k, sc.key); return v != null ? `${sc.label.toLowerCase()} ${fmtAvg(v)}` : ''; }).filter(Boolean);
      if (avg.length) parts.push(avg.join(', '));
      if (tot.n) parts.push(`${fmtInt(tot.kcal)} kcal (${macroLine(tot)})`);
      if (syms.length) parts.push('ressenti : ' + syms.map((s) => `${str(s.text)}${scaleValue(s.intensity) ? ` ${s.intensity}/5` : ''}`).join(' ; '));
      if (str(d.notes).trim()) parts.push(`notes : ${str(d.notes).trim().replace(/\s+/g, ' ').slice(0, 200)}`);
      return `- ${longDate(k)} : ${parts.length ? parts.join(' · ') : 'rien de noté'}`;
    }
    L.push(`## ${longDate(k)} ${fromKey(k).getFullYear()}`.replace(/(\d{4}) \1$/, '$1'));
    if (!skipVisit && (visitOf(d) || isVisitDay(k))) L.push(...visitLines(k));
    L.push(`Sommeil : coucher la veille ${str(prev.bed) || 'non noté'}, réveil ${str(d.wake) || 'non noté'}${night ? ` (nuit de ${night})` : ''}`);
    L.push(`Eau : ${waterOf(d) ? `${fmtL(waterOf(d))} L` : 'rien noté'} (objectif ${fmtDec(S.settings.goals.water)} L)`);
    const acts = sportOf(d).sort(byTime), pl = plannedFor(k);
    L.push(`Pas : ${stepsOf(d) ? fmtInt(stepsOf(d)) : 'non notés'} (objectif ${fmtInt(S.settings.sport.steps)})`);
    L.push(acts.length ? 'Activité physique :' : `Activité physique : rien de noté${pl ? ` (séance prévue : ${pl.name}, ${pl.minutes} min)` : ''}`);
    acts.forEach((a) => { const kc = kcalBurned(a); L.push(`- ${str(a.time)} ${KIND_LABEL[a.kind] ? KIND_LABEL[a.kind].toLowerCase() : 'activité'} : ${entryName(a)}${a.minutes ? `, ${a.minutes} min` : ''}, ${intensityLabel(a.intensity).toLowerCase()}${a.details ? ` — ${a.details}` : ''}${kc ? ` (≈ ${kc} kcal)` : ''}`); });

      if (taken.length || extra.length) L.push(`- Pris : ${[...taken, ...extra].map(fmtSup).join(', ')}`);

    cis.forEach((c) => L.push(`- ${str(c.time)} : ${scoreLine(c) || 'sans note'}${str(c.note).trim() ? ` — « ${str(c.note).trim()} »` : ''}`));

      ? ` (objectifs : ${[g.kcal ? `${fmtInt(g.kcal)} kcal` : '', g.p ? `protéines ${fmtG(g.p)} g` : '', g.g ? `glucides ${fmtG(g.g)} g` : '', g.l ? `lipides ${fmtG(g.l)} g` : ''].filter(Boolean).join(', ')})` : '';

    meals.forEach((m) => {

  /* Les 4 semaines avant une visite : moyennes, régularité des compléments, ressenti, puis jour par jour. */
  function visitReport(k) {
    const every = S.settings.visit.every, start = addDays(k, -every);
    const days = Array.from({ length: every }, (_, i) => addDays(start, i)).filter((dk) => dk <= todayKey());
    const L = [`# Mon suivi — bilan de la visite médicale du ${longDate(k).toLowerCase()}`, '', ...visitLines(k)];
    L.push('', `## Les ${every} jours d’avant (du ${shortDate(start)} au ${shortDate(addDays(k, -1))})`);
    const avg = (vals) => (vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null);
    const nights = days.map((dk) => nightMinutes((peekDay(addDays(dk, -1)) || {}).bed, (peekDay(dk) || {}).wake)).filter((m) => m != null);
    const noted = days.filter((dk) => hasJournal(peekDay(dk)) || Object.values((peekDay(dk) || {}).taken || {}).some(Boolean)).length;
    L.push(`Jours avec quelque chose de noté : ${noted} sur ${days.length}`);
    if (nights.length) L.push(`Sommeil : ${fmtDuration(Math.round(avg(nights)))} en moyenne (${plural(nights.length, 'nuit')} notée${nights.length > 1 ? 's' : ''})`);
    const sessions = days.flatMap((dk) => sessionsOf(peekDay(dk))), daily = days.flatMap((dk) => sportOf(peekDay(dk)).filter((a) => a.kind === 'quotidien'));
    const stepDays = days.map((dk) => stepsOf(peekDay(dk))).filter(Boolean);
    L.push(`Sport : ${plural(sessions.length, 'séance')} en ${days.length} jours (${minutesOf(sessions)} min ; objectif ${S.settings.sport.perWeek} par semaine, soit ${Math.round((S.settings.sport.perWeek * days.length) / 7)})${daily.length ? `, plus ${plural(daily.length, 'activité')} du quotidien (${minutesOf(daily)} min)` : ''}`);
    if (stepDays.length) L.push(`Pas : ${fmtInt(avg(stepDays))} par jour en moyenne (${plural(stepDays.length, 'jour')} noté${stepDays.length > 1 ? 's' : ''}, objectif ${fmtInt(S.settings.sport.steps)})`);
    const drank = days.map((dk) => waterOf(peekDay(dk))).filter((x) => x > 0);
    if (drank.length) L.push(`Eau : ${fmtL(avg(drank))} L par jour en moyenne (${plural(drank.length, 'jour')} noté${drank.length > 1 ? 's' : ''}, objectif ${fmtDec(S.settings.goals.water)} L, atteint ${plural(drank.filter((x) => x >= S.settings.goals.water * 1000).length, 'fois')})`);
    const cis = days.flatMap((dk) => listOf((peekDay(dk) || {}).checkins));
    const scales = SCALES.map((sc) => { const v = avg(cis.map((c) => scaleValue(c[sc.key])).filter((x) => x != null)); return v != null ? `${sc.label.toLowerCase()} ${fmtAvg(v)}` : ''; }).filter(Boolean);
    if (scales.length) L.push(`Check-ins (${plural(cis.length, 'check-in')}, moyennes sur 5) : ${scales.join(', ')}`);
    const eaten = days.map((dk) => sumMacros(dayItems(peekDay(dk)))).filter((t) => t.n);
    if (eaten.length) L.push(`Alimentation (${plural(eaten.length, 'jour')} avec les macros) : ${fmtInt(avg(eaten.map((t) => t.kcal)))} kcal, protéines ${fmtG(avg(eaten.map((t) => t.p)))} g, glucides ${fmtG(avg(eaten.map((t) => t.g)))} g, lipides ${fmtG(avg(eaten.map((t) => t.l)))} g par jour en moyenne`);

      const sch = days.filter((dk) => isScheduled(sp, dk));
      return sch.length ? `- ${sp.name}${sp.dose ? ' ' + sp.dose : ''} : pris ${sch.filter((dk) => isTaken(sp.id, dk)).length} fois sur ${sch.length} prévue${sch.length > 1 ? 's' : ''}` : '';
    }).filter(Boolean);
    if (sups.length) L.push('Régularité des compléments :', ...sups);
    const syms = days.flatMap((dk) => listOf((peekDay(dk) || {}).symptoms).map((x) => `- ${shortDate(dk)} ${str(x.time)} : ${str(x.text).trim()}${scaleValue(x.intensity) ? ` (${x.intensity}/5)` : ''}`));
    L.push(syms.length ? 'Ce que j’ai ressenti :' : 'Ressenti : rien de noté', ...syms);
    L.push('', '## Jour par jour', ...days.map((dk) => dayReport(dk, { compact: true })));
    L.push('', '## Le jour de la visite', dayReport(k, { skipVisit: true }));
    return L.join('\n');
  }
  function claudeReport(scope, key, withWeek = S.ui.ask.withWeek) {
    if (scope === 'visit') return visitReport(key);
    if (scope === 'week') {
      const days = Array.from({ length: 7 }, (_, i) => addDays(key, i)).filter((dk) => dk <= todayKey());
      const wk = sportWeek(key);
      return `# Mon suivi — ${weekTitle(key).toLowerCase()}\n\nSport de la semaine : ${plural(wk.count, 'séance')} sur ${S.settings.sport.perWeek} prévues, ${wk.minutes} min\n\n${days.map((dk) => dayReport(dk)).join('\n\n')}`;
    }
    const before = withWeek ? Array.from({ length: 6 }, (_, i) => dayReport(addDays(key, i - 6), { compact: true })) : [];
    return `# Mon suivi — ${longDate(key).toLowerCase()}\n\n${dayReport(key)}${before.length ? `\n\n## Les 6 jours d’avant (résumé)\n${before.join('\n')}` : ''}`;
  }
  /* Profil santé pour Claude : qui je suis, poids, objectifs, traitements, antécédents. */
  function profileText() {
    const h = S.settings.health, age = ageOf(h.birth), cw = currentWeight(), w = weightNow(), b = bmi(), g = S.settings.goals;
    const L = [];
    const who = [h.sex ? cap1(h.sex) : '', age != null ? `${age} ans` : '', h.height ? `${fmtHeight(h.height)}` : '',
      w ? `${fmtDec(w)} kg${cw ? ` (pesée du ${shortDate(cw.k)})` : ' (poids de départ)'}` : '', b ? `IMC ${fmtDec(b)}` : ''].filter(Boolean);
    if (who.length) L.push(`Mon profil : ${who.join(', ')}`);
    if (h.targetWeight) L.push(`Objectif de poids : ${fmtDec(h.targetWeight)} kg${h.startWeight ? ` (départ ${fmtDec(h.startWeight)} kg)` : ''}`);
    if (h.activity) L.push(`Activité physique : ${ACTIVITY[h.activity].toLowerCase()}`);
    const sp = S.settings.sport;
    L.push(`Objectif sport : ${sp.perWeek} séances légères de ${sp.minMin} à ${sp.maxMin} min par semaine, ${fmtInt(sp.steps)} pas par jour`);
    if (h.treatments.trim()) L.push(`Traitements : ${h.treatments.trim()}`);
    if (h.conditions.trim()) L.push(`Problèmes de santé, antécédents : ${h.conditions.trim()}`);
    if (h.allergies.trim()) L.push(`Allergies, intolérances : ${h.allergies.trim()}`);
    if (S.settings.profile.trim()) L.push(`Autres infos : ${S.settings.profile.trim()}`);
    L.push(`Objectifs du jour : eau ${fmtDec(g.water)} L${g.kcal ? `, ${fmtInt(g.kcal)} kcal` : ''}${g.p ? `, protéines ${fmtG(g.p)} g` : ''}${g.g ? `, glucides ${fmtG(g.g)} g` : ''}${g.l ? `, lipides ${fmtG(g.l)} g` : ''}`);
    return L.join('\n') + '\n\n';
  }
  const hasProfile = () => { const h = S.settings.health; return !!(h.birth || h.height || h.treatments.trim() || h.conditions.trim() || S.settings.profile.trim()); };
  /* Texte copié ou partagé : pour un projet Claude « état et santé », prêt à coller. */
  function claudeText(scope, key, q = S.ui.ask.q.trim(), withWeek = S.ui.ask.withWeek) {
    const ask = q || {
      week: 'Fais le point sur ma semaine à partir de ce suivi : comment je vais, les tendances, les liens possibles, et ce que je peux améliorer.',
      visit: 'Voici ma visite médicale et mes 4 dernières semaines. Analyse ma prise de sang (carences ?) en tenant compte de mes compléments et de leur régularité, l’évolution de mon poids, mon alimentation et mon état, et dis-moi quelles questions poser à mon médecin.',
      day: 'Fais le point sur mon état du jour à partir de ce suivi : ce qui va, ce qui ne va pas, les liens possibles, et ce que je peux faire demain.'
    }[scope];
    return `${ask}\n\n${profileText()}${claudeReport(scope, key, withWeek)}`;
  }
  /* Consigne complète quand la page demande elle-même à Claude (artefact). */
  function claudePrompt(scope, key) {
    const q = S.ui.ask.q.trim();
    const words = { day: 300, week: 350, visit: 450 }[scope];
    const titles = {
      day: '## Mon état\n## Ce que je remarque\n## Alimentation et activité\n## Pour demain\n## À surveiller',
      week: '## Ma semaine\n## Tendances\n## Alimentation et sport\n## Pour la semaine prochaine\n## À surveiller',
      visit: '## Bilan du mois\n## Prise de sang et carences\n## Poids, alimentation et sport\n## Compléments\n## Questions pour le médecin\n## À surveiller'
    }[scope];
    return [
      'Tu es mon assistant santé dans l’app « Mon suivi ». Tu n’es pas médecin et tu ne poses pas de diagnostic : tu m’aides à comprendre mon état à partir de mon journal.',
      `Réponds en français, en me tutoyant, simplement et sans jargon, en ${words} mots maximum, avec ces titres Markdown (##) :`,
      titles,
      'Règles :',
      scope === 'visit' ? '- Compare chaque valeur de la prise de sang à la norme (celle du labo si elle est notée, sinon le repère donné) et relie-la aux compléments pris et à leur régularité ; signale les carences possibles et ce qui est en excès.' : '',
      scope === 'visit' ? '- Ne propose jamais de changer un traitement prescrit (par exemple Mounjaro) ni d’arrêter un complément sans le médecin : formule plutôt des questions à lui poser.' : '',
      '- Relie ce qui peut l’être (sommeil, repas et macros, compléments, traitement, stress, douleurs) sans inventer de valeurs absentes du journal ; dis ce qui manque pour mieux juger.',
      '- Pour le sport, reste prudent et progressif (séances légères, adaptées à la fatigue et au traitement) ; compte aussi les activités du quotidien.',
      '- Si quelque chose peut être urgent (douleur dans la poitrine, essoufflement, malaise, sang, fièvre forte, idées noires…), commence par là et conseille d’appeler le 112.',
      '- Si un symptôme dure ou revient, ou si une valeur de prise de sang sort des normes, conseille d’en parler à un médecin.',
      S.ui.ask.photo ? '- Une photo est jointe (prise de sang, ordonnance ou autre document) : lis-la et commente les valeurs utiles, en rappelant les normes.' : '',
      q ? `\nMa question : ${q}` : '',
      '',
      profileText() + claudeReport(scope, key).slice(0, 50000)
    ].filter((x) => x !== '').join('\n');
  }
  const ASK_ERRORS = {
    not_granted: 'Tu n’as pas autorisé cette page à utiliser Claude. Utilise « Copier pour Claude ».',
    rate_limited: 'Trop de demandes pour l’instant. Réessaie dans un moment.',
    session_expired: 'Reconnecte-toi à Claude, puis réessaie.',
    image_rejected: 'Cette photo n’est pas acceptée : prends une photo JPEG ou PNG, pas trop lourde.',
    refused: 'Claude n’a pas répondu à cette demande. Reformule ta question.',
    empty_completion: 'Claude n’a rien répondu. Réessaie avec une question plus simple.',
    prompt_too_large: 'Trop de texte d’un coup. Décoche « Ajouter les 6 jours d’avant » ou retire la photo.'
  };
  const ASK_GONE = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  async function askClaude(scope, key, fresh) {
    const a = S.ui.ask;
    if (!store.sample || a.status === 'thinking' || a.status === 'streaming') return;
    const prompt = claudePrompt(scope, key), q = a.q.trim();
    const ctl = new AbortController();
    Object.assign(a, { scope, key, status: 'thinking', text: '', error: '', ctl });
    renderAsk();
    const opts = { signal: ctl.signal, onText: ({ text }) => { if (a.ctl !== ctl) return; a.text = text; a.status = 'streaming'; renderAsk(); } };
    if (fresh) opts.cache = false;
    if (a.photo && store.sampleImages) opts.images = [a.photo];
    try {
      const res = await store.sample(prompt, opts);
      if (a.ctl !== ctl) return;
      a.text = res.text + (res.truncated ? '\n\n*(Réponse coupée : pose une question plus précise pour la suite.)*' : '');
      a.status = 'done';
      if (scope !== 'week') mutateDay(key, 'claude', (d) => { d.claude = { at: new Date().toISOString(), q: q.slice(0, 300), text: a.text.slice(0, 8000) }; }, false);
    } catch (e) {
      if (a.ctl !== ctl) return;
      const code = (e && e.code) || 'upstream_error';
      a.text = code === 'refused' ? '' : str(e && e.text);
      a.status = code === 'cancelled' ? 'done' : 'error';
      a.error = code === 'cancelled' ? '' : ASK_ERRORS[code] || (ASK_GONE.includes(code) ? 'Claude n’est pas disponible ici. Utilise « Copier pour Claude ».' : 'La réponse a été interrompue. Réessaie.');
      if (ASK_GONE.includes(code)) { store.sample = null; a.status = 'idle'; a.ctl = null; safeRender(); toast(a.error); return; }
    }
    a.ctl = null;
    renderAsk();
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* on essaie autrement */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }
  /* Partage natif (Android) : la feuille de partage permet de choisir l'app Claude. */
  async function shareText(title, text) {
    const Share = capPlugin('Share');
    try {
      if (Share) await Share.share({ title, text, dialogTitle: 'Envoyer à Claude' });
      else if (navigator.share) await navigator.share({ title, text });
      else return false;
      return true;
    } catch (e) {
      return /cancel|abort/i.test(String((e && (e.name || e.message)) || e)); // annulé par toi : rien à signaler
    }
  }

  /* ---------- Rendu : Semaine ---------- */
  function renderWeek() {
    const start = S.ui.weekOf, t = todayKey();
    const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    const rows = MOMENTS.map((m) => {
      const sups = S.settings.supplements.filter((s) => s.moment === m.key && days.some((dk) => isScheduled(s, dk) || isTaken(s.id, dk)));
      if (!sups.length) return '';
      return html`<tr class="grp m-${m.key}"><th colspan="8" scope="colgroup">${m.label}${m.hint ? html` <span>${m.hint}</span>` : ''}</th></tr>${sups.map((s) => html`<tr class="m-${m.key}"><th scope="row">${s.name}${s.dose ? html` <small>${s.dose}</small>` : ''}</th>${days.map((dk) => {
        const on = isTaken(s.id, dk);
        if (!on && !isScheduled(s, dk)) return html`<td></td>`;
        return html`<td><button type="button" class="mini${on ? ' on' : ''}" data-act="toggle" data-sid="${s.id}" data-date="${dk}" aria-pressed="${bool(on)}" aria-label="${s.name}, ${longDate(dk)}">${on ? ICON.check : ''}</button></td>`;
      })}</tr>`)}`;

    const summary = [
      html`<tr><th scope="row">Pris</th>${cell((dk) => { const st = stats(dk); return st.total ? `${st.taken}/${st.total}` : ''; })}</tr>`,
      html`<tr><th scope="row">Réveil</th>${cell((dk, d) => str(d.wake))}</tr>`,
      html`<tr><th scope="row">Eau <small>L</small></th>${cell((dk, d) => (waterOf(d) ? fmtL(waterOf(d)) : ''))}</tr>`,
      html`<tr><th scope="row">Calories</th>${cell((dk, d) => { const x = sumMacros(dayItems(d)); return x.n ? fmtInt(x.kcal) : ''; })}</tr>`,
      html`<tr><th scope="row">Protéines <small>g</small></th>${cell((dk, d) => { const x = sumMacros(dayItems(d)); return x.n ? fmtG(x.p) : ''; })}</tr>`,
      SCALES.map((sc) => html`<tr><th scope="row">${sc.label}${sc.faces ? '' : html` <small>sur 5</small>`}</th>${days.map((dk) => {
        const v = avgScale(dk, sc.key);

        ${start !== startOfWeek(t) ? html`<button type="button" class="ghost" data-act="week-now">Cette semaine</button>` : ''}

  /* ---------- Rendu : Année ---------- */
  function renderYear() {
    const y = S.ui.year, t = todayKey();
    let full = 0, tracked = 0;
    const months = MONTHS.map((name, m) => {
      const offset = (new Date(y, m, 1).getDay() + 6) % 7, nDays = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let dn = 1; dn <= nDays; dn++) {
        const k = `${y}-${pad(m + 1)}-${pad(dn)}`, st = stats(k), j = hasJournal(peekDay(k)), v = hasVisit(k);
        const future = k > t, p = st.total ? st.taken / st.total : 0;
        if (!future && st.total) { tracked++; if (p >= 1) full++; }
        const cls = 'bub' + (future ? ' future' : '') + (!st.total ? ' none' : p >= 1 ? ' full' : p > 0 ? ' part' : '') + (j ? ' j' : '') + (v ? ' v' : '') + (k === t ? ' today' : '');
        const label = `${longDate(k)} : ${st.total ? `${st.taken} sur ${st.total} compléments` : 'rien de prévu'}${j ? ', journal rempli' : ''}${v ? ', visite médicale' : ''}`;
        cells.push(html`<button type="button" class="${cls}" style="--p:${p.toFixed(3)}" data-act="goto" data-date="${k}" aria-label="${label}"></button>`);
      }
      return html`<section class="month"><h3>${cap1(name)}</h3><div class="blister">${WD_LETTER.map((l) => html`<span class="wdh" aria-hidden="true">${l}</span>`)}${Array.from({ length: offset }, () => html`<span aria-hidden="true"></span>`)}${cells}</div></section>`;

  function sportForm(f) {

  /* Séances par semaine sur 8 semaines : colonnes de 24 px au plus, bouts arrondis de 4 px, valeur au sommet,
     ligne d'objectif fine ; chaque colonne porte sa bulle (title) avec les minutes. */
  function sportChart() {
    const sp = S.settings.sport, cur = startOfWeek(todayKey());
    const weeks = Array.from({ length: 8 }, (_, i) => { const w = addDays(cur, (i - 7) * 7), s = sportWeek(w); return { w, n: s.count, min: s.minutes }; });
    if (!weeks.some((x) => x.n)) return html`<p class="empty">Ton historique apparaîtra ici dès ta première séance.</p>`;
    const colW = innerWidth >= 900 ? (Math.min(view.clientWidth || 900, 1120) - 90) / 2 - 40 : (view.clientWidth || 360) - 66;
    const W = Math.round(Math.max(270, Math.min(560, colW))), H = 190, padL = 10, padR = 10, padT = 22, padB = 28;
    const top = Math.max(sp.perWeek, ...weeks.map((x) => x.n)) + 1;
    const slot = (W - padL - padR) / weeks.length, bw = Math.min(24, slot * 0.55);
    const Y = (v) => padT + (1 - v / top) * (H - padT - padB), base = H - padB;
    const bar = (x, y) => {
      const h = base - y, r = Math.min(4, h);
      return `M${x.toFixed(1)} ${base} V${(y + r).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)} H${(x + bw - r).toFixed(1)} Q${(x + bw).toFixed(1)} ${y.toFixed(1)} ${(x + bw).toFixed(1)} ${(y + r).toFixed(1)} V${base} Z`;
    };
    const every = slot < 44 ? 2 : 1;
    const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(`Séances par semaine : ${weeks.map((x) => `semaine du ${shortDate(x.w)}, ${x.n}`).join(' ; ')}`)}">`
      + `<line x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1"/>`
      + `<line x1="${padL}" x2="${W - padR}" y1="${Y(sp.perWeek).toFixed(1)}" y2="${Y(sp.perWeek).toFixed(1)}" stroke="var(--muted)" stroke-width="1"/>`
      + `<text x="${W - padR}" y="${(Y(sp.perWeek) - 6).toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${esc(`Objectif ${sp.perWeek}`)}</text>`
      + weeks.map((x, i) => {
        const cx = padL + slot * i + slot / 2, bx = cx - bw / 2;
        const tip = `<title>${esc(`Semaine du ${shortDate(x.w)} : ${plural(x.n, 'séance')}, ${x.min} min`)}</title>`;
        const mark = x.n ? `<path d="${bar(bx, Y(x.n))}" fill="var(--sport)"/><text x="${cx.toFixed(1)}" y="${(Y(x.n) - 6).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${x.n}</text>` : '';
        const lbl = (weeks.length - 1 - i) % every === 0 ? `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" font-weight="${i === weeks.length - 1 ? 800 : 600}" fill="var(--muted)">${esc(i === weeks.length - 1 ? 'Cette sem.' : tinyDate(x.w))}</text>` : '';
        return `<g>${tip}<rect x="${(cx - slot / 2).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${H - padT}" fill="transparent"/>${mark}${lbl}</g>`;
      }).join('')
      + '</svg>';
    return html`<div class="chart-wrap">${trusted(svg)}</div>`;
  }
  function sportSettings() {

      ${te && !te.id ? tplForm(te.draft) : te ? '' : html`<div class="actions" style="margin-top:10px"><button type="button" class="ghost" data-act="tpl-new">Ajouter une séance</button></div>`}
      <h2 class="sub-title" style="margin-top:22px">Programme de la semaine</h2>

      <div class="form-grid">${WD_LONG.map((w, i) => html`<label class="field"><span>${cap1(w)}</span><select id="plan-${i}" data-plan="${i}"><option value="">Repos</option>${sp.templates.map((tp) => html`<option value="${tp.id}"${sp.plan[i] === tp.id ? html` selected` : ''}>${tp.name}</option>`)}</select></label>`)}</div>

  /* ---------- Rendu : Santé ---------- */
  const MONTHS_SHORT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const tinyDate = (k) => { const d = fromKey(k); return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; };
  /* Courbe du poids aux pesées : une série, ligne 2 px, points 8 px, zone à 10 %, grille fine, ligne d'objectif,
     dernière valeur écrite au bout ; au survol, repère vertical et bulle. Les valeurs sont aussi dans « Visites ». */
  function weightChart() {
    const pts = weighIns(), target = S.settings.health.targetWeight;
    if (pts.length < 2) {
      return html`<p class="empty">${pts.length ? `Une pesée pour l’instant : ${fmtDec(pts[0].w)} kg le ${shortDate(pts[0].k)}. ` : ''}Ta courbe apparaîtra dès la deuxième pesée, à la visite médicale.</p>`;
    }
    const W = Math.round(Math.max(280, Math.min(880, (view.clientWidth || 360) - (innerWidth >= 900 ? 90 : 40)))), H = 230;
    const padL = 40, padR = 64, padT = 18, padB = 30;
    const x0 = dayNum(pts[0].k), x1 = Math.max(x0 + 1, dayNum(pts[pts.length - 1].k));
    let lo = Math.min(...pts.map((p) => p.w)), hi = Math.max(...pts.map((p) => p.w));
    if (target) { lo = Math.min(lo, target); hi = Math.max(hi, target); }
    const range = Math.max(hi - lo, 1), step = range <= 4 ? 1 : range <= 10 ? 2 : range <= 25 ? 5 : 10;
    lo = Math.floor((lo - step * 0.3) / step) * step; hi = Math.ceil((hi + step * 0.3) / step) * step;
    const X = (k) => padL + ((dayNum(k) - x0) / (x1 - x0)) * (W - padL - padR);
    const Y = (w) => padT + ((hi - w) / (hi - lo)) * (H - padT - padB);
    const ticks = [];
    for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.k).toFixed(1)} ${Y(p.w).toFixed(1)}`).join(' ');
    const area = `${line} L${X(pts[pts.length - 1].k).toFixed(1)} ${H - padB} L${X(pts[0].k).toFixed(1)} ${H - padB} Z`;
    const labelled = pts.length <= 6 ? pts : [pts[0], pts[Math.floor(pts.length / 2)], pts[pts.length - 1]];
    const last = pts[pts.length - 1];
    const data = pts.map((p) => ({ x: +X(p.k).toFixed(1), y: +Y(p.w).toFixed(1), d: shortDate(p.k), v: `${fmtDec(p.w)} kg` }));
    const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(`Poids aux pesées : ${pts.map((p) => `${shortDate(p.k)} ${fmtDec(p.w)} kg`).join(', ')}`)}">`
      + ticks.map((v) => `<line x1="${padL}" x2="${W - padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)" font-weight="600">${esc(fmtDec(v, 0))}</text>`).join('')
      + (target ? `<line x1="${padL}" x2="${W - padR}" y1="${Y(target).toFixed(1)}" y2="${Y(target).toFixed(1)}" stroke="var(--fill)" stroke-width="1.5"/><text x="${padL + 6}" y="${(Y(target) - 6).toFixed(1)}" font-size="12" font-weight="700" fill="var(--ink)">${esc(`Objectif ${fmtDec(target)} kg`)}</text>` : '')
      + `<path d="${area}" fill="var(--chart)" fill-opacity=".1" stroke="none"/>`
      + `<path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
      + `<line class="cross" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1" style="display:none"/>`
      + pts.map((p) => `<circle cx="${X(p.k).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="4" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>`).join('')
      + labelled.map((p, i) => `<text x="${X(p.k).toFixed(1)}" y="${H - 8}" text-anchor="${pts.length > 1 && p === pts[0] ? 'start' : p === last ? 'end' : 'middle'}" font-size="12" fill="var(--muted)" font-weight="600">${esc(tinyDate(p.k))}</text>`).join('')
      + `<text x="${(X(last.k) + 10).toFixed(1)}" y="${(Y(last.w) + 4).toFixed(1)}" font-size="13" font-weight="800" fill="var(--ink)">${esc(`${fmtDec(last.w)} kg`)}</text>`
      + `<rect class="hit" x="${padL}" y="0" width="${W - padL - padR}" height="${H}" fill="transparent"/></svg>`;
    return html`<div class="chart-wrap" id="wchart" data-w="${W}" data-pts="${JSON.stringify(data)}">${trusted(svg)}<div class="chart-tip" hidden></div></div>`;
  }
  function bindChart() {
    const wrap = document.getElementById('wchart');
    if (!wrap) return;
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.chart-tip'), cross = svg.querySelector('.cross');
    const pts = JSON.parse(wrap.dataset.pts), W = Number(wrap.dataset.w);
    const show = (e) => {
      const r = svg.getBoundingClientRect(), k = r.width / W, px = (e.clientX - r.left) / k;
      const p = pts.reduce((a, b) => (Math.abs(b.x - px) < Math.abs(a.x - px) ? b : a));
      cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.style.display = '';
      tip.replaceChildren(Object.assign(document.createElement('b'), { textContent: p.v }), document.createTextNode(` · ${p.d}`));
      tip.hidden = false;
      const half = tip.offsetWidth / 2, maxX = wrap.clientWidth - half; // la bulle reste dans la carte
      tip.style.left = `${Math.max(half, Math.min(maxX, p.x * k))}px`; tip.style.top = `${p.y * k}px`;
    };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.style.display = 'none'; });
  }
  function renderHealth() {
    const h = S.settings.health, t = todayKey();
    const age = ageOf(h.birth), cw = currentWeight(), wNow = weightNow(), b = bmi();
    const stat = (label, value, sub) => html`<div class="stat"><span>${label}</span><b>${value}</b>${sub ? html`<small>${sub}</small>` : ''}</div>`;
    // objectif de poids
    const pts = weighIns(), start = h.startWeight || (pts[0] && pts[0].w);
    let goal = '';
    if (h.targetWeight && wNow) {
      const left = round1(wNow - h.targetWeight), done = start ? round1(start - wNow) : null;
      const pct = start && start !== h.targetWeight ? Math.max(0, Math.min(100, Math.round(((start - wNow) / (start - h.targetWeight)) * 100))) : 0;
      goal = html`<div class="goalbar"><p>Objectif ${fmtDec(h.targetWeight)} kg · ${left > 0 ? `encore ${fmtDec(left)} kg` : 'atteint'}${done ? ` · ${done > 0 ? '−' : '+'}${fmtDec(Math.abs(done))} kg depuis le départ` : ''}</p><div class="track" role="img" aria-label="${pct} % du chemin vers l’objectif"><i style="width:${pct}%"></i></div></div>`;
    }
    // 7 derniers jours
    const days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
    const avg = (vals) => (vals.length ? vals.reduce((a, c) => a + c, 0) / vals.length : null);

  const app = document.getElementById('app');

  function setSupplementField(sid, f, v) {
    const s = S.settings.supplements.find((x) => x.id === sid);
    if (!s) return;
    if (f === 'active') s.active = !!v;
    else if (f === 'weekday') s.weekday = v === '' ? null : Number(v);
    else if (f === 'since') { if (isKey(v)) s.since = v; }
    else if (f === 'moment') { if (MOMENT_KEYS.includes(v)) s.moment = v; }
    else if (f === 'freq') { if (FREQS[v]) s.freq = v; }

    else if (f === 'dose' || f === 'note') s[f] = String(v);

  app.addEventListener('change', (e) => {
    const t = e.target, ds = t.dataset;

    if (ds.bind === 'wake' || ds.bind === 'bed') {
      // Enregistré tout de suite ; l'affichage (durée de la nuit) suit quand on quitte le champ.
      const field = ds.bind, val = t.value;
      mutateDay(ds.date, field, (d) => { d[field] = val; }, false);
      safeRender();
    } else if (ds.bind === 'steps') {
      const n = Math.round(num(String(t.value).replace(/[\s.,]/g, '')) || 0);
      if (String(t.value).trim() && (n < 0 || n > 100000)) { toast('Entre 0 et 100 000 pas.'); return; }
      mutateDay(ds.date, 'steps', (d) => { d.steps = n; }, false);
      safeRender();
    } else if (ds.spset) {
      const key = ds.spset;
      mutateSettings((st) => { st.sport = normalizeSport({ ...st.sport, [key]: t.value }); });
    } else if (ds.plan) {
      mutateSettings((st) => { st.sport.plan[Number(ds.plan)] = t.value || null; });
    } else if (ds.tpl && S.ui.tplEdit) {
      S.ui.tplEdit.draft[ds.tpl] = t.value;
    } else if (ds.visit === 'weight') {
      const w = num(t.value);
      if (String(t.value).trim() && (w == null || w < 20 || w > 400)) { toast('Écris ton poids en kilos, par exemple 82,5.'); return; }
      mutateDay(ds.date, 'visit', (d) => { ensureVisit(d).weight = w == null ? null : round1(w); }, false);
      if (w != null) t.value = fmtDec(round1(w));
      safeRender(); // évolution depuis la dernière pesée
    } else if (ds.vset) {
      const key = ds.vset;
      if (key === 'start' && !isKey(t.value)) { toast('Choisis la date de ta première visite.'); return; }
      const every = Math.round(num(t.value) || 0);
      if (key === 'every' && (every < 7 || every > 120)) { toast('Entre 7 et 120 jours.'); t.value = S.settings.visit.every; return; }
      mutateSettings((st) => { st.visit[key] = key === 'notify' ? t.checked : key === 'every' ? every : t.value; });
      scheduleVisitReminders();
    } else if (ds.ui === 'dataDate') {
      S.ui.dataDate = isKey(t.value) ? t.value : null;
      render();
    } else if (ds.draft && S.ui.form) {
      S.ui.form.draft[ds.draft] = t.value;
    } else if (ds.item) {
      onItemInput(ds.item, t.type === 'checkbox' ? t.checked : t.value);
    } else if (ds.ask === 'withWeek') {
      S.ui.ask.withWeek = t.checked;
      refreshReport();
    } else if (ds.ask === 'photo') {
      S.ui.ask.photo = (t.files && t.files[0]) || null;
      render();
    } else if (ds.goal === 'water') {
      const n = posNum(t.value);
      if (!n || n < 0.5 || n > 8) { toast('Entre 0,5 et 8 litres.'); t.value = fmtDec(S.settings.goals.water); return; }
      mutateSettings((st) => { st.goals.water = round1(n); }, false);
      t.value = fmtDec(round1(n));
    } else if (ds.goal === 'glass') {
      mutateSettings((st) => { st.goals.glass = Number(t.value) || 250; }, false);
    } else if (ds.goal) {
      const n = posNum(t.value);
      mutateSettings((st) => { st.goals[ds.goal] = n ? round1(n) : null; }, false);
      t.value = n ? fmtDec(round1(n)) : '';
    } else if (ds.hset && !['treatments', 'conditions', 'allergies'].includes(ds.hset)) {
      const key = ds.hset, v = t.value.trim();
      mutateSettings((st) => { st.health = normalizeHealth({ ...st.health, [key]: key === 'birth' || key === 'activity' ? v : num(v) }); }, false);
      const n = S.settings.health[key];
      if (v && (n == null || n === '')) toast(key === 'height' ? 'Taille en centimètres, par exemple 180.' : key === 'birth' ? 'Choisis ta date de naissance.' : 'Poids en kilos, par exemple 82,5.');
      if (key !== 'birth' && key !== 'activity') t.value = n ? fmtDec(n) : '';
      if (key === 'birth') render();
    } else if (ds.setting === 'claudeUrl') {
      const v = t.value.trim();
      if (v && !isClaudeUrl(v)) { toast('Colle un lien qui commence par https://claude.ai/'); return; }
      mutateSettings((st) => { st.claudeUrl = v; }, false);
      if (v) toast('Lien enregistré');
    } else if (ds.weekly) {
      const v = t.value;
      mutateSettings((st) => { const s = st.supplements.find((x) => x.id === ds.weekly); if (s) s.weekday = v === '' ? null : Number(v); });
      if (v !== '') toast('Jour enregistré');
    } else if (ds.sset) {
      const row = t.closest('[data-sid]');
      if (!row) return;
      const structural = ['moment', 'freq', 'active'].includes(ds.sset); // ceux qui changent la fiche affichée

      mutateSettings(() => setSupplementField(row.dataset.sid, ds.sset, t.type === 'checkbox' ? t.checked : t.value), structural);

      mutateDay(ds.date, 'visit', (d) => {
        const vis = ensureVisit(d);
        if (path.startsWith('labs.')) vis.labs[path.slice(5)] = val; else vis[path] = val;
      }, false);
    } else if (ds.tpl && S.ui.tplEdit) {
      S.ui.tplEdit.draft[ds.tpl] = t.value;
    } else if (ds.ask === 'q') {
      S.ui.ask.q = t.value;
      refreshReport();
    } else if (ds.fd) {
      S.ui.foodDraft[ds.fd] = t.value;
    } else if (ds.restore) {
      S.ui.restoreText = t.value;
    } else if (['treatments', 'conditions', 'allergies'].includes(ds.hset)) {
      mutateSettings((st) => { st.health[ds.hset] = t.value.slice(0, 2000); }, false);
    } else if (ds.setting === 'profile') {
      mutateSettings((st) => { st.profile = t.value.slice(0, 4000); }, false);
    } else if (['name', 'dose', 'note'].includes(ds.sset)) {
      const row = t.closest('[data-sid]');
      const s = row && S.settings.supplements.find((x) => x.id === row.dataset.sid);
      if (!s) return;
      s[ds.sset] = t.value;
      markDirty('settings');
    }
  });
  /* Le texte pour Claude affiché suit la question et la case « 6 jours d'avant ». */
  function refreshReport() {
    const rt = document.getElementById('report-text'), area = document.getElementById('ask-area');
    if (rt && area && S.ui.ask.showReport) rt.value = claudeText(area.dataset.scope, area.dataset.key);
  }
  app.addEventListener('toggle', (e) => {
    const t = e.target;
    if (!t.dataset) return;
    if (t.dataset.toggle === 'labs') { S.ui.labsOpen = t.open; return; }
    if (t.dataset.toggle !== 'report') return;
    S.ui.ask.showReport = t.open;
    refreshReport();
  }, true); // « toggle » ne remonte pas : on l'écoute à la descente

  /* Nouveau jour, retour sur la page, connexion retrouvée, fermeture */
  let lastToday = todayKey();
  function checkRollover() {
    const t = todayKey();
    if (t === lastToday) return;
    if (S.ui.date === lastToday) S.ui.date = t;
    if (S.ui.weekOf === startOfWeek(lastToday)) S.ui.weekOf = startOfWeek(t);
    if (S.ui.monthOf === lastToday.slice(0, 7)) S.ui.monthOf = t.slice(0, 7);
    lastToday = t;
    if (S.ready) safeRender();
  }
  function resume() {
    if (store.mode !== 'cloud' || store.stopped) return;
    if (!store.online) { clearTimeout(store.connectTimer); store.connectTimer = null; connect(); }
    else if (store.dirty.size) { clearTimeout(store.retryTimer); store.retryTimer = null; flushAll(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkRollover(); resume(); }
    else flushAll();
  });
  window.addEventListener('online', resume);
  window.addEventListener('pagehide', flushAll);
  setInterval(checkRollover, 60000);
  // la courbe du poids se recalcule à la largeur de l'écran
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.ready && S.ui.view === 'sante') safeRender(); }, 200); });

  /* App Android : rappels de la visite médicale (la veille à 19:00, le matin à 7:30), pour les 6 prochaines.
     Identifiants 7000 à 7099 réservés à ces rappels : on les annule tous puis on les recrée. */
  async function scheduleVisitReminders() {
    const LN = capPlugin('LocalNotifications');
    if (!LN || !S.settings) return;
    const v = S.settings.visit;
    try {
      const pending = await LN.getPending();
      const ours = ((pending && pending.notifications) || []).filter((n) => n.id >= 7000 && n.id < 7100);
      if (ours.length) await LN.cancel({ notifications: ours.map((n) => ({ id: n.id })) });
      if (!v.notify) return;
      let perm = await LN.checkPermissions();
      if (perm.display !== 'granted' && perm.display !== 'denied') perm = await LN.requestPermissions();
      const denied = perm.display !== 'granted';
      if (denied !== !!store.notifyDenied) { store.notifyDenied = denied; if (S.ui.view === 'reglages') safeRender(); }
      if (denied) return;
      const now = Date.now(), list = [];
      let k = nextVisit(todayKey());
      for (let i = 0; i < 6; i++, k = addDays(k, v.every)) {
        const eve = fromKey(addDays(k, -1)); eve.setHours(19, 0, 0, 0);
        const morning = fromKey(k); morning.setHours(7, 30, 0, 0);
        const common = { isExactNotification: false, smallIcon: 'ic_stat_monsuivi' };
        if (eve.getTime() > now) list.push({ ...common, id: 7000 + i * 2, title: 'Demain : visite médicale', body: 'Prise de sang (souvent à jeun, vérifie avec le labo), pesée et médecin. Note tes questions.', schedule: { at: eve, allowWhileIdle: true } });
        if (morning.getTime() > now) list.push({ ...common, id: 7001 + i * 2, title: 'Aujourd’hui : visite médicale', body: 'Prise de sang, pesée, médecin. Note tout dans Mon suivi pour ton bilan du mois avec Claude.', schedule: { at: morning, allowWhileIdle: true } });
      }
      if (list.length) await LN.schedule({ notifications: list });
    } catch (e) { /* notifications indisponibles : les rappels restent dans l'app */ }
  }

  /* App Android : le bouton retour ferme le formulaire ouvert, revient à la vue Jour, puis met l'app en arrière-plan. */
  const capApp = capPlugin('App');
  if (capApp && typeof capApp.addListener === 'function') {
    capApp.addListener('backButton', () => {
      if (S.ui.form || S.ui.confirm || S.ui.exportText != null) { S.ui.form = null; S.ui.confirm = null; S.ui.exportText = null; render(); }
      else if (S.ui.view === 'reglages' && S.ui.settingsPage) { S.ui.settingsPage = null; render(); toTop(); }
      else if (S.ui.view !== 'jour') { S.ui.view = 'jour'; render(); toTop(); }
      else if (typeof capApp.minimizeApp === 'function') capApp.minimizeApp();
    });
  }

  init();
})();
</script>
