        toast('Ce fichier n’est pas une sauvegarde de Mon suivi.');
        return;
      }
      S.settings = normalizeSettings(obj.settings);
      store.trusted = true;
      markDirty('settings');
      const months = sanitizeMonths(obj.months);
      let n = 0;
      Object.keys(months).forEach((mk) => {
        S.months[mk] = months[mk];
        Object.keys(months[mk].days).forEach((dk) => { touchDay(dk); n++; });
        markDirty('m' + mk);
      });
      S.ui.form = null; S.ui.confirm = null; S.ui.openSup = null;
      render();
      toast(`Sauvegarde restaurée (${plural(n, 'jour')})`);
    };
    r.onerror = () => toast('Impossible de lire ce fichier.');
    r.readAsText(file);
  }

  /* ---------- Actions (boutons data-act) ---------- */
  const askDelete = (kind, id, focus) => { S.ui.confirm = `${kind}:${id}`; S.ui.focus = focus; render(); };
  function deleteEntry(field, k, id) {
    S.ui.confirm = null;
    mutateDay(k, field, (d) => { d[field] = d[field].filter((x) => !x || x.id !== id); });
    toast('Supprimé');
  }
  const actions = {
    tab: (d) => { S.ui.view = d.view; S.ui.form = null; S.ui.confirm = null; S.ui.exportText = null; render(); toTop(); },
    'day-prev': () => go(addDays(S.ui.date, -1)),
    'day-next': () => go(addDays(S.ui.date, 1)),
    'day-today': () => go(todayKey()),
    goto: (d) => { const fromOther = S.ui.view !== 'jour'; S.ui.view = 'jour'; go(d.date); if (fromOther) toTop(); },
    toggle: (d) => {
      S.ui.just = `${d.sid}|${d.date}`;
      mutateDay(d.date, 'taken:' + d.sid, (day) => { day.taken[d.sid] = !day.taken[d.sid]; });
    },
    'wake-now': (d) => {
      const t = nowTime();
      mutateDay(d.date, 'wake', (day) => { day.wake = t; });
      toast(`Réveil noté à ${t}`);
    },
    'ci-new': (d) => startForm('checkin', d.date),
    'meal-new': (d) => startForm('meal', d.date),
    'ci-edit': (d) => startForm('checkin', d.date, d.id),
    'meal-edit': (d) => startForm('meal', d.date, d.id),
    'ci-ask': (d) => askDelete('ci', d.id, `[data-act="ci-del"]${attr('data-id', d.id)}`),
    'meal-ask': (d) => askDelete('meal', d.id, `[data-act="meal-del"]${attr('data-id', d.id)}`),
    'ci-del': (d) => deleteEntry('checkins', d.date, d.id),
    'meal-del': (d) => deleteEntry('meals', d.date, d.id),
    'confirm-cancel': () => {
      const [kind, id] = String(S.ui.confirm || '').split(/:(.*)/);
      if (kind === 'reset') S.ui.focus = '[data-act="reset-ask"]';
      else if (kind === 'sup') S.ui.focus = `[data-act="sup-ask"]${attr('data-sid', id)}`;
      else if (kind) S.ui.focus = `[data-act="${kind}-ask"]${attr('data-id', id)}`;
      S.ui.confirm = null;
      render();
    },
    rate: (d) => {
      const f = S.ui.form;
      if (!f) return;
      const v = Number(d.v);
      f.draft[d.scale] = f.draft[d.scale] === v ? null : v;
      render();
    },
    'meal-kind': (d) => { if (S.ui.form) { S.ui.form.draft.kind = d.v; render(); } },
    'form-save': () => saveForm(),
    'form-cancel': () => {
      const f = S.ui.form;
      S.ui.form = null;
      if (f) S.ui.focus = f.id ? `[data-act="${f.type === 'checkin' ? 'ci' : 'meal'}-edit"]${attr('data-id', f.id)}` : `[data-act="${f.type === 'checkin' ? 'ci' : 'meal'}-new"]`;
      render();
    },
    'week-prev': () => { S.ui.weekOf = addDays(S.ui.weekOf, -7); render(); },
    'week-next': () => { S.ui.weekOf = addDays(S.ui.weekOf, 7); render(); },
    'week-now': () => { S.ui.weekOf = startOfWeek(todayKey()); render(); },
    'year-prev': () => { S.ui.year--; render(); },
    'year-next': () => { S.ui.year++; render(); },
    'year-now': () => { S.ui.year = new Date().getFullYear(); render(); },
    'sup-add': () => {
      const s = { id: newId(), name: 'Nouveau complément', dose: '', note: '', moment: 'matin', freq: 'daily', since: todayKey(), active: true, weekday: null };
      S.ui.openSup = s.id;
      S.ui.focus = `#sup-${CSS.escape(s.id)}-name`;
      S.ui.select = true;
      mutateSettings((st) => { st.supplements.push(s); });
    },
    'sup-open': (d) => { S.ui.openSup = d.sid; S.ui.confirm = null; if (finePointer()) S.ui.focus = `#sup-${CSS.escape(d.sid)}-name`; render(); },
    'sup-close': (d) => { S.ui.openSup = null; S.ui.confirm = null; S.ui.focus = `[data-act="sup-open"]${attr('data-sid', d.sid)}`; render(); },
    'sup-ask': (d) => askDelete('sup', d.sid, `[data-act="sup-del"]${attr('data-sid', d.sid)}`),
    'sup-del': (d) => {
      S.ui.confirm = null;
      mutateSettings((st) => { st.supplements = st.supplements.filter((x) => x.id !== d.sid); });
      toast('Complément supprimé');
    },
    'reset-ask': () => { S.ui.confirm = 'reset'; S.ui.focus = '[data-act="reset-yes"]'; render(); },
    'reset-yes': () => {
      S.ui.confirm = null;
      mutateSettings((st) => { st.supplements = defaultSupplements(todayKey()); });
      toast('Liste de départ remise');
    },
    'export-json': () => exportJSON(),
    'export-csv': () => exportCSV(),
    'copy-export': () => copyExport(),
    'close-export': () => { S.ui.exportText = null; render(); }
  };

  /* ---------- Événements ---------- */
  const app = document.getElementById('app');
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || !app.contains(b) || !S.ready) return;
    const fn = actions[b.dataset.act];
    if (fn) fn(b.dataset);
  });
  function setSupplementField(sid, f, v) {
    const s = S.settings.supplements.find((x) => x.id === sid);
    if (!s) return;
    if (f === 'active') s.active = !!v;
    else if (f === 'weekday') s.weekday = v === '' ? null : Number(v);
    else if (f === 'since') { if (isKey(v)) s.since = v; }
    else if (f === 'moment') { if (MOMENT_KEYS.includes(v)) s.moment = v; }
    else if (f === 'freq') { if (FREQS[v]) s.freq = v; }
    else if (f === 'name') s.name = String(v).trim() || 'Sans nom';
    else if (f === 'dose' || f === 'note') s[f] = String(v);
  }
  app.addEventListener('change', (e) => {
    const t = e.target, ds = t.dataset;
    if (!S.ready || !ds) return;
    if (ds.bind === 'wake' || ds.bind === 'bed') {
      // Enregistré tout de suite ; l'affichage (durée de la nuit) suit quand on quitte le champ.
      const field = ds.bind, val = t.value;
      mutateDay(ds.date, field, (d) => { d[field] = val; }, false);
      safeRender();
    } else if (ds.draft && S.ui.form) {
      S.ui.form.draft[ds.draft] = t.value;
    } else if (ds.weekly) {
      const v = t.value;
      mutateSettings((st) => { const s = st.supplements.find((x) => x.id === ds.weekly); if (s) s.weekday = v === '' ? null : Number(v); });
      if (v !== '') toast('Jour enregistré');
    } else if (ds.sset) {
      const row = t.closest('[data-sid]');
      if (!row) return;
      const structural = ['moment', 'freq', 'active'].includes(ds.sset); // ceux qui changent la fiche affichée
      if (structural && (t.type === 'checkbox' || finePointer())) S.ui.focus = `#${CSS.escape(t.id)}`;
      mutateSettings(() => setSupplementField(row.dataset.sid, ds.sset, t.type === 'checkbox' ? t.checked : t.value), structural);
    } else if (ds.file === 'import') {
      importFile(t.files && t.files[0]);
      t.value = '';
    }
  });
  app.addEventListener('input', (e) => {
    const t = e.target, ds = t.dataset;
    if (!S.ready || !ds) return;
    if (ds.bind === 'notes') {
      mutateDay(ds.date, 'notes', (d) => { d.notes = t.value; }, false);
    } else if (ds.draft && S.ui.form) {
      S.ui.form.draft[ds.draft] = t.value;
    } else if (['name', 'dose', 'note'].includes(ds.sset)) {
      const row = t.closest('[data-sid]');
      const s = row && S.settings.supplements.find((x) => x.id === row.dataset.sid);
      if (!s) return;
      s[ds.sset] = t.value;
      markDirty('settings');
    }
  });

  /* Nouveau jour, retour sur la page, connexion retrouvée, fermeture */
  let lastToday = todayKey();
  function checkRollover() {
    const t = todayKey();
    if (t === lastToday) return;
    if (S.ui.date === lastToday) S.ui.date = t;
    if (S.ui.weekOf === startOfWeek(lastToday)) S.ui.weekOf = startOfWeek(t);
    lastToday = t;
    if (S.ready) safeRender();
  }
  function resume() {
    if (store.mode !== 'cloud' || store.stopped) return;
    if (!store.online) { clearTimeout(store.connectTimer); store.connectTimer = null; connect(); }
    else if (store.dirty.size) { clearTimeout(store.retryTimer); store.retryTimer = null; flushAll(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkRollover(); resume(); }
    else flushAll();
  });
  window.addEventListener('online', resume);
  window.addEventListener('pagehide', flushAll);
  setInterval(checkRollover, 60000);

  init();
})();
</script>
