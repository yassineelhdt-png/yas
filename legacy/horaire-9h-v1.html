*{box-sizing:border-box}

  // ---------- vue Semaine ----------

      var studied = (+document.getElementById("rp-h").value || 0) * 60 + (+document.getElementById("rp-m").value || 0);
      state.replanOpen = false;
      saveDay(state.date, { replan: { at: at, studied: studied, lunch: document.getElementById("rp-lunch").checked, sport: document.getElementById("rp-sport").checked, dinner: document.getElementById("rp-dinner").checked } });
      toast("Suite de la journée recalculée");
    }
    else if (act === "reset") { state.settings = {}; cache(); render(); writeDoc("app/settings", {}); toast("Réglages de base rétablis"); }
  });
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "wake" && t.value) { var dw = getDay(state.date) || {}, pw = { wake: t.value }; if (dw.start && E.m(dw.start) < E.m(t.value)) pw.start = undefined; saveDay(state.date, pw); return; }
    if (t.id === "start" && t.value) { saveDay(state.date, { start: t.value, replan: undefined }); toast("Programme calé sur " + t.value); return; }
    if (t.dataset && t.dataset.set) {
      var o = {}, v = t.value;
      if (t.dataset.t === "num") { if (v === "" || isNaN(+v)) return; v = +v; }
      o[t.dataset.set] = v; saveSettings(o); toast("Réglage enregistré");
    }
  });

  // surlignage « maintenant » sans tout redessiner
  setInterval(function () {
    if (state.view !== "jour" || state.date !== todayStr()) return;
    var nm = nowMin(), changed = false;
    Array.prototype.forEach.call(document.querySelectorAll("#tl .row"), function (r) {
      var on = nm >= +r.dataset.s && nm < +r.dataset.e && !r.classList.contains("past");
      if (on !== r.classList.contains("now")) changed = true;
    });
    if (changed && !(document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName))) render();
  }, 30000);

  render();
})();
</script>

</body></html>
